<script>
/* 深链首帧：路由不是首页时，先把首页的标题/角落舞台藏起来（脚本还没跑到也不闪首页） */
(function () {
  try {
    var h = String(location.hash || '').replace(/^#/, '');
    if (/^\/(?:select|about|play)(?:\/|$)/.test(h)) document.documentElement.classList.add('czl-route-page');
  } catch (e) { /* 忽略 */ }
})();
</script>
<style>
  html.czl-route-page #bg, html.czl-route-page #meteors, html.czl-route-page .hero,
  html.czl-route-page .stage, html.czl-route-page #veil,
  html.czl-route-page #pre { display: none !important; }
  /* 外壳脚本还没跑到时的极简加载提示（纯 CSS，html 元素首帧就能画） */
  html.czl-route-page::before {
    content: 'LOADING';
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    padding: 15px 28px; font: bold 11px ui-monospace, Consolas, monospace;

    border: 1px solid rgba(255,255,255,.18);

<style>
  :root { --gold: #e8b84b; --gold-l: #ffd76a; --cyan: #7fd8ff; --txt: #e8ecff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden;
    background:
      radial-gradient(1100px 620px at 50% 12%, rgba(84,60,180,.34) 0%, transparent 60%),
      radial-gradient(1600px 1000px at 50% 110%, rgba(20,14,64,.9) 0%, #07051a 60%) #07051a;
    color: var(--txt); font: 15px "Segoe UI","Microsoft YaHei",sans-serif; }
  /* 背景三层统一收进 #bg：鼠标微视差整层平移（≤4px，只动这一层，不影响前景/舞台） */
  #bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; will-change: transform; }
  .nebula { position: absolute; inset: 0;
    background:
      radial-gradient(360px 240px at 16% 78%, rgba(232,184,75,.10), transparent 70%),

    animation: neb 18s ease-in-out infinite alternate; }
  @keyframes neb { from { transform: translateY(0); opacity: .8; } to { transform: translateY(-16px); opacity: 1; } }
  #stars { position: absolute; inset: 0; }
  .st { position: absolute; border-radius: 50%; background: #fff; animation: twinkle ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .12; transform: scale(.8); } 50% { opacity: .8; transform: scale(1); } }
  .sigil { position: absolute; left: 50%; top: 42%; width: 820px; height: 820px; transform: translate(-50%,-50%);
    opacity: .1; pointer-events: none; animation: spin 120s linear infinite; }
  @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
  /* 偶发流星：6~15s 一颗斜掠而过（前景层，不参与微视差） */
  #meteors { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .meteor { position: absolute; height: 2px; border-radius: 2px; opacity: 0;
    background: linear-gradient(90deg, rgba(207,230,255,0) 0%, rgba(207,230,255,.8) 62%, #fff 100%);
    filter: drop-shadow(0 0 6px rgba(160,210,255,.75));
    animation: meteorFall 1.15s cubic-bezier(.36,.06,.74,.62) forwards; }
  @keyframes meteorFall {
    from { transform: translate3d(0,0,0) rotate(18deg); opacity: 0; }
    14% { opacity: .85; }
    to { transform: translate3d(var(--dx,44vw), var(--dy,14.3vw), 0) rotate(18deg); opacity: 0; }
  }

  /* —— 版式高度预算 ——
     hero 总高 = 标题高(宽 × 132/492) + 其余固定部分(--hero-fix)。
     标题宽度除了受宽度限制，还要按**可用高度反算**：手机横屏只有 ~290~390px 高，
     只按 86vw 算的话标题会把底部按钮组顶出屏幕（实测 vh=292 时按钮下沿在 319）。
     短屏先把"其余部分"收紧（按钮更紧凑），再把标题按高度反算 → 整页一定落在视口内。
     ★ 手机（短屏/窄屏）另给 --title-max 上限：680px 铺满 844 宽的 80%，两边只剩 80px，
       观感偏挤；收到 560px（≈66%）后左右留白翻倍，标题也更"立得住"。 */
  :root { --hero-fix: 232px; --title-max: 680px;
    --title-w: min(var(--title-max), 86vw, max(200px, calc((100vh - var(--hero-fix) - 26px) * 3.727))); }
  /* MC 风方块字标题 */
  .title { width: var(--title-w); display: block; margin: 0 auto; animation: bob 5.2s ease-in-out infinite; }
  /* 版本号：与标题同宽、右对齐 → 正好落在 CHEZZLE 大字的右下角；淡灰、克制 */
  .ver { width: var(--title-w); margin: -4px auto 0; text-align: right;
    color: #5a527e; font-size: 11px; letter-spacing: 2px; opacity: 0; animation: pop .8s ease 1.15s forwards; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  /* 字母淡入：只动 opacity（transform 会被 SVG 字母的定位属性占用，不能动画） */
  .title .lt { opacity: 0; animation: pop .5s ease forwards; }
  @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
  /* —— 长条按钮（开始 / 设置 / 关于）—— */
  .bar { display: flex; align-items: center; justify-content: center; gap: 13px; margin: 0 auto;
    width: min(560px, 82vw); padding: 14px 20px; font-family: inherit; font-size: 17px; font-weight: bold;
    letter-spacing: 8px; text-decoration: none; cursor: pointer; border: 0; color: inherit;
    clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 16px, 100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%, 0 calc(100% - 16px), 0 16px);
    opacity: 0; animation: pop .55s ease forwards; transition: transform .18s ease, filter .18s ease; }
  #btnPlay { margin-top: 36px; animation-delay: .55s;
    background: linear-gradient(180deg, #ffe9a8 0%, #e8b84b 46%, #9a6d1e 100%); color: #241a02;
    filter: drop-shadow(0 0 16px rgba(232,184,75,.45)) drop-shadow(0 10px 20px rgba(0,0,0,.5)); }
  #btnSet { margin-top: 15px; animation-delay: .62s;
    background: linear-gradient(180deg, #2a2270 0%, #1a1650 50%, #0f0c34 100%); color: var(--cyan);
    border: 1.5px solid rgba(127,216,255,.55);
    filter: drop-shadow(0 0 10px rgba(127,216,255,.2)) drop-shadow(0 10px 20px rgba(0,0,0,.5)); }
  #btnAbout { margin-top: 12px; animation-delay: .72s;
    background: linear-gradient(180deg, rgba(30,24,66,.72) 0%, rgba(18,14,44,.72) 100%); color: #aebbe0;
    border: 1px solid rgba(127,216,255,.28);
    filter: drop-shadow(0 8px 16px rgba(0,0,0,.45)); }
  #btnPlay:hover { transform: translateY(-2px); filter: drop-shadow(0 0 26px rgba(255,215,106,.75)) drop-shadow(0 14px 24px rgba(0,0,0,.5)); }
  #btnSet:hover { transform: translateY(-2px); filter: drop-shadow(0 0 22px rgba(127,216,255,.5)) drop-shadow(0 14px 24px rgba(0,0,0,.5)); }
  #btnAbout:hover { transform: translateY(-2px); border-color: rgba(127,216,255,.6); color: #dbe4ff;
    filter: drop-shadow(0 0 16px rgba(127,216,255,.3)) drop-shadow(0 12px 20px rgba(0,0,0,.5)); }
  .bar:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  /* 短屏（手机横屏，可见高度常常只有 290~400px）：按钮与标题一起收窄。
     ★ 按钮宽度直接决定角落两个小舞台能长多大（舞台只能待在按钮两侧的空档里）：
       8 Plus 可用宽 736 时 —— 按钮 82vw(604) → 舞台 0.20（放不下，直接消失）
                              58vw(427) → 舞台 ~0.31（133px，偏小）
                              50vw(368) → 舞台 ~0.38~0.43（162px，明显有存在感）
       所以用户觉得"动画太小"时，收按钮就是唯一的杠杆（用户建议改按钮大小，正是这里）。 */
  /* 中等偏矮 / 偏窄窗口（笔记本分屏、窗口压到半屏）：整体收一档——
     否则 558px 高时标题就占 182px、三个按钮各 50px，视觉上非常挤。 */
  @media (max-height: 640px) and (min-height: 471px), (max-width: 980px) and (min-height: 471px) {
    :root { --hero-fix: 196px; --title-max: 560px; }
    .bar { width: min(480px, 68vw); padding: 11px 18px; font-size: 15.5px; letter-spacing: 6px; }
    #btnPlay { margin-top: 24px; } #btnSet { margin-top: 11px; } #btnAbout { margin-top: 9px; }
  }
  @media (max-height: 470px) {
    :root { --hero-fix: 186px; --title-max: min(470px, 64vw); }
    .bar { width: min(560px, 50vw); padding: 10px 16px; font-size: 15px; letter-spacing: 6px; }
    #btnPlay { margin-top: 18px; } #btnSet { margin-top: 10px; } #btnAbout { margin-top: 10px; }
  }

  /* —— 两个小动画：钉死在左下 / 右下角；无边框、无底色（画布只清屏不填色），
        完全融入星空背景；整块外壳都不拦截鼠标——画布本身够大（含让方块飞行的透明"空气带"），
        外壳若吃点击就会在按钮两端形成看不见的死区（实测：点按钮偏两端没反应）—— */
  .stage { position: fixed; bottom: 14px; z-index: 3; line-height: 0; pointer-events: none; }
  .stage canvas { display: block; pointer-events: none; }
  #stageL { left: 14px; }
  #stageR { right: 14px; }
  @media (prefers-reduced-motion: reduce) {
    .nebula, .st, .sigil, .title { animation: none !important; }
    .bar, .lt { animation: pop .4s ease forwards; }
    .stage, #meteors { display: none; } /* 关掉动画时舞台/流星毫无内容，直接隐藏 */
  }
  /* —— 低性能档（触屏 / 小屏，由 JS 打 body.low）——
     手机发热与掉帧的大头不是画布，而是"每帧都在重新合成/重绘"的装饰层：
     全屏星云动画、90 颗带 drop-shadow 滤镜的星星、820px 矢量法阵旋转、流星滤镜。
     低档把它们降级成静态/无滤镜版本，视觉几乎不变，GPU 占用降到零头。 */
  body.low .nebula { animation: none; }
  body.low .sigil { animation: none; opacity: .07; }
  body.low .meteor { filter: none; }
  body.low .bar { transition: none; }
  /* —— 入场：深色幕布自动淡出（纯 CSS，不等引擎；国内网络下引擎包很大）——
     开场动画一律不依赖 dist/chezzle.js?vmvc6l20g：标题/按钮的 CSS 动画在解析时就跑起来，
     引擎只影响两个角落的小舞台（下面用"启动占位"承接等待）。 */
  #veil { position: fixed; inset: 0; z-index: 899; background: #07051a; pointer-events: none;
    animation: veilOut .55s ease-out .02s both; }
  @keyframes veilOut { to { opacity: 0; visibility: hidden; } }
  /* —— 角落小舞台的"加载占位"：引擎（~800KB）没到之前先亮一块同款小平行四边形，
        带绕边白色光标 + LOADING；引擎就绪后淡出、真舞台淡入 —— */
  .shard { position: absolute; left: 50%; top: 50%; width: 168px; height: 50px;
    transform: translate(-50%,-50%); display: grid; place-items: center; pointer-events: none;
    animation: shardIn .32s ease .45s both; }
  @keyframes shardIn { from { opacity: 0; } to { opacity: 1; } }
  .shard svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .shard .frame { fill: rgba(10,12,32,.55); stroke: rgba(255,255,255,.16); stroke-width: 1.1; vector-effect: non-scaling-stroke; }
  .shard .spark { fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round;
    stroke-dasharray: 13 87; animation: shardSpark 1.5s linear infinite; }
  @keyframes shardSpark { to { stroke-dashoffset: -100; } }
  .shard span { position: relative; font: bold 10px/1 ui-monospace, Consolas, monospace;
    letter-spacing: 5px; padding-left: 5px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,.5); }
  .stage canvas { opacity: 0; transition: opacity .55s ease .1s; }
  body.stagesReady .stage canvas { opacity: 1; }
  body.stagesReady .shard { opacity: 0; transition: opacity .3s ease; animation: none; }
  /* —— 页面切换：斜切面板从右扫入盖住 → 再**继续向左**扫出（单向，不回摆）。
        只保留一条白色切边线，不再有金色辉光（用户：切回主页时的辉光画蛇添足）。 —— */
  #wipe { position: fixed; inset: 0; z-index: 900; pointer-events: none; overflow: hidden; visibility: hidden; }
  #wipe.on, #wipe.out { visibility: visible; }
  #wipe i { position: absolute; top: -12%; bottom: -12%; left: 0; width: 132%;
    transform: translateX(112%) skewX(-14deg);
    background: linear-gradient(96deg, rgba(232,184,75,.1) 0%, #07051a 26%, #07051a 100%); }
  #wipe.on i { transition: transform .48s cubic-bezier(.66,0,.24,1); transform: translateX(-6%) skewX(-14deg); }
  #wipe.out i { transition: transform .5s cubic-bezier(.55,0,.3,1); transform: translateX(-132%) skewX(-14deg); }
  #wipe i:before { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 2px;
    background: #fff; opacity: .9; }
  @media (prefers-reduced-motion: reduce) {
    #veil { animation: none; opacity: 0; visibility: hidden; }
    #wipe.on i, #wipe.out i { transition: none; }
    .shard { animation: none; }
    .shard .spark { animation: none; stroke: rgba(255,255,255,.5); }
    .stage canvas { opacity: 1; transition: none; }
  }
  /* —— 资源缓存进度（底部居中，细窄一条；不拦点击、不抢戏）——
     主页空闲时把选关页/关卡表/关卡页先抓进本地缓存（Cloudflare 国内 RTT 大），
     这里把进度如实显示出来。全部命中缓存时它连出现都不会出现（250ms 内就结束了）。 */
  #pre { position: fixed; left: 50%; bottom: 7px; transform: translateX(-50%); z-index: 4;
    display: flex; align-items: center; gap: 8px; pointer-events: none;
    font: 11px ui-monospace, Consolas, monospace; letter-spacing: 1px; color: #6f7d9e;
    opacity: 0; transition: opacity .35s ease; }
  #pre.on { opacity: 1; }
  #pre.done { color: #8fd6a6; }
  #preBar { display: block; width: 92px; height: 3px; background: rgba(127,216,255,.15); overflow: hidden; }
  #preFill { display: block; width: 0%; height: 100%;
    background: linear-gradient(90deg, #4f9fd8, #cfefff); transition: width .22s ease; }
  @media (prefers-reduced-motion: reduce) { #pre, #preFill { transition: none; } }

  /* —— 竖屏强制横屏：整页绕左上角顺时针转 90° ——
     旋转后"局部坐标系"是 innerHeight 宽 × innerWidth 高（手机上就是横屏版式）；
     所有 position:fixed 元素在变换后的容器里也按局部坐标定位，故舞台钉角照旧。
     ★ 转的是 **body**，不是 html：旋转容器的盒子宽 = innerHeight，在竖屏下必然比
       视口宽。若把它放在**根元素**上，移动端会认为"页面比设备宽"→ 把布局视口一起
       撑大（shrink-to-fit，实测 375×667 变成 669×1189），于是整页按放大后的尺寸
       排版、内容被裁在屏幕外、角落舞台被放到最大（用户手机复现）。放在 body 上
       （普通后代盒子）不会影响布局视口，旋转只影响绘制。
     ★ 尺寸不再用 CSS 的 100vh：iOS 的 100vh 是"地址栏收起后"的大视口，比 JS 的
       innerHeight 大一截 → 版式与 JS 换算打架，页面下缘会被地址栏压住。
       这里只留一份兜底，真正的 px 由 applyRotSize() 按 innerWidth/innerHeight 写死。 */
  @media (orientation: portrait) {
    body { position: absolute; top: 0; left: 100vw; width: 100vh; height: 100vw;
      transform: rotate(90deg); transform-origin: left top; overflow: hidden; }
    /* 旋转后 vh = 版式空间的宽度、vw = 版式空间的高度 */
    :root { --title-w: min(var(--title-max), 86vh, max(200px, calc((100vw - var(--hero-fix) - 26px) * 3.727))); }
    .bar { width: min(560px, 82vh); }
  }
  @media (orientation: portrait) and (max-width: 470px) {
    :root { --hero-fix: 186px; --title-max: min(470px, 64vh); }
    .bar { width: min(560px, 50vh); padding: 10px 16px; font-size: 15px; letter-spacing: 6px; }
    #btnPlay { margin-top: 18px; } #btnSet { margin-top: 10px; } #btnAbout { margin-top: 10px; }
  }

  /* —— 设置面板（首页）——
     与游戏内 HUD 面板同一套视觉：圆角深紫渐变 + 金描边、mono 小标、平行四边形按钮。 */
  .czset { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center;
    padding: 18px; background: rgba(5, 4, 16, .62); opacity: 0; transition: opacity .22s ease;
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .czset.in { opacity: 1; }
  .czset[hidden] { display: none; }
  .czset-panel { position: relative; display: flex; flex-direction: column; width: min(560px, 94vw);
    max-height: min(88vh, 660px); color: #dfe8f2; overflow: hidden;
    background: linear-gradient(180deg, #282050 0%, #120d30 55%, #0e0a24 100%);
    border: 1.5px solid rgba(232, 184, 75, .8); border-radius: 12px;
    box-shadow: 0 0 26px rgba(232, 184, 75, .18), 0 20px 48px rgba(0, 0, 0, .6);
    transform: translateY(14px); transition: transform .28s cubic-bezier(.2, .9, .3, 1.05); }
  .czset.in .czset-panel { transform: none; }
  .czset-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 18px 22px 12px; border-bottom: 1px solid rgba(232, 184, 75, .18); }
  .czset-kicker { font: bold 10px/1 ui-monospace, Consolas, monospace; letter-spacing: 3px; color: rgba(232, 184, 75, .75); }
  .czset-head h2 { margin-top: 7px; font: bold 22px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif;
    letter-spacing: 6px; color: #ffe9b0; text-shadow: 0 0 12px rgba(255, 215, 106, .35); }
  .czset-x { width: 30px; height: 30px; flex: none; cursor: pointer; border-radius: 8px;
    background: rgba(20, 26, 64, .9); border: 1px solid rgba(127, 216, 255, .35); color: #9fb2c8;
    font: 13px/1 "Segoe UI", sans-serif; transition: border-color .16s, color .16s; }
  .czset-x:hover { border-color: #7fd8ff; color: #dff2ff; }
  .czset-body { padding: 16px 22px 4px; overflow: auto; overscroll-behavior: contain; }
  .czset-sec { margin-bottom: 18px; }
  .czset-sec h3 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    font: bold 12px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 2px; color: #9fb2c8; }
  .czset-sec h3 span { font: bold 12px/1 ui-monospace, Consolas, monospace; letter-spacing: 1px; color: #ffd76a; }
  .czset-sec input[type="range"] { -webkit-appearance: none; appearance: none; display: block; width: 100%;
    height: 4px; margin: 11px 0 4px; border-radius: 2px; cursor: pointer; outline: none;
    background: linear-gradient(90deg, rgba(232, 184, 75, .85), rgba(232, 184, 75, .22)); }
  .czset-sec input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #ffd76a; border: 2px solid #6b4a10; box-shadow: 0 0 8px rgba(232, 184, 75, .65); }

<script>
// ============================================================================
// 引擎懒加载：只有首页的两个角落小舞台需要 dist/chezzle.js?vmvc6l20g（~800KB）。
// 选关 / 关于 / 关卡视图各自在 iframe 里加载自己的引擎；外壳不再为一个装饰动画
// 在首屏下载大包 —— 国内访问 CF Pages 时这是首屏体感最大的一个优化。
// ============================================================================
(function () {
  var SRC = 'dist/chezzle.js?vmvc6l20g';
  window.__czEngineWaiters = [];
  window.__czHomeShow = window.__czHomeShow || function () {};

    if (typeof cb === 'function') window.__czEngineWaiters.push(cb);

      for (var i = 0; i < list.length; i++) { try { list[i](); } catch (e) { /* 单个初始化失败不影响外壳 */ } }

    s.src = SRC;
    s.async = false;
    s.onload = function () {

      var list = window.__czEngineWaiters.splice(0);
      for (var i = 0; i < list.length; i++) { try { list[i](); } catch (e) { /* 忽略 */ } }

<script>
// 首页本体（角落舞台 / 星野 / 流星 / 预取 / 入场细节）：
// 包在函数里 → 只有首页可见时才加载引擎并初始化；从选关返回首页时也走这里。
function __czHomeInit() {
const C = window.Chezzle;
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
// —— 性能档位（低档 = 触屏/小屏设备）——
// 手机发热掉帧的大头不是画布，而是"每帧都在重新合成/重绘"的装饰层：全屏星云动画、
// 90 颗带 drop-shadow 滤镜的闪烁星星、820px 矢量法阵旋转、流星滤镜、dpr=3 的清屏。
// 低档把这些降级成静态/无滤镜版本（视觉几乎不变），GPU 占用降到零头。
const COARSE = matchMedia('(pointer: coarse)').matches || !matchMedia('(hover: hover)').matches;
const LOW = !REDUCE && (COARSE || Math.min(innerWidth, innerHeight) < 620);

// 竖屏强制横屏的坐标换算
// ----------------------------------------------------------------------------
// CSS 在 orientation:portrait 时把整页绕左上角顺时针转 90°，屏幕坐标 (sx,sy) 与
// 页面"局部坐标" (lx,ly) 的关系是：sx = innerWidth - ly，sy = lx。
// 于是局部视口 = (innerHeight × innerWidth)，而 getBoundingClientRect() 返回的是
// **屏幕坐标**，必须换算后再交给布局计算，否则横竖屏两套算法会打架。
// ============================================================================

 *  ★ 旋转写在 **body** 上（见上面 CSS 注释）：根元素被撑宽会让移动端把布局视口一起

function applyRotSize() {

    h.style.top = '0';
    h.style.left = innerWidth + 'px';
    h.style.width = innerHeight + 'px';
    h.style.height = innerWidth + 'px';
    h.style.transformOrigin = 'left top';
    h.style.transform = 'rotate(90deg)';
    h.style.overflow = 'hidden';

// 舞台公共部分

// 2) 坐标：内容坐标系固定 380/430 × 330；地面线两侧都在 y=276（同一条水平线）；
//    画布比内容大时，内容贴画布**底部**对齐 → 多出来的部分全是"空气"，
//    右侧舞台靠它把玩家送到页面真实"关于"按钮右缘（画布透明且不拦截鼠标）
// ============================================================================
const BASE_H = 330;   // 两侧内容高度一致 → 钉在同一个 bottom 上，地面天然对齐
const GROUND = 276;   // 内容坐标里的地面上沿
const GAP = 14;       // 画布离视口边缘的距离（左下 / 右下角）

  const dpr = Math.min(LOW ? 2 : 3, Math.max(1, window.devicePixelRatio || 1));

  canvas.style.height = h + 'px';

  return { dpr, w, h, s, ox: align === 'right' ? w - baseW * s : 0, oy: h - baseH * s };

// #region stage-geometry —— 纯函数（tests/homestage.test.js 会原样提取复算，勿改签名）
/**
 * 算出一个舞台的尺寸与缩放，保证**舞台里的任何东西都不会压到"关于"按钮上**。
 * 两条互斥的安全约束，取能给出更大舞台的那条：
 *   ① 内容横向完全落在按钮外侧（右舞台在右、左舞台在左）
 *   ② 内容纵向完全落在按钮下缘之下

 * 全程在按钮右侧 → x 方向永不重叠，数学上不可能穿模）。
 * 两条都放不下（窗口又矮又窄）→ 返回 null，调用方直接隐藏舞台。
 * @param {number} vw 视口宽 @param {number} vh 视口高
 * @param {{left:number,right:number,top:number,bottom:number}} b "关于"按钮矩形
 * @param {'left'|'right'} kind 舞台方位
 */
function computeStage(vw, vh, b, kind) {
  const CW = kind === 'right' ? 430 : 380;
  const right = vw - GAP, bottom = vh - GAP;
  const clearS = kind === 'right'
    ? (right - b.right - 8) / CW        // 内容整体在按钮右侧
    : (b.left - 8 - GAP) / CW;          // 内容整体在按钮左侧
  const belowS = (vh - 24 - b.bottom) / BASE_H; // 内容整体在按钮下缘之下
  const capW = Math.min(1, (vw * 0.62) / CW);
  const capH = (vh - 2 * GAP) / BASE_H;         // 内容整体放得进视口高度
  const sClear = Math.min(capW, clearS, capH);
  const sBelow = Math.min(capW, belowS, capH);
  let s, gag = false;
  // ★ 最小可用缩放 0.26：旧值 0.30 在手机上会把两个舞台都判死（8 Plus 横屏右侧只能到 0.27），
  //   结果"动画全没了"。0.26 时内容约 112×86 逻辑 px，手机 dpr2 下画布仅 224×172，开销可忽略。
  if (sClear >= 0.26) { s = sClear; gag = kind === 'right'; } // ①
  else if (sBelow >= 0.26) { s = sBelow; }                    // ②
  else return null;
  const contentW = CW * s, contentH = BASE_H * s;
  return {
    s, contentW, contentH, gag,
    contentLeft: kind === 'right' ? right - contentW : GAP, // 内容贴角
    contentTop: bottom - contentH,
    right, bottom,
  };
}
// #endregion stage-geometry

/** 两个舞台一起决策：**要么都显示、要么都收起**。
 *  手机上常出现"左边一个 120px 缩略图、右边什么都没有"的不对称画面；
 *  而且短屏时舞台本身也挤不下（内容会压到按钮区域），干脆走干净的纯版式。
 *  结果按"视口 + 按钮矩形"做键缓存：同一帧里两个舞台各问一次不会重复计算。 */
const stageCache = { key: '', v: null };
function stageLayout() {
  const b = localRect(document.getElementById('btnAbout'));
  const key = [vw(), vh(), b.left, b.top, b.right, b.bottom].map((n) => Math.round(n)).join(',');
  if (stageCache.key === key) return stageCache.v;
  const L = computeStage(vw(), vh(), b, 'left');
  const R = computeStage(vw(), vh(), b, 'right');
  const both = L && R;
  const v = { b, L: both ? L : null, R: both ? R : null };
  stageCache.key = key;
  stageCache.v = v;
  return v;
}


/** 每帧开头：按物理分辨率清屏（**不填底色** → 与页面星空背景完全融合），
 *  然后切到内容坐标系，之后所有对象都按内容坐标绘制。 */
function beginFrame(ctx, L) {
  ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  ctx.clearRect(0, 0, L.w, L.h);
  ctx.setTransform(L.dpr * L.s, 0, 0, L.dpr * L.s, L.dpr * L.ox, L.dpr * L.oy);
}

function drawObjects(ctx, scene) {
  for (const o of scene.objects) {
    if (!o.render) continue;
    try { o.render(ctx, { scene, time: scene.time }); } catch (e) { /* 单个对象出错不影响整幕 */ }
  }
}

// ============================================================================
// 左下：传送门舞台 —— 真实物理：A=高处门（高台顶），B=地面门。
// 玩家从 B 左侧起步，一直往右：进 B → 引擎传到 A（高台顶）→ 出 A 继续向右 →
// 走出高台边缘掉下来 → 落到 B 门前 → 再进 B → 再传 A…（无限循环）
// 物理按固定 1/60 步进 + 渲染插值：60Hz 屏幕上不再"每两步才动一次"（顿挫感来源）
// ============================================================================
const portalDemo = (function () {
  if (REDUCE) return null;
  const canvas = document.getElementById('cvL');
  const ctx = canvas.getContext('2d');
  const W = 380;
  const scene = new C.Scene({ worldW: W, worldH: BASE_H });
  scene.addObject(new C.Floor({ x: -40, y: GROUND, w: 460, h: 40 }));          // 地面
  scene.addObject(new C.Floor({ x: -40, y: GROUND - 140, w: 160, h: 30 }));    // 高台
  const pa = new C.Portal({ x: 32, y: GROUND - 204, w: 46, h: 64, color: '#c78bff', id: 'pa' });  // A：高台顶
  const pb = new C.Portal({ x: 170, y: GROUND - 72, w: 60, h: 72, color: '#c78bff', id: 'pb' });  // B：地面上
  scene.addObject(pa); scene.addObject(pb);
  const p = new C.Player({ x: 140, y: GROUND - 45, substance: 'NaOH', mass: 8, moveSpeed: 120, id: 'walk' });
  scene.addObject(p);
  scene.status = 'running';
  scene.control.add('right'); // 一直往右

  let L = { dpr: 1, w: W, h: BASE_H, s: 1, ox: 0, oy: 0 };
  let live = true;
  canvas.style.display = 'none';   // 布局算完之前先别露面（免得闪一下"原始尺寸"的画布）
  function layout() {
    const st = stageLayout().L;    // 两个舞台同进同退（见 stageLayout）
    if (!st) { live = false; canvas.style.display = 'none'; return; } // 放不下 → 收起
    live = true;
    canvas.style.display = 'block';
    L = fitStage(canvas, W, BASE_H, Math.round(st.contentW), Math.round(st.contentH), st.s, 'left');
  }
  hookViewport(layout);

  const TICK = 1 / 60;
  const MAX_CATCHUP = 6;
  let acc = 0, last = performance.now();
  let px = p.x, py = p.y;   // 上一次物理步进前的位置（插值用）
  let rx = p.x, ry = p.y;   // 本帧渲染位置
  const ripples = [];       // 穿门涟漪（入/出各一圈）
  /** 穿门涟漪：扩散光环，颜色与门一致 */
  function drawRipples(dt) {
    if (!ripples.length) return;
    ctx.save();
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.t += dt;
      const k = r.t / 0.55;
      if (k >= 1) { ripples.splice(i, 1); continue; }
      ctx.globalAlpha = (1 - k) * 0.7;
      ctx.strokeStyle = '#c78bff';
      ctx.lineWidth = 0.6 + 2.2 * (1 - k);
      ctx.beginPath();
      ctx.arc(r.x, r.y, 6 + k * 32, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
  (function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min((now - last) / 1000, 0.1); last = now;
    if (!live || window.__czHomePaused) return; // 离开首页（选关/关卡 iframe）时暂停画布循环，省电
    acc += dt;
    let n = 0;
    while (acc >= TICK && n < MAX_CATCHUP) {
      // 每刻重新声明"一直往右"：Scene 在页面失焦/隐藏时会清空 control
      // （防键盘卡住，见 src/core/input.js）；只 add 一次的话，切标签页回来就永远丢了
      // → 玩家从此不动（"切走再回来左边小人卡住"）。
      scene.control.add('right');
      px = p.x; py = p.y;
      scene.step(TICK);
      // 穿门会瞬移：跨度过大时不插值（否则会看到方块"滑"过整张画布），
      // 同时在入口/出口各放一圈涟漪
      if (Math.abs(p.x - px) + Math.abs(p.y - py) > 80) {
        ripples.push({ x: px + 22.5, y: py + 22.5, t: 0 });
        ripples.push({ x: p.x + 22.5, y: p.y + 22.5, t: 0 });
        px = p.x; py = p.y;
      }
      acc -= TICK; n++;
    }
    if (acc > TICK * MAX_CATCHUP) acc = 0; // 长时间卡顿后不补帧，避免快进
    const a = Math.min(1, acc / TICK);
    rx = px + (p.x - px) * a; ry = py + (p.y - py) * a;

    beginFrame(ctx, L);
    const sx = p.x, sy = p.y;
    p.x = rx; p.y = ry;               // 只改渲染用的坐标，物理状态不受影响
    drawObjects(ctx, scene);
    p.x = sx; p.y = sy;
    drawRipples(dt);
  })(performance.now());
  return {
    layout,
    /** 立刻按当前布局重画一帧（外壳切回首页时用：画布可能停在旧尺寸/旧帧上） */
    paint() {
      if (!live) return;
      beginFrame(ctx, L);
      drawObjects(ctx, scene);
    },
  };
})();

// ============================================================================
// 右下：焰色舞台 —— 地板 / 玩家 / 三盏酒精灯（A B C，各配一种盐的焰色）
// 玩家流程：A 左侧 → 跳到 A 上（停）→ 跳到 B 上（停）→ 跳到 C 上（停）→
// 向左斜升后拉平，平推撞上页面真实"关于"按钮的**右缘** → 按钮被顶得向左弹一下
// → 反弹落回 A。方块全程在按钮右侧（x 方向永不重叠）→ 不可能穿模
// ----------------------------------------------------------------------------
// 位置全部由解析式给出，渲染直接用（不取整）→ 亚像素平滑；
// 画布尺寸只在 load / resize 时重算（不再定时读 DOM）→ 不再有"微小瞬移"
// ============================================================================
const flameDemo = (function () {
  if (REDUCE) return null;
  const canvas = document.getElementById('cvR');
  const ctx = canvas.getContext('2d');
  const CW = 430, PW = 45;
  const btn = document.getElementById('btnAbout');

  const scene = new C.Scene({ worldW: CW, worldH: BASE_H });
  scene.addObject(new C.Floor({ x: -20, y: GROUND, w: 480, h: 40 }));
  // 玩家（NaOH，小方块）——先加入（绘制在灯后层）
  const p = new C.Player({ x: 70, y: GROUND - PW, substance: 'NaOH', mass: 8, id: 'hero' });
  p.gravity = 0; // 脚本动画：不参与重力
  scene.addObject(p);
  // 三盏酒精灯 A / B / C（盐：KCl 紫 / NaCl 黄 / CuSO4 绿）
  const salts = [['KCl', 0.6], ['NaCl', 0.8], ['CuSO4', 0.5]];
  const lamps = [];
  salts.forEach(([salt, m], i) => {
    const lamp = new C.Lamp({ x: 140 + i * 60, y: GROUND - 40, autoOn: true, id: 'lamp' + i });
    scene.addObject(lamp);
    lamp.addPrecipitate(salt, m);
    lamps.push(lamp);
  });
  scene.status = 'running';

  // 悬停点（玩家左缘 x）：A=137.5 B=197.5 C=257.5（灯中心 - 22.5）
  // AY：玩家 bottom 贴在灯顶(236)上方 6px（站火焰上缘，不悬空）
  const AX = [137.5, 197.5, 257.5];
  const AY = (GROUND - 40) - PW - 6;

  // —— 画布尺寸/缩放：由 computeStage 统一决定（保证舞台压不到"关于"按钮上）——
  // 彩蛋模式：画布左侧多留一条透明"空气带"，方块平推撞按钮右缘（圆环特效也不会被切）；
  // 装饰模式：按钮就贴在内容左前方，此时不做撞击彩蛋，方块只在内容内起跳。
  let L = { dpr: 1, w: CW, h: BASE_H, s: 1, ox: 0, oy: 0 };
  let HIT = { x: 60, y: 20 };   // 撞点（方块左上角的目标位置，内容坐标）
  let onBtn = false;            // 是否真的撞在按钮上（false → 只做空撞特效）
  let live = true;              // 窗口太小时舞台隐藏，帧循环空转
  canvas.style.display = 'none';   // 布局算完之前先别露面

  function layout() {
    const sl = stageLayout();
    const b = sl.b;
    const st = sl.R;               // 两个舞台同进同退（见 stageLayout）
    if (!st) { live = false; canvas.style.display = 'none'; return; } // 放不下 → 收起
    live = true;
    canvas.style.display = 'block';
    if (st.gag) {
      // 彩蛋模式：方块左缘停在按钮右缘（+2px 视觉缝隙）、与按钮垂直居中。
      // 全程方块都在按钮右侧 → x 方向永不重叠 → 数学上不可能穿模
      HIT = {
        x: (b.right + 2 - st.contentLeft) / st.s,
        y: ((b.top + b.bottom) / 2 - st.contentTop) / st.s - PW / 2,
      };
      onBtn = true;
    } else {
      // 装饰模式（按钮就在内容左前方）：不做撞击彩蛋，只在内容里向左上起跳
      HIT = { x: 40, y: Math.max(AY - 150, (b.bottom + 8 - st.contentTop) / st.s) };
      onBtn = false;
    }
    // 空气带：只有彩蛋模式需要（让方块能一路飞到按钮右缘）；上方留出反弹弧顶空间
    const airW = st.gag ? Math.round(st.contentLeft - b.right + PW * st.s + 8) : 0;
    const w = Math.round(airW + st.contentW);
    const h = Math.round(Math.max(st.contentH, st.contentH + st.s * Math.max(0, 60 - HIT.y) + 12));
    L = fitStage(canvas, CW, BASE_H, w, h, st.s, 'right');
  }
  hookViewport(layout);

  const CYCLE = 6.0;
  function bez(x0, y0, cx, cy, x1, y1, k) {
    const u = 1 - k;
    return { x: u * u * x0 + 2 * u * k * cx + k * k * x1, y: u * u * y0 + 2 * u * k * cy + k * k * y1 };
  }
  // 相位：停A → 跳B → 停B → 跳C → 停C → 大跳撞"关于"按钮右缘 → 反弹落回 A
  // 大跳控制点：末端切线取水平（cy = HIT.y）→ 方块"斜升后拉平、平推撞上去"，
  // 撞击瞬间不带有向下分量，也就不会先压到按钮上沿
  function pose(t) {
    if (t < 0.8) return { x: AX[0], y: AY };
    if (t < 1.4) return bez(AX[0], AY, 197.5, 138, AX[1], AY, (t - 0.8) / 0.6);
    if (t < 2.2) return { x: AX[1], y: AY };
    if (t < 2.8) return bez(AX[1], AY, 237.5, 138, AX[2], AY, (t - 2.2) / 0.6);
    if (t < 3.6) return { x: AX[2], y: AY };
    if (t < 4.5) {
      const k = (t - 3.6) / 0.9;
      const cx = AX[2] + (HIT.x - AX[2]) * 0.45;
      return bez(AX[2], AY, cx, HIT.y, HIT.x, HIT.y, k);
    }
    if (t < 5.6) {
      const k = (t - 4.5) / 1.1;
      const cx = HIT.x + (AX[0] - HIT.x) * 0.42;
      return bez(HIT.x, HIT.y, cx, HIT.y - 85, AX[0], AY, k); // 先被弹起，再落回 A 灯
    }
    return { x: AX[0], y: AY };
  }

  // 灯焰余烬：从三盏灯的火苗尖上飘出的小颗粒，颜色 = 该灯的焰色（紫/黄/绿）
  // —— 焰色反应的点睛，数量与透明度都压得很低，避免喧宾夺主
  const embers = [];
  let emberAcc = 0;
  function stepEmbers(dt) {
    emberAcc += dt;
    while (emberAcc > 0.24) {
      emberAcc -= 0.24;
      if (embers.length > 54) break;
      const lp = lamps[(Math.random() * lamps.length) | 0];
      embers.push({
        x: lp.x + lp.w / 2 + (Math.random() - 0.5) * lp.w * 0.6,
        y: lp.y - 16 - Math.random() * 8,
        vx: (Math.random() - 0.5) * 9,
        vy: -(14 + Math.random() * 20),
        r: 0.8 + Math.random() * 1.1,
        t: 0,
        life: 1.0 + Math.random() * 0.8,
        c: lp.flameTintCur || '#ff9a4d',
      });
    }
    for (let i = embers.length - 1; i >= 0; i--) {
      const e2 = embers[i];
      e2.t += dt;
      if (e2.t >= e2.life) { embers.splice(i, 1); continue; }
      e2.x += e2.vx * dt;
      e2.y += e2.vy * dt;
      e2.vy *= 1 - 0.85 * dt; // 越飘越慢
    }
  }
  function drawEmbers() {
    if (!embers.length) return;
    ctx.save();
    for (const e2 of embers) {
      const k = e2.t / e2.life;
      ctx.globalAlpha = (1 - k) * 0.7;
      ctx.fillStyle = e2.c;
      ctx.beginPath();
      ctx.arc(e2.x, e2.y, e2.r * (1 - k * 0.45), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // 撞击特效：撞点扩散的光环 + 火花（撞按钮与空撞都有）
  let fx = null;
  function impact() {
    fx = { t: 0, x: HIT.x, y: HIT.y + PW / 2 }; // 撞点 = 方块左缘中点
    if (!onBtn) return;                        // 没撞到按钮 → 只留特效
    const el = btn;
    if (el && typeof el.animate === 'function') {
      // 从右侧撞上来 → 按钮被顶得向左弹（方向物理正确，且是**远离方块**的方向）
      el.animate([
        { transform: 'translateX(0)' },
        { transform: 'translateX(-7px)' },
        { transform: 'translateX(2px)' },
        { transform: 'translateX(0)' },
      ], { duration: 360, easing: 'ease-out' });
    }
  }
  function drawFx(dt) {
    if (!fx) return;
    fx.t += dt;
    const k = fx.t / 0.5;
    if (k >= 1) { fx = null; return; }
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = '#ffe9b0';
    ctx.lineWidth = 0.6 + 2.2 * (1 - k);
    ctx.beginPath();
    ctx.arc(fx.x, fx.y, 4 + k * 26, 0, Math.PI * 2);
    ctx.stroke();
    for (let i = 0; i < 7; i++) {
      const a = Math.PI + (i / 6) * Math.PI; // 上半圈飞溅
      const rr = 6 + k * 34;
      ctx.fillStyle = i % 2 ? '#ffd76a' : '#7fd8ff';
      ctx.beginPath();
      ctx.arc(fx.x + Math.cos(a) * rr, fx.y + Math.sin(a) * rr * 0.7, 0.5 + 1.8 * (1 - k), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  const TICK = 1 / 60;
  let acc = 0, last = performance.now(), cycleT = 0, bumped = false;
  (function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min((now - last) / 1000, 0.1); last = now;
    if (!live || window.__czHomePaused) return; // 同上：离开首页暂停
    cycleT = (cycleT + dt) % CYCLE;
    const pos = pose(cycleT);
    p.x = pos.x; p.y = pos.y; // 亚像素：不取整（取整会在慢速段产生 1px 抖动）
    p.vel.x = 0; p.vel.y = 0;
    acc += dt;
    let n = 0;
    while (acc >= TICK && n < 6) { scene.step(TICK); acc -= TICK; n++; }
    p.x = pos.x; p.y = pos.y; // 物理步进可能动过位置 → 拉回脚本轨迹

    // 顶到按钮的瞬间（大跳落点 t=4.5）
    if (cycleT >= 4.48 && cycleT < 4.58) {
      if (!bumped) { bumped = true; impact(); }
    } else bumped = false;

    beginFrame(ctx, L);
    drawObjects(ctx, scene);
    stepEmbers(dt);
    drawEmbers();
    drawFx(dt);
  })(performance.now());
  return {
    layout,
    /** 立刻按当前布局重画一帧（外壳切回首页时用） */
    paint() {
      if (!live) return;
      beginFrame(ctx, L);
      drawObjects(ctx, scene);
      drawEmbers();
    },
  };
})();

/** 外壳从选关/关于/关卡返回首页时：立刻重排 + 重画两个小舞台。
 *  背景：页面视图期间 body.czl-page 把 .stage 隐藏，画布可能保留着
 *  "按钮矩形为 0"时算出的旧尺寸（Safari 上还会因 canvas width 重设而清空），
 *  只等下一帧 rAF 重绘的话，揭开首页的第一眼可能看到空舞台 / 玩家不见了。 */
window.__czStagesWake = function () {
  try {
    if (portalDemo) { portalDemo.layout(); portalDemo.paint(); }
    if (flameDemo) { flameDemo.layout(); flameDemo.paint(); }
  } catch (e) { /* 纯装饰，出错不影响功能 */ }
};

// 星夜（位置用局部 px，竖屏强制横屏时也铺满）
// 低档：只留 26 颗、且**不加 drop-shadow 滤镜**——滤镜会让每颗星星各占一个
// 需要重新模糊的合成层，90 颗 × 每帧闪烁 = 手机 GPU 的主要开销之一
(function () {
  if (REDUCE) return;
  const box = document.getElementById('stars');
  const place = () => {
    for (const s of box.children) {
      s.style.left = (Math.random() * vw()).toFixed(0) + 'px';
      s.style.top = (Math.random() * vh()).toFixed(0) + 'px';
    }
  };
  const N = LOW ? 26 : 90;
  for (let i = 0; i < N; i++) {
    const s = document.createElement('i');
    s.className = 'st';
    const sz = 1 + Math.random() * 2.2;
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    s.style.left = (Math.random() * vw()).toFixed(0) + 'px';
    s.style.top = (Math.random() * vh()).toFixed(0) + 'px';
    s.style.animationDuration = (2.4 + Math.random() * 5) + 's';
    s.style.animationDelay = (Math.random() * 5) + 's';
    if (!LOW) s.style.filter = 'drop-shadow(0 0 3px rgba(200,220,255,.9))';
    box.appendChild(s);
  }
  addEventListener('orientationchange', () => setTimeout(place, 260));
})();

// 偶发流星：6~15s 一颗（低档更稀：12~21s，且不带滤镜，见 body.low .meteor）
(function () {
  if (REDUCE) return;
  const box = document.getElementById('meteors');
  function spawn() {
    if (window.__czHomePaused) { setTimeout(spawn, 6000); return; } // 离开首页不生成流星
    if (!box.childElementCount) {
      const m = document.createElement('i');
      m.className = 'meteor';
      const W = vw();
      m.style.left = (W * (0.08 + Math.random() * 0.62)).toFixed(0) + 'px';
      m.style.top = (vh() * (0.02 + Math.random() * 0.30)).toFixed(0) + 'px';
      m.style.width = (72 + Math.random() * 96).toFixed(0) + 'px';
      // 斜 18° 的位移量：按局部宽度算，旋转坐标系下也一致
      m.style.setProperty('--dx', (W * 0.44).toFixed(0) + 'px');
      m.style.setProperty('--dy', (W * 0.143).toFixed(0) + 'px');
      m.addEventListener('animationend', () => m.remove());
      box.appendChild(m);
    }
    setTimeout(spawn, (LOW ? 11000 : 6000) + Math.random() * 9000);
  }
  setTimeout(spawn, 2200 + Math.random() * 3500);
})();

// 鼠标微视差：背景三层整体平移 ≤4px（阻尼跟随；触屏/无 hover 设备不启用）// 只动 #bg 一层，前景按钮与两个舞台纹丝不动 → 有纵深但不晃眼
(function () {
  if (REDUCE || !matchMedia('(hover: hover)').matches) return;
  const bg = document.getElementById('bg');
  const AMP = 8; // 光标从中心到边缘的总位移（实际最多 ±4px）
  let tx = 0, ty = 0, cx = 0, cy = 0, running = false;
  addEventListener('mousemove', (e) => {
    const p = localPtr(e);
    tx = (p.x / vw() - 0.5) * -AMP;
    ty = (p.y / vh() - 0.5) * -AMP;
    if (!running) { running = true; requestAnimationFrame(tick); }
  }, { passive: true });
  function tick() {
    cx += (tx - cx) * 0.08;
    cy += (ty - cy) * 0.08;
    bg.style.transform = `translate3d(${cx.toFixed(2)}px,${cy.toFixed(2)}px,0)`;
    if (Math.abs(tx - cx) > 0.05 || Math.abs(ty - cy) > 0.05) requestAnimationFrame(tick);
    else running = false;
  }
})();

// 预取（用户要求）：Cloudflare 在国内 RTT 大，"点按钮 → 白屏等待"很伤体验。
// 趁玩家在主页停留时（load 之后的空闲时段、低优先级）把下一步要用的东西抓进本地缓存：
//   ① 关卡表 levels/levels.json（顺带挑出 1~2 个"最可能马上要打"的关卡页）
//   ② 两个按钮的目标页 select.html / about.html + 关卡页共用的 levels/report.js
// 配合仓库根目录的 _headers（HTML 允许短暂缓存 + stale-while-revalidate），
// 点进选关/关卡时直接命中缓存，不再等一次跨国往返；没命中也只是照旧走网络，无副作用。
// 底部那条细进度条（#pre）如实显示进度：全部命中缓存时 250ms 内就结束，根本不会露面。
(function prefetch() {
  const box = document.getElementById('pre');
  const fill = document.getElementById('preFill');
  const txt = document.getElementById('preText');
  let total = 0, done = 0, bytes = 0, partial = 0, lastPct = 0, finished = false;
  let showTimer = 0;
  window.__preDebug = () => ({ total, done, partial: Math.round(partial * 100) / 100, bytes, lastPct, finished });

  const paint = () => {
    if (!box || !fill || !txt) return;
    // ★ partial 里已经含"完成项 = 1.0"，不能再加 done（否则重复计数 → 分母 5 项却算出 120%）
    //   分母是"清单条数"，所以必须先把清单定下来再开始抓；没真正结束前最多显示 97%
    const raw = Math.round((partial / Math.max(1, total)) * 100);
    const pct = finished ? 100 : Math.min(97, Math.max(lastPct, raw));
    lastPct = pct;
    fill.style.width = pct + '%';
    txt.textContent = finished ? '缓存就绪 ✓'
      : `缓存中 ${pct}% · ${Math.max(1, Math.round(bytes / 1024))}KB`;
  };
  const finish = () => {
    if (finished) return;
    finished = true;
    clearTimeout(showTimer);
    paint();
    if (box) box.classList.add('done');
    setTimeout(() => { if (box) box.classList.remove('on'); }, 1400);   // 报个"就绪"再悄悄退场
  };

  /** 抓一个资源：按 content-length 做**字节级**部分进度，进度条才走得顺。
   *  每条的贡献 = min(1, 本条已收字节 / 本条总字节)；完成后固定记 1（分母 = 条数）。 */
  const warm = (url) => {
    total++;
    paint();
    let frac = 0;                                  // 本条已贡献的进度（0..1）
    const setFrac = (v) => { partial += v - frac; frac = v; };
    return fetch(url, { priority: 'low' })
      .then((res) => {
        // ★ 有 gzip/brotli 时 content-length 是**压缩后**的字节数，而 body 读出来是解压后的，
        //   直接相除会瞬间冲满 → 按文本资源常见的 ~4 倍压缩比折算（Cloudflare 上就是这么发的）
        const enc = res.headers.get('content-encoding');
        const len = Math.max(1, (Number(res.headers.get('content-length')) || 60000) * (enc ? 4 : 1));
        if (!res.body || typeof res.body.getReader !== 'function') {
          return res.arrayBuffer().then((buf) => { bytes += buf.byteLength; });   // 老内核：整块算
        }
        const reader = res.body.getReader();
        let got = 0;
        const pump = () => reader.read().then((r) => {
          if (r.done) return;
          got += r.value.byteLength;
          bytes += r.value.byteLength;
          setFrac(Math.min(0.98, got / len));       // 留 0.02 给"收尾"，避免提前到 100%
          paint();
          return pump();
        });
        return pump();
      })
      .catch(() => { /* 抓不到就算了，照旧走网络 */ })
      .then(() => { setFrac(1); done++; paint(); });
  };

  addEventListener('load', () => {
    const idle = window.requestIdleCallback || ((fn) => setTimeout(fn, 900));
    idle(async () => {
      // 真正开始前先在 250ms 后准备露脸：全部命中缓存时它来不及出现
      showTimer = setTimeout(() => { if (box && !finished) box.classList.add('on'); }, 250);
      // ① 先拿关卡表：它只用来决定"抓哪几关"，不计入进度（分母要先固定，见 paint）
      //    ★ 外壳用 iframe（?spa=1）加载页面，预热 URL 要和 iframe 请求完全一致才有用
      const shellApi = window.__czShell;
      const warmUrl = (p) => (shellApi && shellApi.withSpa ? shellApi.withSpa(p) : p);
      let list = [warmUrl('select.html'), warmUrl('about.html'), 'levels/report.js'];
      try {
        const cfg = await (await fetch('levels/levels.json')).json();
        let cleared = new Set();
        try { cleared = new Set(JSON.parse(localStorage.getItem('chezzle-progress-v1') || '{}').cleared || []); } catch (e) { /* 忽略 */ }
        const all = [...(cfg.tutorial ? [cfg.tutorial] : []), ...Object.values(cfg.levels || {}).flat()]
          .filter((l) => l && l.file);
        const next = all.filter((l) => !cleared.has(l.id));       // 优先"下一个还没通关的"
        list = list.concat([...next, ...all].slice(0, 2).map((l) => warmUrl(l.file)));
      } catch (e) { /* 关卡表拿不到：只抓保底那几个 */ }
      // ② 清单已定 → 分母固定 → 开始抓（进度条从 0 稳稳走到 100%）
      await Promise.all(list.map(warm));
      finish();
    });
  });
})();

// 外壳返回首页时（从选关/关于回来）：重播标题/按钮的入场动画，而不是"静默切回"
window.__czHomeShow = function () {
  try {
    const title = document.querySelector('.title');
    if (title) {
      for (const el of title.querySelectorAll('.lt')) {
        el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
      }
    }
    for (const el of document.querySelectorAll('.bar, .ver')) {
      el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
    }
  } catch (e) { /* 纯装饰，失败忽略 */ }
};

// 引擎就绪：角落舞台淡入、加载占位淡出（首屏转场/路由由 body 开头的独立外壳脚本负责）
document.body.classList.add('stagesReady');
// 若外壳在引擎还在下载时就切回了首页：等初始化完成后再补播标题/按钮入场
if (typeof window.__czAfterHomeInit === 'function') {
  const cb = window.__czAfterHomeInit;
  window.__czAfterHomeInit = null;
  try { cb(); } catch (e) { /* 忽略 */ }
}
} // __czHomeInit

/** 外壳用：确保首页舞台已初始化（可重复调用，只生效一次） */
window.__czStartHome = function () {
  if (window.__czHomeStarted) return;
  window.__czHomeStarted = true;
  window.__czLoadEngine(function () { __czHomeInit(); });
};
// 初始路由就是首页 → 立即开始（引擎并行下载，不挡标题/按钮的首屏动画）
if (!document.body.classList.contains('czl-page')) window.__czStartHome();
</script>
<script>
/* ============================================================================
   设置面板（首页）
   ----------------------------------------------------------------------------
   写入 window.ChezzlePrefs（prefs.js，localStorage）：
     · 视角大小      → 关卡相机缩放（src/core/prefs.js → render/camera.js）
     · 摇杆大小      → 移动端摇杆半径（core/touch.js joyGeom）
     · 右下按钮大小  → 移动端 2×2 按钮边长（core/touch.js touchButtonRects）
     · 键位          → 桌面键盘映射（core/input.js）
   改完即存；关卡页启动时读取。移动端隐藏键位、桌面隐藏触控尺寸（触屏笔电两者都显示）。
   ========================================================================== */
(function () {
  var P = window.ChezzlePrefs;
  var panel = document.getElementById('czSet');
  var openBtn = document.getElementById('btnSet');
  if (!panel || !openBtn) return;
  if (!P) { openBtn.disabled = true; return; }

  var closeBtn = document.getElementById('czSetClose');
  var doneBtn = document.getElementById('czSetDone');
  var resetBtn = document.getElementById('czSetReset');
  var keyList = document.getElementById('czSetKeyList');
  var viewInput = document.getElementById('czSetView');
  var viewVal = document.getElementById('czSetViewVal');
  var joyInput = document.getElementById('czSetJoy');
  var joyVal = document.getElementById('czSetJoyVal');
  var btnInput = document.getElementById('czSetBtn');
  var btnVal = document.getElementById('czSetBtnVal');
  var touchSec = document.getElementById('czSetTouch');
  var keysSec = document.getElementById('czSetKeys');
  var lastFocus = null;
  var listening = null; // { action, oldCode }

  function pct(v) { return Math.round(v * 100) + '%'; }

  // 触屏设备显示摇杆/按钮尺寸；桌面（精细指针）显示键位。触屏笔电两者都显示。
  var coarse = false;
  try { coarse = window.matchMedia('(pointer: coarse)').matches; } catch (e) { /* 老内核 */ }
  var hasTouch = navigator.maxTouchPoints > 0;
  touchSec.hidden = !(coarse || (hasTouch && Math.min(innerWidth, innerHeight) < 500));
  keysSec.hidden = coarse;

  function renderKeys() {
    var p = P.get();
    keyList.innerHTML = '';
    P.ACTIONS.forEach(function (a) {
      var row = document.createElement('div');
      row.className = 'czset-key';
      var name = document.createElement('span');
      name.textContent = a.label;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'czset-kbtn';
      b.textContent = P.keyLabel(p.keys[a.id]);
      b.setAttribute('aria-label', a.label + ' 当前键位：' + P.keyLabel(p.keys[a.id]) + '，点击修改');
      b.addEventListener('click', function () { startListen(a.id, b); });
      row.appendChild(name);
      row.appendChild(b);
      keyList.appendChild(row);
    });
  }

  function syncInputs() {
    var p = P.get();
    viewInput.value = Math.round(p.viewScale * 100);
    viewVal.textContent = pct(p.viewScale);
    joyInput.value = Math.round(p.joyScale * 100);
    joyVal.textContent = pct(p.joyScale);
    btnInput.value = Math.round(p.btnScale * 100);
    btnVal.textContent = pct(p.btnScale);
    renderKeys();
  }

  function endListen() {
    if (!listening) return;
    var l = listening;
    listening = null;
    window.removeEventListener('keydown', onListenKey, true);
    if (l.btn) {
      l.btn.classList.remove('listen');
      l.btn.textContent = P.keyLabel(P.get().keys[l.action]);
    }
  }
  function onListenKey(e) {
    e.preventDefault();
    e.stopPropagation();
    if (e.repeat) return;
    if (!listening) return;
    var action = listening.action;
    if (e.code === 'Escape') { endListen(); return; }
    var keys = Object.assign({}, P.get().keys);
    var oldCode = keys[action];
    var cur = P.get().keys;
    for (var i = 0; i < P.ACTIONS.length; i++) {
      var id = P.ACTIONS[i].id;
      if (id !== action && cur[id] === e.code) keys[id] = oldCode; // 冲突 → 双方交换
    }
    keys[action] = e.code;
    endListen();
    P.save({ keys: keys });
    renderKeys();
  }
  function startListen(action, btn) {
    if (listening) endListen();
    listening = { action: action, btn: btn };
    btn.classList.add('listen');
    btn.textContent = '按下新键…';
    window.addEventListener('keydown', onListenKey, true);
  }

  viewInput.addEventListener('input', function () {
    P.save({ viewScale: Number(viewInput.value) / 100 });
    viewVal.textContent = pct(Number(viewInput.value) / 100);
  });
  joyInput.addEventListener('input', function () {
    P.save({ joyScale: Number(joyInput.value) / 100 });
    joyVal.textContent = pct(Number(joyInput.value) / 100);
  });
  btnInput.addEventListener('input', function () {
    P.save({ btnScale: Number(btnInput.value) / 100 });
    btnVal.textContent = pct(Number(btnInput.value) / 100);
  });

  function openPanel() {
    if (!panel.hidden) return;
    lastFocus = document.activeElement;
    syncInputs();
    panel.hidden = false;
    panel.setAttribute('aria-hidden', 'false');
    // 强制一帧后再加 .in，确保淡入/上浮过渡生效
    requestAnimationFrame(function () { panel.classList.add('in'); });
    if (closeBtn && closeBtn.focus) closeBtn.focus();
  }
  function closePanel() {
    if (panel.hidden) return;
    endListen();
    panel.classList.remove('in');
    panel.setAttribute('aria-hidden', 'true');
    setTimeout(function () { panel.hidden = true; }, 220);
    if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
    lastFocus = null;
  }

  openBtn.addEventListener('click', openPanel);
  if (closeBtn) closeBtn.addEventListener('click', closePanel);
  if (doneBtn) doneBtn.addEventListener('click', closePanel);
  if (resetBtn) resetBtn.addEventListener('click', function () { P.reset(); syncInputs(); });
  panel.addEventListener('click', function (e) { if (e.target === panel) closePanel(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !panel.hidden && !listening) closePanel();
  });
})();
</script>
</body>

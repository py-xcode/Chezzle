<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chezzle · 选关 · 元素回廊</title>
<style>
  /* ★ 主题色用三个数值自定义属性承载并注册成 <number>：这样它们**可以被 transition 插值**，
     换元素时背景洗色/符文环/光晕才会平滑过渡而不是硬切（"用 var() 拼的颜色"默认不可动画）。 */
  @property --ar { syntax: '<number>'; inherits: true; initial-value: 150; }
  @property --ag { syntax: '<number>'; inherits: true; initial-value: 232; }
  @property --ab { syntax: '<number>'; inherits: true; initial-value: 176; }
  :root {
    --gold: #e8b84b; --gold-l: #ffd76a; --cyan: #7fd8ff; --green: #96e8b0; --purple: #c78bff;
    --edge: #2b3047; --txt: #dfe8f2; --dim: #9fb2c8; --bg-deep: #07051a;
    --ar: 150; --ag: 232; --ab: 176;   /* 当前元素的主题色（随选中元素平滑过渡） */
    --card-w: 320px; --card-h: 248px;
    transition: --ar .6s ease, --ag .6s ease, --ab .6s ease;  /* 换色动画落在这里 */
  }
  * { box-sizing: border-box; margin: 0; }
  /* ★ 关掉浏览器自己的手势：卡片是绝对定位、会撑出可视区，若不禁止原生平移，
     手机上滑动时整个页面会跟着被拖走（用户截图复现）；顺手关掉长按菜单/选中。
     touch-action 写在 html 上对整页生效，拖拽由 Pointer Events 自己处理。 */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  body { overflow: hidden; color: var(--txt); font: 14px "Segoe UI","Microsoft YaHei",sans-serif;
    background: #07051a; }
  a { color: var(--cyan); text-decoration: none; }
  button { font-family: inherit; }

  /* ---------- 背景（与主页同一套：星野 / 星云 / 符文法阵 / 偶发流星） ---------- */
  #bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .wash { position: absolute; inset: 0; transition: background 900ms ease;
    background:
      radial-gradient(1150px 700px at 50% -12%, rgb(var(--ar) var(--ag) var(--ab) / .16) 0%, transparent 62%),
      radial-gradient(1500px 900px at 50% 118%, rgba(20,14,64,.9) 0%, #07051a 62%),
      radial-gradient(1100px 620px at 50% 42%, rgba(84,60,180,.22) 0%, transparent 66%); }
  #stars { position: absolute; inset: 0; }
  /* ★ 必须限定在 #stars 内：`.st` 这种短类名容易和页面里别的东西（同位素 chip 的状态字）撞车 */
  #stars .st { position: absolute; border-radius: 50%; background: #fff; animation: twinkle ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .1; transform: scale(.8); } 50% { opacity: .75; transform: scale(1); } }
  .sigil { position: absolute; left: 50%; top: 46%; width: 900px; height: 900px; transform: translate(-50%,-50%);
    opacity: .07; animation: spin 150s linear infinite; }
  @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
  #meteors { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .meteor { position: absolute; height: 2px; border-radius: 2px; opacity: 0;
    background: linear-gradient(90deg, rgba(207,230,255,0), rgba(207,230,255,.8) 62%, #fff);
    filter: drop-shadow(0 0 6px rgba(160,210,255,.75));
    animation: meteorFall 1.15s cubic-bezier(.36,.06,.74,.62) forwards; }
  @keyframes meteorFall {
    from { transform: translate3d(0,0,0) rotate(18deg); opacity: 0; }
    14% { opacity: .8; }
    to { transform: translate3d(44vw, 14.3vw, 0) rotate(18deg); opacity: 0; }
  }

  /* ---------- 页面骨架：上栏 / 回廊 / 下栏 ---------- */
  #app { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 16px 20px 6px; }
  .back { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border: 1px solid var(--edge);
    background: linear-gradient(180deg, #232a5c, #12163a); color: var(--txt); cursor: pointer;
    transition: filter .2s, transform .2s, color .2s;
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px); }
  .back:hover { filter: drop-shadow(0 0 10px rgba(232,184,75,.45)); color: var(--gold-l); transform: translateY(-1px); }
  .back:focus-visible, .ghost:focus-visible, .card:focus-visible, .chip:focus-visible, .enter:focus-visible {
    outline: 2px solid var(--cyan); outline-offset: 3px; }
  h1 { font-size: 30px; color: var(--gold-l); letter-spacing: 6px; text-shadow: 0 0 18px rgba(232,184,75,.5); }
  h1 small { display: block; margin-top: 3px; font-size: 11.5px; font-weight: normal; letter-spacing: 1px; color: var(--dim); }
  .hspace { margin-left: auto; }
  #progress { display: flex; align-items: center; gap: 10px; padding: 7px 14px; font-size: 12.5px; color: var(--cyan);
    border: 1px solid rgba(127,216,255,.35); background: rgba(16,26,56,.75); letter-spacing: 1px;
    filter: drop-shadow(0 0 8px rgba(127,216,255,.22));
    clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px); }
  #pbar { width: 92px; height: 5px; background: rgba(127,216,255,.16); overflow: hidden; }
  #pbar { display: block; }
  #pfill { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), #cfefff); transition: width .5s ease; }
  .ghost { padding: 7px 12px; font-size: 11.5px; color: #7b8aa8; background: none; border: 1px solid transparent; cursor: pointer; }
  .ghost:hover { color: #ffb0b0; border-color: rgba(255,120,120,.35); }

  /* ---------- 回廊（横向卡片走廊） ---------- */
  /* max-height 卡住走廊高度：高屏上不至于把卡片和下方同位素条拉得太远 */
  #corridor { position: relative; flex: 1 1 auto; min-height: 0; max-height: 460px; perspective: 1300px; }
  #ring { position: absolute; left: 50%; top: 50%; width: min(560px, 78vmin); height: min(560px, 78vmin);
    transform: translate(-50%,-50%); opacity: .42; transition: opacity .5s ease; }
  #ring circle, #ring path { stroke: rgb(var(--ar) var(--ag) var(--ab) / .55); }
  #ring .spin { transform-origin: 50% 50%; animation: spin 46s linear infinite; }
  #ring .spin2 { transform-origin: 50% 50%; animation: spin 78s linear infinite reverse; }
  #track { position: absolute; inset: 0; transition: opacity .2s ease; }
  .card { position: absolute; left: 50%; top: 50%; width: var(--card-w); height: var(--card-h);
    margin: 0; padding: 0; border: 0; background: none; cursor: pointer; color: var(--txt);
    transform-style: preserve-3d; will-change: transform, opacity; text-align: left; }
  /* 斜切底板（Phigros 式斜牌），文字保持正立 → 好看且中文可读 */
  .card .plate { position: absolute; inset: 0; transform: skewX(-9deg); border: 1px solid rgba(var(--c), .5);
    background: linear-gradient(140deg, rgba(var(--c), .16), rgba(10,10,32,.86) 58%, rgba(8,8,24,.9));
    filter: drop-shadow(0 10px 26px rgba(0,0,0,.5)); transition: border-color .25s, filter .25s, background .25s;
    clip-path: polygon(18px 0, 100% 0, calc(100% - 18px) 100%, 0 100%); }
  .card .body { position: absolute; inset: 0; padding: 20px 24px; display: flex; flex-direction: column; }
  /* No.X 往左探出底板一点（斜牌左上角本来就留了白），做"编号破框"的层次 */
  .card .cnum { font: 12px ui-monospace, Consolas, monospace; letter-spacing: 1px; color: rgba(var(--c), .9);
    margin-left: -18px; }
  .card .csym { font: bold clamp(44px, 7.2vmin, 74px)/1 "Segoe UI",sans-serif; letter-spacing: 2px; color: #fff;
    text-shadow: 0 0 22px rgba(var(--c), .55); margin-top: 2px; margin-left: 15px;
    display: flex; align-items: center; }
  /* 引导卡用内联 SVG 代替 ⚗ 字符：那是个冷僻码位，多数系统缺字形会显示成豆腐块 */
  .card .csym svg { width: .92em; height: .92em; }
  .card .cname { font-size: 15px; letter-spacing: 3px; color: #dfe8f2; margin-top: 2px; margin-left: 15px; }
  .card .cmeta { margin-top: auto; font-size: 11.5px; letter-spacing: 1px; color: var(--dim); }
  .card .cpips { display: flex; gap: 5px; margin-top: 8px; }
  .card .cpips i { width: 16px; height: 4px; background: rgba(255,255,255,.16); }
  .card .cpips i.on { background: rgba(var(--c), .95); filter: drop-shadow(0 0 6px rgba(var(--c), .8)); }
  .card .cpips i.done { background: var(--gold-l); filter: drop-shadow(0 0 6px rgba(255,215,106,.8)); }
  .card .tick { position: absolute; right: 26px; top: 20px; width: 22px; height: 22px; opacity: 0; }
  .card .badge { position: absolute; right: 26px; bottom: 18px; padding: 2px 9px; font-size: 10.5px; letter-spacing: 1px;
    border: 1px solid rgba(var(--c), .8); color: rgb(var(--c)); background: rgba(8,10,28,.7); }
  /* 状态：暗（无关卡）< 未解锁 < 已解锁 < 已通关 < 金光（全同位素通关） */
  .card.st0 { --c: 90,100,150; } .card.st0 .body, .card.st0 .plate { opacity: .42; }
  .card.st1 { --c: 120,130,190; } .card.st1 .body, .card.st1 .plate { opacity: .68; }
  .card.st2 { --c: 150,232,176; }
  .card.st3 { --c: 150,232,176; } .card.st3 .plate { background: linear-gradient(140deg, rgba(var(--c),.3), rgba(10,10,32,.85) 60%); }
  .card.gold { --c: 255,215,106; } .card.gold .plate { border-color: var(--gold-l); animation: goldPulse 2.6s ease-in-out infinite; }
  /* 稀有关卡元素 = 紫色（与"已解锁=绿 / 已通关更亮 / 金光=全清"这套状态色区分开） */
  .card.rare.st2, .card.rare.st3 { --c: 199,139,255; }
  .card.rare .plate { box-shadow: inset 0 0 40px rgba(199,139,255,.12); }
  .card.st3 .tick, .card.gold .tick { opacity: 1; }
  /* 未编写关卡的元素：只留下"轮得到"的轮廓，别抢已有关卡元素的注意力 */
  .card.st0 .cmeta { color: #5a6480; }
  @keyframes goldPulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(255,215,106,.45)); }
    50% { filter: drop-shadow(0 0 26px rgba(255,215,106,.95)); } }
  .card.active .plate { border-color: rgba(var(--c), .95); }
  .card.locked-shake { animation: shake .34s ease; }
  @keyframes shake { 0%,100% { margin-left: 0; } 25% { margin-left: -9px; } 60% { margin-left: 7px; } }

  .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 76px; display: grid; place-items: center;
    border: 1px solid var(--edge); background: rgba(14,17,42,.72); color: var(--txt); cursor: pointer; z-index: 200;
    transition: filter .2s, color .2s, background .2s;
    clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
  .arrow:hover { color: var(--gold-l); background: rgba(30,26,70,.85); filter: drop-shadow(0 0 12px rgba(232,184,75,.4)); }
  .arrow[disabled] { opacity: .25; cursor: default; }
  #prev { left: max(10px, calc(50% - 520px)); } #next { right: max(10px, calc(50% - 520px)); }

  /* ---------- 周期轨道：1..7 周期条，当前周期高亮；点一下跳到该周期首个元素 ---------- */
  #periods { display: flex; gap: 6px; padding: 0 20px 2px; }
  .per { flex: 1 1 0; min-width: 0; padding: 4px 7px 5px; cursor: pointer; text-align: left;
    border: 1px solid rgba(120,130,190,.22); background: rgba(12,16,38,.6); color: var(--dim);
    transition: border-color .2s, background .2s, color .2s, transform .2s;
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
  .per b { display: block; font: bold 12px ui-monospace, Consolas, monospace; color: #cfe0ff; }
  .per i { display: block; height: 3px; margin-top: 4px; background: rgba(255,255,255,.12); position: relative; }
  .per i::after { content: ''; position: absolute; inset: 0 auto 0 0; width: var(--f, 0%); background: rgba(199,139,255,.85); }
  .per.on { border-color: rgba(255,215,106,.85); background: rgba(232,184,75,.2); color: #ffe9b0; transform: translateY(-1px); }
  .per.on i::after { background: var(--gold-l); }
  .per:hover { border-color: rgba(232,184,75,.6); color: var(--txt); }
  .per:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  /* 跨周期时飘一下"第 N 周期"，把周期概念讲清楚 */
  #pflash { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); z-index: 210;
    font: bold 15px/1 "Segoe UI","Microsoft YaHei",sans-serif; letter-spacing: 6px; color: rgba(255,233,176,.92);
    text-shadow: 0 0 18px rgba(232,184,75,.6); opacity: 0; pointer-events: none; }
  #pflash.show { animation: pf 1.5s ease-out; }
  @keyframes pf {
    0% { opacity: 0; transform: translateX(-50%) translateY(10px) scale(.94); }
    22% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(-12px); }
  }
  /* 头顶的筛选开关 */
  .seg { display: inline-flex; border: 1px solid var(--edge); overflow: hidden; }
  .seg button { padding: 6px 11px; font-size: 11.5px; color: var(--dim); background: rgba(12,16,38,.7); border: 0; cursor: pointer;
    transition: background .3s ease, color .25s ease; }
  .seg button.on { color: #241a02; background: linear-gradient(180deg, #ffe9a8, #e8b84b); font-weight: bold; }
  .seg button:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }

  /* ---------- 下栏：同位素条 + 进入按钮 ---------- */
  footer { padding: 4px 20px 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  /* 同位素条：撑满整行再居中（否则 flex 收缩会把 chip 压扁、文字互相重叠） */
  #isotopes { display: flex; align-items: stretch; justify-content: center; gap: 9px; flex-wrap: wrap;
    width: 100%; min-height: 54px; }
  /* ★ 注意：<button> 自己当 flex 容器时 Chrome 的固有宽度算不对（内容会折行/被裁剪），
     所以按钮只做 inline-block，真正的横向排布交给里面的 .row */
  .chip { display: inline-block; padding: 8px 14px; cursor: pointer; color: var(--txt);
    flex: 0 0 auto;
    border: 1px solid rgba(120,130,190,.32); background: linear-gradient(180deg, rgba(20,24,56,.85), rgba(10,12,32,.85));
    transition: transform .16s, border-color .25s, filter .25s, background .35s, opacity .25s;
    animation: chipIn .34s cubic-bezier(.2,.9,.3,1.15) both;   /* 换元素时逐个浮入，而不是硬切 */
    clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px); }
  @keyframes chipIn { from { opacity: 0; transform: translateY(12px) scale(.94); } to { opacity: 1; transform: none; } }
  .chip .row { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .chip .row > * { flex: 0 0 auto; }
  .chip:hover { transform: translateY(-2px); border-color: rgba(232,184,75,.6); }
  .chip .iso { display: flex; flex-direction: column; align-items: center; line-height: 1.1;
    font: 11px ui-monospace, Consolas, monospace; color: var(--dim); }
  .chip .iso b { font-size: 13px; color: #cfe0ff; }
  .chip .nm { font-size: 14px; letter-spacing: 1px; }
  .chip .stat { font-size: 10.5px; color: var(--dim); }
  .chip .stars { color: var(--gold-l); font-size: 10.5px; letter-spacing: 1px; }
  .chip.sel { border-color: var(--gold-l); background: linear-gradient(180deg, rgba(232,184,75,.28), rgba(60,42,10,.55));
    filter: drop-shadow(0 0 16px rgba(232,184,75,.4)); }
  .chip.sel .nm { color: #fff6d8; }
  .chip.done { border-color: rgba(143,232,176,.6); }
  .chip.done .st { color: var(--green); }
  .chip.lock { opacity: .62; }
  .chip.lock:hover { border-color: rgba(255,140,140,.5); }
  .chip.empty { opacity: .45; cursor: default; }

  .enter { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 13px 46px;
    font-size: 16px; font-weight: bold; min-width: 260px; white-space: nowrap;
    letter-spacing: 5px; cursor: pointer; border: 0; color: #241a02;
    background: linear-gradient(180deg, #ffe9a8 0%, #e8b84b 46%, #9a6d1e 100%);
    filter: drop-shadow(0 0 16px rgba(232,184,75,.45)) drop-shadow(0 8px 18px rgba(0,0,0,.5));
    transition: transform .18s, filter .3s, background .4s ease, color .3s ease, letter-spacing .3s, font-size .3s;
    clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px); }
  .enter:hover { transform: translateY(-2px); filter: drop-shadow(0 0 26px rgba(255,215,106,.8)) drop-shadow(0 12px 22px rgba(0,0,0,.5)); }
  .enter[disabled] { cursor: default; color: #b9c2d8; background: linear-gradient(180deg, #2a3057, #171b3c);
    filter: none; transform: none; letter-spacing: 2px; font-size: 14px; }
  #enterText { display: inline-block; transition: opacity .2s ease; }

  /* ---------- 进入关卡的过场 ---------- */
  #flash { position: fixed; inset: 0; z-index: 60; pointer-events: none; opacity: 0;
    background: radial-gradient(60% 60% at 50% 46%, rgba(255,255,255,.92), rgb(var(--ar) var(--ag) var(--ab) / .5) 42%, transparent 74%); }
  body.launch #flash { animation: flashOut .46s ease-out forwards; }
  @keyframes flashOut { from { opacity: 0; } 30% { opacity: 1; } to { opacity: 0; } }
  body.launch .card.active { transition: transform .42s cubic-bezier(.2,.9,.3,1.4); transform: translate(-50%,-50%) scale(1.28) !important; }
  body.launch #app > *:not(#corridor) { opacity: .25; transition: opacity .3s; }

  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(16px); z-index: 70;
    padding: 9px 18px; font-size: 13px; background: #1c1650; border: 1px solid rgba(232,184,75,.5); color: var(--txt);
    opacity: 0; transition: opacity .24s, transform .24s; pointer-events: none;
    filter: drop-shadow(0 0 10px rgba(232,184,75,.3));
    clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px); }
  #toast.on { opacity: 1; transform: translateX(-50%); }

  /* ---------- 页面切换：进场淡入 + 离场淡出（点"主页"/"进入关卡"时先淡出再跳） ---------- */
  #wipe { position: fixed; inset: 0; z-index: 900; background: var(--bg-deep); opacity: 1;
    pointer-events: none; transition: opacity .34s ease; }
  #wipe.off { opacity: 0; }

  /* ---------- 响应式：手机上卡片占满一屏宽、按钮全宽 ---------- */
  @media (max-width: 760px) {
    :root { --card-w: 74vw; --card-h: 210px; }
    header { padding: 12px 14px 4px; gap: 10px; }
    h1 { font-size: 22px; letter-spacing: 4px; }
    #progress { padding: 6px 10px; font-size: 11.5px; } #pbar { width: 54px; }
    .arrow { width: 36px; height: 62px; }
    #prev { left: 6px; } #next { right: 6px; }
    .card .csym { font-size: clamp(40px, 13vw, 64px); }
    .card .body { padding: 16px 20px; }
    footer { padding: 2px 14px 16px; gap: 10px; }
    .enter { width: 100%; max-width: 420px; justify-content: center; letter-spacing: 4px; }
    .chip { padding: 7px 11px; gap: 8px; }
  }
  @media (max-height: 560px) {
    :root { --card-h: 168px; }
    .card .csym { font-size: clamp(34px, 9vmin, 54px); }
    #ring { width: min(420px, 70vmin); height: min(420px, 70vmin); }
    #corridor { max-height: none; }
    .card, #ring, .arrow { top: 44%; }
  }
  /* ★ 媒体查询看到的是**物理**视口，旋转后就不等于版式空间了；
     所以"局部空间太矮/太窄"的情况由 JS 打 body 类名来收紧版式（旋转与否都适用） */
  body.short { --card-h: min(50vw, 200px); }
  body.short #periods { display: none; }
  body.short h1 small { display: none; }
  body.short #corridor { max-height: none; }
  body.short .card .csym { font-size: clamp(30px, 11vw, 52px); }
  body.short #ring { width: min(70vh, 70vw); height: min(70vh, 70vw); }
  body.short header { padding: 9px 14px 2px; gap: 9px; }
  body.short #progress { padding: 5px 9px; font-size: 11px; }
  body.short #pbar { width: 44px; }
  body.short footer { padding: 2px 12px 10px; gap: 8px; }
  body.short .chip { padding: 6px 10px; gap: 7px; }
  body.short .enter { font-size: 15px; letter-spacing: 3px; padding: 11px 30px; }
  @media (prefers-reduced-motion: reduce) {
    #stars .st, .sigil, #meteors, .card.gold .plate, #ring .spin, #ring .spin2 { animation: none !important; }
    body.launch #flash { animation: none; }
    .card, .wash, #pfill, .chip, .enter { transition: none; }
  }
  /* —— 竖屏强制横屏：整页绕左上角顺时针转 90°（局部坐标系 = 100vh × 100vw）——
     旋转后 vw/vh 仍指物理视口，所以这里把"按宽度算"的尺寸改成按 vh 算；
     短屏规则（本来用 max-height 判断）在竖屏下命中不了，故在下面显式补一份。
     JS 侧用 vw()/vh()/localRect()/localPtr() 做同样的换算。 */
  @media (orientation: portrait) {
    html { position: absolute; top: 0; left: 100vw; width: 100vh; height: 100vw;
      transform: rotate(90deg); transform-origin: left top; overflow: hidden; }
    /* 旋转后：vw = 版式空间的**高度**，vh = 版式空间的**宽度** */
    :root { --card-w: min(74vh, 460px); --card-h: min(50vw, 250px); }
    .card .csym { font-size: clamp(32px, 12vw, 64px); }
    #ring { width: min(78vw, 78vh); height: min(78vw, 78vh); }
    #corridor { max-height: min(58vw, 460px); }
    header { padding: 11px 14px 3px; gap: 10px; }
    h1 { font-size: 22px; letter-spacing: 4px; }
    #periods { padding: 0 14px 2px; }
    .per { padding: 3px 6px 4px; } .per b { font-size: 11px; }
    footer { padding: 2px 14px 12px; gap: 9px; }
    .enter { width: 100%; max-width: 420px; justify-content: center; letter-spacing: 4px; }
    .chip { padding: 7px 11px; gap: 8px; }
  }
</style>
</head>

<script src="levels/levels.js"></script>
<script>
const CFG_READY = window.CHEZZLE_LEVELS_READY || Promise.resolve(window.CHEZZLE_LEVELS || {});
let CFG = window.CHEZZLE_LEVELS || {};
const PROG_KEY = 'chezzle-progress-v1';

// 竖屏强制横屏：CSS 把整页绕左上角顺时针转 90°，屏幕坐标 (sx,sy) 与页面局部坐标
// (lx,ly) 的关系为 sx = innerWidth - ly、sy = lx → 局部视口 = innerHeight × innerWidth。
// getBoundingClientRect()/clientX 都返回**屏幕坐标**，涉及布局与拖拽时必须换算。
const isRot = () => matchMedia('(orientation: portrait)').matches;
const vw = () => (isRot() ? innerHeight : innerWidth);
const vh = () => (isRot() ? innerWidth : innerHeight);
const localPtr = (e) => (isRot() ? { x: e.clientY, y: innerWidth - e.clientX } : { x: e.clientX, y: e.clientY });

// #region select-model —— 纯函数 + 元素事实表（tests/selectmodel.test.js 会原样提取复算，勿改签名）
// 元素事实：[族, 周期, 序数, 符号, 中文名]。f 区（镧系/锕系）单独放 FOOT，合并后正好 118 位。
const FACTS = [
  [1,1,1,'H','氢'], [18,1,2,'He','氦'], [1,2,3,'Li','锂'], [2,2,4,'Be','铍'], [13,2,5,'B','硼'],
  [14,2,6,'C','碳'], [15,2,7,'N','氮'], [16,2,8,'O','氧'], [17,2,9,'F','氟'], [18,2,10,'Ne','氖'],
  [1,3,11,'Na','钠'], [2,3,12,'Mg','镁'], [13,3,13,'Al','铝'], [14,3,14,'Si','硅'], [15,3,15,'P','磷'],
  [16,3,16,'S','硫'], [17,3,17,'Cl','氯'], [18,3,18,'Ar','氩'], [1,4,19,'K','钾'], [2,4,20,'Ca','钙'],
  [3,4,21,'Sc','钪'], [4,4,22,'Ti','钛'], [5,4,23,'V','钒'], [6,4,24,'Cr','铬'], [7,4,25,'Mn','锰'],
  [8,4,26,'Fe','铁'], [9,4,27,'Co','钴'], [10,4,28,'Ni','镍'], [11,4,29,'Cu','铜'], [12,4,30,'Zn','锌'],
  [13,4,31,'Ga','镓'], [14,4,32,'Ge','锗'], [15,4,33,'As','砷'], [16,4,34,'Se','硒'], [17,4,35,'Br','溴'],
  [18,4,36,'Kr','氪'], [1,5,37,'Rb','铷'], [2,5,38,'Sr','锶'], [3,5,39,'Y','钇'], [4,5,40,'Zr','锆'],
  [5,5,41,'Nb','铌'], [6,5,42,'Mo','钼'], [7,5,43,'Tc','锝'], [8,5,44,'Ru','钌'], [9,5,45,'Rh','铑'],
  [10,5,46,'Pd','钯'], [11,5,47,'Ag','银'], [12,5,48,'Cd','镉'], [13,5,49,'In','铟'], [14,5,50,'Sn','锡'],
  [15,5,51,'Sb','锑'], [16,5,52,'Te','碲'], [17,5,53,'I','碘'], [18,5,54,'Xe','氙'], [1,6,55,'Cs','铯'],
  [2,6,56,'Ba','钡'], [3,6,57,'La','镧'], [4,6,72,'Hf','铪'], [5,6,73,'Ta','钽'], [6,6,74,'W','钨'],
  [7,6,75,'Re','铼'], [8,6,76,'Os','锇'], [9,6,77,'Ir','铱'], [10,6,78,'Pt','铂'], [11,6,79,'Au','金'],
  [12,6,80,'Hg','汞'], [13,6,81,'Tl','铊'], [14,6,82,'Pb','铅'], [15,6,83,'Bi','铋'], [16,6,84,'Po','钋'],
  [17,6,85,'At','砹'], [18,6,86,'Rn','氡'], [1,7,87,'Fr','钫'], [2,7,88,'Ra','镭'], [3,7,89,'Ac','锕'],
  [4,7,104,'Rf','钅卢'], [5,7,105,'Db','钅杜'], [6,7,106,'Sg','钅喜'], [7,7,107,'Bh','钅波'], [8,7,108,'Hs','钅黑'],
  [9,7,109,'Mt','钅麦'], [10,7,110,'Ds','钅达'], [11,7,111,'Rg','钅仑'], [12,7,112,'Cn','鎶'], [13,7,113,'Nh','鉨'],
  [14,7,114,'Fl','鈇'], [15,7,115,'Mc','镆'], [16,7,116,'Lv','鉝'], [17,7,117,'Ts','鿬'], [18,7,118,'Og','鿫'],
];
const bySym = {
  ...Object.fromEntries(FACTS.map(([g, p, n, s, name]) => [s, { g, p, n, s, name, series: null }])),
  // 镧系 / 锕系（f 区，各 14 位）：周期表里抽出来单列的两行，这里同样并进走廊
  ...Object.fromEntries([[58,'Ce','铈'],[59,'Pr','镨'],[60,'Nd','钕'],[61,'Pm','钷'],[62,'Sm','钐'],[63,'Eu','铕'],[64,'Gd','钆'],
    [65,'Tb','铽'],[66,'Dy','镝'],[67,'Ho','钬'],[68,'Er','铒'],[69,'Tm','铥'],[70,'Yb','镱'],[71,'Lu','镥']]
    .map(([n, s, name]) => [s, { g: 3, p: 6, n, s, name, series: '镧系' }])),
  ...Object.fromEntries([[90,'Th','钍'],[91,'Pa','镤'],[92,'U','铀'],[93,'Np','镎'],[94,'Pu','钚'],[95,'Am','镅'],[96,'Cm','锔'],
    [97,'Bk','锫'],[98,'Cf','锎'],[99,'Es','锿'],[100,'Fm','镄'],[101,'Md','钔'],[102,'No','锘'],[103,'Lr','铹']]
    .map(([n, s, name]) => [s, { g: 3, p: 7, n, s, name, series: '锕系' }])),
};

/** 走廊条目：新手引导 + **全部 118 位元素**（按原子序数）。
 *  没有配关卡的位元素也进走廊（"每个元素都轮得到"），只是状态为 st0（暗、显示「暂无」）。
 *  @param {boolean} onlyPlayable 只保留"有已编写关卡"的元素（顶部筛选开关用） */
function buildEntries(cfg, facts, onlyPlayable) {
  const out = [];
  if (cfg.tutorial) {
    out.push({
      sym: 'tutorial', kind: 'tutorial', n: 0, name: cfg.tutorial.name || '新手引导',
      period: 0, group: 0, rare: false, hasLevel: true,
      isotopes: [{ id: cfg.tutorial.id, name: '引导关', mass: 0, file: cfg.tutorial.file }],
    });
  }
  const syms = Object.keys(facts || {});
  syms.sort((a, b) => (facts[a].n || 999) - (facts[b].n || 999));
  for (const sym of syms) {
    const f = facts[sym];
    const isotopes = ((cfg.levels || {})[sym] || []).slice().sort((a, b) => (a.mass || 0) - (b.mass || 0));
    const hasLevel = isotopes.some((i) => i.file);
    if (onlyPlayable && !hasLevel) continue;
    out.push({
      sym, kind: 'element', n: f.n, name: f.name, period: f.p, group: f.g,
      rare: (cfg.rare || []).includes(sym), hasLevel, isotopes,
    });
  }
  return out;
}
/** 每个周期的**通关进度**：total = 该周期已编写关卡数，done = 其中已通关数。
 *  条内填充 = done/total（没关卡的周期为 0）—— 这就是周期轨道上那根条的含义。 */
function periodStats(entries, cleared) {
  const out = [];
  for (let p = 1; p <= 7; p++) {
    const list = entries.filter((e) => e.kind === 'element' && e.period === p);
    if (!list.length) continue;
    const real = list.flatMap((e) => e.isotopes.filter((i) => i.file));
    out.push({
      p, total: list.length,
      withLevel: real.length,
      levels: real.length,
      done: real.filter((i) => cleared && cleared.has(i.id)).length,
      first: entries.indexOf(list[0]),
    });
  }
  return out;
}
/** 索引 → 该索引所在周期的序号（元素卡才有，引导卡返回 0） */
function periodOf(entry) { return entry && entry.kind === 'element' ? entry.period : 0; }

/** 全部关卡（含新手引导）拍平：前置关系与解锁计算都基于它 */
function allLevels(cfg) {
  const out = [];
  if (cfg.tutorial) out.push({ ...cfg.tutorial, sym: 'tutorial' });
  for (const [sym, list] of Object.entries(cfg.levels || {})) {
    for (const it of list || []) out.push({ ...it, sym });
  }
  return out;
}
/** 解锁判定（前置关卡式）：requires 里的关**全部通关**才解锁；requires 留空 = 一开始就能玩。
 *  ★ 只需写直接前置（链条自动传递）：H-1 已要求新手引导，He-1 只写 H-1 即可。
 *  ★ 旧版是"通关 X → 解锁 X 的子节点"的反向表，且漏判"是否已通关"，会把整张图全解锁。 */
function unlockedSet(cfg, cleared) {
  const set = new Set();
  for (const lv of allLevels(cfg)) {
    const req = lv.requires || [];
    if (req.length === 0 || req.every((r) => cleared.has(r))) set.add(lv.id);
  }
  if (cfg.tutorial) set.add(cfg.tutorial.id);  // 新手引导始终可玩
  return set;
}
/** 哪些关解锁了它（用于"通关 X 解锁"提示） */
function unlockersOf(cfg, levelId) {
  return allLevels(cfg).filter((lv) => (lv.requires || []).includes(levelId)).map((lv) => lv.id);
}
/** 同位素状态：'done' 已通关 / 'open' 已解锁可玩 / 'lock' 未解锁 / 'empty' 关卡未编写 */
function isotopeState(it, unlocked, cleared) {
  if (!it.file) return 'empty';
  if (cleared.has(it.id)) return 'done';
  return unlocked.has(it.id) ? 'open' : 'lock';
}
/** 元素卡片状态：'gold' 全同位素通关 / 'st3' 有通关 / 'st2' 有解锁 / 'st1' 全锁 / 'st0' 无关卡 */
function elementState(entry, unlocked, cleared) {
  const real = entry.isotopes.filter((i) => i.file);
  if (!real.length) return 'st0';
  if (real.every((i) => cleared.has(i.id))) return 'gold';
  if (real.some((i) => cleared.has(i.id))) return 'st3';
  if (real.some((i) => unlocked.has(i.id))) return 'st2';
  return 'st1';
}
/** 索引夹紧（走廊两端不回绕，箭头置灰更符合直觉） */
function clampIndex(i, n) { return Math.max(0, Math.min(n - 1, i)); }
/** 同位素难度星数：同元素内按质量升序名次（越重越难） */
function difficultyStars(entry, isotope) {
  const i = entry.isotopes.findIndex((x) => x.id === isotope.id);
  return Math.max(1, Math.min(5, i + 1));
}
// #endregion select-model

// ---- 进度 ----
function loadProg() {
  try { return new Set((JSON.parse(localStorage.getItem(PROG_KEY) || '{}').cleared) || []); }
  catch (e) { return new Set(); }
}
let cleared = loadProg();
let unlocked = new Set(['tutorial']);
let onlyPlayable = false;                 // 顶部筛选：默认"全部元素"（每个元素都轮得到）
let ENTRIES = [];

// 关卡 id → 提示用的名字（"通关 X 解锁"里的 X）：只写关卡名，不带元素名
function buildNameMap() {
  const m = new Map();
  for (const e of ENTRIES) for (const it of e.isotopes) m.set(it.id, e.kind === 'tutorial' ? e.name : it.name);
  return m;
}
let NAME_OF = buildNameMap();

// ---- DOM ----
const $ = (id) => document.getElementById(id);
const track = $('track'), isoBox = $('isotopes'), enterBtn = $('enter'), enterText = $('enterText');
const prevBtn = $('prev'), nextBtn = $('next');

let active = 0;        // 当前元素下标
let activeIso = 0;     // 当前同位素下标
let curX = 0;          // 走廊当前位置（以"卡片数"为单位的浮点值，rAF 缓动趋近 active）
let step = 330;        // 卡片间距（px，实测）
let launching = false;
let cards = [];        // 当前走廊里的卡片 DOM（筛选后会重建）

// ---- 建卡 ----
const GUIDE_ICON = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <path d="M9 3h6M10 3v5.2L4.8 17a3.4 3.4 0 0 0 3 5h8.4a3.4 3.4 0 0 0 3-5L14.4 8.2V3"
    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M7.6 15h8.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;

function cardMeta(e) {
  if (e.kind === 'tutorial') return '新手引导 · 从零开始';
  const tail = e.hasLevel ? '' : ' · 暂无';
  return `第 ${e.period} 周期 · 第 ${e.group} 族${tail}`;
}
/** 按当前筛选重建走廊（切换"全部/只看有关卡"时用） */
function buildCards() {
  track.innerHTML = '';
  cards = ENTRIES.map((e, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'card';
    b.setAttribute('role', 'option');
    b.dataset.i = i;
    b.innerHTML = `
      <span class="plate"></span>
      <span class="body">
        <span class="cnum">${e.kind === 'tutorial' ? 'GUIDE' : 'No.' + e.n}</span>
        <span class="csym" style="color:#fff">${e.kind === 'tutorial' ? GUIDE_ICON : e.sym}</span>
        <span class="cname">${e.name}</span>
        <span class="cmeta">${cardMeta(e)}</span>
        <span class="cpips"></span>
      </span>
      <svg class="tick" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12.5l4.4 4.4L19 7.5" stroke="#ffd76a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      ${e.rare ? '<span class="badge">稀有</span>' : ''}`;
    b.addEventListener('click', () => {
      if (launching) return;
      // 单击就进入（用户要求：不要"先选中、再点一次"的双击感）：
      // 先把选中切到这张卡，再走进入逻辑；不可玩的会给出抖动 + 提示，不会静默。
      if (i !== active) setActive(i, true);
      tryEnter();
    });
    track.appendChild(b);
    return b;
  });
  refreshCardStates();
  layoutCards();
  moveCards(true);
}

/** 卡片是否"能进"：至少有一个已解锁且已编写的同位素 */
function cardPlayable(e) {
  return e.isotopes.some((it) => it.file && unlocked.has(it.id));
}
function refreshCardStates() {
  ENTRIES.forEach((e, i) => {
    const st = elementState(e, unlocked, cleared);
    const b = cards[i];
    b.className = `card ${st}${e.rare ? ' rare' : ''}${i === active ? ' active' : ''}`;
    const pips = b.querySelector('.cpips');
    pips.innerHTML = e.isotopes.map((it) => {
      const s = isotopeState(it, unlocked, cleared);
      return `<i class="${s === 'done' ? 'done' : s === 'empty' ? '' : 'on'}"></i>`;
    }).join('');
    b.setAttribute('aria-label', `${e.name}${e.kind === 'tutorial' ? '' : '（' + e.sym + '）'}：${e.isotopes.length} 个同位素关卡`);
    b.setAttribute('aria-selected', i === active ? 'true' : 'false');
  });
  prevBtn.disabled = active === 0;
  nextBtn.disabled = active === ENTRIES.length - 1;
}

// ---- 同位素条 ----
function renderIsotopes() {
  const e = ENTRIES[active];
  isoBox.innerHTML = '';
  if (!e.isotopes.length) {
    // 没配关卡的元素：给一条说明，别让下栏空着
    const tip = document.createElement('button');
    tip.type = 'button';
    tip.className = 'chip empty';
    tip.disabled = true;
    tip.innerHTML = `<span class="row"><span class="iso"><b>—</b><span>${e.sym}</span></span>
      <span class="nm">${e.name}</span><span class="stat">暂无</span></span>`;
    isoBox.appendChild(tip);
    refreshEnter();
    return;
  }
  e.isotopes.forEach((it, i) => {
    const s = isotopeState(it, unlocked, cleared);
    const stars = e.kind === 'tutorial' ? '' : `<span class="stars">${'★'.repeat(difficultyStars(e, it))}</span>`;
    const status = s === 'done' ? '已通关' : s === 'open' ? '可挑战' : s === 'empty' ? '暂无'
      : '未解锁';
    const c = document.createElement('button');
    c.type = 'button';
    c.className = `chip${i === activeIso ? ' sel' : ''}${s === 'done' ? ' done' : ''}${s === 'lock' ? ' lock' : ''}${s === 'empty' ? ' empty' : ''}`;
    c.style.animationDelay = `${Math.min(i * 45, 260)}ms`;   // 逐个浮入
    c.innerHTML = `<span class="row">
      <span class="iso"><b>${it.mass || '—'}</b><span>${e.kind === 'tutorial' ? '关' : e.sym}</span></span>
      <span class="nm">${it.name}</span>
      ${stars}
      <span class="stat">${status}</span></span>`;
    c.addEventListener('click', () => {

// ---- 走廊位移：缓动 + 逐卡透视/缩放 ----

// ---- 进入关卡 ----

addEventListener('orientationchange', () => setTimeout(() => { markViewport(); layoutCards(); moveCards(true); }, 240));

/** 开场应该停在哪张元素卡：
 *  ① 第一个"已解锁且有文件、尚未通关"的关卡所在元素（下一个该打的）
 *  ② 全通关 → 最后一个已通关的元素卡（走廊顺序即原子序数，取最靠后的那张）
 *  ③ 都没有（无进度且首关未解锁）→ 留在最开头 */
function autoTarget() {
  const idx = ENTRIES.findIndex((e) => e.isotopes.some((it) => it.file && unlocked.has(it.id) && !cleared.has(it.id)));
  if (idx >= 0) return idx;
  for (let i = ENTRIES.length - 1; i >= 0; i--) {
    if (ENTRIES[i].isotopes.some((it) => it.file && cleared.has(it.id))) return i;
  }
  return 0;
}

/** 关卡表来自 levels/levels.json（levels.js 负责读进来），所以要等它 ready 再建界面 */
function boot(cfg) {
  CFG = cfg || {};
  unlocked = unlockedSet(CFG, cleared);
  ENTRIES = buildEntries(CFG, bySym, onlyPlayable);
  NAME_OF = buildNameMap();
  buildCards();                     // 先建卡（全部 118 位元素）
  buildPeriods();                   // 再建周期轨道（条内 = 该周期通关进度）
  setActive(0, true);          // 先停在最开头（新手引导）
  refreshProgress();
  moveCards(true);
  // 开场动画：稍等进场淡入，再自动划过走廊到"下一个该打的关卡"
  const target = autoTarget();
  if (target > 0) setTimeout(() => setActive(target, true), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 520);
  // 进场：从深色淡入（#wipe 初始不透明）
  requestAnimationFrame(() => requestAnimationFrame(() => $('wipe').classList.add('off')));
}
CFG_READY.then(boot).catch(() => {
  $('ptext').textContent = '关卡表读取失败';
  toast('读取 levels/levels.json 失败：请用 http 服务打开（如 python -m http.server）');
  requestAnimationFrame(() => requestAnimationFrame(() => $('wipe').classList.add('off')));
});
</script>
</body>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 空图标：避免浏览器为 /favicon.ico 白跑一次跨国请求 -->
<link rel="icon" href="data:,">
<title>Chezzle · 选关 · 元素回廊</title>
<script>
/* 站点外壳（SPA）内嵌模式：?spa=1（外壳用 iframe 加载本页）。
   直接打开 /select 时回到外壳的选关路由，保证全站是同一个文档、同一套转场。 */
(function () {
  var spa = /[?&]spa=1/.test(location.search);
  window.__CZ_SPA_PAGE = spa;
  if (!spa) location.replace('./#/select');
})();
</script>
<!-- 偏好 + 音效：prefs.js 供 audio.js 读 sfxVolume/sfxMuted；点击音由 audio.js 统一接线，
     需要不同语义的元素用 data-sfx 覆盖（本页：返回 ui.back、筛选/重置 ui.tick、进入 ui.open；
     走廊卡片在 select-model 之后按"可进/锁定"动态挂 level.enter / ui.deny，拖动时跳过）。 -->
<script src="prefs.js?vmvmdw3n4"></script>
<script src="audio.js?vmvmdw3n4"></script>
<style>
  /* ★ 主题色用三个数值自定义属性承载并注册成 <number>：这样它们**可以被 transition 插值**，
     换元素时背景洗色/符文环/光晕才会平滑过渡而不是硬切（"用 var() 拼的颜色"默认不可动画）。 */
  @property --ar { syntax: '<number>'; inherits: true; initial-value: 150; }
  @property --ag { syntax: '<number>'; inherits: true; initial-value: 232; }
  @property --ab { syntax: '<number>'; inherits: true; initial-value: 176; }
  :root {
    --gold: #e8b84b; --gold-l: #ffd76a; --cyan: #7fd8ff; --green: #96e8b0; --purple: #c78bff;
    --edge: #2b3047; --txt: #dfe8f2; --dim: #9fb2c8; --bg-deep: #07051a;
    --ar: 150; --ag: 232; --ab: 176;   /* 当前元素的主题色（随选中元素平滑过渡） */
    --card-w: 320px; --card-h: 248px;
    transition: --ar .6s ease, --ag .6s ease, --ab .6s ease;  /* 换色动画落在这里 */
  }
  /* ★★ 手机端卡顿的真凶：上面这条自定义属性 transition。
     注册成 <number> 的 --ar 一旦变化，浏览器会**连续 0.6 秒、每帧**重算依赖它的样式，
     而 .wash 是满屏三层 radial-gradient（8 Plus 上 2.7M 设备像素/帧 × 36 帧 ≈ 1 亿像素重绘），
     所以"翻卡时越来越卡，停下后 0.6 秒突然又流畅"——用户描述的这个特征完全对上。
     低档设备直接改成瞬时换色：每次跨卡只重绘 1 帧，肉眼几乎无差。 */
  html.low { transition: none; }
  * { box-sizing: border-box; margin: 0; }
  /* ★ 关掉浏览器自己的手势：卡片是绝对定位、会撑出可视区，若不禁止原生平移，
     手机上滑动时整个页面会跟着被拖走（用户截图复现）；顺手关掉长按菜单/选中。
     touch-action 写在 html 上对整页生效，拖拽由 Pointer Events 自己处理。 */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  body { overflow: hidden; color: var(--txt); font: 14px "Segoe UI","Microsoft YaHei",sans-serif;
    background: #07051a; }
  a { color: var(--cyan); text-decoration: none; }
  button { font-family: inherit; }

  /* ---------- 背景（与主页同一套：星野 / 星云 / 符文法阵 / 偶发流星） ---------- */
  #bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .wash { position: absolute; inset: 0; transition: background 900ms ease;
    background:
      radial-gradient(1150px 700px at 50% -12%, rgb(var(--ar) var(--ag) var(--ab) / .16) 0%, transparent 62%),
      radial-gradient(1500px 900px at 50% 118%, rgba(20,14,64,.9) 0%, #07051a 62%),
      radial-gradient(1100px 620px at 50% 42%, rgba(84,60,180,.22) 0%, transparent 66%); }
  #stars { position: absolute; inset: 0; }
  /* ★ 必须限定在 #stars 内：`.st` 这种短类名容易和页面里别的东西（同位素 chip 的状态字）撞车 */
  #stars .st { position: absolute; border-radius: 50%; background: #fff; animation: twinkle ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .1; transform: scale(.8); } 50% { opacity: .75; transform: scale(1); } }
  .sigil { position: absolute; left: 50%; top: 46%; width: 900px; height: 900px; transform: translate(-50%,-50%);
    opacity: .07; animation: spin 150s linear infinite; }
  @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
  #meteors { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .meteor { position: absolute; height: 2px; border-radius: 2px; opacity: 0;
    background: linear-gradient(90deg, rgba(207,230,255,0), rgba(207,230,255,.8) 62%, #fff);
    filter: drop-shadow(0 0 6px rgba(160,210,255,.75));
    animation: meteorFall 1.15s cubic-bezier(.36,.06,.74,.62) forwards; }
  @keyframes meteorFall {
    from { transform: translate3d(0,0,0) rotate(18deg); opacity: 0; }
    14% { opacity: .8; }
    to { transform: translate3d(44vw, 14.3vw, 0) rotate(18deg); opacity: 0; }
  }

  /* ---------- 页面骨架：上栏 / 回廊 / 下栏 ---------- */
  /* ★ 页眉/周期条/页脚一律 flex: 0 0 auto（不参与压缩）：只有走廊是可伸缩项。
     否则窗口一矮，flex 会把页眉/页脚压扁而**内容溢出**它们的盒子 → 卡片再压上来，
     就成了"卡片和上方周期条重合"（用户手机截图）。 */
  #app { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; flex: 0 0 auto; padding: 16px 20px 6px; }
  .back { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border: 1px solid var(--edge);
    background: linear-gradient(180deg, #232a5c, #12163a); color: var(--txt); cursor: pointer;
    transition: filter .2s, transform .2s, color .2s;
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px); }
  .back:hover { filter: drop-shadow(0 0 10px rgba(232,184,75,.45)); color: var(--gold-l); transform: translateY(-1px); }
  .back:focus-visible, .ghost:focus-visible, .card:focus-visible, .chip:focus-visible, .enter:focus-visible {
    outline: 2px solid var(--cyan); outline-offset: 3px; }
  h1 { font-size: 30px; color: var(--gold-l); letter-spacing: 6px; text-shadow: 0 0 18px rgba(232,184,75,.5); }
  h1 small { display: block; margin-top: 3px; font-size: 11.5px; font-weight: normal; letter-spacing: 1px; color: var(--dim); }
  /* 调试全解锁标记：levels.json 里 "debugUnlockAll": true 时显示，避免忘记关 */
  .dbg-unlock { margin-left: 12px; padding: 4px 9px; font: bold 10px/1 ui-monospace, Consolas, monospace;
    font-style: normal; letter-spacing: 2px; color: #ffd9a0;
    border: 1px solid rgba(255,138,126,.7); background: rgba(90,28,28,.55);
    filter: drop-shadow(0 0 8px rgba(255,120,100,.35));
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
  .dbg-unlock[hidden] { display: none; }
  .hspace { margin-left: auto; }
  #progress { display: flex; align-items: center; gap: 10px; padding: 7px 14px; font-size: 12.5px; color: var(--cyan);
    border: 1px solid rgba(127,216,255,.35); background: rgba(16,26,56,.75); letter-spacing: 1px;
    filter: drop-shadow(0 0 8px rgba(127,216,255,.22));
    clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px); }
  #pbar { width: 92px; height: 5px; background: rgba(127,216,255,.16); overflow: hidden; }
  #pbar { display: block; }
  #pfill { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), #cfefff); transition: width .5s ease; }
  .ghost { padding: 7px 12px; font-size: 11.5px; color: #7b8aa8; background: none; border: 1px solid transparent; cursor: pointer; }
  .ghost:hover { color: #ffb0b0; border-color: rgba(255,120,120,.35); }

  /* ---------- 回廊（横向卡片走廊） ---------- */
  /* max-height 卡住走廊高度：高屏上不至于把卡片和下方同位素条拉得太远 */
  #corridor { position: relative; flex: 1 1 auto; min-height: 0; max-height: 460px; perspective: 1300px; }
  #ring { position: absolute; left: 50%; top: 50%; width: min(560px, 78vmin); height: min(560px, 78vmin);
    transform: translate(-50%,-50%); opacity: .42; transition: opacity .5s ease;
    /* ★ 纯装饰，绝不能吃点击：SVG 的圆弧**描边**本身就是命中区域，而法阵比走廊高、会横穿页眉。
       实测"全部元素/只看有关卡"只有部分位置点得动 —— 用户复现的"必须点偏上才点得到"，
       一半原因在这里，另一半是卡片溢出走廊（见 fitDeck）。 */
    pointer-events: none; }
  #ring circle, #ring path { stroke: rgb(var(--ar) var(--ag) var(--ab) / .55); }
  #ring .spin { transform-origin: 50% 50%; animation: spin 46s linear infinite; }
  #ring .spin2 { transform-origin: 50% 50%; animation: spin 78s linear infinite reverse; }
  #track { position: absolute; inset: 0; transition: opacity .2s ease;
    /* ★ 卡片裁在走廊这条带子里：即使尺寸量算有偏差（页脚换行、字体度量差异），
       卡片也绝不会盖住上方周期条/下方同位素条——顺带连"透明死区抢点击"一起杜绝。
       发射过场时卡片要放大 1.28 倍，那一瞬间放开裁剪。 */
    overflow: hidden; }
  body.launch #track { overflow: visible; }
  /* ★ 卡片尺寸（--card-w/--card-h）由 fitDeck() 按**实测走廊高度**写死：卡片比走廊高时
     会上下溢出到页眉/页脚，而卡片是 <button>（整块盒子都吃点击）→ 顶部"全部元素/
     只看有关卡"开关与同位素条的上下半截被透明死区盖住（用户复现：必须点偏上才点得到）。
     ★ 这里不再对每张卡写 will-change：119 张卡各占一个合成层 = 手机滑动掉帧 + 发热的主因；
     走廊外的卡片会被窗口化 display:none（见 setWindow），真正参与合成的只有 8 张左右。 */
  .card { position: absolute; left: 50%; top: var(--card-top, 50%); width: var(--card-w); height: var(--card-h);
    margin: 0; padding: 0; border: 0; background: none; cursor: pointer; color: var(--txt);
    text-align: left; }
  /* ★ 不要再写 transform-style: preserve-3d：卡里没有任何 3D 子元素（底板只是 skewX），
     但它会让**每个子元素各自进入 3D 渲染上下文** → 一张卡变成 5 个合成层，
     9 张可见卡 = 45 层。老机器（iPhone 8 Plus / A11）在滑动时就是被这个拖垮的。 */
  /* 卡片内容整体包一层：悬浮的"呼吸"上下浮动交给 CSS 动画（合成器线程，不占主线程）——
     ★ 原先是每帧在 moveCards() 里用 sin(时间) 算的，而 moveCards 只在**缓动/拖拽**时才跑
     → 停住后浮动就冻住，点一下空白又跳一帧，看起来像"点一下动一帧"（用户复现）。 */
  .card .inner { position: absolute; inset: 0; display: block; }
  .card.active .inner { animation: cardBob 3.4s ease-in-out infinite; }
  @keyframes cardBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  /* 斜切底板（Phigros 式斜牌），文字保持正立 → 好看且中文可读 */
  .card .plate { position: absolute; inset: 0; transform: skewX(-9deg); border: 1px solid rgba(var(--c), .5);
    background: linear-gradient(140deg, rgba(var(--c), .16), rgba(10,10,32,.86) 58%, rgba(8,8,24,.9));
    transition: border-color .25s, filter .25s, background .25s;
    clip-path: polygon(18px 0, 100% 0, calc(100% - 18px) 100%, 0 100%); }
  /* drop-shadow 滤镜只给"当前卡"（视觉焦点本来就在它身上）：119 张卡各带一个滤镜
     会让每帧都要重新做一次模糊，是滑动掉帧的另一个大头 */
  .card.active .plate { filter: drop-shadow(0 10px 26px rgba(0,0,0,.5)); }
  .card .body { position: absolute; inset: 0; display: flex; flex-direction: column;
    padding: clamp(10px, calc(var(--card-h) * 0.08), 20px) clamp(14px, calc(var(--card-h) * 0.10), 24px); }
  /* No.X 往左探出底板一点（斜牌左上角本来就留了白），做"编号破框"的层次 */
  .card .cnum { font-family: ui-monospace, Consolas, monospace; font-size: clamp(10px, calc(var(--card-h) * 0.05), 12px);
    letter-spacing: 1px; color: rgba(var(--c), .9); margin-left: -18px; }
  /* 字号跟着卡片高度走（卡片在矮屏上会被压扁，写死字号会溢出） */
  .card .csym { font-weight: bold; font-size: clamp(30px, calc(var(--card-h) * 0.30), 74px); line-height: 1;
    font-family: "Segoe UI",sans-serif; letter-spacing: 2px; color: #fff;
    text-shadow: 0 0 22px rgba(var(--c), .55); margin-top: 2px; margin-left: 15px;
    display: flex; align-items: center; }
  /* 低档设备：只有当前卡的符号保留发光（22px 模糊的文字阴影在 WebKit 上很贵，
     9 张卡各来一次 = 每帧都在重绘大块文字） */
  body.low .card:not(.active) .csym { text-shadow: none; }
  /* 引导卡用内联 SVG 代替 ⚗ 字符：那是个冷僻码位，多数系统缺字形会显示成豆腐块 */
  .card .csym svg { width: .92em; height: .92em; }
  .card .cname { font-size: clamp(12px, calc(var(--card-h) * 0.062), 15px); letter-spacing: 3px; color: #dfe8f2; margin-top: 2px; margin-left: 15px; }
  .card .cmeta { margin-top: auto; font-size: clamp(10px, calc(var(--card-h) * 0.048), 11.5px); letter-spacing: 1px; color: var(--dim); }
  .card .cpips { display: flex; gap: 5px; margin-top: 8px; }
  .card .cpips i { width: 16px; height: 4px; background: rgba(255,255,255,.16); }
  /* 每颗小方块各带一个滤镜 = 一张卡最多 5 个滤镜，119 张卡就是几百个 → 换成更亮的底色 */
  .card .cpips i.on { background: rgba(var(--c), 1); box-shadow: 0 0 5px rgba(var(--c), .75); }
  .card .cpips i.done { background: var(--gold-l); box-shadow: 0 0 5px rgba(255,215,106,.75); }
  .card .tick { position: absolute; right: 26px; top: 20px; width: 22px; height: 22px; opacity: 0; }
  .card .badge { position: absolute; right: 26px; bottom: 18px; padding: 2px 9px; font-size: 10.5px; letter-spacing: 1px;
    border: 1px solid rgba(var(--c), .8); color: rgb(var(--c)); background: rgba(8,10,28,.7); }
  /* 状态：暗（无关卡）< 未解锁 < 已解锁 < 已通关 < 金光（全同位素通关） */
  .card.st0 { --c: 90,100,150; } .card.st0 .body, .card.st0 .plate { opacity: .42; }
  .card.st1 { --c: 120,130,190; } .card.st1 .body, .card.st1 .plate { opacity: .68; }
  .card.st2 { --c: 150,232,176; }
  .card.st3 { --c: 150,232,176; } .card.st3 .plate { background: linear-gradient(140deg, rgba(var(--c),.3), rgba(10,10,32,.85) 60%); }
  .card.gold { --c: 255,215,106; } .card.gold .plate { border-color: var(--gold-l); animation: goldPulse 2.6s ease-in-out infinite; }
  /* 低档设备：金色呼吸（每帧重做 drop-shadow 滤镜）与矢量法阵旋转都停掉 */
  body.low .card.gold .plate { animation: none; filter: none; border-color: var(--gold-l); }
  body.low #ring .spin, body.low #ring .spin2 { animation: none; }
  /* ★ 低档设备：换元素时的"背景洗色"不再做 transition —— 全屏三层 radial-gradient 的
     逐帧重绘在手机上非常贵（iPhone 8 Plus 上 900ms ≈ 55 次全屏重绘），而它只是背景色调。
     直接换色，肉眼几乎无感，滑动立刻顺一截。 */
  body.low .wash { transition: none; }
  /* 稀有关卡元素 = 紫色（与"已解锁=绿 / 已通关更亮 / 金光=全清"这套状态色区分开） */
  .card.rare.st2, .card.rare.st3 { --c: 199,139,255; }
  .card.rare .plate { box-shadow: inset 0 0 40px rgba(199,139,255,.12); }
  .card.st3 .tick, .card.gold .tick { opacity: 1; }
  /* 未编写关卡的元素：只留下"轮得到"的轮廓，别抢已有关卡元素的注意力 */
  .card.st0 .cmeta { color: #5a6480; }
  @keyframes goldPulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(255,215,106,.45)); }
    50% { filter: drop-shadow(0 0 26px rgba(255,215,106,.95)); } }
  .card.active .plate { border-color: rgba(var(--c), .95); }
  .card.locked-shake { animation: shake .34s ease; }
  @keyframes shake { 0%,100% { margin-left: 0; } 25% { margin-left: -9px; } 60% { margin-left: 7px; } }

  .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 76px; display: grid; place-items: center;
    border: 1px solid var(--edge); background: rgba(14,17,42,.72); color: var(--txt); cursor: pointer; z-index: 200;
    transition: filter .2s, color .2s, background .2s;
    clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
  .arrow:hover { color: var(--gold-l); background: rgba(30,26,70,.85); filter: drop-shadow(0 0 12px rgba(232,184,75,.4)); }
  .arrow[disabled] { opacity: .25; cursor: default; }
  #prev { left: max(10px, calc(50% - 520px)); } #next { right: max(10px, calc(50% - 520px)); }

  /* ---------- 周期轨道：1..7 周期条，当前周期高亮；点一下跳到该周期首个元素 ---------- */
  #periods { display: flex; gap: 6px; flex: 0 0 auto; padding: 0 20px 2px; }
  .per { flex: 1 1 0; min-width: 0; padding: 4px 7px 5px; cursor: pointer; text-align: left;
    border: 1px solid rgba(120,130,190,.22); background: rgba(12,16,38,.6); color: var(--dim);
    transition: border-color .2s, background .2s, color .2s, transform .2s;
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
  .per b { display: block; font: bold 12px ui-monospace, Consolas, monospace; color: #cfe0ff; }
  .per i { display: block; height: 3px; margin-top: 4px; background: rgba(255,255,255,.12); position: relative; }
  .per i::after { content: ''; position: absolute; inset: 0 auto 0 0; width: var(--f, 0%); background: rgba(199,139,255,.85); }
  .per.on { border-color: rgba(255,215,106,.85); background: rgba(232,184,75,.2); color: #ffe9b0; transform: translateY(-1px); }
  .per.on i::after { background: var(--gold-l); }
  .per:hover { border-color: rgba(232,184,75,.6); color: var(--txt); }
  .per:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  /* 跨周期时飘一下"第 N 周期"，把周期概念讲清楚 */
  #pflash { position: absolute; left: 50%; top: 12%; transform: translateX(-50%); z-index: 210;
    font: bold 15px/1 "Segoe UI","Microsoft YaHei",sans-serif; letter-spacing: 6px; color: rgba(255,233,176,.92);
    text-shadow: 0 0 18px rgba(232,184,75,.6); opacity: 0; pointer-events: none; }
  #pflash.show { animation: pf 1.5s ease-out; }
  @keyframes pf {
    0% { opacity: 0; transform: translateX(-50%) translateY(10px) scale(.94); }
    22% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(-12px); }
  }
  /* 头顶的筛选开关 */
  /* —— 显示范围切换：Chezzle 的「缺角矩形」+ 会滑动的金色指示块 —— */
  .seg { position: relative; display: inline-flex; gap: 2px; padding: 2px;
    border: 1px solid var(--edge); background: rgba(12,16,38,.72);
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px); }
  /* 指示块：跟着选中项滑动（宽度 + 位移一起补间 → 切换是"滑过去"而不是"跳过去"） */
  .seg .ind { position: absolute; left: 0; top: 2px; bottom: 2px; width: 0; pointer-events: none;
    background: linear-gradient(180deg, #ffe9a8, #e8b84b);
    box-shadow: 0 0 12px rgba(232,184,75,.45);
    clip-path: polygon(7px 0, calc(100% - 7px) 0, 100% 7px, 100% calc(100% - 7px), calc(100% - 7px) 100%, 7px 100%, 0 calc(100% - 7px), 0 7px);
    transition: transform .34s cubic-bezier(.2,.9,.28,1.06), width .34s cubic-bezier(.2,.9,.28,1.06); }
  .seg button { position: relative; z-index: 1; padding: 6px 12px; font-size: 11.5px; color: var(--dim);
    background: none; border: 0; cursor: pointer; transition: color .26s ease, text-shadow .26s ease; }
  .seg button:hover { color: var(--txt); }
  .seg button.on { color: #241a02; background: none; font-weight: bold; }
  body.low .seg .ind { transition: none; box-shadow: none; }
  .seg button:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }

  /* ---------- 下栏：同位素条 + 进入按钮 ---------- */
  footer { flex: 0 0 auto; padding: 4px 20px 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  /* 同位素条：撑满整行再居中（否则 flex 收缩会把 chip 压扁、文字互相重叠） */
  #isotopes { display: flex; align-items: stretch; justify-content: center; gap: 9px; flex-wrap: wrap;
    width: 100%; min-height: 54px; }
  /* ★ 注意：<button> 自己当 flex 容器时 Chrome 的固有宽度算不对（内容会折行/被裁剪），
     所以按钮只做 inline-block，真正的横向排布交给里面的 .row */
  .chip { display: inline-block; padding: 8px 14px; cursor: pointer; color: var(--txt);
    flex: 0 0 auto;
    border: 1px solid rgba(120,130,190,.32); background: linear-gradient(180deg, rgba(20,24,56,.85), rgba(10,12,32,.85));
    transition: transform .16s, border-color .25s, filter .25s, background .35s, opacity .25s;
    animation: chipIn .34s cubic-bezier(.2,.9,.3,1.15) both;   /* 换元素时逐个浮入，而不是硬切 */
    clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px); }
  @keyframes chipIn { from { opacity: 0; transform: translateY(12px) scale(.94); } to { opacity: 1; transform: none; } }
  .chip .row { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .chip .row > * { flex: 0 0 auto; }
  .chip:hover { transform: translateY(-2px); border-color: rgba(232,184,75,.6); }
  .chip .iso { display: flex; flex-direction: column; align-items: center; line-height: 1.1;
    font: 11px ui-monospace, Consolas, monospace; color: var(--dim); }
  .chip .iso b { font-size: 13px; color: #cfe0ff; }
  .chip .nm { font-size: 14px; letter-spacing: 1px; }
  .chip .stat { font-size: 10.5px; color: var(--dim); }
  .chip .stars { color: var(--gold-l); font-size: 10.5px; letter-spacing: 1px; }
  .chip.sel { border-color: var(--gold-l); background: linear-gradient(180deg, rgba(232,184,75,.28), rgba(60,42,10,.55));
    filter: drop-shadow(0 0 16px rgba(232,184,75,.4)); }
  .chip.sel .nm { color: #fff6d8; }
  .chip.done { border-color: rgba(143,232,176,.6); }
  .chip.done .st { color: var(--green); }
  .chip.lock { opacity: .62; }
  .chip.lock:hover { border-color: rgba(255,140,140,.5); }
  .chip.empty { opacity: .45; cursor: default; }

  .enter { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 13px 0;
    /* ★ 定宽：文案在"进入关卡 / 通关 X 解锁 / 暂无"之间切换时按钮尺寸不再变化。
       旧版按文案宽度做 WAAPI 补间，而 letter-spacing/font-size 又被 CSS 过渡着 ——
       offsetWidth 量到的是过渡中间值，补间结束回落真实宽度 → "先变长再突然变短"（用户实测）。 */
    width: min(420px, 64vw);
    font-size: 16px; font-weight: bold; white-space: nowrap;
    letter-spacing: 5px; cursor: pointer; border: 0; color: #241a02;
    background: linear-gradient(180deg, #ffe9a8 0%, #e8b84b 46%, #9a6d1e 100%);
    filter: drop-shadow(0 0 16px rgba(232,184,75,.45)) drop-shadow(0 8px 18px rgba(0,0,0,.5));
    /* 只过渡不引起重排的属性（transform/filter/背景/文字色） */
    transition: transform .18s ease, filter .3s ease, background .4s ease, color .3s ease;
    clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px); }
  .enter:hover { transform: translateY(-2px); filter: drop-shadow(0 0 26px rgba(255,215,106,.8)) drop-shadow(0 12px 22px rgba(0,0,0,.5)); }
  .enter[disabled] { cursor: default; color: #b9c2d8; background: linear-gradient(180deg, #2a3057, #171b3c);
    filter: none; transform: none; letter-spacing: 2px; font-size: 14px; }
  #enterText { display: inline-block; transition: opacity .2s ease; }

  /* ==========================================================================
     进入关卡的过场（重做版 2）
     --------------------------------------------------------------------------
     ① 其他元素隐去（暗幕 + 应用层淡出）；
     ② **同一个**平行四边形：从选中卡原位整体放大到画面中央——不换框、不换形；
     ③ 内容改编：同一个框内旧内容向上平移滑出、关卡信息从下方平移滑入（同一条曲线）；
     ④ 左下 Tips 渐入、右下小平行四边形滑入（白边一段绕圈 + LOADING）；
     ⑤ 预取就绪且过场演完后交给外壳：选关页**所有东西一起平移出画面**，
        游戏画面再整体渐入（见 index.html 的 showGame / cz:out、cz:back 消息）。
     ========================================================================== */
  #enterFx { position: fixed; inset: 0; z-index: 880; visibility: hidden; pointer-events: none;
    opacity: 0; transition: opacity .46s ease; }
  #enterFx.on { visibility: visible; opacity: 1; }
  /* 暗幕：盖住选关界面 */
  #enterFx .fx-veil { position: absolute; inset: 0; opacity: 0;
    background:
      radial-gradient(1000px 620px at 50% 44%, rgba(var(--c,150,232,176),.16), transparent 62%),
      radial-gradient(1500px 900px at 50% 112%, rgba(20,14,64,.9), #07051a 62%), #07051a;
    transition: opacity .52s ease; }
  #enterFx.on .fx-veil { opacity: .97; }
  body.entering #app { opacity: .015; transition: opacity .5s ease; pointer-events: none; }
  body.entering #toast { display: none; }
  /* —— 唯一的平行四边形：描边层 + 内暗层 + 两个内容层（内容装在矩形裁剪盒里做"平移换内容"）。
        位置/尺寸由 JS 写成选中卡的矩形，整体只做 transform 缩放；
        颜色取选中卡自身的 --c（状态色），底板渐变/描边/投影与卡片 active 态一致 → 放大时不变色。 —— */
  #enterFx .fx-card { position: fixed; left: 0; top: 0; transform-origin: 50% 50%; will-change: transform; }
  #enterFx .fx-card-bg { position: absolute; inset: 0; pointer-events: none; transform: skewX(-9deg);
    clip-path: polygon(calc(var(--cw, 320px) * .056) 0, 100% 0,
      calc(100% - var(--cw, 320px) * .056) 100%, 0 100%);
    background: rgba(var(--c), .95);
    filter: drop-shadow(0 10px 26px rgba(0,0,0,.5));
    transition: filter .5s ease; }
  #enterFx .fx-card-in { position: absolute; inset: 1px; pointer-events: none; transform: skewX(-9deg);
    clip-path: polygon(calc(var(--cw, 320px) * .056 - 1px) 0, 100% 0,
      calc(100% - var(--cw, 320px) * .056 + 1px) 100%, 0 100%);
    /* 两层：主题色淡染（透明→透明）+ 不透明深底。
       只写单层半透明渐变时，淡染那端会透出外层实色描边，整张牌会"变绿/变亮"。 */
    background:
      linear-gradient(140deg, rgba(var(--c), .16), rgba(10,10,32,0) 60%),
      #0a0a20; }
  /* 内容改编后稍微加一点主题色辉光（起点仍与卡片一致） */
  #enterFx.morph .fx-card-bg { filter: drop-shadow(0 0 24px rgba(var(--c),.22)) drop-shadow(0 12px 30px rgba(0,0,0,.5)); }
  /* 矩形裁剪盒：内容平移时裁在框内；内容改编期间再按平行四边形斜边裁一遍，
     防止文字从斜角处"穿"到框外 */
  #enterFx .fx-clip { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  #enterFx.morph .fx-clip {
    clip-path: polygon(calc(var(--cw, 320px) * .056) 0, 100% 0,
      calc(100% - var(--cw, 320px) * .056) 100%, 0 100%); }
  #enterFx .fx-face { position: absolute; inset: 0;
    transition: transform .6s cubic-bezier(.4,0,.2,1); }
  /* 旧内容：选中卡的等比复制（底板/边框隐藏 → 视觉上的框只有外面那一个） */
  #enterFx .fx-face-a { transform: translate3d(0, 0, 0); }
  #enterFx .fx-face-a .card { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    margin: 0; padding: 0; border: 0; background: none; text-align: left;
    transform: none !important; opacity: 1 !important; filter: none !important; cursor: default; }
  #enterFx .fx-face-a .card .inner { animation: none !important; }
  #enterFx .fx-face-a .card .plate { border: 0 !important; background: none !important;
    filter: none !important; animation: none !important; clip-path: none; }
  /* ★ 内容切换方向**平行于平行四边形的斜边**（tan9° ≈ .1584）：旧内容沿斜边向上滑出，
     新内容从斜下方沿同一条斜线滑入——垂直切换会让文字横穿斜边、看起来"穿模" */
  #enterFx.morph .fx-face-a {
    transform: translate3d(calc(var(--ch, 248px) * .1584), calc(var(--ch, 248px) * -1.02), 0); }
  /* 新内容：关卡信息（同一个框的内部，沿斜边从下方向上滑入） */
  #enterFx .fx-face-b { display: flex; align-items: center; justify-content: center;
    gap: calc(var(--cw, 320px) * .05);
    padding: calc(var(--ch, 248px) * .07) calc(var(--cw, 320px) * .07);
    transform: translate3d(calc(var(--ch, 248px) * -.1584), calc(var(--ch, 248px) * 1.02), 0);
    color: #fff; }
  #enterFx.morph .fx-face-b { transform: translate3d(0, 0, 0); }
  #enterFx .fb-sym { flex: 0 0 auto; min-width: 1.05em; text-align: center;
    font: bold calc(var(--ch, 248px) * .21)/1 "Segoe UI","Microsoft YaHei",sans-serif;
    color: #fff; text-shadow: 0 0 26px rgba(var(--c),.8); }
  #enterFx .fb-sym svg { width: .92em; height: .92em; vertical-align: -.06em; }
  #enterFx .fb-txt { min-width: 0; display: flex; flex-direction: column; }
  #enterFx .fb-num { font: calc(var(--ch, 248px) * .036)/1 ui-monospace,Consolas,monospace;
    letter-spacing: 2.5px; color: rgba(var(--c),.9); }
  #enterFx .fb-name { margin: calc(var(--ch, 248px) * .026) 0 calc(var(--ch, 248px) * .012);
    font-size: calc(var(--ch, 248px) * .082); font-weight: bold; letter-spacing: 5px; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #enterFx .fb-sub { font-size: calc(var(--ch, 248px) * .046); letter-spacing: 2px; color: #a9b8d0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #enterFx .fb-meta { margin-top: calc(var(--ch, 248px) * .032); font-size: calc(var(--ch, 248px) * .036);
    letter-spacing: 1.5px; color: #7180a0; }
  /* 底部信息线：把放大的框下半部撑起来（不然内容全挤在中间） */
  #enterFx .fb-foot { position: absolute; left: calc(var(--cw, 320px) * .085); right: calc(var(--cw, 320px) * .085);
    bottom: calc(var(--ch, 248px) * .062); display: flex; align-items: center; gap: 12px;
    font: calc(var(--ch, 248px) * .033)/1 ui-monospace, Consolas, monospace;
    letter-spacing: 2.5px; color: rgba(113,128,160,.92); }
  #enterFx .fb-foot i { flex: 1 1 auto; height: 1px;
    background: linear-gradient(90deg, rgba(var(--c),.55), rgba(var(--c),0)); }
  #enterFx .fb-state { position: absolute; right: calc(var(--cw, 320px) * .07); top: calc(var(--ch, 248px) * .062);
    padding: 3px 9px; font: calc(var(--ch, 248px) * .034)/1 ui-monospace,monospace;
    letter-spacing: 2px; color: rgb(var(--c)); border: 1px solid rgba(var(--c),.65);
    background: rgba(8,10,28,.6); }
  /* 左下 Tips：暗色小名牌 + 主题色竖条，从下方渐入 */
  #enterFx .fx-tip { position: absolute; left: 26px; bottom: 26px;
    bottom: calc(26px + env(safe-area-inset-bottom,0px));
    max-width: min(360px, 46vw); padding: 12px 18px 13px 16px;
    display: flex; align-items: flex-start; gap: 12px;
    background: linear-gradient(120deg, rgba(16,20,48,.94), rgba(8,9,26,.9));
    border-left: 2px solid rgb(var(--c,150,232,176));
    box-shadow: 0 12px 32px rgba(0,0,0,.5), 0 0 22px rgba(var(--c,150,232,176),.12);
    clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
    opacity: 0; transform: translateY(18px);
    transition: opacity .5s ease, transform .58s cubic-bezier(.2,.8,.3,1); }
  #enterFx.tipOn .fx-tip { opacity: 1; transform: none; }
  #enterFx .fx-tip b { flex: 0 0 auto; padding-top: 1px; font: bold 10px/1.5 ui-monospace,Consolas,monospace;
    letter-spacing: 3px; color: #ffd76a; text-shadow: 0 0 10px rgba(255,215,106,.45); }
  #enterFx .fx-tip span { font-size: 12.5px; line-height: 1.7; letter-spacing: .5px; color: #b9c6dd; }
  /* 右下 LOADING：小平行四边形，白边一段绕圈 */
  #enterFx .fx-load { position: absolute; right: 26px; bottom: 26px;
    bottom: calc(26px + env(safe-area-inset-bottom,0px));
    opacity: 0; transform: translateX(28px);
    transition: opacity .44s ease, transform .56s cubic-bezier(.2,.86,.3,1); }
  #enterFx.loadOn .fx-load { opacity: 1; transform: none; }
  /* 关卡已就绪：所有东西依次平移出画面（只留暗幕 → 外壳让游戏画面整体渐入） */
  #enterFx.leaving .fx-tip { opacity: 0; transform: translateY(-32vh);
    transition: opacity .3s ease, transform .52s cubic-bezier(.55,0,.3,1); }
  #enterFx.leaving .fx-load { opacity: 0; transform: translateY(-26vh);
    transition: opacity .3s ease .05s, transform .52s cubic-bezier(.55,0,.3,1) .05s; }
  /* 通用 LOADING 组件（与关卡启动层 levels/boot.js 同一套） */
  .czlLoad { position: relative; width: 168px; height: 50px; display: grid; place-items: center; pointer-events: none; }
  .czlLoad svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .czlLoad .frame { fill: rgba(10,12,32,.72); stroke: rgba(255,255,255,.18); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .czlLoad .spark { fill: none; stroke: #fff; stroke-width: 1.9; stroke-linecap: round; stroke-dasharray: 13 87;
    animation: czlSpark 1.5s linear infinite; }
  @keyframes czlSpark { to { stroke-dashoffset: -100; } }
  .czlLoad > span { position: relative; font: bold 11px/1 ui-monospace,Consolas,monospace; letter-spacing: 6px;
    color: #fff; padding-left: 6px; text-shadow: 0 0 12px rgba(255,255,255,.5); }
  /* 跳转前的白光：压过页与页之间的任何空档 */
  #enterFx .fx-flash { position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: radial-gradient(56% 56% at 50% 46%, rgba(255,255,255,.9), rgba(var(--c,150,232,176),.45) 44%, transparent 74%); }

  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(16px); z-index: 70;
    padding: 9px 18px; font-size: 13px; background: #1c1650; border: 1px solid rgba(232,184,75,.5); color: var(--txt);
    opacity: 0; transition: opacity .24s, transform .24s; pointer-events: none;
    filter: drop-shadow(0 0 10px rgba(232,184,75,.3));
    clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px); }
  #toast.on { opacity: 1; transform: translateX(-50%); }

  /* ---------- 页面切换：进场淡入 + 离场淡出（点"主页"/"进入关卡"时先淡出再跳） ---------- */
  #wipe { position: fixed; inset: 0; z-index: 900; background: var(--bg-deep); opacity: 1;
    pointer-events: none; transition: opacity .34s ease; }
  #wipe.off { opacity: 0; }

  /* ---------- 响应式：手机上按钮全宽；卡片尺寸交给 fitDeck() 精算（这里只留兜底） ---------- */
  @media (max-width: 760px) {
    header { padding: 12px 14px 4px; gap: 10px; }
    h1 { font-size: 22px; letter-spacing: 4px; }
    #progress { padding: 6px 10px; font-size: 11.5px; } #pbar { width: 54px; }
    .arrow { width: 36px; height: 62px; }
    #prev { left: 6px; } #next { right: 6px; }
    footer { padding: 2px 14px 16px; gap: 10px; }
    .enter { width: 100%; max-width: 420px; justify-content: center; letter-spacing: 4px; }
    .chip { padding: 7px 11px; gap: 8px; }
  }
  @media (max-height: 560px) {
    #ring { width: min(420px, 70vmin); height: min(420px, 70vmin); }
    #corridor { max-height: none; }
    /* ★ 只挪法阵与箭头：卡片的位置由 fitDeck() 按走廊实测高度写 --card-top 精确居中。
       这里若也写 .card { top: 44% }，卡片会被顶出走廊上沿 7px（实测 538×522：
       卡片 245 高、走廊 263 高，44% 让卡片顶到 y=123 而走廊从 130 开始）→ 压住周期条。 */
    #ring, .arrow { top: 44%; }
  }
  /* ★ 媒体查询看到的是**物理**视口，旋转后就不等于版式空间了；
     所以"局部空间太矮/太窄"的情况由 JS 打 body 类名来收紧版式（旋转与否都适用）。
     ★ 卡片的宽高/字号一律由 fitDeck() 按实测走廊高度写死（含 --card-h 派生字号），
     这里不再逐个覆盖字号——否则矮屏上字号比卡片还高，内容溢出卡片。 */
  /* 中等偏矮 / 偏窄窗口（笔记本分屏、浏览器压到半屏，如 1477×558）：
     页眉+周期条+页脚吃掉太多高度、卡片又顶到 248px 上限 → 整页显得挤。
     这里先收一档：隐藏周期条/副标题、缩小页眉页脚与卡片上限。vh<430 的 short 再更狠。 */
  body.compact #periods { display: none; }
  body.compact h1 small { display: none; }
  body.compact #ring { width: min(62vh, 62vw); height: min(62vh, 62vw); }
  body.compact header { padding: 9px 16px 2px; gap: 10px; }
  body.compact h1 { font-size: 24px; letter-spacing: 5px; }
  body.compact .back { padding: 7px 13px; font-size: 13px; }
  body.compact #progress { padding: 5px 10px; font-size: 11.5px; }
  body.compact #pbar { width: 50px; }
  body.compact .ghost { padding: 6px 10px; font-size: 10.5px; }
  body.compact .seg button { padding: 5px 10px; font-size: 11px; }
  body.compact footer { padding: 3px 16px 12px; gap: 8px; }
  body.compact #isotopes { min-height: 46px; gap: 7px; }
  body.compact .chip { padding: 6px 10px; }
  body.compact .chip .nm { font-size: 13px; }
  body.compact .chip .iso b { font-size: 12px; }
  body.compact .enter { width: min(380px, 58vw); padding: 10px 0; font-size: 15px; letter-spacing: 4px; }
  body.compact .enter[disabled] { font-size: 13px; letter-spacing: 2px; }
  body.short #periods { display: none; }
  body.short h1 small { display: none; }
  body.short #corridor { max-height: none; }
  body.short #ring { width: min(70vh, 70vw); height: min(70vh, 70vw); }
  body.short header { padding: 9px 14px 2px; gap: 9px; }
  body.short #progress { padding: 5px 9px; font-size: 11px; }
  body.short #pbar { width: 44px; }
  body.short footer { padding: 2px 12px 10px; gap: 8px; }
  body.short .chip { padding: 6px 10px; gap: 7px; }
  body.short .enter { font-size: 15px; letter-spacing: 3px; padding: 11px 30px; }
  @media (prefers-reduced-motion: reduce) {
    #stars .st, .sigil, #meteors, .card.gold .plate, #ring .spin, #ring .spin2, .card.active .inner { animation: none !important; }
    body.launch #flash { animation: none; }

<script>
const SPASHELL = window.__CZ_SPA_PAGE === true; // 外壳 iframe 内嵌模式
const CFG_READY = window.CHEZZLE_LEVELS_READY || Promise.resolve(window.CHEZZLE_LEVELS || {});
let CFG = window.CHEZZLE_LEVELS || {};
const PROG_KEY = 'chezzle-progress-v1';

// 竖屏强制横屏：CSS 把整页绕左上角顺时针转 90°，屏幕坐标 (sx,sy) 与页面局部坐标
// (lx,ly) 的关系为 sx = innerWidth - ly、sy = lx → 局部视口 = innerHeight × innerWidth。
// getBoundingClientRect()/clientX 都返回**屏幕坐标**，涉及布局与拖拽时必须换算。
const isRot = () => matchMedia('(orientation: portrait)').matches;
const vw = () => (isRot() ? innerHeight : innerWidth);
const vh = () => (isRot() ? innerWidth : innerHeight);
const localPtr = (e) => (isRot() ? { x: e.clientY, y: innerWidth - e.clientX } : { x: e.clientX, y: e.clientY });

// —— 性能档位（低档 = 触屏 / 小屏设备）——
// 手机滑动掉帧与发热的大头是"每帧重新合成/重绘"的装饰：119 张卡片各占一个合成层、
// 每张卡带 blur/drop-shadow 滤镜、矢量法阵旋转、金色呼吸滤镜、80 颗闪烁星星。
// 低档逐个降级（去掉滤镜与图层、停掉无谓动画），同时把参与合成的卡片窗口化。
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = matchMedia('(pointer: coarse)').matches || !matchMedia('(hover: hover)').matches;
const LOW = !REDUCE && (COARSE || Math.min(innerWidth, innerHeight) < 620);

/** 竖屏旋转容器的尺寸：由 JS 按 innerWidth/innerHeight 写死 px，不再依赖 CSS 的 100vh。
 *  iOS 上 100vh 是"地址栏收起后"的大视口，比 innerHeight 大一截 → 与 JS 的 vw()/vh()
 *  换算打架，页面下缘会被地址栏压住。两边用同一组数字就不会错位。
 *  ★ 旋转写在 **body** 上（见上面 CSS 注释）：根元素被撑宽会让移动端把布局视口一起
 *    撑大，整页随即按错误尺寸排版。 */
const ROT_PROPS = ['position', 'top', 'left', 'width', 'height', 'transform', 'transformOrigin', 'overflow'];
function applyRotSize() {
  const h = document.body;
  if (isRot()) {
    h.style.position = 'absolute';
    h.style.top = '0';
    h.style.left = innerWidth + 'px';
    h.style.width = innerHeight + 'px';
    h.style.height = innerWidth + 'px';
    h.style.transformOrigin = 'left top';
    h.style.transform = 'rotate(90deg)';
    h.style.overflow = 'hidden';
  } else {
    for (const k of ROT_PROPS) h.style[k] = '';
  }
}

// #region select-model —— 纯函数 + 元素事实表（tests/selectmodel.test.js 会原样提取复算，勿改签名）
// 元素事实：[族, 周期, 序数, 符号, 中文名]。f 区（镧系/锕系）单独放 FOOT，合并后正好 118 位。
const FACTS = [
  [1,1,1,'H','氢'], [18,1,2,'He','氦'], [1,2,3,'Li','锂'], [2,2,4,'Be','铍'], [13,2,5,'B','硼'],
  [14,2,6,'C','碳'], [15,2,7,'N','氮'], [16,2,8,'O','氧'], [17,2,9,'F','氟'], [18,2,10,'Ne','氖'],
  [1,3,11,'Na','钠'], [2,3,12,'Mg','镁'], [13,3,13,'Al','铝'], [14,3,14,'Si','硅'], [15,3,15,'P','磷'],
  [16,3,16,'S','硫'], [17,3,17,'Cl','氯'], [18,3,18,'Ar','氩'], [1,4,19,'K','钾'], [2,4,20,'Ca','钙'],
  [3,4,21,'Sc','钪'], [4,4,22,'Ti','钛'], [5,4,23,'V','钒'], [6,4,24,'Cr','铬'], [7,4,25,'Mn','锰'],
  [8,4,26,'Fe','铁'], [9,4,27,'Co','钴'], [10,4,28,'Ni','镍'], [11,4,29,'Cu','铜'], [12,4,30,'Zn','锌'],
  [13,4,31,'Ga','镓'], [14,4,32,'Ge','锗'], [15,4,33,'As','砷'], [16,4,34,'Se','硒'], [17,4,35,'Br','溴'],
  [18,4,36,'Kr','氪'], [1,5,37,'Rb','铷'], [2,5,38,'Sr','锶'], [3,5,39,'Y','钇'], [4,5,40,'Zr','锆'],
  [5,5,41,'Nb','铌'], [6,5,42,'Mo','钼'], [7,5,43,'Tc','锝'], [8,5,44,'Ru','钌'], [9,5,45,'Rh','铑'],
  [10,5,46,'Pd','钯'], [11,5,47,'Ag','银'], [12,5,48,'Cd','镉'], [13,5,49,'In','铟'], [14,5,50,'Sn','锡'],
  [15,5,51,'Sb','锑'], [16,5,52,'Te','碲'], [17,5,53,'I','碘'], [18,5,54,'Xe','氙'], [1,6,55,'Cs','铯'],
  [2,6,56,'Ba','钡'], [3,6,57,'La','镧'], [4,6,72,'Hf','铪'], [5,6,73,'Ta','钽'], [6,6,74,'W','钨'],
  [7,6,75,'Re','铼'], [8,6,76,'Os','锇'], [9,6,77,'Ir','铱'], [10,6,78,'Pt','铂'], [11,6,79,'Au','金'],
  [12,6,80,'Hg','汞'], [13,6,81,'Tl','铊'], [14,6,82,'Pb','铅'], [15,6,83,'Bi','铋'], [16,6,84,'Po','钋'],
  [17,6,85,'At','砹'], [18,6,86,'Rn','氡'], [1,7,87,'Fr','钫'], [2,7,88,'Ra','镭'], [3,7,89,'Ac','锕'],
  [4,7,104,'Rf','钅卢'], [5,7,105,'Db','钅杜'], [6,7,106,'Sg','钅喜'], [7,7,107,'Bh','钅波'], [8,7,108,'Hs','钅黑'],
  [9,7,109,'Mt','钅麦'], [10,7,110,'Ds','钅达'], [11,7,111,'Rg','钅仑'], [12,7,112,'Cn','鎶'], [13,7,113,'Nh','鉨'],
  [14,7,114,'Fl','鈇'], [15,7,115,'Mc','镆'], [16,7,116,'Lv','鉝'], [17,7,117,'Ts','鿬'], [18,7,118,'Og','鿫'],
];
const bySym = {
  ...Object.fromEntries(FACTS.map(([g, p, n, s, name]) => [s, { g, p, n, s, name, series: null }])),
  // 镧系 / 锕系（f 区，各 14 位）：周期表里抽出来单列的两行，这里同样并进走廊
  ...Object.fromEntries([[58,'Ce','铈'],[59,'Pr','镨'],[60,'Nd','钕'],[61,'Pm','钷'],[62,'Sm','钐'],[63,'Eu','铕'],[64,'Gd','钆'],
    [65,'Tb','铽'],[66,'Dy','镝'],[67,'Ho','钬'],[68,'Er','铒'],[69,'Tm','铥'],[70,'Yb','镱'],[71,'Lu','镥']]
    .map(([n, s, name]) => [s, { g: 3, p: 6, n, s, name, series: '镧系' }])),
  ...Object.fromEntries([[90,'Th','钍'],[91,'Pa','镤'],[92,'U','铀'],[93,'Np','镎'],[94,'Pu','钚'],[95,'Am','镅'],[96,'Cm','锔'],
    [97,'Bk','锫'],[98,'Cf','锎'],[99,'Es','锿'],[100,'Fm','镄'],[101,'Md','钔'],[102,'No','锘'],[103,'Lr','铹']]
    .map(([n, s, name]) => [s, { g: 3, p: 7, n, s, name, series: '锕系' }])),
};

/** 走廊条目：新手引导 + **全部 118 位元素**（按原子序数）。
 *  没有配关卡的位元素也进走廊（"每个元素都轮得到"），只是状态为 st0（暗、显示「暂无」）。
 *  @param {boolean} onlyPlayable 只保留"有已编写关卡"的元素（顶部筛选开关用） */
function buildEntries(cfg, facts, onlyPlayable) {
  const out = [];
  if (cfg.tutorial) {
    out.push({
      sym: 'tutorial', kind: 'tutorial', n: 0, name: cfg.tutorial.name || '新手引导',
      period: 0, group: 0, rare: false, hasLevel: true,
      isotopes: [{ id: cfg.tutorial.id, name: '引导关', mass: 0, file: cfg.tutorial.file }],
    });
  }
  const syms = Object.keys(facts || {});
  syms.sort((a, b) => (facts[a].n || 999) - (facts[b].n || 999));
  for (const sym of syms) {
    const f = facts[sym];
    const isotopes = ((cfg.levels || {})[sym] || []).slice().sort((a, b) => (a.mass || 0) - (b.mass || 0));
    const hasLevel = isotopes.some((i) => i.file);
    if (onlyPlayable && !hasLevel) continue;
    out.push({
      sym, kind: 'element', n: f.n, name: f.name, period: f.p, group: f.g,
      rare: (cfg.rare || []).includes(sym), hasLevel, isotopes,
    });
  }
  return out;
}
/** 每个周期的**通关进度**：total = 该周期已编写关卡数，done = 其中已通关数。
 *  条内填充 = done/total（没关卡的周期为 0）—— 这就是周期轨道上那根条的含义。 */
function periodStats(entries, cleared) {
  const out = [];
  for (let p = 1; p <= 7; p++) {
    const list = entries.filter((e) => e.kind === 'element' && e.period === p);
    if (!list.length) continue;
    const real = list.flatMap((e) => e.isotopes.filter((i) => i.file));
    out.push({
      p, total: list.length,
      withLevel: real.length,
      levels: real.length,
      done: real.filter((i) => cleared && cleared.has(i.id)).length,
      first: entries.indexOf(list[0]),
    });
  }
  return out;
}
/** 索引 → 该索引所在周期的序号（元素卡才有，引导卡返回 0） */
function periodOf(entry) { return entry && entry.kind === 'element' ? entry.period : 0; }

/** 全部关卡（含新手引导）拍平：前置关系与解锁计算都基于它 */
function allLevels(cfg) {
  const out = [];
  if (cfg.tutorial) out.push({ ...cfg.tutorial, sym: 'tutorial' });
  for (const [sym, list] of Object.entries(cfg.levels || {})) {
    for (const it of list || []) out.push({ ...it, sym });
  }
  return out;
}
/** 解锁判定（前置关卡式）：requires 里的关**全部通关**才解锁；requires 留空 = 一开始就能玩。
 *  ★ 只需写直接前置（链条自动传递）：H-1 已要求新手引导，He-1 只写 H-1 即可。
 *  ★ 旧版是"通关 X → 解锁 X 的子节点"的反向表，且漏判"是否已通关"，会把整张图全解锁。
 *  ★ 调试：levels/levels.json 顶层 "debugUnlockAll": true → 忽略前置，所有已编写关卡直接可进
 *    （验证未解锁关卡用；正式发布记得改回 false）。 */
function unlockedSet(cfg, cleared) {
  const all = allLevels(cfg);
  if (cfg && cfg.debugUnlockAll === true) {
    const set = new Set(all.map((lv) => lv.id));
    if (cfg.tutorial) set.add(cfg.tutorial.id);
    try { console.info('[Chezzle] debugUnlockAll=true：已忽略前置解锁（选关页全解锁）'); } catch (e) { /* 忽略 */ }
    return set;
  }
  const set = new Set();
  for (const lv of all) {
    const req = lv.requires || [];
    if (req.length === 0 || req.every((r) => cleared.has(r))) set.add(lv.id);
  }
  if (cfg.tutorial) set.add(cfg.tutorial.id);  // 新手引导始终可玩
  return set;
}
/** 哪些关解锁了它（用于"通关 X 解锁"提示） */
function unlockersOf(cfg, levelId) {
  return allLevels(cfg).filter((lv) => (lv.requires || []).includes(levelId)).map((lv) => lv.id);
}
/** 同位素状态：'done' 已通关 / 'open' 已解锁可玩 / 'lock' 未解锁 / 'empty' 关卡未编写 */
function isotopeState(it, unlocked, cleared) {
  if (!it.file) return 'empty';
  if (cleared.has(it.id)) return 'done';

    const x = d * step;
    sset(b, 'transform',
      `translate(-50%,-50%) translate3d(${x.toFixed(2)}px, 0px, ${(-ad * 60).toFixed(1)}px)` +
      ` rotateY(${rotY.toFixed(2)}deg) scale(${scale.toFixed(3)})`);
    sset(b, 'opacity', String(Math.max(0, 1 - ad * 0.3)));
    sset(b, 'zIndex', String(Math.round(100 - ad * 10)));
    // pointer-events 不是合成属性：每帧重写会触发样式失效，值没变就别碰
    sset(b, 'pointerEvents', pe);
    // blur 只给"侧后方"的卡片，低档设备完全不做（每帧重新模糊是最贵的一步）
    sset(b, 'filter', LOW || ad < 0.5 ? 'none' : `blur(${Math.min(2.4, (ad - 0.5) * 1.6).toFixed(2)}px)`);
  }
  // 主题色**只在卡片落位时**改（见 setActive）：拖拽途中每越过一张卡就换色，会让满屏
  // 背景在手指还没松开时就开始重绘——正是"翻的时候越来越卡"的观感来源。
}
let lastAccentIdx = -1;
/** 写进 --ar/--ag/--ab（已用 @property 注册成 <number>）→ 由 CSS transition 平滑插值 */
function setAccent(rgb) {
  if (!rgb) return;
  const [r, g, b] = rgb.split(',');
  const st = document.documentElement.style;
  st.setProperty('--ar', r.trim());
  st.setProperty('--ag', g.trim());
  st.setProperty('--ab', b.trim());
}
/** 主题色：稀有元素=紫、新手引导=金、其余按原子序数在青/绿之间取色（与本体同一套色系） */
function accentOf(e) {
  if (!e) return '150,232,176';
  if (e.kind === 'tutorial') return '255,215,106';
  if (e.rare) return '199,139,255';
  const hues = ['150,232,176', '127,216,255', '150,232,176', '255,215,106'];
  return hues[e.n % hues.length];
}

let rafId = 0;
let dragging = false;   // ★ 拖拽期间缓动循环必须让位：否则手停住时 rAF 每帧把 curX 拉回 active，
                        //   鼠标再微动又拽回去 → 高频对拉，就是"粘在窗口边缘鬼畜抖动"的成因
function tickCards() {
  rafId = 0;
  if (dragging) return;
  const target = active;
  if (Math.abs(target - curX) < 0.0015) { curX = target; moveCards(); return; }
  curX += (target - curX) * 0.115;   // 到位缓动：偏小 → 落位更"沉"，不飘
  moveCards();
  rafId = requestAnimationFrame(tickCards);
}
function kickCards() { if (!rafId && !dragging) rafId = requestAnimationFrame(tickCards); }
/** 停掉进行中的缓动（拖拽开始时调用） */
function stopCards() { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }

/** 周期轨道：7 段，当前周期高亮；条内填充 = **该周期通关进度**（已通关关卡 / 已编写关卡） */
function buildPeriods() {
  const box = $('periods');
  box.innerHTML = '';
  const stats = periodStats(ENTRIES, cleared);
  for (const st of stats) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'per';
    b.dataset.p = st.p;
    b.style.setProperty('--f', st.levels ? `${Math.round(st.done / st.levels * 100)}%` : '0%');
    b.innerHTML = `<b>${st.p}</b><i></i>`;
    b.title = `第 ${st.p} 周期 · ${st.total} 位元素 · 已编写关卡 ${st.levels} 关，已通关 ${st.done} 关`;
    b.setAttribute('aria-label', b.title);
    b.addEventListener('click', () => { if (!launching) setActive(st.first, true); });
    box.appendChild(b);
  }
  refreshPeriods();
}
function refreshPeriods() {
  const cur = periodOf(ENTRIES[active]);
  for (const b of $('periods').children) b.classList.toggle('on', +b.dataset.p === cur);
}
/** 跨周期时飘一下"第 N 周期" */
let lastPeriod = -1;
function flashPeriod(p) {
  if (p === lastPeriod) return;
  lastPeriod = p;
  const el = $('pflash');
  if (!p) { el.classList.remove('show'); return; }
  el.textContent = `第 ${p} 周期`;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

function setActive(i, focusIso) {
  if (launching) return; // 进入关卡的过场进行中：不允许翻卡/改选中
  const n = ENTRIES.length;
  const prevP = periodOf(ENTRIES[active]);
  active = clampIndex(i, n);
  if (focusIso) activeIso = 0;
  // 默认选中"最靠前的可玩同位素"，其次已通关的，最后第一个（无同位素时保持 0）
  const e = ENTRIES[active];
  const firstPlayable = e.isotopes.findIndex((it) => isotopeState(it, unlocked, cleared) === 'open');
  const firstDone = e.isotopes.findIndex((it) => isotopeState(it, unlocked, cleared) === 'done');
  activeIso = firstPlayable >= 0 ? firstPlayable
    : firstDone >= 0 ? firstDone
      : Math.max(0, Math.min(activeIso, e.isotopes.length - 1));
  refreshCardStates();
  renderIsotopes();
  layoutCards();
  kickCards();
  refreshPeriods();
  // 主题色只在落位时换一次（拖拽途中不换）→ 满屏背景每翻一张卡只重绘 1~36 帧，而不是每帧
  if (lastAccentIdx !== active) {
    lastAccentIdx = active;
    setAccent(accentOf(ENTRIES[active] || ENTRIES[0]));
  }
  for (const it of e.isotopes) warmLevel(it.file);   // 预取本元素的关卡页（见 warmLevel 注释）
  const p = periodOf(e);
  if (p !== prevP) flashPeriod(p); else lastPeriod = p;
  document.title = `Chezzle · 选关 · ${e.kind === 'tutorial' ? e.name : e.name + ' ' + e.sym}`;
}

function denyCard(b, e) {
  uiSfx('ui.deny');        // 锁定关卡抖动：拒绝音（单击卡片时 audio.js 已按 data-sfx 响过，同名限频不会双响）
  b.classList.remove('locked-shake');
  void b.offsetWidth;      // 重启动画
  b.classList.add('locked-shake');
  const locked = e.isotopes.filter((i) => i.file && !unlocked.has(i.id));
  // 同样取"这些锁定关卡的前置"，而不是反向的 unlockersOf
  const need = [...new Set(locked.flatMap((i) => i.requires || []))].map((u) => NAME_OF.get(u) || u);
  toast(need.length ? `${e.name} 还没解锁 · 先通关 ${need.join(' / ')}` : `${e.name} 暂无`);
}

// ============================================================================
// 进入关卡：卡片放大 → 内容变形成关卡信息卡 → 左下 Tips / 右下 LOADING 滑入
// 同时真预取目标关卡（HTML + 引擎包），就绪且过场演完后交给外壳挂载关卡 iframe。
// 全程在**本文档内**完成，没有跨页导航 → 浏览器差异（白屏/冻住）不再影响转场。
// ============================================================================
const TIP_PLACEHOLDER = '· · ·'; // 文案池为空时的占位；文案写在 levels/levels.json 顶层 "tips": [...]
let lastTipIndex = -1;           // 随机抽取时避免连续两次同一句
function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
/** Tips 文案：从 levels/levels.json 顶层的 "tips" 池里随机抽一条（与关卡无关）。
 *  池为空时显示占位；文案由用户补 JSON 即可，不用改代码。 */
function pickTip() {
  const pool = (CFG && Array.isArray(CFG.tips) ? CFG.tips : [])
    .map((s) => (typeof s === 'string' ? s.trim() : ''))
    .filter(Boolean);
  if (!pool.length) return TIP_PLACEHOLDER;
  let i = (Math.random() * pool.length) | 0;
  if (pool.length > 1 && i === lastTipIndex) i = (i + 1 + ((Math.random() * (pool.length - 1)) | 0)) % pool.length;
  lastTipIndex = i;
  return pool[i];
}
function loadChipHTML() {
  return '<div class="czlLoad">' +
    '<svg viewBox="0 0 168 50" preserveAspectRatio="none" aria-hidden="true">' +
    '<path class="frame" d="M14 1 H167 L154 49 H1 Z"/>' +
    '<path class="spark" pathLength="100" d="M14 1 H167 L154 49 H1 Z"/></svg>' +
    '<span>LOADING</span></div>';
}
/** 元素矩形 → 旋转坐标系下的局部矩形（与卡片布局同一套坐标） */
function localRectOf(el) {
  const r = el.getBoundingClientRect();
  if (!isRot()) return { left: r.left, top: r.top, width: r.width, height: r.height };
  return { left: r.top, top: innerWidth - r.right, width: r.height, height: r.width };
}
/** 关卡信息（同一个平行四边形内部的新内容；按选中卡尺寸排版，外层整体缩放后即为大卡） */
function infoFaceHTML(e, it, state) {
  const guide = e.kind === 'tutorial';
  const sym = guide ? GUIDE_ICON : escHtml(e.sym);
  const num = guide ? 'GUIDE' : 'No.' + e.n;
  const name = guide ? '新手引导' : escHtml(e.name);
  const sub = guide ? '引导关 · 从零开始' : escHtml((it.name || '') + (it.id ? ' · ' + it.id : ''));
  const meta = guide ? 'CHEZZLE · TUTORIAL'
    : ('第 ' + e.period + ' 周期 · 第 ' + e.group + ' 族' + (e.rare ? ' · 稀有' : ''));
  const stateTxt = state === 'done' ? '已通关 · 可重玩' : '可挑战';
  return '<span class="fb-sym">' + sym + '</span>' +
    '<span class="fb-txt"><span class="fb-num">' + num + '</span>' +
    '<b class="fb-name">' + name + '</b>' +
    '<i class="fb-sub">' + sub + '</i>' +
    '<span class="fb-meta">' + meta + '</span></span>' +
    '<span class="fb-foot">' + (guide ? 'LEVEL · TUTORIAL' : 'LEVEL · ' + escHtml(it.id || '—')) +
    '<i></i></span>' +
    '<span class="fb-state">' + stateTxt + '</span>';
}
/** WAAPI 小封装（老内核不支持时直接落到终态，保证功能不丢）；返回 Animation 以便中途取消 */
function animateTo(el, frames, dur, easing, delay) {
  try {
    if (!el.animate) throw new Error('no waapi');
    return el.animate(frames, { duration: dur, easing, delay: delay || 0, fill: 'both' });
  } catch (err) {
    el.style.transform = frames[frames.length - 1].transform || '';
    return null;
  }
}
/** 预取关卡真的需要的东西：关卡 HTML（外壳 iframe 的同款 URL）+ 引擎包/外链脚本。
 *  配合 _headers 的缓存策略，命中缓存时这里几乎瞬时完成。 */
async function prepareLevel(file) {
  const shellApi = (window.parent !== window && window.parent.__czShell) || null;
  const url = shellApi && shellApi.withSpa ? shellApi.withSpa(file) : file;
  let html = '';
  try {
    const res = await fetch(url, { cache: 'default' });
    if (res.ok) html = await res.text();
  } catch (e) { return; }
  const urls = new Set();
  const re = /<script\b[^>]*\bsrc\s*=\s*["']([^"']+)["']/gi;
  let m;
  while ((m = re.exec(html))) {
    const src = m[1];
    if (/^(?:https?:|data:)/i.test(src)) continue;
    try { urls.add(new URL(src, new URL(file, location.href)).href); } catch (e) { /* 忽略 */ }
  }
  await Promise.all([...urls].map((u) => fetch(u, { cache: 'default' })
    .then((r) => r.arrayBuffer()).catch(() => {})));
}

function tryEnter() {
  const e = ENTRIES[active];
  const it = e.isotopes[activeIso];
  if (!it) { denyCard(cards[active], e); return; }
  const s = isotopeState(it, unlocked, cleared);
  if (s !== 'open' && s !== 'done') { denyCard(cards[active], e); return; }
  enterLevel(e, it, s);
}

/** 把"选中卡 + 关卡信息"交给外壳（SPA）；非外壳环境下退化为直接打开关卡页 */
function handoff(e, it) {
  try {
    sessionStorage.setItem('chezzle-enter-v1', JSON.stringify({
      file: it.file, id: it.id || '', name: it.name || '',
      elName: e.kind === 'tutorial' ? '新手引导' : e.name,
      sym: e.kind === 'tutorial' ? '⚗' : e.sym,
      num: e.kind === 'tutorial' ? 'GUIDE' : 'No.' + e.n,
      accent: accentOf(e),
    }));
  } catch (err) { /* 隐私模式忽略 */ }
  if (SPASHELL && window.parent !== window) {
    parent.postMessage({
      type: 'cz:play',
      file: it.file,
      id: it.id || '',
      name: it.name || (e.kind === 'tutorial' ? e.name : e.name),
    }, '*');
  } else {
    location.href = it.file;
  }
}

function enterLevel(e, it, state) {
  if (launching) return;
  launching = true;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fx = $('enterFx');
  const card = cards[active];
  if (reduce || !fx || !card) { handoff(e, it); return; }

  const started = performance.now();
  const MIN_SHOW = 2350;   // 放慢的节奏：缩放 → 内容改编 → Tips → LOADING → 交棒
  const MAX_WAIT = 5600;   // 预取最多等这么久，再慢就交给关卡页自己的加载层
  let prepared = false;
  let navigated = false;

  const r = localRectOf(card);
  // 颜色跟选中卡完全一致（卡的状态色：普通/已通关/金光/稀有，都由卡片上的 --c 决定）
  // —— 以前这里用 accentOf(e)，放大瞬间会从"卡的颜色"跳成"元素色"，看起来像换了一张牌。
  let accent = '';
  try { accent = (getComputedStyle(card).getPropertyValue('--c') || '').trim(); } catch (e) { /* 忽略 */ }
  if (!accent) accent = accentOf(e);
  fx.style.setProperty('--c', accent);
  // —— 唯一的平行四边形：位置/尺寸 = 选中卡的矩形；斜切角随宽度等比 ——
  const box = fx.querySelector('.fx-card');
  if (enterAnim) { try { enterAnim.cancel(); } catch (e) { /* 已结束 */ } enterAnim = null; }
  box.style.transition = '';
  box.style.left = r.left + 'px';
  box.style.top = r.top + 'px';
  box.style.width = r.width + 'px';
  box.style.height = r.height + 'px';
  box.style.setProperty('--cw', r.width + 'px');
  box.style.setProperty('--ch', r.height + 'px');
  box.style.transform = 'none';
  // 旧内容 = 选中卡的等比复制（隐藏其自带底板，框由外层提供 → 视觉上始终是同一个框）
  const faceA = fx.querySelector('.fx-face-a');
  const clone = card.cloneNode(true);
  clone.removeAttribute('id');
  clone.style.opacity = '1';
  clone.style.transform = 'none';
  clone.style.filter = 'none';
  // 卡片正处在"呼吸"浮动中时，克隆体停掉 CSS 动画会跳到 +0；把当前偏移抄过来 → 起手帧完全重合
  try {
    const liveInner = card.querySelector('.inner');
    const clonedInner = clone.querySelector('.inner');
    if (liveInner && clonedInner) clonedInner.style.transform = getComputedStyle(liveInner).transform;
  } catch (e) { /* 忽略 */ }
  faceA.replaceChildren(clone);
  fx.querySelector('.fx-face-b').innerHTML = infoFaceHTML(e, it, state);
  const tipEl = fx.querySelector('.fx-tip');
  tipEl.innerHTML = '<b>TIP</b><span></span>';
  tipEl.querySelector('span').textContent = pickTip();
  fx.querySelector('.fx-load').innerHTML = loadChipHTML();
  fx.classList.remove('morph', 'tipOn', 'loadOn', 'go', 'leaving');
  card.style.visibility = 'hidden';
  document.body.classList.add('entering');
  fx.classList.add('on');

  // 1) 同一个平行四边形：从原位整体放大到画面中央（更慢、有惯性）
  const cx = vw() / 2 - (r.left + r.width / 2);
  const cy = vh() / 2 - (r.top + r.height / 2);
  const targetW = Math.min(560, vw() * 0.6);
  const k = Math.max(1.08, Math.min(1.55, targetW / r.width));
  enterGeo = { box, cx, cy, k };
  enterAnim = animateTo(box, [
    { transform: 'translate(0px,0px) scale(1)' },
    { transform: `translate(${(cx * 0.26).toFixed(1)}px,${(cy * 0.26).toFixed(1)}px) scale(${(1 + (k - 1) * 0.3).toFixed(3)})`, offset: 0.25 },
    { transform: `translate(${cx.toFixed(1)}px,${cy.toFixed(1)}px) scale(${k.toFixed(3)})` },
  ], 880, 'cubic-bezier(.17,.84,.25,1)', 120);

  // 2) 内容改编：同一个框内旧内容向上平移滑出 / 关卡信息从下方平移滑入
  setTimeout(() => fx.classList.add('morph'), 1020);
  // 3) Tips / LOADING 依次滑入
  setTimeout(() => fx.classList.add('tipOn'), 1700);
  setTimeout(() => fx.classList.add('loadOn'), 1980);

  // 4) 真预取（外壳 iframe 用的同款 URL，命中缓存时瞬时完成）
  prepareLevel(it.file).then(() => { prepared = true; }).catch(() => { prepared = true; });

  const handoffNow = () => {
    if (navigated) return;
    navigated = true;
    setTimeout(() => handoff(e, it), 260); // 外壳会先让选关页整体平移出画面，再让游戏渐入
  };
  const waitReady = () => {
    if (navigated) return;
    const t = performance.now() - started;
    if (t < MIN_SHOW) { setTimeout(waitReady, Math.max(40, MIN_SHOW - t)); return; }
    if (!prepared && t < MAX_WAIT) { setTimeout(waitReady, 150); return; }
    handoffNow();
  };
  setTimeout(waitReady, MIN_SHOW);
}

/** 外壳从关卡返回：把过场倒放回去（不重新加载，选关状态原地保留）。
 *  此时选关 iframe 还在外壳的暗场/不可见里，所以可以无过渡地瞬间复位，再播入场。 */
function backFromLevel() {
  const fx = $('enterFx');
  const card = cards[active];
  if (card) card.style.visibility = '';
  document.body.classList.remove('entering');
  launching = false;
  if (fx) {
    const box = fx.querySelector('.fx-card');
    if (enterAnim) { try { enterAnim.cancel(); } catch (e) { /* 已结束 */ } enterAnim = null; }
    enterGeo = null;
    fx.style.transition = 'none';
    fx.classList.remove('leaving', 'morph', 'go', 'loadOn', 'tipOn');
    fx.classList.remove('on');
    if (box) { box.style.transition = 'none'; box.style.transform = 'none'; }
    const faceA = fx.querySelector('.fx-face-a');
    if (faceA) faceA.replaceChildren();
    void fx.offsetWidth;
    fx.style.transition = '';
    if (box) box.style.transition = '';
  }
  // 关卡里可能通关/解锁变化：重读本地进度，刷新卡片状态与进度条
  try {
    cleared = loadProg();
    unlocked = unlockedSet(CFG || {}, cleared);
    refreshCardStates();
    renderIsotopes();
    refreshProgress();
    buildPeriods();
  } catch (e) { /* 忽略 */ }
  // 稍等外壳把 iframe 揭开，再播放入场（与外壳的 iframe 淡入叠在一起）
  document.body.classList.remove('ready');
  void document.body.offsetWidth;
  setTimeout(() => requestAnimationFrame(() => document.body.classList.add('ready')), 260);
}

/** 返回首页 / 关于页：SPA 里发消息给外壳；独立打开时走原来的离场 */
function leaveTo(href) {
  if (!href) return;
  if (SPASHELL && window.parent !== window) {
    parent.postMessage({ type: /about/i.test(href) ? 'cz:about' : 'cz:home' }, '*');
    return;
  }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { location.href = href; return; }
  const w = $('wipe');
  w.classList.remove('off');
  setTimeout(() => { location.href = href; }, 300);
}
$('back').addEventListener('click', (e) => { e.preventDefault(); leaveTo('index.html'); });
// 外壳 → 选关页的消息：
//   cz:back  从关卡返回：立即复位过场层并重播入场（此时 iframe 还不可见）
//   cz:out   关卡已就绪：所有东西一起平移出画面，随后外壳让游戏画面渐入
//   cz:enter  再次展示选关：重播页面入场
window.addEventListener('message', (ev) => {
  const d = ev.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'cz:back') backFromLevel();
  else if (d.type === 'cz:out') {
    const fx = $('enterFx');
    if (!fx) return;
    fx.classList.add('leaving');
    // 卡片正在被 WAAPI 缩放：先接到当前帧，再顺着往画面外滑（不能直接 cancel，否则会跳回原位）
    if (enterGeo && enterGeo.box) {
      const b = enterGeo.box;
      const cur = getComputedStyle(b).transform;
      if (enterAnim) { try { enterAnim.cancel(); } catch (e) { /* 已结束 */ } enterAnim = null; }
      b.style.transition = 'none';
      b.style.transform = cur === 'none' ? '' : cur;
      void b.offsetWidth;
      b.style.transition = 'transform .52s cubic-bezier(.55,0,.3,1)';
      b.style.transform = 'translate(' + enterGeo.cx.toFixed(1) + 'px,' +
        (enterGeo.cy - vh() * 1.2).toFixed(1) + 'px) scale(' + enterGeo.k + ')';
      setTimeout(() => { b.style.transition = ''; }, 580);
    }
  } else if (d.type === 'cz:enter') {
    document.body.classList.remove('ready');
    void document.body.offsetWidth;
    requestAnimationFrame(() => document.body.classList.add('ready'));
  }
});

// ---- 显示范围筛选：全部元素 / 只看有关卡 ----
/** 切换时先让走廊淡出 + 轻微收一下 → 重建 → 再淡入（否则卡片是"啪"地换掉，没有过渡） */
function applyFilter(playable) {
  if (launching) return;
  if (playable === onlyPlayable) return;
  const keepSym = ENTRIES[active] ? ENTRIES[active].sym : 'tutorial';
  onlyPlayable = playable;
  $('fAll').classList.toggle('on', !playable);
  $('fPlay').classList.toggle('on', playable);
  moveSegInd(false);                  // 金色指示块滑过去
  const swap = () => {
    ENTRIES = buildEntries(CFG || {}, bySym, onlyPlayable);
    NAME_OF = buildNameMap();
    activeIso = 0;
    lastPeriod = -1;
    buildCards();
    buildPeriods();
    fitDeck();                       // 卡片条数变了 → 页脚高度可能变 → 重新量走廊
    const idx = ENTRIES.findIndex((e) => e.sym === keepSym);
    setActive(idx >= 0 ? idx : 0, true);
    track.style.opacity = '1';
    track.style.transform = 'none';
  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { swap(); return; }
  track.style.opacity = '0';
  track.style.transform = 'scale(.985)';   // 收一点点再展开：切换有"呼吸"而不是硬替换
  setTimeout(swap, 200);
}
$('fAll').addEventListener('click', () => applyFilter(false));
$('fPlay').addEventListener('click', () => applyFilter(true));

// ---- 交互：箭头 / 键盘 / 滚轮 / 拖拽 ----
prevBtn.addEventListener('click', () => setActive(active - 1, true));
nextBtn.addEventListener('click', () => setActive(active + 1, true));
enterBtn.addEventListener('click', tryEnter);

/** 跳到相邻"有关卡"的元素（长走廊里快速找可玩关卡） */
function jumpPlayable(dir) {
  for (let i = active + dir; i >= 0 && i < ENTRIES.length; i += dir) {
    if (ENTRIES[i].hasLevel) { setActive(i, true); return; }
  }
}
/** 跳到上/下一个周期的首位元素 */
function jumpPeriod(dir) {
  const cur = periodOf(ENTRIES[active]);
  const stats = periodStats(ENTRIES, cleared);
  if (!stats.length) return;
  if (cur === 0) { setActive(stats[0].first, true); return; } // 引导卡 → 第 1 周期
  const i = stats.findIndex((s) => s.p === cur);
  const nxt = stats[Math.max(0, Math.min(stats.length - 1, i + dir))];
  if (nxt) setActive(nxt.first, true);
}
addEventListener('keydown', (e) => {
  if (launching) return;
  const k = e.key;
  const isoN = ENTRIES[active].isotopes.length;
  if (k === 'ArrowLeft') { setActive(active - 1, true); e.preventDefault(); }
  else if (k === 'ArrowRight') { setActive(active + 1, true); e.preventDefault(); }
  else if (k === 'Home') { setActive(0, true); e.preventDefault(); }
  else if (k === 'End') { setActive(ENTRIES.length - 1, true); e.preventDefault(); }
  else if (k === '[') { jumpPeriod(-1); e.preventDefault(); }
  else if (k === ']') { jumpPeriod(1); e.preventDefault(); }
  else if (k === 'n') { jumpPlayable(1); e.preventDefault(); }
  else if (k === 'p') { jumpPlayable(-1); e.preventDefault(); }
  else if (k === 'ArrowUp' && isoN) { activeIso = (activeIso - 1 + isoN) % isoN; renderIsotopes(); e.preventDefault(); }
  else if (k === 'ArrowDown' && isoN) { activeIso = (activeIso + 1) % isoN; renderIsotopes(); e.preventDefault(); }
  else if (k === 'Enter' || k === ' ') { tryEnter(); e.preventDefault(); }
  else if (/^[1-9]$/.test(k)) { const i = +k - 1; if (i < ENTRIES[active].isotopes.length) { activeIso = i; renderIsotopes(); } }
});
$('corridor').addEventListener('wheel', (e) => {
  if (launching) return;
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (Math.abs(d) < 4) return;
  wheelAcc += d;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => { wheelAcc = 0; }, 220);
  // 滚轮也能一次翻多张：按累计量折算张数（一"格"≈ 60px）
  const n = Math.trunc(wheelAcc / 60);
  if (n) { wheelAcc -= n * 60; setActive(active + n, true); }
  e.preventDefault();
}, { passive: false });
let wheelAcc = 0, wheelTimer = 0;

// 拖拽（鼠标 / 触屏统一用 Pointer Events）
// ★ 手感：拖动时走廊 1:1 跟手；松手时按"拖过的距离 + 甩动速度"一起折算要落到第几张，
//   所以使劲一甩能连翻好几张，而不是永远只挪一张。
(function drag() {
  const box = $('corridor');
  const SLOW = 1.6;       // ★ 跟手阻尼：翻一张卡需要滑过 1.6 个卡片间距（越大越"沉"、同样距离翻得越少）
  const FLING_MS = 170;   // 甩动惯性折算时间（越大越"滑"）
  const FLING_MAX = 3;    // 单次甩动最多翻几张
  const EDGE = 0.35;      // 走廊两端的橡皮筋阻尼
  let down = false, x0 = 0, moved = 0, id = null;
  let samples = [];       // ★ 最近 120ms 的 (x,t) 采样：释放速度只看这个窗口
  let dragged = false;    // 本次交互是否构成"拖拽"（用来吞掉尾随的 click）
  const pitch = () => step * SLOW;                // 翻一张卡所需的滑动距离
  /** 释放速度（局部 px/ms）：只认最近 120ms 的采样；松手离最后一个采样超过 80ms
   *  （"拖完顿一下再松手"）按 0 算，不再有惯性。
   *  ★ 原先用"整段手势的峰值速度"：短暂停顿只让惯性减半 → 停顿后松手还会甩好几张。 */
  function releaseV(now) {
    while (samples.length && now - samples[0].t > 120) samples.shift();
    if (samples.length < 2) return 0;
    const a = samples[0], b = samples[samples.length - 1];
    if (now - b.t > 80) return 0;
    const dt = b.t - a.t;
    return dt > 0 ? (b.x - a.x) / dt : 0;
  }
  function posFrom(mv) {
    let c = active - mv / pitch();
    const max = ENTRIES.length - 1;
    if (c < 0) c *= EDGE;                          // 到头了 → 越拖越涩
    else if (c > max) c = max + (c - max) * EDGE;
    return c;
  }
  box.addEventListener('pointerdown', (e) => {
    if (launching || e.target.closest('.arrow')) return;
    const p = localPtr(e);
    down = true; dragged = false; moved = 0; id = e.pointerId;
    samples = [{ x: p.x, t: performance.now() }];
    dragging = true; stopCards();                  // 交给手指，缓动循环让位（防抖关键）
    // 以"当前实际位置"为拖拽原点，接手瞬间不跳（缓动途中按下也顺滑）
    x0 = p.x - (active - curX) * pitch();
  });
  box.addEventListener('pointermove', (e) => {
    if (!down || e.pointerId !== id) return;
    const p = localPtr(e), t = performance.now();
    moved = p.x - x0;
    samples.push({ x: p.x, t });
    if (samples.length > 24) samples.shift();
    if (Math.abs(moved) > 6) {
      if (!dragged) box.setAttribute('data-sfx-off', '');  // 拖动走廊整棵子树跳过点击音（松手后恢复，见 up）
      dragged = true;                // ★ 只有真的拖起来了才吞随后的 click；
      try { box.setPointerCapture(id); } catch (err) { /* 合成事件 / pointerId 已失效 */ }
      curX = posFrom(moved);   // 带阻尼地跟手
      moveCards();
    }
  });
  const up = (e) => {
    if (!down || (id !== null && e.pointerId !== id)) return;
    down = false; id = null;
    dragging = false;
    const v = releaseV(performance.now());            // 只认最近 120ms 的速度
    const fling = Math.max(-FLING_MAX, Math.min(FLING_MAX, (v * FLING_MS) / pitch()));
    let target = Math.round(curX - fling);            // 拖过的距离 + 惯性一起折算
    // 拖过一定距离却四舍五入回到原处时，至少顺方向走一张（小幅甩动也要有反馈）
    if (target === active && dragged && Math.abs(moved) > pitch() * 0.28) target = active + (moved < 0 ? 1 : -1);
    if (target === active) kickCards();               // ★ 原地回弹走缓动；直接 curX = active 会瞬移
    else setActive(target, true);
    moved = 0; samples = [];
    if (dragged) setTimeout(() => { dragged = false; box.removeAttribute('data-sfx-off'); }, 60); // 让尾随的 click 被吞掉（音效已跳过）
  };
  box.addEventListener('pointerup', up);
  box.addEventListener('pointercancel', up);
  box.addEventListener('dragstart', (e) => e.preventDefault());
  // 拖完松手时浏览器还会补一个 click，落到卡片上就会误触发"进入/选中" → 捕获阶段吞掉
  box.addEventListener('click', (e) => { if (dragged) { e.stopPropagation(); e.preventDefault(); } }, true);
})();

// ---- 进度栏 / 清除进度 ----
function refreshProgress() {
  const total = ENTRIES.reduce((s, e) => s + e.isotopes.filter((i) => i.file).length, 0);
  const done = ENTRIES.reduce((s, e) => s + e.isotopes.filter((i) => i.file && cleared.has(i.id)).length, 0);
  $('ptext').textContent = `已通关 ${done} / ${total}`;
  $('pfill').style.width = total ? `${Math.round(done / total * 100)}%` : '0%';
}
$('reset').addEventListener('click', () => {
  if (!confirm('确定清除全部通关进度？（不会删除关卡文件）')) return;
  cleared = new Set();
  try { localStorage.setItem(PROG_KEY, JSON.stringify({ cleared: [] })); } catch (e) {}
  unlocked = unlockedSet(CFG || {}, cleared);
  refreshCardStates(); renderIsotopes(); refreshProgress(); buildPeriods();
  toast('进度已清除');
});

// ---- toast ----
let toastTimer = null;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}

// ---- 背景：星野 / 流星（坐标按局部视口算，竖屏强制横屏时也铺满） ----
(function stars() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = $('stars');
  const N = LOW ? 24 : 80;
  for (let i = 0; i < N; i++) {
    const s = document.createElement('i');
    s.className = 'st';
    const sz = 1 + Math.random() * 2;
    s.style.width = sz + 'px'; s.style.height = sz + 'px';
    s.style.left = (Math.random() * vw()).toFixed(0) + 'px';
    s.style.top = (Math.random() * vh()).toFixed(0) + 'px';
    s.style.animationDuration = (2.6 + Math.random() * 5) + 's';
    s.style.animationDelay = (Math.random() * 5) + 's';
    box.appendChild(s);
  }
  addEventListener('orientationchange', () => setTimeout(() => {
    for (const s of box.children) {
      s.style.left = (Math.random() * vw()).toFixed(0) + 'px';
      s.style.top = (Math.random() * vh()).toFixed(0) + 'px';
    }
  }, 260));
  const mb = $('meteors');
  (function spawn() {
    if (!mb.childElementCount) {
      const m = document.createElement('i');
      m.className = 'meteor';
      const W = vw();
      m.style.left = (W * (0.08 + Math.random() * 0.62)).toFixed(0) + 'px';
      m.style.top = (vh() * (0.02 + Math.random() * 0.30)).toFixed(0) + 'px';
      m.style.width = (72 + Math.random() * 96).toFixed(0) + 'px';
      m.style.setProperty('--dx', (W * 0.44).toFixed(0) + 'px');
      m.style.setProperty('--dy', (W * 0.143).toFixed(0) + 'px');
      m.addEventListener('animationend', () => m.remove());
      mb.appendChild(m);
    }
    setTimeout(spawn, 6500 + Math.random() * 9000);
  })();
})();

// ---- 启动 ----
/** 把"局部视口"特征打到 body 类名上：媒体查询只认物理视口，旋转后就对不上了。
 *  顺带在这里同步旋转容器尺寸与卡片尺寸（都要按视口实测算，纯 CSS 做不到）。 */
function markViewport() {
  const b = document.body;
  b.classList.toggle('rot', isRot());
  b.classList.toggle('short', vh() < 430);   // 局部太矮 → 收紧版式（隐藏周期条等）
  // 中等偏矮/偏窄（笔记本半屏、窗口拉扁）：先收一档，避免页眉卡脚把卡片挤死
  b.classList.toggle('compact', vh() < 640 || vw() < 1000);
  b.classList.toggle('narrow', vw() < 700);
  b.classList.toggle('low', LOW);            // 低档：停滤镜/停图层（见 CSS body.low）
  document.documentElement.classList.toggle('low', LOW);   // 还要打在 <html> 上：关掉 --ar 过渡（满屏重绘风暴）
  applyRotSize();
  fitDeck();
}
markViewport();
// 视口变化统一入口：rAF 合并（iOS 地址栏收起时会连发很多次 resize）
let vpPending = false;
function onViewport() {
  if (vpPending) return;
  vpPending = true;
  requestAnimationFrame(() => {
    vpPending = false;
    markViewport();
    layoutCards();
    moveSegInd(true);   // 尺寸变了：指示块立即对齐（不做滑动动画）
  });
}
addEventListener('resize', onViewport);
addEventListener('orientationchange', () => setTimeout(onViewport, 200));
if (window.visualViewport) visualViewport.addEventListener('resize', onViewport);

/** 开场应该停在哪张元素卡：
 *  ① 第一个"已解锁且有文件、尚未通关"的关卡所在元素（下一个该打的）
 *  ② 全通关 → 最后一个已通关的元素卡（走廊顺序即原子序数，取最靠后的那张）
 *  ③ 都没有（无进度且首关未解锁）→ 留在最开头 */
function autoTarget() {
  const idx = ENTRIES.findIndex((e) => e.isotopes.some((it) => it.file && unlocked.has(it.id) && !cleared.has(it.id)));
  if (idx >= 0) return idx;
  for (let i = ENTRIES.length - 1; i >= 0; i--) {
    if (ENTRIES[i].isotopes.some((it) => it.file && cleared.has(it.id))) return i;
  }
  return 0;
}

// ---------------------------------------------------------------------------
// SPA 内嵌：慢网启动层 + 就绪交接（外壳收到 cz:page-ready 才揭开 iframe）
// ---------------------------------------------------------------------------
let bootShown = false;
const bootTimer = setTimeout(() => {
  const b = $('boot');
  if (b) { b.classList.add('show'); bootShown = true; }
}, 260);
let pageReadySent = false;
/** 数据就绪：收起启动层/暗幕，开始入场编排；通知外壳"可以揭开选关页了" */
function revealPage() {
  clearTimeout(bootTimer);
  const b = $('boot');
  if (b) {
    if (bootShown) b.classList.add('done');
    setTimeout(() => { if (b.parentNode) b.parentNode.removeChild(b); }, 800);
  }
  const w = $('wipe');
  if (w) {
    if (SPASHELL) { w.style.transition = 'none'; w.classList.add('off'); }
    else requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('off')));
  }
  document.body.classList.add('ready');
  if (!pageReadySent) {
    pageReadySent = true;
    if (SPASHELL && window.parent !== window) {
      try { parent.postMessage({ type: 'cz:page-ready' }, '*'); } catch (e) { /* 忽略 */ }
    }
  }
}

/** 关卡表来自 levels/levels.json（levels.js 负责读进来），所以要等它 ready 再建界面 */
function boot(cfg) {
  CFG = cfg || {};
  unlocked = unlockedSet(CFG, cleared);
  // 调试全解锁标记（levels.json 的 debugUnlockAll:true 时可见；发布前记得改回 false）
  const dbgTag = $('dbgUnlock');
  if (dbgTag) dbgTag.hidden = CFG.debugUnlockAll !== true;
  ENTRIES = buildEntries(CFG, bySym, onlyPlayable);
  NAME_OF = buildNameMap();
  buildCards();                     // 先建卡（全部 118 位元素）
  buildPeriods();                   // 再建周期轨道（条内 = 该周期通关进度）
  setActive(0, true);          // 先停在最开头（新手引导）
  refreshProgress();
  moveSegInd(true);                 // 显示范围切换的金色指示块：首帧就位
  fitDeck();                        // ★ 页脚内容（同位素条/按钮）定下来后再量走廊高度，卡片尺寸才准
  layoutCards();
  moveCards(true);
  // 再量一次：字体度量/换行在首帧后才稳定（手机 Safari 上曾出现"晚一帧才换行"→ 卡片压到周期条）
  requestAnimationFrame(() => { fitDeck(); layoutCards(); moveSegInd(true); });
  // 开场动画：稍等进场淡入，再自动划过走廊到"下一个该打的关卡"
  const target = autoTarget();
  if (target > 0) setTimeout(() => setActive(target, true), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 520);
  revealPage();
}
CFG_READY.then(boot).catch(() => {
  $('ptext').textContent = '关卡表读取失败';
  toast('读取 levels/levels.json 失败：请用 http 服务打开（如 python -m http.server）');
  revealPage();
});
</script>
</body>
</html>

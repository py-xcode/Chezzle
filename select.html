<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chezzle · 选关 · 元素周期表</title>
<style>
  :root {
    --gold: #e8b84b; --gold-l: #ffd76a; --cyan: #7fd8ff; --green: #96e8b0;
    --panel: #141a40; --edge: #2b3047; --txt: #dfe8f2; --dim: #9fb2c8;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%;
    background:
      radial-gradient(1150px 700px at 50% -12%, rgba(84,60,180,.30) 0%, transparent 60%),
      radial-gradient(1500px 900px at 50% 115%, rgba(20,14,64,.85) 0%, #090720 60%) #090720;
    color: var(--txt); font: 14px "Segoe UI","Microsoft YaHei",sans-serif; }
  body { padding: 18px 20px 40px; position: relative; }
  a { color: var(--cyan); text-decoration: none; }
  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .st { position: absolute; border-radius: 50%; background: #fff; animation: twinkle ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .1; transform: scale(.8); } 50% { opacity: .7; transform: scale(1); } }
  header, #grid, #legend { position: relative; z-index: 1; }
  /* 符文法阵背景 */
  .sigil { position: fixed; left: 50%; top: 30%; width: 760px; height: 760px; transform: translate(-50%,-50%);
    z-index: 0; opacity: .07; pointer-events: none; animation: spin 130s linear infinite; }
  @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
  /* 顶栏（切角金属牌） */
  header { display: flex; align-items: center; gap: 14px; max-width: 1080px; margin: 0 auto 14px; flex-wrap: wrap; }
  .back { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border: 1px solid var(--edge);
    background: linear-gradient(180deg, #232a5c, #12163a); color: var(--txt); cursor: pointer; transition: filter .2s, transform .2s;
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px); }
  .back:hover { filter: drop-shadow(0 0 10px rgba(232,184,75,.45)); color: var(--gold-l); transform: translateY(-1px); }
  .back:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  h1 { font-size: 21px; color: var(--gold-l); text-shadow: 0 0 14px rgba(232,184,75,.45); letter-spacing: 1px; }
  h1 small { color: var(--dim); font-size: 12px; font-weight: normal; margin-left: 10px; }
  #progress { margin-left: auto; color: var(--cyan); font-size: 13px; padding: 7px 14px; border: 1px solid rgba(127,216,255,.35);
    background: rgba(16,26,56,.8); letter-spacing: 1px; filter: drop-shadow(0 0 8px rgba(127,216,255,.25));
    clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px); }
  #reset { font-size: 11px; color: #6a7a96; background: none; border: none; cursor: pointer; padding: 4px; }
  #reset:hover { color: #ffb0b0; }
  /* 元素表（切角符文格） */
  #grid { display: grid; grid-template-columns: repeat(18, 1fr); gap: 3px; max-width: 1080px; margin: 0 auto; }
  .cell { position: relative; min-height: 52px; border: 1px solid; display: flex;
    flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 3px;
    cursor: pointer; transition: filter .18s, transform .18s; font-family: "Segoe UI","Microsoft YaHei",sans-serif;
    clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px); }
  .cell:hover { transform: translateY(-1px) scale(1.05); z-index: 2; }
  .cell:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .cell .num { position: absolute; top: 1px; left: 5px; font-size: 9px; color: inherit; opacity: .8; }
  .cell .sym { font: bold 16px "Segoe UI",sans-serif; letter-spacing: .5px; }
  .cell .nm { font-size: 9px; opacity: .75; }
  /* —— 亮度/深浅层级（暗→亮：st0 无关卡 < st1 未解锁 < st2 已解锁 < st3 已通关；gold 金光）——
     普通元素 --c = 浅绿；稀有元素 --c = 浅蓝；发光随亮度增强 */
  .cell.st0 { background: rgba(14,17,38,.94); border-color: rgba(90,100,150,.14); color: rgba(160,170,215,.24); }
  .cell.st0:hover { filter: drop-shadow(0 0 4px rgba(90,100,150,.3)); }
  .cell.st1 { background: rgba(24,28,58,.96); border-color: rgba(120,130,190,.3); color: rgba(190,200,240,.5); }
  .cell.st2 { background: rgba(var(--c), .14); border-color: rgba(var(--c), .55); color: #f2f8ff;
    filter: drop-shadow(0 0 10px rgba(var(--c), .25)); }
  .cell.st3 { background: rgba(var(--c), .32); border-color: rgba(var(--c), .95); color: #ffffff;
    filter: drop-shadow(0 0 14px rgba(var(--c), .55)); }
  .cell.gold { background: rgba(255,215,106,.30); border-color: #ffd76a; color: #fff6d8;
    filter: drop-shadow(0 0 18px rgba(255,215,106,.8)); animation: goldPulse 2.4s ease-in-out infinite; }
  @keyframes goldPulse { 0%,100% { filter: drop-shadow(0 0 12px rgba(255,215,106,.5)); }
    50% { filter: drop-shadow(0 0 24px rgba(255,215,106,.95)); } }
  /* 图例位（新手引导，仿真实周期表上方图例铀格）：第 1 行 H 与 He 之间的空档带 */
  .tuto { grid-column: 6 / span 9; grid-row: 1; display: flex; align-items: center; justify-content: center; gap: 9px;
    min-height: 52px; border: 1.5px solid var(--gold-l); cursor: pointer;
    background: linear-gradient(180deg, rgba(232,184,75,.32), rgba(232,184,75,.10)); color: #ffe9b0;
    font-size: 12.5px; filter: drop-shadow(0 0 14px rgba(232,184,75,.45)); transition: filter .2s, transform .2s;
    clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px); }
  .tuto:hover { filter: drop-shadow(0 0 24px rgba(255,215,106,.8)); transform: translateY(-1px); }
  .tuto:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .tuto b { font-size: 15px; letter-spacing: 1px; }
  /* 脚注行（镧系/锕系） */
  .foot { display: flex; align-items: center; padding-right: 3px; color: var(--dim); font-size: 10px; justify-content: flex-end; }
  /* 图例（符文石板） */
  #legend { max-width: 1080px; margin: 16px auto 0; padding: 13px 18px;
    background: linear-gradient(180deg, rgba(30,30,72,.92), rgba(12,12,36,.92)); border: 1px solid rgba(232,184,75,.4);
    font-size: 12.5px; line-height: 2.1; color: var(--dim);
    filter: drop-shadow(0 0 12px rgba(232,184,75,.18));
    clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px); }
  #legend .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .sw { display: inline-block; width: 26px; height: 15px; border: 1px solid; vertical-align: -3px; margin-right: 5px;
    clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px); }
  /* 弹窗（切角祭坛） */
  #modal { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
    background: rgba(4,6,20,.72); backdrop-filter: blur(3px); }
  #modal.on { display: flex; }
  .box { width: min(430px, 92vw); max-height: 82vh; overflow-y: auto; padding: 22px 24px; color: var(--txt);
    background: linear-gradient(180deg, #1b1650, #100c2e);
    border: 1.5px solid rgba(232,184,75,.75);
    filter: drop-shadow(0 0 26px rgba(232,184,75,.35)) drop-shadow(0 18px 40px rgba(0,0,0,.6));
    transform: translateY(8px) scale(.98); transition: transform .18s;
    clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 16px, 100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%, 0 calc(100% - 16px), 0 16px); }
  #modal.on .box { transform: none; }
  .box h2 { font-size: 19px; color: var(--gold-l); margin-bottom: 2px; text-shadow: 0 0 12px rgba(232,184,75,.5); }
  .box .sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
  .badge { display: inline-block; margin-left: 8px; padding: 1px 9px; font-size: 10.5px;
    border: 1px solid var(--cyan); color: var(--cyan); filter: drop-shadow(0 0 6px rgba(127,216,255,.4)); vertical-align: 3px;
    clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px); }
  .close { position: sticky; float: right; top: 0; margin: -6px -4px 0 0; width: 30px; height: 30px; display: grid;
    place-items: center; border: 1px solid var(--edge); background: #1a1650; color: #9fb2c8;
    cursor: pointer; transition: color .15s, filter .15s;
    clip-path: polygon(7px 0, calc(100% - 7px) 0, 100% 7px, 100% calc(100% - 7px), calc(100% - 7px) 100%, 7px 100%, 0 calc(100% - 7px), 0 7px); }
  .close:hover { color: #fff; filter: drop-shadow(0 0 8px rgba(255,120,120,.6)); }
  .close:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .iso { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 8px; border: 1px solid rgba(90,90,150,.35);
    background: linear-gradient(180deg, rgba(10,12,34,.85), rgba(8,8,26,.85)); color: #cfd8f0;
    clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px); }
  .iso .nt { font: bold 18px "Segoe UI",sans-serif; color: #fff; flex: 0 0 56px; text-align: center; text-shadow: 0 0 8px rgba(160,200,255,.4); }
  .iso .nt .stack { display: inline-flex; flex-direction: column; font-size: 10px; line-height: 1.05; text-align: center;
    vertical-align: 0; margin-right: 1px; color: #9fb2c8; }
  .iso .info { flex: 1; min-width: 0; }
  .iso .info .t { font-size: 14px; color: #fff; }
  .iso .info .d { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .iso .act { flex: 0 0 auto; }
  .go { cursor: pointer; padding: 8px 16px; border: 0; font-weight: bold; font-size: 13px; letter-spacing: 1px;
    background: linear-gradient(180deg, #ffe9a8, #e8b84b 55%, #9a6d1e); color: #241a02;
    filter: drop-shadow(0 0 10px rgba(232,184,75,.45)); transition: filter .18s, transform .18s;
    clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px); }
  .go:hover { filter: drop-shadow(0 0 18px rgba(255,215,106,.8)); transform: translateY(-1px); }
  .go:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .lock { color: #7a86b0; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
  .done { color: #8fe8b0; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
  .none-lv { color: #55617f; font-size: 12px; }
  /* toast */
  #toast { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px); z-index: 45;
    padding: 9px 18px; background: #1c1650; border: 1px solid rgba(232,184,75,.5); color: var(--txt);
    font-size: 13px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
    filter: drop-shadow(0 0 10px rgba(232,184,75,.3));
    clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px); }
  #toast.on { opacity: 1; transform: translateX(-50%); }
  @media (prefers-reduced-motion: reduce) {
    .cell.gold, .tuto, .st, .sigil { animation: none; }
    .cell { transition: none; }
  }
</style>
</head>
<body>
<div id="stars" aria-hidden="true"></div>
<svg class="sigil" viewBox="0 0 900 900" aria-hidden="true">
  <g fill="none" stroke="#c78bff">
    <circle cx="450" cy="450" r="330" stroke-width="2"/>
    <circle cx="450" cy="450" r="366" stroke-width="1" stroke-dasharray="30 22"/>
    <path d="M450 84 L540 450 L450 816 L360 450 Z" stroke-width="1.5"/>
    <path d="M84 450 L450 360 L816 450 L450 540 Z" stroke-width="1.5"/>
  </g>
</svg>

<header>
  <a class="back" href="index.html" aria-label="返回主页">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    主页
  </a>
  <h1>选关 · 元素周期表 <small>点击元素查看同位素关卡</small></h1>
  <div id="progress">已通关 0 / 0</div>
  <button id="reset" type="button">清除进度</button>
</header>

<div id="grid" aria-label="元素周期表关卡网格"></div>

<div id="legend">
  <div class="row">
    <span><span class="sw" style="background:#0e1126;border-color:rgba(90,100,150,.3)"></span>未写关卡（最暗）</span>
    <span><span class="sw" style="background:#181c3a;border-color:rgba(120,130,190,.35)"></span>未解锁</span>
    <span><span class="sw" style="background:rgba(150,232,176,.16);border-color:rgba(150,232,176,.55)"></span>已解锁</span>
    <span><span class="sw" style="background:rgba(150,232,176,.34);border-color:rgba(150,232,176,.95)"></span>已通关</span>
    <span><span class="sw" style="background:rgba(255,215,106,.3);border-color:#ffd76a"></span>全同位素通关 · 金光</span>
    <span><span class="sw" style="background:rgba(127,216,255,.3);border-color:rgba(127,216,255,.85)"></span>稀有关卡（难度提升）</span>
  </div>
  <div class="row" style="color:#6a7a96">
    普通元素 = 浅绿；稀有元素 = 浅蓝辉光。格子越亮说明进度越深；金光 = 该元素所有同位素关卡全部通关。
    每个元素格可含多个同位素关卡（同格多关），通关后按配置解锁新关卡；顶部金色格是新手引导（对应真实周期表图例铀格的位置）。
  </div>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-label="同位素关卡">
  <div class="box">
    <button class="close" id="mclose" type="button" aria-label="关闭">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <h2 id="mtitle">氢</h2>
    <div class="sub" id="msub"></div>
    <div id="mlist"></div>
  </div>
</div>

<div id="toast" role="status"></div>

<script src="levels/levels.js"></script>
<script>
const CFG = window.CHEZZLE_LEVELS;
const PROG_KEY = 'chezzle-progress-v1';

// ---- 元素周期表事实（符号/中文名/位置；与关卡无关的固定数据）----
// [族号, 周期, 序号, 符号, 中文名]
const FACTS = [
  [1,1,1,'H','氢'], [18,1,2,'He','氦'],
  [1,2,3,'Li','锂'], [2,2,4,'Be','铍'], [13,2,5,'B','硼'], [14,2,6,'C','碳'], [15,2,7,'N','氮'],
  [16,2,8,'O','氧'], [17,2,9,'F','氟'], [18,2,10,'Ne','氖'],
  [1,3,11,'Na','钠'], [2,3,12,'Mg','镁'], [13,3,13,'Al','铝'], [14,3,14,'Si','硅'], [15,3,15,'P','磷'],
  [16,3,16,'S','硫'], [17,3,17,'Cl','氯'], [18,3,18,'Ar','氩'],
  [1,4,19,'K','钾'], [2,4,20,'Ca','钙'], [3,4,21,'Sc','钪'], [4,4,22,'Ti','钛'], [5,4,23,'V','钒'],
  [6,4,24,'Cr','铬'], [7,4,25,'Mn','锰'], [8,4,26,'Fe','铁'], [9,4,27,'Co','钴'], [10,4,28,'Ni','镍'],
  [11,4,29,'Cu','铜'], [12,4,30,'Zn','锌'], [13,4,31,'Ga','镓'], [14,4,32,'Ge','锗'], [15,4,33,'As','砷'],
  [16,4,34,'Se','硒'], [17,4,35,'Br','溴'], [18,4,36,'Kr','氪'],
  [1,5,37,'Rb','铷'], [2,5,38,'Sr','锶'], [3,5,39,'Y','钇'], [4,5,40,'Zr','锆'], [5,5,41,'Nb','铌'],
  [6,5,42,'Mo','钼'], [7,5,43,'Tc','锝'], [8,5,44,'Ru','钌'], [9,5,45,'Rh','铑'], [10,5,46,'Pd','钯'],
  [11,5,47,'Ag','银'], [12,5,48,'Cd','镉'], [13,5,49,'In','铟'], [14,5,50,'Sn','锡'], [15,5,51,'Sb','锑'],
  [16,5,52,'Te','碲'], [17,5,53,'I','碘'], [18,5,54,'Xe','氙'],
  [1,6,55,'Cs','铯'], [2,6,56,'Ba','钡'], [3,6,57,'La','镧'], [4,6,72,'Hf','铪'], [5,6,73,'Ta','钽'],
  [6,6,74,'W','钨'], [7,6,75,'Re','铼'], [8,6,76,'Os','锇'], [9,6,77,'Ir','铱'], [10,6,78,'Pt','铂'],
  [11,6,79,'Au','金'], [12,6,80,'Hg','汞'], [13,6,81,'Tl','铊'], [14,6,82,'Pb','铅'], [15,6,83,'Bi','铋'],
  [16,6,84,'Po','钋'], [17,6,85,'At','砹'], [18,6,86,'Rn','氡'],
  [1,7,87,'Fr','钫'], [2,7,88,'Ra','镭'], [3,7,89,'Ac','锕'], [4,7,104,'Rf','𬬻'], [5,7,105,'Db','𬭊'],
  [6,7,106,'Sg','𬭳'], [7,7,107,'Bh','𬭛'], [8,7,108,'Hs','𬭶'], [9,7,109,'Mt','鿏'], [10,7,110,'Ds','𫟼'],
  [11,7,111,'Rg','𬬭'], [12,7,112,'Cn','鎶'], [13,7,113,'Nh','鉨'], [14,7,114,'Fl','鈇'], [15,7,115,'Mc','镆'],
  [16,7,116,'Lv','鉝'], [17,7,117,'Ts','鿬'], [18,7,118,'Og','鿫'],
];
const FOOT = [
  [ [58,'Ce','铈'],[59,'Pr','镨'],[60,'Nd','钕'],[61,'Pm','钷'],[62,'Sm','钐'],[63,'Eu','铕'],[64,'Gd','钆'],
    [65,'Tb','铽'],[66,'Dy','镝'],[67,'Ho','钬'],[68,'Er','铒'],[69,'Tm','铥'],[70,'Yb','镱'],[71,'Lu','镥'] ],
  [ [90,'Th','钍'],[91,'Pa','镤'],[92,'U','铀'],[93,'Np','镎'],[94,'Pu','钚'],[95,'Am','镅'],[96,'Cm','锔'],
    [97,'Bk','锫'],[98,'Cf','锎'],[99,'Es','锿'],[100,'Fm','镄'],[101,'Md','钔'],[102,'No','锘'],[103,'Lr','铹'] ],
];
const bySym = Object.fromEntries(FACTS.map(([g,p,n,s,name]) => [s, { g, p, n, s, name }]));

// ---- 进度 / 解锁 ----
const GREEN = '150,232,176', CYAN = '127,216,255'; // 普通元素=浅绿；稀有元素=浅蓝
function loadProg() {
  try { const p = JSON.parse(localStorage.getItem(PROG_KEY) || '{"cleared":[]}'); return new Set(p.cleared || []); }
  catch (e) { return new Set(); }
}
function saveProg(set) {
  try { localStorage.setItem(PROG_KEY, JSON.stringify({ cleared: [...set] })); } catch (e) {}
}
/** 解锁闭包：根 = tutorial；BFS 展开 unlocks */
function unlockedSet(cleared) {
  const set = new Set(['tutorial']);
  const q = ['tutorial'];
  while (q.length) {
    const id = q.shift();
    for (const nxt of CFG.unlocks[id] || []) {
      if (!set.has(nxt)) { set.add(nxt); q.push(nxt); }
    }
  }
  return set;
}
/** 某关完成时会被哪些关解锁（用于显示"通关 X 解锁"） */
function unlockersOf(levelId) {
  const out = [];
  for (const [src, targets] of Object.entries(CFG.unlocks || {})) {
    if (targets.includes(levelId)) out.push(src);
  }
  return out;
}

// ---- 渲染表 ----
const grid = document.getElementById('grid');
const RARE = new Set(CFG.rare || []);
let clearedSet = loadProg();

function realLevelsOf(sym) { return (CFG.levels?.[sym] || []).filter((i) => i.file); }

function cellState(sym) {
  const rl = realLevelsOf(sym);
  if (rl.length === 0) return 'st0';
  const un = unlockedSet(clearedSet);
  const hasUn = rl.some((i) => un.has(i.id));
  const hasCl = rl.some((i) => clearedSet.has(i.id));
  const allCl = rl.every((i) => clearedSet.has(i.id));
  if (allCl) return 'gold';
  if (hasCl) return 'st3';
  if (hasUn) return 'st2';
  return 'st1';
}

for (const [g, p, n, sym, name] of FACTS) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'cell ' + cellState(sym);
  const rare = RARE.has(sym);
  b.style.setProperty('--c', rare ? CYAN : GREEN);
  b.dataset.sym = sym;
  b.setAttribute('aria-label', `${name}（${sym}）元素`);
  b.title = `${name} ${sym} · ${cellState(sym) === 'st0' ? '暂无关卡' : cellState(sym) === 'gold' ? '同位素全部通关' : '点击查看同位素关卡'}`;
  b.innerHTML = `<span class="num">${n}</span><span class="sym">${sym}</span><span class="nm">${name}</span>`;
  b.addEventListener('click', () => openModal(sym));
  b.style.gridColumn = g;
  b.style.gridRow = p;
  grid.appendChild(b);
}
// 脚注行（镧系 / 锕系）
FOOT.forEach((row, ri) => {
  const lab = document.createElement('div');
  lab.className = 'foot';
  lab.textContent = ['57-71 镧系', '89-103 锕系'][ri];
  lab.style.gridColumn = 1;
  lab.style.gridRow = 8 + ri;
  grid.appendChild(lab);
  row.forEach(([n, s, nm], i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cell ' + cellState(s);
    const rare = RARE.has(s);
    b.style.setProperty('--c', rare ? CYAN : GREEN);
    b.dataset.sym = s;
    b.title = `${nm} ${s} · ${cellState(s) === 'st0' ? '暂无关卡' : '点击查看同位素关卡'}`;
    b.setAttribute('aria-label', `${nm}（${s}）元素`);
    b.innerHTML = `<span class="num">${n}</span><span class="sym">${s}</span><span class="nm">${nm}</span>`;
    b.addEventListener('click', () => openModal(s));
    b.style.gridColumn = 2 + i;
    b.style.gridRow = 8 + ri;
    grid.appendChild(b);
  });
});
// 图例位：新手引导（仿真实周期表上方的图例铀格）
(function () {
  const tuto = document.createElement('a');
  tuto.href = CFG.tutorial.file;
  tuto.className = 'tuto';
  tuto.innerHTML = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M9 3h6M10 3v5.2L4.8 17a3.4 3.4 0 0 0 3 5h8.4a3.4 3.4 0 0 0 3-5L14 8.2V3"
        stroke="#ffe9b0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7.5 15h9" stroke="#ffe9b0" stroke-width="1.5" stroke-linecap="round"/></svg>
    <b>新手引导</b><span style="opacity:.85">（图例位）</span>`;
  grid.appendChild(tuto);
})();

// ---- 进度栏 ----
function refreshProgress() {
  const all = Object.values(CFG.levels || {}).flat().filter((i) => i.file).map((i) => i.id);
  const total = all.length + 1;
  const done = [...clearedSet].filter((id) => id === CFG.tutorial.id || all.includes(id)).length;
  let gold = 0;
  for (const sym of Object.keys(CFG.levels || {})) if (cellState(sym) === 'gold') gold++;
  document.getElementById('progress').textContent = `已通关 ${done} / ${total} · 金光 ${gold} 格`;
}
refreshProgress();

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('确定清除全部通关进度？（不会删除关卡文件）')) return;
  clearedSet = new Set();
  saveProg(clearedSet);
  location.reload();
});

// ---- 同位素弹窗 ----
const modal = document.getElementById('modal');
const mtitle = document.getElementById('mtitle');
const msub = document.getElementById('msub');
const mlist = document.getElementById('mlist');
let lastFocus = null;

function openModal(sym) {
  const f = bySym[sym];
  const rl = realLevelsOf(sym);
  if (rl.length === 0) {
    toast(`${f.name}（${sym}）暂无关卡`);
    return;
  }
  const un = unlockedSet(clearedSet);
  lastFocus = document.activeElement;
  mtitle.textContent = `${f.name} ${sym}`;
  msub.innerHTML = `第 ${f.p} 周期 第 ${f.g} 族 · 同位素各成一关${
    RARE.has(sym) ? '<span class="badge">稀有关卡</span>' : ''}`;
  mlist.innerHTML = '';
  const all = (CFG.levels?.[sym] || []).slice().sort((a, b) => a.mass - b.mass);
  all.forEach((it) => {
    const row = document.createElement('div');
    row.className = 'iso';
    const cleared = clearedSet.has(it.id);
    const unlocked = un.has(it.id);
    const act = !it.file
      ? '<span class="none-lv">未编写</span>'
      : cleared
        ? `<span class="done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="vertical-align:-2px"><path d="M5 12.5l4.4 4.4L19 7.5" stroke="#8fe8b0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>已通关</span>`
        : unlocked
          ? `<button class="go" type="button" data-file="${it.file}">进入关卡</button>`
          : `<span class="lock"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="vertical-align:-2px"><rect x="5" y="11" width="14" height="9" rx="2.4" stroke="#7a86b0" stroke-width="1.8"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="#7a86b0" stroke-width="1.8"/></svg>通关 ${
              (unlockersOf(it.id).map((u) => u === 'tutorial' ? '新手引导' : u).join(' / ') || '上一关')} 解锁</span>`;
    row.innerHTML = `
      <span class="nt"><span class="stack"><span>${it.mass}</span><span>${f.n}</span></span>${sym}</span>
      <span class="info"><span class="t">${it.name}</span><span class="d">质量数 ${it.mass}${it.file ? '' : ' · 关卡未编写'}</span></span>
      <span class="act">${act}</span>`;
    if (it.file && unlocked && !cleared) {
      row.querySelector('.go').addEventListener('click', () => { location.href = it.file; });
    }
    mlist.appendChild(row);
  });
  modal.classList.add('on');
  modal.querySelector('.close').focus();
}
function closeModal() {
  modal.classList.remove('on');
  if (lastFocus) lastFocus.focus();
}
document.getElementById('mclose').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// ---- toast ----
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1800);
}

// ---- 星夜 ----
(function () {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.getElementById('stars');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('i');
    s.className = 'st';
    const sz = 1 + Math.random() * 2;
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.top = (Math.random() * 100) + 'vh';
    s.style.animationDuration = (2.6 + Math.random() * 5) + 's';
    s.style.animationDelay = (Math.random() * 5) + 's';
    box.appendChild(s);
  }
})();
</script>

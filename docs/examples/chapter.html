<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Chezzle · 多场景章节示例</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e28; color: #cfd8ea; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  h1 { font-size: 15px; color: #ffd76a; margin: 0; }
  #stage { position: relative; width: 1100px; height: 700px; box-shadow: 0 0 60px rgba(120,90,220,0.25); }
  #stage canvas { background: #0b0e28; }
  #help { font-size: 11px; color: #6a7a96; max-width: 1100px; text-align: center; }
</style>
</head>
<body>
<h1>第一章 · 研究室（两个场景 + 玩家跨场景搬运）</h1>
<div id="stage"></div>
<div id="help">
  场景 A「研究室」：站上金色压力板 → 切到场景 B「完成区」。<br>
  场景 B：站上压力板 → 切回 A（回到离开时的原样）。每一步切换时玩家对象被完整搬移（物品栏/身上物质/血量保留）。
</div>
<script src="../../dist/chezzle.js?vmtnzn7a4?vmtnzn7a4?vmtnyxblw?vmtnyxblw?vmtnxszpm?vmtnxszpm?vmtnwuuru?vmtnwuuru?vmtnvnx3h?vmtnvnx3h?vmtfspzrg?vmtfspzrg?vmtfrfflh?vmtfrfflh?vmtfr81ac?vmtfr81ac?vmtfr1s0a?vmtfr1s0a?vmtfqm31b?vmtfqm31b"></script>
<script>
const M = new Chezzle.Multiscene(document.getElementById('stage'), { width: 1100, height: 700 });

// ---- 场景 A：研究室 ----
M.scene('a', { worldW: 1600, worldH: 700 })
  .floor(0, 660, 1600, 40)
  .floor(0, 0, 1600, 20)
  .deposit(400, 520, { substance: 'NaCl', mass: 30 })          // 演示物：盐堆
  .beaker(700, 440, 80, 220, { volume: 200, solutes: { HCl: 5 } }) // 演示物：盐酸烧杯
  .switch(300, 638, { mode: 'pressure', id: 'sw' })             // 压力板：去 B
  .sign(120, 560, '第一章：按 A/D 走，站上金色压力板')
  .player(150, 500, { substance: 'NaOH', mass: 30, id: 'player1' });

// ---- 场景 B：完成区 ----
M.scene('b', { worldW: 1200, worldH: 700 })
  .floor(0, 660, 1200, 40)
  .floor(0, 0, 1200, 20)
  .switch(650, 638, { mode: 'pressure', id: 'sw2' })            // 压力板：回 A
  .sign(420, 500, '第一章完成！\n带回来的东西都还在身上（NaCl 堆没拿？回去拿~）');

// ---- 构建 + 接线 ----
M.buildAll();
M.byId('a', 'sw').onOpen(() => M.switchTo('b', { spawn: { x: 500, y: 520 } }));
M.byId('b', 'sw2').onOpen(() => M.switchTo('a', { spawn: { x: 520, y: 520 } })); // 远离压力板，防回环
M.start('a');
</script>
</body>
</html>

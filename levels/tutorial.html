<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chezzle · 新手引导（多场景大远征）</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e28; }
  body { display: flex; align-items: center; justify-content: center; }
  #box { position: relative; width: 100vw; height: 100vh; }
  canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="box"></div>
<script src="../dist/chezzle.js?vmtodua0j"></script>
<script src="../plugin/tutorial.js"></script>
<script src="../plugin/checkpoint.js"></script>
<script src="../plugin/showtime.js"></script>
<script src="report.js"></script>
<script>
// ============================================================================
// 新手引导关 · 七世界大远征（Multiscene 多场景）
// ----------------------------------------------------------------------------
// 世界：①苏醒草原(氧气) → ②翡翠峡谷(化学反应/收集/搭高/冰面) →
//       ③炼丹台地(灯列/分解/焰色) → ④深井实验室(无氧/产氢/气泡柱/探测器【测验①】)
//       → ⑤爆炸盆地(亲手爆炸/断绳/大气爆鸣/传送门首秀【测验②】)
//       → ⑥溶液神殿(溶解/提取器/钥匙/传送门成对) → ⑦火山口(催化/燃烧/喷灯/通关烟花)
// 引导原则：**每个物品首次出现必解释**（这是什么/分几类/怎么用），横幅+路标双保险；
// 文案直白。演出=showtime 模组；死亡=checkpoint 模组（多场景版）；
// 跨场景"传送门"= Multiscene.switchTo（引擎的 portal 同色配对只在单场景内）。
// ============================================================================
const TOUCH = (typeof navigator !== 'undefined' && (navigator.maxTouchPoints || 0) > 0) || /[?&]touch=1/.test(location.search || '');
const TXT = (d, m) => (TOUCH ? m : d);
const box = document.getElementById('box');

// --------------------------- 演出剧本（showtime） ---------------------------
const SHOWTIME = [
  // 开场世界观（纯横幅，不教按键）
  { scene: 'plain', on: 'at', at: 0.5, act: [{ kind: 'banner', text: '嘿！你好！', dur: 2.2 }] },
  { scene: 'plain', on: 'at', at: 3.0, act: [{ kind: 'banner', text: '欢迎来到 Chezzle！', dur: 2.2 }] },
  { scene: 'plain', on: 'at', at: 5.6, act: [{ kind: 'banner', text: '在这里，你就是一团化学物质\n现在是一块 30 克的氢氧化钠', dur: 3.0 }] },
  { scene: 'plain', on: 'at', at: 9.0, act: [{ kind: 'banner', text: '每个关都要：跋山涉水 · 保全自己 · 收集通关要用的物质', dur: 3.2 }] },
  { scene: 'plain', on: 'at', at: 12.6, act: [{ kind: 'banner', text: '死了会回到本关开头——化学家都死过几百次', dur: 2.6 }] },
  { scene: 'plain', on: 'at', at: 15.6, act: [{ kind: 'banner', text: TXT('A / D 移动 · 空格跳跃', '左下摇杆移动 · 上推跳跃'), dur: 2.8 }] },
  // 世界横幅（切场景时）
  { scene: 'plain', on: 'enter', act: [{ kind: 'banner', text: '第 1 世界 · 苏醒草原\n先学会走路', dur: 2.6 }] },
  { scene: 'canyon', on: 'enter', act: [{ kind: 'banner', text: '第 2 世界 · 翡翠峡谷\n这里的池子会跟你"打招呼"', dur: 2.8 }] },
  { scene: 'plateau', on: 'enter', act: [{ kind: 'banner', text: '第 3 世界 · 炼丹台地\n跟着灯光走', dur: 2.6 }] },
  { scene: 'well', on: 'enter', act: [{ kind: 'banner', text: '第 4 世界 · 深井实验室\n注意：这里的空气没有氧气', dur: 2.8 }] },
  { scene: 'basin', on: 'enter', act: [{ kind: 'banner', text: '第 5 世界 · 爆炸盆地\n测验②：炸！', dur: 2.6 }] },
  { scene: 'temple', on: 'enter', act: [{ kind: 'banner', text: '第 6 世界 · 溶液神殿\n把铜从水里"拧"出来', dur: 2.8 }] },
  { scene: 'crater', on: 'enter', act: [{ kind: 'banner', text: '第 7 世界 · 火山口（最后一站！）\n点灯 · 烧炭 · 开门 · 走人', dur: 3.0 }] },
  // 世界内教学横幅（区域触发）
  { scene: 'plain', on: 'pos', x: 700, y: 400, w: 500, h: 400, act: [
    { kind: 'banner', text: '空气里有氧气 O₂——燃烧的秘密武器\n先记住它（左上角空气面板）', dur: 3.0 }] },
  { scene: 'plain', on: 'pos', x: 1850, y: 480, w: 350, h: 320, act: [
    { kind: 'banner', text: '这是「开关」：①踩上就开（站上去试试！）\n②要化学物质才开（世界 2 见）', dur: 3.6 }] },
  { scene: 'plain', on: 'open', ref: 'p_gate_sw', act: [
    { kind: 'shake', n: 5 }, { kind: 'banner', text: '闸门开了——走进新世界！', dur: 2.4 }] },
  { scene: 'canyon', on: 'pos', x: 80, y: 520, w: 400, h: 380, act: [
    { kind: 'banner', text: '「池子」= 溶液。\n跳进去看看会发生什么——盯紧飘出来的反应标签！', dur: 3.4 }] },
  { scene: 'canyon', on: 'pos', x: 620, y: 520, w: 380, h: 380, act: [
    { kind: 'banner', text: '「Q 收集」：把沉淀收进物品栏（屏幕下方，点格可选中）', dur: 3.2 }] },
  { scene: 'canyon', on: 'pos', x: 960, y: 560, w: 360, h: 340, act: [
    { kind: 'banner', text: '「Shift 放置」：往脚下放沉淀，把自己垫高！\n（这是"搭高"——爬塔！）', dur: 3.6 }] },
  { scene: 'canyon', on: 'pos', x: 1330, y: 560, w: 400, h: 340, act: [
    { kind: 'banner', text: '「冰面」：滑！沉淀放上去会自己溜走——\n在这别想搭高（放一把试试，看它跑）', dur: 3.6 }] },
  { scene: 'canyon', on: 'open', ref: 'c_swCu', act: [
    { kind: 'shake', n: 5 }, { kind: 'banner', text: '配对了！门开 → 去台地', dur: 2.4 }] },
  { scene: 'plateau', on: 'pos', x: 40, y: 480, w: 360, h: 320, act: [
    { kind: 'banner', text: '「灯」：站上开关点亮；离开它就灭。\n粉末也可以放灯上（灯=加热台）', dur: 3.6 }] },
  { scene: 'plateau', on: 'pos', x: 940, y: 480, w: 340, h: 320, act: [
    { kind: 'banner', text: '把 Cu(OH)₂ 放灯上烤：受热分解 → 黑色 CuO', dur: 3.4 }] },
  { scene: 'plateau', on: 'pos', x: 1240, y: 440, w: 360, h: 360, act: [
    { kind: 'banner', text: '「焰色反应」：粉末放常燃灯 → 火焰变色！（不消耗）', dur: 3.4 }] },
  { scene: 'plateau', on: 'open', ref: 'd_swCuO', act: [
    { kind: 'shake', n: 5 }, { kind: 'banner', text: '烤出来的 CuO 配对成功——前进！', dur: 2.4 }] },
  { scene: 'well', on: 'pos', x: 260, y: 660, w: 460, h: 240, act: [
    { kind: 'banner', text: '把 Zn 推进盐酸池：Zn + 2HCl → ZnCl₂ + H₂↑\n（产氢！看气泡柱）', dur: 3.6 }] },
  { scene: 'well', on: 'open', ref: 'w_det', act: [
    { kind: 'shake', n: 6 }, { kind: 'banner', text: '🧪 测验①通过！氢气达标，出口解锁', dur: 2.8 }] },
  { scene: 'basin', on: 'pos', x: 80, y: 480, w: 340, h: 320, act: [
    { kind: 'banner', text: '测验②：把 Na 块推进水池——\n推完快跑！这次真的会炸（站远点看）', dur: 3.6 }] },
  { scene: 'basin', on: 'open', ref: 'b_det', act: [
    { kind: 'shake', n: 14 }, { kind: 'banner', text: '轰！——氢气在富氧的空气里就是这个脾气\n（看！爆炸还会切断绳子——吊着的块砸下来了）', dur: 4.6 },
    { kind: 'fireworks', n: 6 }] },
  { scene: 'basin', on: 'pos', x: 1640, y: 440, w: 380, h: 360, act: [
    { kind: 'banner', text: '「传送门」（第一次见）：紫色拱门！\n开关"承认"它才亮——亮着就走进去', dur: 3.4 }] },
  { scene: 'temple', on: 'pos', x: 300, y: 480, w: 360, h: 320, act: [
    { kind: 'banner', text: 'CuO 推进酸池：溶解！CuO + 2HCl → CuCl₂（变蓝）', dur: 3.4 }] },
  { scene: 'temple', on: 'pos', x: 820, y: 460, w: 320, h: 340, act: [
    { kind: 'banner', text: '「提取器」：站上开关，从池子里把固体盐"提"出来——Q 收', dur: 3.4 }] },
  { scene: 'temple', on: 'open', ref: 't_key', act: [
    { kind: 'shake', n: 5 }, { kind: 'banner', text: '钥匙永久开锁——传送门亮了！', dur: 2.6 }] },
  { scene: 'crater', on: 'pos', x: 260, y: 880, w: 340, h: 320, act: [
    { kind: 'banner', text: '「催化」：MnO₂ 进双氧池 → O₂ 泡泡！（催化剂不消耗）', dur: 3.4 }] },
  { scene: 'crater', on: 'pos', x: 660, y: 880, w: 340, h: 320, act: [
    { kind: 'banner', text: '「燃烧」：C 放灯上：C + O₂ → CO₂——氧气是草原那个', dur: 3.4 }] },
  { scene: 'crater', on: 'win', act: [
    { kind: 'fireworks', n: 24 },
    { kind: 'banner', text: '🎉 恭喜通关！\n你已经是正式的化学怪人了', dur: 999 }] },
  // —— 出口/传送门"到达切换"（goto：pos 触发；require=开关有效开启才算"门亮过"）——
  // 出口区在"开关 deleteId 删的墙"后面：墙没删进不来，墙删了走进来即切场景。
  { scene: 'plain', on: 'pos', x: 2130, y: 400, w: 110, h: 340, act: [{ kind: 'goto', scene: 'canyon', spawn: { x: 120, y: 808 } }] },
  { scene: 'canyon', on: 'pos', x: 1310, y: 500, w: 110, h: 420, act: [{ kind: 'goto', scene: 'plateau', spawn: { x: 120, y: 608 } }] },
  { scene: 'plateau', on: 'pos', x: 1520, y: 400, w: 110, h: 320, act: [{ kind: 'goto', scene: 'well', spawn: { x: 120, y: 628 } }] },
  { scene: 'well', on: 'pos', x: 1140, y: 540, w: 120, h: 200, require: 'w_det', act: [{ kind: 'goto', scene: 'basin', spawn: { x: 120, y: 608 } }] },
  { scene: 'basin', on: 'pos', x: 1754, y: 590, w: 70, h: 110, require: 'b_det', act: [{ kind: 'goto', scene: 'temple', spawn: { x: 120, y: 608 } }] },
  { scene: 'temple', on: 'pos', x: 1474, y: 590, w: 70, h: 110, require: 't_key', act: [{ kind: 'goto', scene: 'crater', spawn: { x: 140, y: 948 } }] },
  { scene: 'temple', on: 'pos', x: 1624, y: 590, w: 70, h: 110, act: [{ kind: 'goto', scene: 'basin', spawn: { x: 120, y: 608 } }] },
];

// ------------------------------ 检查点（多场景） ------------------------------
const CHECKPOINTS = [
  { scene: 'plain', id: 'c1', x: 0, y: 0, w: 700, h: 800, sx: 140, sy: 700 },
  { scene: 'canyon', id: 'c2', x: -60, y: 0, w: 900, h: 1000, sx: 120, sy: 900 },
  { scene: 'plateau', id: 'c3', x: -60, y: 0, w: 800, h: 800, sx: 120, sy: 700 },
  { scene: 'well', id: 'c4', x: 0, y: 0, w: 1200, h: 715, sx: 150, sy: 700 },
  { scene: 'well', id: 'c4b', x: 0, y: 715, w: 1200, h: 200, sx: 460, sy: 820 },
  { scene: 'basin', id: 'c5', x: 0, y: 0, w: 900, h: 800, sx: 120, sy: 700 },
  { scene: 'temple', id: 'c6', x: 0, y: 0, w: 900, h: 800, sx: 120, sy: 700 },
  { scene: 'crater', id: 'c7', x: 0, y: 0, w: 1200, h: 1200, sx: 140, sy: 1040 },
];

// -------------------------------- 构建世界 ----------------------------------
// 注意：plugins 不能在构造参数里引用 M（M 还没初始化——TDZ）；
// 先构造，再赋 plugins（buildAll 时注入每个场景）。
const M = new Chezzle.Multiscene(box); // 尺寸自适应窗口（缓冲 ×devicePixelRatio 高清）
M.plugins = [
  { name: 'showtime', cfg: { M, plays: SHOWTIME } },
  { name: 'checkpoint', cfg: { M, spawns: CHECKPOINTS, texts: [
    '复活！化学家从不回头看爆炸',
    '没事，NaOH 还有很多（30 克而已）',
    '刚才那是教学的一部分（才怪）',
    '重来一次！这回先看路标',
  ] } },
];

// -------- 世界 1 · 苏醒草原（2200×800，氧气 18）：移动/大气/首见开关 --------
M.scene('plain', { worldW: 2200, worldH: 800 })
  .floor(-260, 700, 2820, 130, { id: 'p_floor' })
  .floor(300, 640, 220, 16, { id: 'p_hill' })
  .floor(700, 550, 260, 16, { id: 'p_rock' })
  .floor(1260, 620, 120, 16, { id: 'p_gap1a' })
  .floor(1580, 620, 120, 16, { id: 'p_gap1b' })
  .player(140, 600, { substance: 'NaOH', mass: 30, id: 'player1' })
  .sign(260, 690, TXT(
    'A / D 移动 · 空格跳跃 · R 重开\n先往右走走，感受一下脚步',
    '左下摇杆移动 · 上推跳跃\n先往右走走，感受一下脚步'), { id: 'p_s0' })
  .sign(260, 640, '按 V "灵魂出窍"看整片草原（再按 V 回来）', { id: 'p_s0b', size: 10 })
  .sign(60, 660, '💀 死了会回到这里——这是本关的「检查点」', { id: 'p_s0c', size: 11 })
  .sign(310, 560, '踩上石头看风景——你是要"跋山涉水"的化学物质！', { id: 'p_s1', size: 11 })
  // 出口：压力开关（首次详解在路标）→ 删除挡路墙 → 玩家走过去切场景
  .sign(1930, 660, '这是「开关」：\n①踩上就开——现在这个（站上去试试）\n②需要化学物质才能开（世界 2 见）', { id: 'p_sw' })
  .switch(2000, 678, { mode: 'pressure', deleteId: 'p_wall', id: 'p_gate_sw' })
  .floor(2124, 460, 16, 260, { id: 'p_wall' })
  .sign(2080, 620, '开关开了 = 墙消失 = 过去', { id: 'p_gate_s', size: 10 });

// ------- 世界 2 · 翡翠峡谷（1800×1000，氧气 18）：反应/收集/搭高/冰面 -------
M.scene('canyon', { worldW: 1800, worldH: 1000 })
  .floor(-80, 900, 228, 150, { id: 'c_l0' })
  .floor(432, 900, 328, 150, { id: 'c_l0b' })
  .floor(760, 900, 320, 150, { id: 'c_l1' })
  .floor(1180, 900, 700, 150, { id: 'c_l2' })
  .pool(160, 900, 260, 55, { volume: 220, solutes: { CuSO4: 30 }, gasHeight: 80, id: 'c_pool' })
  .sign(110, 855, '第一个「池子」：池子 = 溶液。\n跳进去看看身体会发生什么——看飘出的反应标签！', { id: 'c_s0' })
  .sign(120, 795, '反应成功！表面长出蓝色沉淀 Cu(OH)₂\n（碱 + 硫酸铜 → 蓝沉淀）', { id: 'c_s1', size: 10 })
  .sign(700, 855, '「Q 收集」：走进沉淀按 Q，收进物品栏\n（屏幕下方那一格；点格子可选中）', { id: 'c_s2' })
  .floor(1060, 740, 170, 16, { id: 'c_tower_top' })
  .floor(1060, 900, 22, 176, { id: 'c_tower_l' })
  .floor(1208, 900, 22, 176, { id: 'c_tower_r' })
  .switch(1150, 718, { mode: 'chemical', opening: 'Cu(OH)2', deleteId: 'c_wall', id: 'c_swCu' })
  .floor(1318, 560, 16, 360, { id: 'c_wall' })
  .sign(1100, 700, '第二种「开关」：要化学物质才能开。\n它头顶写着要什么（Cu(OH)₂）。\n怎么放：点物品栏选中 → 站开关旁按 Shift', { id: 'c_sw_s', size: 10 })
  .sign(1030, 855, '塔 160px 高跳不上去？\nShift 往脚下放沉淀把自己垫高——爬塔！', { id: 'c_tower_s' })
  .floor(1360, 900, 340, 150, { ice: true, id: 'c_ice' })
  .sign(1370, 855, '「冰面」：滑！沉淀放上去会自己溜走——\n在这搭不了高（放一把试试，看它跑）', { id: 'c_ice_s' });

// ------- 世界 3 · 炼丹台地（1600×800，氧气 18）：灯列/分解/焰色 -------------
M.scene('plateau', { worldW: 1600, worldH: 800 })
  .floor(-60, 700, 1720, 130, { id: 'd_floor' })
  .switch(120, 678, { mode: 'pressure', id: 'd_s1' })
  .lamp(220, 660, { autoOn: false, id: 'd_l1' })
  .sign(60, 640, '「灯」：用开关点燃（开关第①种）。\n站上开关→灯亮；离开→灯灭。\n粉末也可以放灯上（灯=加热台）', { id: 'd_s0', size: 10 })
  .switch(560, 678, { mode: 'pressure', id: 'd_s2' })
  .lamp(660, 660, { autoOn: false, id: 'd_l2' })
  .switch(760, 678, { mode: 'pressure', id: 'd_s3' })
  .lamp(860, 660, { autoOn: false, id: 'd_l3' })
  .sign(560, 620, '灯光小道：一盏接一盏点亮——往亮处走', { id: 'd_note1', size: 10 })
  .lamp(1080, 660, { autoOn: false, id: 'd_heat' })
  .switch(1000, 678, { mode: 'pressure', id: 'd_heat_sw' })
  .sign(980, 640, '把 Cu(OH)₂ 放灯上烤（Shift）：受热分解 → 黑色 CuO', { id: 'd_note2', size: 10 })
  .lamp(1280, 660, { autoOn: true, id: 'd_flame' })
  .deposit(1340, 690, { substance: 'CuSO4', mass: 8, id: 'd_cu' })
  .deposit(1380, 690, { substance: 'NaCl', mass: 8, id: 'd_na' })
  .sign(1260, 600, '「焰色反应」：粉末放上常燃灯 → 火焰变色！\nCuSO₄ 绿 · NaCl 黄——每种元素一种颜色。\n不消耗：移开就还原', { id: 'd_note3', size: 10 })
  .switch(1470, 678, { mode: 'chemical', opening: 'CuO', deleteId: 'd_wall', id: 'd_swCuO' })
  .floor(1524, 460, 16, 260, { id: 'd_wall' })
  .sign(1460, 600, '又见「化学开关」——它要 CuO。\n点物品栏选中 → Shift 放下', { id: 'd_s4', size: 10 });

// -------- 世界 4 · 深井实验室（1200×900，无氧）：测验① 产氢/气泡柱/探测器 ---
// 布局：地面中间一个深坑（跳下去=实验室）；坑底产 H₂ → 气泡柱把玩家托回地面
M.scene('well', { worldW: 1200, worldH: 900 })
  .floor(-60, 720, 480, 130, { id: 'w_l0' })            // 左地面（入口）
  .floor(720, 720, 540, 130, { id: 'w_l1' })            // 右地面（出口侧）
  .floor(420, 140, 18, 580, { id: 'w_wall_l' })         // 坑左壁
  .floor(702, 140, 18, 580, { id: 'w_wall_r' })         // 坑右壁
  .floor(420, 820, 20, 100, { id: 'w_floor2a' })
  .floor(680, 820, 40, 100, { id: 'w_floor2b' })        // 坑底（实验室）
  .block(450, 760, { substance: 'Zn', w: 40, h: 40, pushable: true, id: 'w_zn' })
  .pool(440, 820, 240, 46, { volume: 170, solutes: { HCl: 40 }, gasHeight: 140, id: 'w_hcl' })
  .sign(150, 660, '前方是「深坑」——跳下去！\n（坑底 = 实验室）', { id: 'w_s0' })
  .sign(440, 775, '「盐酸池」：酸！你是碱（NaOH），跳进去会掉血，别试。\n把 Zn 块推进池子！', { id: 'w_s1', size: 10 })
  .sign(470, 750, 'Zn + 2HCl → ZnCl₂ + H₂↑（产氢！看气泡柱）', { id: 'w_s2', size: 10 })

// 深井：出口墙不需要了（探测器亮了 → 走到右地面尽头即可）——删掉补丁
// （w_det 只负责触发检测与 showtime 横幅，出口是区域判定）

// 通用切场景轮询：玩家中心进入区域 → switchTo。
// 注意：**不做"开关当前开"判断**——出口的门就是"开关 deleteId 删的那面墙"：
// 墙在 → 玩家被挡在区域外；墙被删 → 玩家才进得来、走到区域即切场景。
// （若按"开关开着才算"，压力开关一离开就关，玩家走到出口时开关已关，永远切不过去。）
function exitLink(sceneName, x, y, w, h, target, spawn) {
  const sc = M.byName(sceneName);
  const poll = () => {
    const p = sc.player;
    if (p) {
      const cx = p.x + p.w / 2;
      const cy = p.y + p.h / 2;
      if (cx >= x && cx <= x + w && cy >= y && cy <= y + h) {
        M.switchTo(target, { spawn });
        return;
      }
    }
    sc.wait(0.15, poll);
  };
  poll();
}

// 跨场景"传送门"：玩家走进被激活的门 → 切场景（含回头路）
function portalLink(sceneName, portalId, target, spawn) {
  const sc = M.byName(sceneName);
  const gate = sc.byId[portalId];
  const poll = () => {
    const p = sc.player;
    if (p && gate) {
      const active = typeof gate._isActive === 'function' ? gate._isActive(sc) : true;
      if (active && p.x < gate.x + gate.w && p.x + p.w > gate.x && p.y < gate.y + gate.h && p.y + p.h > gate.y) {
        M.switchTo(target, { spawn });
        return;
      }
    }
    sc.wait(0.15, poll);
  };
  poll();
}

// 灯列接线：开关 → 灯（站上亮 / 离开灭）
const wireLamp = (sceneName, swId, lampId) => {
  const sw = M.byId(sceneName, swId);
  const lamp = M.byId(sceneName, lampId);
  if (sw && lamp) {
    sw.onOpen(() => lamp.ignite());
    sw.onClose(() => lamp.extinguish());
  }
};

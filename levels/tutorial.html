<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chezzle · 新手引导（新手教程关）</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e28; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { background: #0b0e28; box-shadow: 0 0 60px rgba(120,90,220,0.25); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="../dist/chezzle.js"></script>
<script src="../docs/plugins/tutorial.js"></script>
<script src="../docs/plugins/checkpoint.js"></script>
<script src="report.js"></script>
<script>
// ============================================================================
// Chezzle 新手教程关 · 八章横向大世界（5120×800，每章一个 640 宽的房间）
// ----------------------------------------------------------------------------
// 章节：
//   ① 开场房：打招呼横幅 + 操作教学（含移动端差异）+ 鸟瞰 + 延迟出现演示
//   ② 收集房：离子反应（NaOH+CuSO4→Cu(OH)2↓）+ 收集 Q + 沉淀搭高 + 化学开关
//   ③ 火房：压力开关点酒精灯 + 加热分解（Cu(OH)2→CuO）+ 焰色反应（Na黄/Cu绿）
//   ④ 气体房【小测验①】：Zn 推进盐酸池产 H2 → 气泡柱托升 → 气体探测器开门
//   ⑤ 爆炸房【小测验②】：Na 块推进水池 → 亲手爆炸 → 产 H2 → 探测器开门
//      （附带教学：爆炸切断绳子）
//   ⑥ 溶液房：CuO+HCl→CuCl2 → 提取器提粉 → 钥匙开门（永久锁）+ 烧杯/滴管进阶
//   ⑦ 泡泡房：催化制氧（H2O2+MnO2）+ 燃烧（C+O2）+ 喷灯高温还原（加餐）
//   ⑧ 终局：压力开关开门 → 走进光里通关
// 核心机制串（新手一个不漏）：
//   移动/跳跃/收集/放置/搭高/开关(压力/化学/钥匙)/灯/喷灯/焰色反应/气体/集气瓶/
//   气体探测器/爆炸/爆炸断绳/气泡柱/催化/燃烧/提取器/烧杯/滴管/传送门/延迟出现/
//   条件提示按钮/鸟瞰/重开/检查点复活/移动端触控差异
// ============================================================================
const canvas = document.getElementById('game');
canvas.width = 1100;
canvas.height = 700;

// 设备差异：触屏（手机/平板）与键盘的文案自动切换
const TOUCH = (typeof navigator !== 'undefined' && (navigator.maxTouchPoints || 0) > 0) || /[?&]touch=1/.test(location.search || '');
const TXT = (d, m) => (TOUCH ? m : d);

const L = new Chezzle.LevelBuilder(canvas, { worldW: 5120, worldH: 800 });

// 每章一个房间：640 宽。墙 = 竖地板（高到世界顶，防翻越/绕路）。
const WALL = 26;
const ROOM = 640;
const GROUND = 720;

L
  // ===========================================================================
  // ① 开场房（0..640）：打招呼 + 操作教学
  // ===========================================================================
  .floor(-WALL, 0, WALL, 800, { id: 'wL0' })
  .floor(0, GROUND, ROOM, 80, { id: 'f0' })
  .floor(ROOM - WALL, 0, WALL, 800, { id: 'wR0' })
  .player(80, GROUND - 60, { substance: 'NaOH', mass: 30, id: 'player1', appearDelay: 1.2 })
  .sign(120, 690, TXT(
    'A/D 移动 · 空格跳跃 · R 重开\nQ 收集 · Shift 放置 · C 拾取 · X 倒出',
    '左下摇杆移动（上推=跳）\n右下四键：Q 收集 · ⇧ 放置 · C 拾取 · X 倒出'),
    { id: 's0a' })
  .sign(120, 640, '按 V 灵魂出窍看整关（再按 V 回来）\n左上角 💡 按钮=关卡提示', { id: 's0b', size: 10 })
  .sign(470, 690, '我是 3 秒后才出现的路标\n物体可以设置「延迟出现」', { id: 'sLate', appearDelay: 3, size: 10 })
  .portal(ROOM - 40, 640, { color: '#7fe0ff', id: 'p0a' })

  // ===========================================================================
  // ② 收集房（640..1280）：离子反应 + 收集 + 搭高 + 化学开关
  // ===========================================================================
  .floor(ROOM, GROUND, 108, 80, { id: 'f1' })                    // 池子处地板断开：块/玩家才能沉进液体
  .floor(ROOM + 372, GROUND, 268, 80, { id: 'f1b' })
  .floor(ROOM * 2 - WALL, 0, WALL, 800, { id: 'wR1' })
  .portal(ROOM + WALL + 0, 640, { color: '#7fe0ff', id: 'p0b' })
  .pool(ROOM + 120, GROUND, 240, 55, { volume: 200, solutes: { CuSO4: 25 }, gasHeight: 80, id: 'poolCu' })
  .sign(ROOM + 60, 685, '跳进蓝色池子！\nNaOH + CuSO4 → Cu(OH)2↓（蓝色沉淀）\n按 Q 把它收进物品栏', { id: 's1a' })
  .sign(ROOM + 66, 640, '（你是 NaOH 本人——这波叫"以碱换碱"）', { id: 's1b', size: 10 })
  .floor(ROOM + 440, 560, 160, 14, { id: 'plat1' })          // 高台：160px 高，跳不上去
  .switch(ROOM + 460, 538, { mode: 'chemical', opening: 'Cu(OH)2', id: 'swR1' })
  .portal(ROOM + 520, 480, { color: '#7fe0ff', switchId: 'swR1', id: 'p1a' })
  .sign(ROOM + 420, 655, '高台够不着？往脚下放沉淀垫高自己！\n（Shift 放置）把 Cu(OH)2 放上开关→传送门亮', { id: 's1c', size: 10 })

  // ===========================================================================
  // ③ 火房（1280..1920）：灯 + 加热分解 + 焰色反应
  // ===========================================================================
  .floor(ROOM * 2, GROUND, ROOM, 80, { id: 'f2' })
  .floor(ROOM * 3 - WALL, 0, WALL, 800, { id: 'wR2' })
  .portal(ROOM * 2 + WALL + 0, 640, { color: '#7fe0ff', id: 'p1b' })
  .switch(ROOM * 2 + 80, 696, { mode: 'pressure', id: 'swLamp' })
  .lamp(ROOM * 2 + 150, 680, { autoOn: false, id: 'lamp1' })
  .sign(ROOM * 2 + 66, 660, '站上金色开关 → 酒精灯点燃\n把 Cu(OH)2 放灯上烤：分解成 CuO', { id: 's2a', size: 10 })
  .block(ROOM * 2 + 240, 660, { substance: 'Cu(OH)2', mass: 30, pushable: true, id: 'cuoh2' })
  .lamp(ROOM * 2 + 340, 680, { autoOn: true, id: 'lampF' })   // 焰色演示灯（常燃）
  .deposit(ROOM * 2 + 400, 694, { substance: 'CuSO4', mass: 8, id: 'depCu' })
  .sign(ROOM * 2 + 320, 640, '焰色反应：把 CuSO4 放灯上 → 火焰变绿！\n把 Na2SO4（池里收的）放上 → 变黄！\n不消耗，移开即恢复', { id: 's2b', size: 10 })
  .switch(ROOM * 2 + 540, 696, { mode: 'chemical', opening: 'CuO', id: 'swR2' })
  .portal(ROOM * 3 - 40, 640, { color: '#7fe0ff', switchId: 'swR2', id: 'p2a' })
  .sign(ROOM * 2 + 500, 660, '把烤出的 CuO 放上开关 → 下一章开门！', { id: 's2c', size: 10 })

  // ===========================================================================
  // ④ 气体房（1920..2560）【小测验①】：金属+酸 → H2 → 探测器 → 传送门
  // ===========================================================================
  .floor(ROOM * 3, GROUND, 108, 80, { id: 'f3' })
  .floor(ROOM * 3 + 332, GROUND, 268, 80, { id: 'f3b' })
  .floor(ROOM * 4 - WALL, 0, WALL, 800, { id: 'wR3' })
  .portal(ROOM * 3 + WALL + 0, 640, { color: '#7fe0ff', id: 'p2b' })
  .block(ROOM * 3 + 70, 660, { substance: 'Zn', w: 40, h: 40, pushable: true, id: 'zn' })
  .pool(ROOM * 3 + 120, GROUND, 200, 55, { volume: 160, solutes: { HCl: 40 }, gasHeight: 520, id: 'poolHCl' })
  .sign(ROOM * 3 + 60, 685, '这是盐酸池！你是 NaOH——进去会"互相伤害"\n（中和反应=掉血，别试）\n把 Zn 块推进池子！', { id: 's3a', size: 10 })
  .floor(ROOM * 3 + 240, 400, 120, 14, { id: 'platGas' })     // 气柱托升落点
  .sign(ROOM * 3 + 210, 445, '站上 H2 气泡柱，飞上去！\n（气体比空气轻 → 托着你）', { id: 's3b', size: 10 })
  .gasbottle(ROOM * 3 + 330, 680, { id: 'bottle1' })
  .sign(ROOM * 3 + 310, 645, '集气瓶（进阶）：C 拾起\n站气泡旁按住 C 集气 · 按住 X 通气', { id: 's3c', size: 10 })
  .gasdetector(ROOM * 3 + 420, 690, { gas: 'H2', threshold: 0.25, id: 'detH2' })
  .portal(ROOM * 4 - 40, 640, { color: '#7fe0ff', switchId: 'detH2', id: 'p3a' })
  .sign(ROOM * 3 + 400, 660, '气体探测器：反应产出的 H2 超标 → 开传送门\n（小测验①：动手产氢！）', { id: 's3d', size: 10 })

  // ===========================================================================
  // ⑤ 爆炸房（2560..3200）【小测验②】：Na 遇水爆炸 → H2 → 探测器 → 传送门
  // ===========================================================================
  .floor(ROOM * 4, GROUND, 168, 80, { id: 'f4' })
  .floor(ROOM * 4 + 412, GROUND, 228, 80, { id: 'f4b' })
  .floor(ROOM * 5 - WALL, 0, WALL, 800, { id: 'wR4' })
  .portal(ROOM * 4 + WALL + 0, 640, { color: '#7fe0ff', id: 'p3b' })
  .block(ROOM * 4 + 140, 660, { substance: 'Na', w: 24, h: 24, pushable: true, id: 'na' })
  .pool(ROOM * 4 + 180, GROUND, 220, 55, { volume: 200, gasHeight: 120, id: 'poolWater' })
  .sign(ROOM * 4 + 96, 685, '把 Na 块推进水池——\nNa + H2O → 爆炸！（还产 H2）\n推完快跑，站远点看烟花', { id: 's4a', size: 10 })
  .sign(ROOM * 4 + 300, 560, '看天上：爆炸会切断附近的绳子！\n（悬挂物会掉下来）', { id: 's4b', size: 10 })
  .gasdetector(ROOM * 4 + 400, 690, { gas: 'H2', threshold: 0.25, id: 'detH2b' })
  .portal(ROOM * 5 - 40, 640, { color: '#7fe0ff', switchId: 'detH2b', id: 'p4a' })
  .sign(ROOM * 4 + 380, 660, '爆炸的 H2 触发探测器 → 传送门亮了！\n（小测验②：爆炸→气体→探测器→进门）', { id: 's4c', size: 10 })

  // ===========================================================================
  // ⑥ 溶液房（3200..3840）：溶解 → 提取器 → 钥匙（永久锁）
  // ===========================================================================
  .floor(ROOM * 5, GROUND, 108, 80, { id: 'f5' })
  .floor(ROOM * 5 + 332, GROUND, 268, 80, { id: 'f5b' })
  .floor(ROOM * 6 - WALL, 0, WALL, 800, { id: 'wR5' })
  .portal(ROOM * 5 + WALL + 0, 640, { color: '#7fe0ff', id: 'p4b' })
  .block(ROOM * 5 + 80, 660, { substance: 'CuO', w: 40, h: 40, pushable: true, id: 'cuo' })
  .pool(ROOM * 5 + 120, GROUND, 200, 55, { volume: 160, solutes: { HCl: 40 }, id: 'poolHCl2' })
  .sign(ROOM * 5 + 60, 685, '把 CuO 块推进酸池：\nCuO + 2HCl → CuCl2 + H2O（溶液变蓝）', { id: 's5a', size: 10 })
  .extractor(ROOM * 5 + 280, 710, { poolId: 'poolHCl2', switchId: 'swExt', rate: 1.2, id: 'ext1' })
  .switch(ROOM * 5 + 350, 696, { mode: 'pressure', id: 'swExt' })
  .sign(ROOM * 5 + 240, 660, '站上开关 → 提取器把溶液里的 CuCl2\n提成粉末掉出来！Q 收起来', { id: 's5b', size: 10 })
  .key(ROOM * 5 + 470, 696, { opening: 'CuCl2', w: 70, id: 'key1' })
  .portal(ROOM * 6 - 40, 640, { color: '#7fe0ff', switchId: 'key1', id: 'p5a' })
  .sign(ROOM * 5 + 430, 660, '把 CuCl2 粉放进钥匙（Shift）\n钥匙是永久锁：不消耗，一次解锁终身有效', { id: 's5c', size: 10 })
  .beaker(ROOM * 5 + 320, 650, { w: 60, h: 70, volume: 30, id: 'bk1' })
  .dropper(ROOM * 5 + 420, 620, { substance: 'NaOH', id: 'dp1' })
  .sign(ROOM * 5 + 300, 575, '进阶：烧杯 C 吸液 X 倒出\n滴管吸液后点击场景滴出——\n把 NaOH 滴进 CuCl2 池：变回 Cu(OH)2！', { id: 's5d', size: 10 })

  // ===========================================================================
  // ⑦ 泡泡房（3840..4480）：催化制氧 + 燃烧 + 喷灯还原（加餐）
  // ===========================================================================
  .floor(ROOM * 6, GROUND, 88, 80, { id: 'f6' })
  .floor(ROOM * 6 + 312, GROUND, 328, 80, { id: 'f6b' })
  .floor(ROOM * 7 - WALL, 0, WALL, 800, { id: 'wR6' })
  .portal(ROOM * 6 + WALL + 0, 640, { color: '#7fe0ff', id: 'p5b' })
  .block(ROOM * 6 + 60, 660, { substance: 'MnO2', w: 30, h: 30, pushable: true, id: 'mno2' })
  .pool(ROOM * 6 + 100, GROUND, 200, 55, { volume: 150, solutes: { H2O2: 80 }, gasHeight: 300, id: 'poolH2O2' })
  .sign(ROOM * 6 + 60, 685, '把 MnO2 推入双氧水池：催化分解！\n2H2O2 → 2H2O + O2↑（看泡泡）', { id: 's6a', size: 10 })
  .block(ROOM * 6 + 300, 660, { substance: 'C', w: 30, h: 30, pushable: true, id: 'cb' })
  .lamp(ROOM * 6 + 340, 680, { autoOn: true, id: 'lampBurn' })
  .sign(ROOM * 6 + 200, 645, '把 C 放上灯 → 点燃燃烧！\nC + O2 → CO2（消耗大气里的氧）', { id: 's6b', size: 10 })
  .switch(ROOM * 6 + 380, 696, { mode: 'pressure', id: 'swHot' })
  .blastlamp(ROOM * 6 + 460, 710, { w: 130, h: 10, autoOn: false, id: 'lampHot' })
  .sign(ROOM * 6 + 360, 660, '加餐：喷灯是高温版酒精灯\n灯上已备好 CuO+C → 还原出 Cu\n（站开关点燃，收走铜当纪念品）', { id: 's6c', size: 10 })
  .switch(ROOM * 6 + 590, 696, { mode: 'pressure', id: 'swR6' })
  .portal(ROOM * 7 - 40, 640, { color: '#7fe0ff', switchId: 'swR6', id: 'p6a' })
  .sign(ROOM * 6 + 560, 660, '站上开关开门 → 最终章！', { id: 's6d', size: 10 })

  // ===========================================================================
  // ⑧ 终局（4480..5120）：压力开关开通关口
  // ===========================================================================
  .floor(ROOM * 7, GROUND, ROOM, 80, { id: 'f7' })
  .floor(ROOM * 8, 0, WALL, 800, { id: 'wR7' })
  .portal(ROOM * 7 + WALL + 0, 640, { color: '#7fe0ff', id: 'p6b' })
  .sign(ROOM * 7 + 90, 690, '毕业小考：站上开关，走进光里', { id: 's7a' })
  .sign(ROOM * 7 + 90, 645, '你这一路学会了：走跳 / 收集 / 放置 / 搭高\n开关 / 灯 / 焰色 / 气体 / 爆炸 / 提取 / 钥匙…', { id: 's7b', size: 10 })
  .switch(ROOM * 7 + 340, 696, { mode: 'pressure', id: 'swWin' })
  .door(ROOM * 7 + 440, 640, 44, 80, { id: 'winDoor' })
;

const scene = L.build();

// 延迟出现（tutorial 插件字段）：Obj 构造是字段白名单，enhance 参数要构造后赋值
// （与编辑器导出同一姿势：scene.byId['x'].appearDelay = 秒数）
scene.byId['player1'].appearDelay = 1.2;
scene.byId['sLate'].appearDelay = 3;

// ---------------------------------------------------------------------------
// 开场横幅剧本（tutorial 插件排期：游戏时间秒）。玩家 appearDelay 1.2s →
// 先打招呼、人再"啪"地出现——顺便演示"延迟出现"。
// ---------------------------------------------------------------------------
scene.tutorialBanners = [
  { at: 0.5, dur: 2.4, text: '嘿！你好！' },
  { at: 3.2, dur: 2.4, text: '欢迎来到 Chezzle！' },
  { at: 6.0, dur: 2.6, text: '一个（物理意义上的）化学冒险' },
  { at: 9.0, dur: 2.6, text: '你现在是一团 30 克的氢氧化钠' },
  { at: 12.0, dur: 3.2, text: TXT(
    'A/D 移动 · 空格跳（往右走两步试试）',
    '左下摇杆移动 · 上推跳跃（先走两步试试）') },
];

// ---------------------------------------------------------------------------
// 章节横幅：玩家走进某章房间 → 自动弹一章标题（互动感：每章有"仪式感"）
// ---------------------------------------------------------------------------
const chapterBanners = [
  { id: 1, x0: ROOM, x1: ROOM * 2, title: '第二章 · 收集与搭高', sub: '蓝池出宝藏，化学怪人的梯子是沉淀' },
  { id: 2, x0: ROOM * 2, x1: ROOM * 3, title: '第三章 · 火与颜色', sub: '炼丹房：烤一烤，火焰会变色' },
  { id: 3, x0: ROOM * 3, x1: ROOM * 4, title: '第四章 · 气体侦探', sub: '小测验①：产 H2，让探测器开门' },
  { id: 4, x0: ROOM * 4, x1: ROOM * 5, title: '第五章 · 爆炸课堂', sub: '小测验②：亲手炸一次！（站远点）' },
  { id: 5, x0: ROOM * 5, x1: ROOM * 6, title: '第六章 · 溶液工坊', sub: '把铜从酸里提出来' },
  { id: 6, x0: ROOM * 6, x1: ROOM * 7, title: '第七章 · 泡泡与火', sub: '轻松环节：看泡泡，玩火' },
  { id: 7, x0: ROOM * 7, x1: ROOM * 8, title: '最终章 · 毕业考试', sub: '走过那扇门，你就是化学怪人' },
];
const chShown = new Set();
const watchChapter = () => {
  const p = scene.player;
  if (p && !p.hidden && p.w > 0) {
    const cx = p.x + p.w / 2;
    for (const c of chapterBanners) {
      if (!chShown.has(c.id) && cx >= c.x0 && cx < c.x1) {
        chShown.add(c.id);
        scene.showBanner(c.title + '\n' + c.sub, 3.2);
      }
    }
  }
  scene.wait(0.3, watchChapter);
};
watchChapter();

// ---------------------------------------------------------------------------
// 条件提示（💡 按钮）：第一条无条件（教"提示按钮"本身），之后按章节区域触发
// ---------------------------------------------------------------------------
L.tips([
  { text: '左上角这个 💡 就是提示按钮！点一下看看。\n（关卡作者把提示设好条件，满足时按钮就会出现——你刚学会了看提示）', when: { mode: 'and', items: [] } },
  { text: '本章目标：跳进蓝池 → 按 Q 收集 Cu(OH)2 → 高台下 Shift 放沉淀垫高 → 爬上高台把 Cu(OH)2 放进开关 → 走进亮的传送门。', when: { mode: 'and', items: [{ type: 'pos', x: ROOM, y: 0, w: ROOM, h: 800 }] } },
  { text: '本章目标：站上金色开关点燃酒精灯 → 把 Cu(OH)2 放灯上烤成 CuO → 顺手玩下焰色反应 → 把 CuO 放进开关。', when: { mode: 'and', items: [{ type: 'pos', x: ROOM * 2, y: 0, w: ROOM, h: 800 }] } },
  { text: '小测验①：把 Zn 块推进盐酸池 → H2 冒出来 → 探测器检测到 → 传送门亮。站上气泡柱还能飞！', when: { mode: 'and', items: [{ type: 'pos', x: ROOM * 3, y: 0, w: ROOM, h: 800 }] } },
  { text: '小测验②：把 Na 块推进水池 → 爆炸！→ 爆炸产生的 H2 让探测器开门 → 进传送门。（站远点）', when: { mode: 'and', items: [{ type: 'pos', x: ROOM * 4, y: 0, w: ROOM, h: 800 }] } },
  { text: '本章目标：CuO 块推进酸池 → 站上提取器开关提 CuCl2 粉 → 收集后放进钥匙 → 传送门亮。', when: { mode: 'and', items: [{ type: 'pos', x: ROOM * 5, y: 0, w: ROOM, h: 800 }] } },
  { text: '本章随便玩：MnO2 进双氧水池看泡泡 · C 放灯上烧 · 喷灯还原铜。玩够了站右边开关开门。', when: { mode: 'and', items: [{ type: 'pos', x: ROOM * 6, y: 0, w: ROOM, h: 800 }] } },
  { text: '毕业考：站上开关 → 走进门。门一过，你就是正式化学怪人！', when: { mode: 'and', items: [{ type: 'pos', x: ROOM * 7, y: 0, w: ROOM, h: 800 }] } },
]);

// ---------------------------------------------------------------------------
// 接线：开关 → 灯（传送门用 switchId 属性自动生效，无需接线）
// ---------------------------------------------------------------------------
scene.byId['swLamp'].onOpen(() => scene.byId['lamp1'].ignite());
scene.byId['swLamp'].onClose(() => scene.byId['lamp1'].extinguish());
scene.byId['swHot'].onOpen(() => scene.byId['lampHot'].ignite());
scene.byId['swHot'].onClose(() => scene.byId['lampHot'].extinguish());
scene.byId['swWin'].onOpen(() => scene.byId['winDoor'].open());

// 喷灯上预置还原原料（加餐区）
scene.byId['lampHot'].addPrecipitate('CuO', 6);
scene.byId['lampHot'].addPrecipitate('C', 3);

// 爆炸房：绳子吊着 Zn 块（示范"爆炸切断绳子"）
const znDrop = new Chezzle.Block({ x: ROOM * 4 + 300, y: 300, w: 30, h: 30, substance: 'Zn', id: 'zndrop' });
scene.addObject(znDrop);
scene.addObject(new Chezzle.Rope({
  x: ROOM * 4 + 315, y: 200, length: 340,
  anchor: { fixed: { x: ROOM * 4 + 315, y: 200 } },
  hanging: znDrop,
  id: 'ropeDemo',
}));

// ---------------------------------------------------------------------------
// 检查点：每章一个（区域=整房，复活点=房入口安全地）
// ---------------------------------------------------------------------------
const CHECKPOINTS = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => ({
  id: 'ch' + i,
  x: i * ROOM, y: 0, w: ROOM, h: 800,
  sx: i * ROOM + 90, sy: GROUND - 6,
}));

// ---------------------------------------------------------------------------
// 插件注入：新手引导（横幅+延迟出现）+ 检查点（死亡复活）
// ---------------------------------------------------------------------------
Chezzle.Plugin.inject(scene, [
  { name: 'tutorial' },
  {
    name: 'checkpoint',
    cfg: {
      spawns: CHECKPOINTS,
      texts: [
        '复活！化学家从不回头看爆炸',
        '没事，NaOH 还有很多（30 克而已）',
        '刚才那是教学的一部分（才怪）',
        '回来重走！这次记得看路标',
      ],
    },
  },
]);

// 通关彩蛋横幅（status=win 后 time 冻结，横幅停在画面上）
scene.on('win', () => scene.showBanner('🎉 恭喜通关！\n你已经是正式的化学怪人了', 999));

L.start();
// 通关上报（选关系统：记录 tutorial + 弹浮层）
ChezzleReport.bind(scene, 'tutorial');
</script>
</body>
</html>

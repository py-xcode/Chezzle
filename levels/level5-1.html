<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Chezzle 关卡</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e28; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { background: #0b0e28; box-shadow: 0 0 60px rgba(120,90,220,0.25); }
</style>
</head>
<body>
<!-- 启动/加载动画：与选关页"进入关卡"过场同款（见 levels/boot.js；导出到 levels/ 下时直接可用） -->
<script src="boot.js"></script>
<canvas id="game"></canvas>
<script src="../prefs.js?vmvwagucl"></script>
<script src="../audio.js?vmvwagucl"></script>
<script src="../dist/chezzle.js?vmvwagucl"></script>

<script src="report.js"></script>
<script>
const canvas = document.getElementById('game');
Chezzle.fitCanvasToWindow(canvas);
window.addEventListener('resize', () => Chezzle.fitCanvasToWindow(canvas));
const L = new Chezzle.LevelBuilder(canvas, { worldW: 3000, worldH: 1200 });
L
  // 调试模式：打开本关时 URL 加 ?debug=1（.debugmode() 已废弃，导出仅留提示）
  .floor(254, 842, 283, 146, { id: 'floor1' })
  .player(332, 734, { substance: 'Fe', mass: 30, id: 'player1' })
  .pool(528, 843, 149, 61, { volume: 1000, solutes: {"HCl":1000}, id: 'pool1' })
  .gastube(509, 760, { inId: 'pool1', outIds: ["pool2"], id: 'gastube1' })
  .floor(671, 845, 529, 128, { id: 'floor3' })
  .pool(1193, 847, 129, 69, { volume: 515, solutes: {"H2S":50,"HCl":10}, id: 'pool2' })
  .block(1047, 751, { substance: 'KClO3', w: 95, h: 95, id: 'block1' })
  .floor(1316, 848, 180, 117, { id: 'floor4' })
  .block(784, 750, { substance: 'BaCl2', w: 90, h: 90, id: 'block2' })
  .extractor(1322, 831, { w: 37, h: 14, poolId: 'pool2', rate: 0.25, id: 'extractor1' })
  .switch(1379, 827, { mode: 'chemical', opening: 'FeCl3', openId: 'portal4', id: 'switch1' })
  .portal(938, 786, { w: 44, h: 64, color: '#c78bff', uses: 1, group: '1', id: 'portal1' })
  .floor(257, 462, 618, 77, { id: 'floor5' })
  .floor(1099, 460, 433, 75, { id: 'floor6' })
  .floor(1106, 175, 423, 44, { id: 'floor7' })
  .portal(1292, 106, { w: 44, h: 64, color: '#c78bff', uses: 1, group: '1', id: 'portal2' })
  .portal(1429, 110, { w: 44, h: 64, color: '#ffb340', switchId: 'switch1', group: '2', id: 'portal3' })
  .portal(1439, 779, { w: 44, h: 64, color: '#ffb340', switchId: 'switch1', group: '2', id: 'portal4' })
  .floor(805, 181, 140, 36, { id: 'floor9' })
  .elepool(941, 177, 170, 60, { volume: 410, solutes: {"NaOH":20}, switchId: 'switch2', id: 'elepool1' })
  .switch(1118, 151, { mode: 'pressure', id: 'switch2' })
  .floor(805, 209, 32, 257, { id: 'floor10' })
  .gastube(651, 94, { inId: 'elepool1', outIds: ["gaschamber1"], id: 'gastube2' })
  .gaschamber(409, 211, 255, 273, { gases: {"NH3":2000}, id: 'gaschamber1' })
  .gasdetector(596, 436, { gas: 'N2', threshold: 0.5, deleteId: 'floor10', id: 'gasdetector1' })
  .pool(865, 458, 246, 48, { volume: 380, solutes: {"AgNO3":20}, id: 'pool3' })
  .extractor(1116, 449, { w: 36, h: 14, poolId: 'pool3', rate: 0.25, id: 'extractor2' })
  .lamp(1181, 424, { autoOn: false, id: 'lamp1' })
  .switch(1238, 436, { mode: 'chemical', opening: 'NH4NO3', igniteId: 'lamp1', id: 'switch3' })
  .key(1336, 426, { opening: 'FeS', openId: 'door1', id: 'key1' })
  .door(1404, 379, 64, 83, { id: 'door1' })
  .gaschamber(1182, 786, 149, 125, { id: 'gaschamber2' })
;

const scene = L.build();
scene.atmosphere.preset({}); // 关卡大气
scene.applyAppearDelays(); // 延迟出现

// ⚡ 接线（示例，按需取消注释）：
// scene.byId['sw'].onOpen(() => scene.byId['lamp'].ignite());
// scene.byId['sw'].onClose(() => scene.byId['lamp'].extinguish());
// scene.byId['key'].onOpen(() => scene.byId['door'].open());
// scene.atmosphere.add('CO2', 8); // 可选：初始大气 CO2（碳化玩法）

L.start();
// ChezzleReport.bind(scene, 'H-1'); // 选关系统：填上关卡 id 后取消注释（见 levels/levels.js）
</script>
</body>
</html>

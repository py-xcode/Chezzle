<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Chezzle 关卡</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e28; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { background: #0b0e28; box-shadow: 0 0 60px rgba(120,90,220,0.25); }
</style>
</head>
<body>
<!-- 启动/加载动画：与选关页"进入关卡"过场同款（见 levels/boot.js；导出到 levels/ 下时直接可用） -->
<script src="boot.js"></script>
<canvas id="game"></canvas>
<script src="../prefs.js?vmvwagucl"></script>
<script src="../audio.js?vmvwagucl"></script>
<script src="../dist/chezzle.js?vmvwagucl"></script>

<script src="report.js"></script>
<script>
const canvas = document.getElementById('game');
Chezzle.fitCanvasToWindow(canvas);
window.addEventListener('resize', () => Chezzle.fitCanvasToWindow(canvas));
const L = new Chezzle.LevelBuilder(canvas, { worldW: 1500, worldH: 800 });
L
  // 调试模式：打开本关时 URL 加 ?debug=1（.debugmode() 已废弃，导出仅留提示）
  .floor(16, 703, 296, 50, { id: 'floor1' })
  .player(45, 580, { substance: 'Fe2O3', mass: 30, id: 'player1' })
  .blastlamp(182, 665, { autoOn: true, highTemp: true, id: 'blastlamp1' })
  .pool(304, 703, 260, 73, { volume: 200, solutes: {"HCl":100}, id: 'pool1' })
  .floor(352, 517, 250, 21, { id: 'floor2' })
  .floor(16, 337, 369, 84, { id: 'floor3' })
  .pool(378, 337, 190, 57, { volume: 200, solutes: {}, id: '2' })
  .floor(352, 425, 20, 96, { id: 'floor4' })
  .block(437, 465, { substance: 'K', w: 50, h: 50, id: 'block1' })
  .block(441, 576, { substance: 'NaClO', w: 50, h: 50, id: 'block2' })
  .floor(558, 702, 190, 50, { id: 'floor5' })
  .block(689, 649, { substance: 'NaOH', w: 50, h: 50, noLift: true, id: 'block3' })
  .floor(580, 396, 20, 126, { id: 'floor6' })
  .pool(740, 699, 244, 63, { volume: 200, solutes: {"NH3·H2O":1}, gasHeight: 850, id: 'pool3' })
  .floor(563, 337, 174, 64, { id: 'floor7' })
  .extractor(263, 321, { w: 50, h: 14, poolId: 2, rate: 0.25, id: 'extractor1' })
  .portal(123, 271, { w: 44, h: 64, color: '#c78bff', uses: 2, group: 'g5124', id: 'portal1' })
  .portal(386, 454, { w: 44, h: 64, color: '#c78bff', uses: 2, group: 'g5124', id: 'portal3' })
  .portal(517, 451, { w: 44, h: 64, color: '#2bc001', uses: 1, group: 'g1580', id: 'portal4' })
  .portal(335, 272, { w: 44, h: 64, color: '#2bc001', uses: 1, group: 'g1580', id: 'portal2' })
  .floor(975, 702, 260, 50, { id: 'floor8' })
  .floor(907, 342, 280, 58, { id: 'floor9' })
  .gasdetector(579, 328, { gas: 'H2', threshold: 0.1, opening: 'H2', id: 'gasdetector1' })
  .switch(997, 322, { mode: 'chemical', opening: 'Al2O3', and: 'switch2', id: 'switch1' })
  .switch(1077, 320, { mode: 'chemical', opening: 'FeCl2', id: 'switch2' })
  .portal(678, 269, { w: 44, h: 64, color: '#d8b32c', switchId: 'gasdetector1', group: 'g5312', id: 'portal5' })
  .portal(941, 282, { w: 44, h: 64, color: '#d8b32c', switchId: 'gasdetector1', group: 'g5312', id: 'portal6' })
  .portal(1138, 277, { w: 44, h: 64, color: '#1e77eb', switchId: 'switch1', group: 'g7890', id: 'portal7' })
  .floor(16, 162, 240, 27, { id: 'floor10' })
  .portal(49, 97, { w: 44, h: 64, color: '#1e77eb', switchId: 'switch1', group: 'g7890', id: 'portal8' })
  .switch(147, 140, { mode: 'chemical', opening: 'Fe(OH)3', igniteId: 'lamp1', id: 'switch3' })
  .lamp(208, 127, { autoOn: false, id: 'lamp1' })
  .pool(249, 162, 173, 43, { volume: 200, solutes: {"HClO":10}, id: 'pool4' })
  .floor(415, 162, 150, 35, { id: 'floor11' })
  .gasdetector(426, 141, { gas: 'O2', threshold: 0.5, opening: 'O2', deleteId: 'floor12', id: 'gasdetector2' })
  .floor(483, -38, 20, 200, { id: 'floor12' })
  .block(516, 125, { substance: 'Cu', w: 25, h: 30, id: 'block4' })
  .pool(559, 162, 182, 30, { volume: 200, solutes: {"HNO3":5}, id: 'pool5' })
  .floor(736, 163, 309, 43, { id: 'floor13' })
  .extractor(768, 146, { w: 50, h: 14, poolId: 'pool5', rate: 0.25, id: 'extractor2' })
  .key(869, 140, { opening: 'CuCl2', openId: 'door1', id: 'key1' })
  .door(928, 92, 50, 70, { id: 'door1' })
  .sign(759, 639, '3NaClO + 2NH₃ → 3NaCl + N₂↑ + 3H₂O', { id: 'sign2' })
  .extractor(570, 685, { w: 50, h: 14, poolId: 'pool1', rate: 1, id: 'extractor3' })
  .floor(904, 242, 20, 99, { id: 'floor14' })
  .sign(1265, 777, 'enjoy!', { id: 'sign3' })
  .floor(1020, -68, 20, 231, { id: 'floor15' })
  .reaction('NaClO+NH4OH->NaCl+N2+H2O')
;

const scene = L.build();
scene.byId['blastlamp1'].addPrecipitate('Al', 1);
scene.addObject(new Chezzle.Rope({ x: 456, y: 494, length: 100, anchor: { fixed: { x: 456, y: 494 } }, hanging: scene.byId['block2'] }));
scene.atmosphere.preset({}); // 关卡大气
scene.applyAppearDelays(); // 延迟出现

// ⚡ 接线（示例，按需取消注释）：
// scene.byId['sw'].onOpen(() => scene.byId['lamp'].ignite());
// scene.byId['sw'].onClose(() => scene.byId['lamp'].extinguish());
// scene.byId['key'].onOpen(() => scene.byId['door'].open());
// scene.atmosphere.add('CO2', 8); // 可选：初始大气 CO2（碳化玩法）

L.start();
ChezzleReport.bind(scene, 'He-1'); // 选关系统：通关上报
</script>
</body>
</html>

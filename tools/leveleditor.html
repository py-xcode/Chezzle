  if ((idx == null || !state.placed[idx]) && state.sel.size <= 1) { box.innerHTML = '<div class="empty">选中一个物体编辑属性</div>'; return; }
  const item = state.placed[idx];
  const e = byType[item.type];
  // 多选提示：主选物体照常编辑属性 + 批量修改区（全选/Ctrl+点击 选中多个 → 批量改延迟/淡入）
  const multi = state.sel.size > 1
    ? `<div class="empty" style="margin-bottom:8px;line-height:1.7">已选中 <b style="color:#7fe0ff">${state.sel.size}</b> 个物体<br>拖动任一物体整组平移 · Ctrl+点击增减 · Delete 删除整组 · Ctrl+A 全选<br><div style="margin-top:5px">
        <b style="color:#9fe8ff">批量</b>：延迟出现 <input type="number" class="batchDel" step="0.1" min="0" title="秒；≤0=不延迟" style="width:52px;background:#0e1432;color:#fff;border:1px solid #3a4178;padding:1px 4px;font-size:11px" placeholder="秒"> 淡入 <input type="number" class="batchFade" step="0.1" min="0" title="秒；留空=默认 0.35s" style="width:52px;background:#0e1432;color:#fff;border:1px solid #3a4178;padding:1px 4px;font-size:11px" placeholder="秒">
        <button class="btn batchApply" style="font-size:10px;padding:1px 8px;margin-left:4px">应用到选中</button></div></div>`
    : '';
  // 标题显示：类型 + id（方便绳子悬挂/接线引用）
  let html = multi + `<h3>${e.label} <small style="color:#9fd8ff">#${item.obj.id ?? '?'}</small> <small style="color:#6a7a96">(${e.type})</small></h3>`;
  // 传送门：组信息条（组号 = 一组；组属性 颜色/次数/开关 编辑自动同步全组）
  if (e.type === 'portal') {
    const g = item.obj.group;
    const mates = g ? state.placed.filter((p) => p.type === 'portal' && p.obj.group === g) : [];
    html += `<div style="margin:4px 0 8px;padding:5px 8px;background:rgba(199,139,255,0.12);border:1px solid rgba(199,139,255,0.4);border-radius:6px;font-size:11px;color:#e8d6ff;line-height:1.6">
      ${g
        ? `组号 <b style="color:#e8b84b">${escHtml(g)}</b> · 同组成员 <b style="color:#7fe0ff">${mates.length}</b> 扇（${mates.map((p) => p.obj.id ?? '?').join('、')}）<br>
          <span style="color:#9fb2c8">组级属性（颜色/可用次数/开关id）改动自动同步全组——改一扇，全组生效</span>`
        : `<b style="color:#ffb340">未分组</b>：先在「组号」里选已有组或输入新组号并点「加入组」<br>
          <span style="color:#9fb2c8">设置组之后（同组 = 配对/共享预算），组级属性才会启用并自动同步</span>`}</div>`;
  }
  const opts = e.collect(item.obj);
  for (const f of e.fields) {
    const v = opts[f.k];
    // 传送门组号：先设组号（才允许改其它属性）——下拉选已有组 + 输入新组
    const portalGroupFreeze = item.type === 'portal' && !item.obj.group;
    const freezeAttr = portalGroupFreeze ? ' disabled title="先设置组号（[组] 字段，如 A）才能修改组属性"' : '';
    html += `<div class="fld"><label>${f.label}</label>`;
    if (f.kind === 'portalg') {
      const groups = [...new Set(state.placed.filter((p) => p.type === 'portal' && p.obj.group).map((p) => p.obj.group))];
      const gopts = (v ? [`<option value="${escHtml(v)}" selected>${escHtml(v)}（当前）</option>`] : []).concat(
        groups.filter((g) => g !== v).map((g) => `<option value="${escHtml(g)}">${escHtml(g)}</option>`),
      );
      html += `<select data-k="${f.k}" data-kind="portalg" style="width:64px"><option value="" ${!v ? 'selected' : ''}>（未分组）</option>${gopts.join('')}</select>
        <input type="text" data-k="${f.k}" data-kind="portalg-new" placeholder="新组号" style="width:70px" value="">
        <button class="btn" data-kind="portalg-apply" style="padding:1px 8px" title="把当前门加入上面的组（未分组=自动按颜色迁移）">加入组</button>`;
    } else if (f.kind === 'bool') html += `<input type="checkbox" ${v ? 'checked' : ''} data-k="${f.k}" data-kind="bool"${freezeAttr}>`;
    else if (f.kind === 'select') html += `<select data-k="${f.k}" data-kind="select"${freezeAttr}>${f.options.map((o) => `<option value="${o}" ${String(v) === String(o) ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    else if (f.k === 'hanging' || f.k === 'anchorObj' || f.kind === 'idref') {
      // 绳子悬挂/锚点物体/插件组件 idref：下拉选择已放置物体的 id（失效引用明确标注）
      const ids = [...new Set(state.placed.map((p) => p.obj.id).filter(Boolean))];
      let opts = ids.map((id) => `<option value="${id}" ${id === v ? 'selected' : ''}>${id}</option>`).join('');
      if (v && !ids.includes(v)) opts = `<option value="${v}" selected>${v}（失效）</option>` + opts;
      html += `<select data-k="${f.k}" data-kind="idref"${freezeAttr}><option value="" ${!v ? 'selected' : ''}>（无）</option>${opts}</select>`;
    } else if (f.kind === 'solutes') html += `<input type="text" data-k="${f.k}" data-kind="solutes" placeholder="NaCl:100, CaCl2:50（多物质用逗号分隔）" value="${Object.entries(v).map(([id, m]) => `${id}:${m}`).join(', ')}"${freezeAttr}>`;
    else if (f.kind === 'substance') {
      // 物质用下拉选择（避免 datalist/输入框的删除问题），含"无"
      const all = Object.keys(C.SUBSTANCES || {}).sort();
      const opts = ['', ...all];
      html += `<select data-k="${f.k}" data-kind="substance"${freezeAttr}><option value="" ${!v ? 'selected' : ''}>（无）</option>${opts.filter((o) => o !== '').map((o) => `<option value="${o}" ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    } else if (f.kind === 'dropsub') {
      // 滴管物质：只列"液体/可溶"（滴管只能滴液体物质，不列固体/沉淀/气体）
      const all = Object.keys(C.SUBSTANCES || {}).sort().filter((id) => {
        const s = C.SUBSTANCES[id];
        return s && (s.state === 'liquid' || s.soluble === 'soluble');
      });
      html += `<select data-k="${f.k}" data-kind="dropsub"${freezeAttr}><option value="" ${!v ? 'selected' : ''}>（无）</option>${all.map((o) => `<option value="${o}" ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    } else if (f.kind === 'number') html += `<input type="number" data-k="${f.k}" data-kind="number" step="any" value="${v ?? ''}"${freezeAttr}>`;
    else if (f.kind === 'rx') html += `<input type="text" data-k="${f.k}" data-kind="rx" value="${(v ?? '').replace(/"/g, '&quot;')}"${freezeAttr}>`;
    else if (f.k === 'color') html += `<input type="color" data-k="${f.k}" data-kind="color" value="${/^#[0-9a-fA-F]{6}$/.test(v || '') ? v : '#c78bff'}"${freezeAttr}>`;
    else if (f.multiline) html += `<textarea rows="3" data-k="${f.k}" data-kind="text"${freezeAttr}>${(v ?? '').replace(/</g, '&lt;')}</textarea>`;
    else html += `<input type="text" data-k="${f.k}" data-kind="text" value="${v ?? ''}"${freezeAttr}>`;
    html += '</div>';
  }
  box.innerHTML = html;
  // 绑定事件
  // textarea = 多行字段（路标文字/显示牌文字等）：同样绑定 change（blur/失焦提交）
  // 传送门「加入组」按钮：把下拉/新输入框里的组号写入当前门
  const joinBtn = box.querySelector('[data-kind="portalg-apply"]');
  if (joinBtn) {
    joinBtn.onclick = () => {
      const sel = box.querySelector('[data-kind="portalg"]');
      const nw = box.querySelector('[data-kind="portalg-new"]');
      const g = (nw && nw.value.trim()) || (sel && sel.value) || '';
      if (!g) { $('status').textContent = '先选一个组或输入新组号再点「加入组」'; return; }
      const item = state.placed[idx];
      const opts = byType.portal.collect(item.obj);
      opts.group = g;
      pushUndo();
      replaceAt(idx, opts);
      // 加入已有组 → 组属性一致化（颜色/次数/开关取组内成员）
      const mates = state.placed.filter((p) => p.type === 'portal' && p !== item && p.obj.group === g).map((p) => p.obj);
      if (mates.length) {
        const tpl = mates[0];
        const o2 = byType.portal.collect(item.obj);
        o2.color = tpl.color; o2.uses = Number.isFinite(tpl.uses) ? tpl.uses : 0; o2.switchId = tpl.switchId ?? null;
        replaceAt(idx, o2);
        $('status').textContent = `传送门入组「${g}」：组属性（颜色/次数/开关）已按组内成员一致化`;
      } else {
        $('status').textContent = `传送门已设为组「${g}」（首个成员）——把另一扇门也选同一组号即配对`;
      }
      refreshProps(); renderEdit();
    };
  }
  box.querySelectorAll('input, select, textarea').forEach((el) => {
    const k = el.dataset.k;
    el.addEventListener('change', () => {
      const item = state.placed[idx];
      const e2 = byType[item.type];
      const opts = e2.collect(item.obj);
      // 传送门组编辑：改动前记录组色（改颜色=整组换色；改开关/次数=整组同步）
      const grpColor = item.obj.color;
      const grpOld = { color: item.obj.color, switchId: item.obj.switchId ?? null, uses: Number.isFinite(item.obj.uses) ? item.obj.uses : 0 };
      let val;
      if (el.dataset.kind === 'portalg-new') return; // 新组号输入框：必须点「加入组」才生效（防误触发）
      if (el.dataset.kind === 'bool') val = el.checked;
      else if (el.dataset.kind === 'solutes') {
        val = {};
        for (const seg of el.value.split(',')) {
          const p = seg.trim().split(':');
          if (!p[0]) continue;
          const id = p[0].trim();
          if (!C.SUBSTANCES[id]) {
            el.style.border = '1px solid #ff6a6a';
            $('status').textContent = `未知物质「${id}」（见物质下拉/物质表：如 NaCl:100, CaCl2:50）`;
            return;
          }
          val[id] = parseFloat(p[1]) || 1;
        }
        el.style.border = '1px solid var(--edge)';
      }
      else if (el.dataset.kind === 'number') val = parseFloat(el.value) || 0;
      else val = el.value;
      if (el.dataset.kind === 'rx') {
        const err = C.reactionStrError(val);
        el.style.border = err ? '1px solid #ff6a6a' : '1px solid var(--edge)';
        el.title = err || '';
        if (err) { $('status').textContent = `自定义反应无效：${err}`; return; }
      }
      // 物质/核心 id 不允许空值（空会破坏物块等），空则保留旧值；
      // 引用文本字段（switchId/igniteId/poolId/and/…）清空 = 解除绑定：
      // 删除键（构造走默认 null = 常开/不接线），否则"清空=删不掉"（用户反馈）
      if (val === '' && (el.dataset.kind === 'substance' || el.dataset.kind === 'dropsub' || k === 'id')) {
        val = opts[k];
      } else if (val === '') {
        delete opts[k];
        val = undefined;
      }
      if (val !== undefined) opts[k] = val;
      // 网格物体（物块/沉淀堆）：改"质量"字段时丢弃 w/h —— 让质量重新决定形状；
      // 改 w/h 字段时保留（显式尺寸优先于质量，缩放/放置结果可持久化）
      if (k === 'mass' && ['block', 'deposit'].includes(item.type)) {
        delete opts.w;
        delete opts.h;
      }
      // ★ 传送门"组"变更：把当前门加入/改到某组——同组成员继承该组的组属性；
      //   若组里已有成员，把它们的属性同步到当前门（组属性以组为准）。
      if (item.type === 'portal' && k === 'group' && val !== undefined) {
        const mates = state.placed
          .filter((p) => p.type === 'portal' && p !== item && p.obj.group === val)
          .map((p) => p.obj);
        if (mates.length) {
          // 加入已有组：从组员继承颜色/次数/开关（组属性一致化）
          const tpl = mates[0];
          opts.color = tpl.color;
          opts.uses = Number.isFinite(tpl.uses) ? tpl.uses : 0;
          opts.switchId = tpl.switchId ?? null;
          $('status').textContent = `传送门已入组「${val}」：颜色/可用次数/开关绑定按组内成员同步（组属性以组为准）`;
        } else {
          // 新建组（首个成员）：若曾按颜色成对，提示可再给另一扇设同组号
          $('status').textContent = `传送门已设为组「${val}」（首个成员）——把另一扇门也选同一组号即配对`;
        }
      }
      pushUndo();
      replaceAt(idx, opts);
      // ★ 传送门组属性同步（组 = 同组号）：组员改 color/uses/switchId → 整组跟随。
      //   组号未设的旧数据按颜色兜底同步（迁移前的一致性）。
      if (item.type === 'portal' && ['color', 'uses', 'switchId'].includes(k)) {
        const my = state.placed[idx].obj;
        const groupKey = my.group != null ? my.group : `__color:${my.color}`;
        const patch = {};
        if (k === 'color') patch.color = opts.color;
        else if (k === 'uses') patch.uses = opts.uses;
        else if (k === 'switchId') patch.switchId = opts.switchId;
        const hits = portalGroupSync(groupKey, patch, idx);
        if (hits.length) {
          buildRenderScene();
          $('status').textContent = `传送门组同步：已联动 ${hits.length} 扇同组门（${k === 'color' ? '换色' : k === 'uses' ? '可用次数' : '开关绑定'}）`;
          saveState();
        }
      }
      renderEdit(); // 不重建属性面板：保留正在编辑的输入框与光标
    });
  });
  // 批量修改（多选/Ctrl+A 后）：延迟出现(秒)/淡入(秒) 应用到全部选中物体
  const batchBtn = box.querySelector('.batchApply');
  if (batchBtn) {
    batchBtn.onclick = () => {
      const bd = box.querySelector('.batchDel').value;
      const bf = box.querySelector('.batchFade').value;
      const setD = bd.trim() !== '' && Number.isFinite(+bd);
      const setF = bf.trim() !== '' && Number.isFinite(+bf);
      if (!setD && !setF) { $('status').textContent = '批量修改：先填 延迟出现 或 淡入 的秒数（≥0）'; return; }
      let n = 0;
      pushUndo();
      for (const i of state.sel) {
        const p = state.placed[i];
        if (!p) continue;
        if (setD) { const v = +bd; if (v > 0) p.obj.appearDelay = v; else { delete p.obj.appearDelay; p.obj.appearTime = undefined; } }
        if (setF) { const v = +bf; if (v > 0) p.obj.appearFade = v; else delete p.obj.appearFade; }
        if (p.obj.syncGrid) p.obj.syncGrid();
        n++;
      }
      ensureStableIds();
      buildRenderScene(); renderEdit(); refreshProps(); refreshExport(); saveState();
      $('status').textContent = `已批量设置 ${n} 个物体（延迟出现${setD ? ' ' + bd + 's' : ' 不变'}·淡入${setF ? ' ' + bf + 's' : ' 不变'}）`;
    };
  }
}

// ---- 导出 DSL ----------------------------------------------------------------
function fmtOpts(map) {
  const parts = [];
  for (const [k, v] of Object.entries(map)) {
    if (v === undefined || v === null) continue;
    if (typeof v === 'object') parts.push(`${k}: ${JSON.stringify(v)}`);
    else if (typeof v === 'string') parts.push(`${k}: '${v}'`);
    else parts.push(`${k}: ${v}`);
  }
  return parts.length ? `{ ${parts.join(', ')} }` : '';
}
function dslLine(item) {
  const t = item.type;
  const o = item.obj;
  if (pluginComponents.has(t)) {
    // 插件组件：.pluginObj('type', { x,y,w,h, fields..., id }) —— 运行时由插件 construct 实例化
    return `.pluginObj('${t}', ${fmtOpts(pluginCollect(t, o))})`;
  }
  const R = (n) => Math.round(n * 10) / 10;
  const pos = `${R(o.x)}, ${R(o.y)}`;
  const HID = o.hidden ? true : undefined; // 初始隐藏 → 导出 hidden: true
  switch (t) {
    case 'floor': {
      const opts = { ice: o.ice ? true : undefined, id: o.id, hidden: HID };
      return `.floor(${pos}, ${R(o.w)}, ${R(o.h)}${fmtOpts(opts) ? ', ' + fmtOpts(opts) : ''})`;
    }
    case 'pool': {
      const opts = { volume: o.solution.volume, solutes: mapToObj(o.solution.solutes), gasHeight: o.gasHeight !== 80 ? o.gasHeight : undefined, hidden: HID, id: o.id };
      return `.pool(${pos}, ${R(o.w)}, ${R(o.h)}${fmtOpts(opts) ? ', ' + fmtOpts(opts) : ''})`;
    }
    case 'block': {
      // 有 w/h（像素模式）→ 省略 mass，导出的形状与编辑器一致；否则 mass 定形状
      const opts = { substance: o.substance, mass: (o.w && o.h) ? undefined : (o.mass ?? 50), w: o.w, h: o.h, pushable: o.pushable === false ? false : undefined, noLift: o.noLift ? true : undefined, hidden: HID, id: o.id };
      return `.block(${pos}, ${fmtOpts(opts)})`;
    }
    case 'deposit': {
      const opts = { substance: o.substance, mass: (o.w && o.h) ? undefined : Math.round((o.grid?.totalMass?.() ?? o.mass ?? 20) * 10) / 10, w: o.w, h: o.h, hidden: HID, id: o.id };
      return `.deposit(${pos}, ${fmtOpts(opts)})`;
    }
    case 'player': {
      // 玩家形状由质量决定：只导出质量（质量↔体积/血量挂钩）
      const opts = { substance: o.substance, mass: o.maxHp ?? 30, noLift: o.noLift ? true : undefined, hidden: HID, id: o.id };
      return `.player(${pos}, ${fmtOpts(opts)})`;
    }
    case 'lamp': return `.lamp(${pos}, ${fmtOpts({ autoOn: o.lit, hidden: HID, id: o.id })})`;
    case 'blastlamp': return `.blastlamp(${pos}, ${fmtOpts({ autoOn: o.lit, highTemp: o.highTemp, hidden: HID, id: o.id })})`;
    case 'switch': return `.switch(${pos}, ${fmtOpts({ mode: o.mode, opening: o.opening, and: o.and, deleteId: o.deleteId || undefined, showId: o.showId || undefined, igniteId: o.igniteId || undefined, extinguishId: o.extinguishId || undefined, openId: o.openId || undefined, hidden: HID, id: o.id })})`;
    case 'key': return `.key(${pos}, ${fmtOpts({ opening: o.opening, deleteId: o.deleteId || undefined, showId: o.showId || undefined, igniteId: o.igniteId || undefined, extinguishId: o.extinguishId || undefined, openId: o.openId || undefined, hidden: HID, id: o.id })})`;
    case 'door': {
      const opts = { hidden: HID, id: o.id };
      return `.door(${pos}, ${R(o.w)}, ${R(o.h)}${fmtOpts(opts) ? ', ' + fmtOpts(opts) : ''})`;
    }
    case 'sign': {
      // 文本要完整转义：反斜杠 → 换行(真实 \n) → 去 \r → 单引号（否则多行文案拆断字符串=导出语法错误）
      const t = String(o.text ?? '')
        .replace(/\\/g, '\\\\')
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '')
        .replace(/'/g, "\\'");
      const extra = fmtOpts({ hidden: HID, id: o.id });
      return `.sign(${pos}, '${t}'${extra ? `, ${extra}` : ''})`;
    }
    case 'portal': return `.portal(${pos}, ${fmtOpts({ w: o.w, h: o.h, color: o.color, uses: Number.isFinite(o.uses) ? o.uses : undefined, switchId: o.switchId || undefined, group: o.group || undefined, hidden: HID, id: o.id })})`;
    case 'gasdetector': return `.gasdetector(${pos}, ${fmtOpts({ gas: o.gas, threshold: o.threshold, opening: o.opening, and: o.and, deleteId: o.deleteId || undefined, showId: o.showId || undefined, igniteId: o.igniteId || undefined, extinguishId: o.extinguishId || undefined, openId: o.openId || undefined, hidden: HID, id: o.id })})`;
    case 'extractor': return `.extractor(${pos}, ${fmtOpts({ w: o.w, h: o.h, poolId: o.poolId, switchId: o.switchId, rate: o.rate, hidden: HID, id: o.id })})`;
    case 'beaker': {
      // water = 容量时为满杯（旧默认）；只在实际水量 ≠ 容量时导出（空杯/半杯）
      const water = Math.round(o.solution.water * 10) / 10;
      const opts = { volume: o.solution.volume, water: water !== o.solution.volume ? water : undefined, solutes: mapToObj(o.solution.solutes), noCarry: o.noCarry ? true : undefined, hidden: HID, id: o.id };
      return `.beaker(${pos}, ${R(o.w)}, ${R(o.h)}${fmtOpts(opts) ? ', ' + fmtOpts(opts) : ''})`;
    }
    case 'dropper': {
      // 满管（=容量）不导出（开局满管默认）；空管/部分导出 liquid
      const liquid = o.liquid !== o.capacity ? Math.round(o.liquid * 10) / 10 : undefined;
      const opts = { substance: o.substance, capacity: o.capacity, drop: o.drop, liquid, noCarry: o.noCarry ? true : undefined, hidden: HID, id: o.id };
      return `.dropper(${pos}, ${fmtOpts(opts)})`;
    }
    case 'gasbottle': {

/** 生成完整可运行的关卡脚本（含 build/接线占位/start；编辑器插件可通过 ed.onExport 追加/改写） */
function buildScript() {
  // id 稳定化（试玩同款）：objN 默认 id → 类型 id（player1/block2…）。
  // 插件增强的构建后赋值走 scene.byId['x'] 引用，导出必须先稳定 id。
  ensureStableIds();

  let seq = 0;
  const PREC_TYPES = ['lamp', 'blastlamp', 'switch', 'key', 'gasdetector'];
  const idPrefix = { lamp: 'lamp', blastlamp: 'lamp', switch: 'sw', key: 'key' };
  for (const p of state.placed) {
    if (PREC_TYPES.includes(p.type) && !p.obj.id && Object.keys(mapToObj(p.obj.precipitates)).length) {

  // 增强属性走构建后赋值 `scene.byId['x'].key = v`，没 id 就写不进去
  // （玩家等物体平时不填 id；绳子走 post 整行构造、不吃这条，排除）。
  for (const p of state.placed) {

    const flds = enhanceFieldsOf(p.type);
    if (flds.some((f) => p.obj[f.key] !== undefined && p.obj[f.key] !== f.def)) p.obj.id = `${p.type}${++seq}`;
  }
  const lines = [
    `const canvas = document.getElementById('game');`,
    `canvas.width = 1100;`,
    `canvas.height = 700;`,
    `const L = new Chezzle.LevelBuilder(canvas, { worldW: ${state.worldW}, worldH: ${state.worldH} });`,
    'L',
  ];
  if ($('cbDebug') && $('cbDebug').checked) lines.push(`  // 调试模式：打开本关时 URL 加 ?debug=1（.debugmode() 已废弃，导出仅留提示）`); // 可选：提示调试模式开启方式
  const post = []; // 构建后语句（灯上默认沉淀 / 开关预设开启物 / 绳子）
  for (const p of state.placed) {
    if (p.type === 'rope') continue; // 绳子需引用物体，走构建后语句
    const l = dslLine(p);
    if (l) lines.push('  ' + l);
    if (PREC_TYPES.includes(p.type)) {
      const prec = mapToObj(p.obj.precipitates);
      for (const [id, m] of Object.entries(prec)) {
        if (m > 0 && p.obj.id) post.push(`scene.byId['${p.obj.id}'].addPrecipitate('${id}', ${m});`);
      }
    }
  }
  // 绳子（构建后，需引用悬挂/锚点物体；悬挂/锚点用场景里物体的 id）
  for (const p of state.placed) {
    if (p.type !== 'rope') continue;
    const o = byType.rope.collect(p.obj);
    // obj 锚点带偏移：绳子顶端相对锚物体的位置
    const ao = state.placed.find((x) => x.obj.id === o.anchorObj)?.obj;
    const anchor = o.anchorMode === 'obj' && ao
      ? `{ obj: scene.byId['${o.anchorObj}'], dx: ${(o.x - ao.x).toFixed(2)}, dy: ${(o.y - ao.y).toFixed(2)} }`
      : `{ fixed: { x: ${o.x}, y: ${o.y} } }`;
    const hang = o.hanging ? `scene.byId['${o.hanging}']` : 'undefined';
    post.push(`scene.addObject(new Chezzle.Rope({ x: ${o.x}, y: ${o.y}, length: ${o.length}, anchor: ${anchor}, hanging: ${hang} }));`);
  }
  // 插件增强属性（如"延迟出现"）：非默认值 → 构建后赋值到物体（插件 run 读取执行）
  for (const p of state.placed) {
    const flds = enhanceFieldsOf(p.type);
    if (!flds.length || !p.obj.id) continue;
    for (const f of flds) {
      const v = p.obj[f.key];
      if (v !== undefined && v !== f.def) post.push(`scene.byId['${p.obj.id}'].${f.key} = ${safeJson(v)}; // 插件增强: ${f.label ?? f.key}`);
    }
  }
  // 延迟出现/淡入（编辑器内建通用字段）：构建后赋值 + 启动前登记"到时显现"
  for (const p of state.placed) {
    if (!p.obj.id) continue;
    const d = Number(p.obj.appearDelay);
    if (d > 0) {
      post.push(`scene.byId['${p.obj.id}'].appearDelay = ${d}; // 延迟出现`);
      const fd = Number(p.obj.appearFade);
      if (fd > 0) post.push(`scene.byId['${p.obj.id}'].appearFade = ${fd};`);
    }
  }
  // 编辑器自带：关卡大气（preset = 整组独占：设置过的按值、没设置的=没有；空=保持默认）
  post.push(`scene.atmosphere.preset(${safeJson(state.atmosphere ?? {})}); // 关卡大气`);
  for (const rx of state.customReactions) {
    lines.push(`  .reaction('${rx.replace(/'/g, "\\'")}')`); // 关卡自定义反应（最高优先级）
  }
  // 条件提示：按列表顺序逐条触发（位置/物品栏/序号条件，且/或）
  if (state.tips.length) lines.push(...dslTips());
  lines.push(';');
  lines.push('', 'const scene = L.build();');
  lines.push(...post);
  // 延迟出现（开局隐藏 → 到时显现+淡入）：插件注入之后、start 之前登记
  lines.push('scene.applyAppearDelays(); // 延迟出现');
  // 接线占位（编辑器暂不支持连线，手动补 onOpen/onClose）
  lines.push('', '// ⚡ 接线（示例，按需取消注释）：');
  lines.push("// scene.byId['sw'].onOpen(() => scene.byId['lamp'].ignite());");
  lines.push("// scene.byId['sw'].onClose(() => scene.byId['lamp'].extinguish());");
  lines.push("// scene.byId['key'].onOpen(() => scene.byId['door'].open());");
  lines.push("// scene.atmosphere.add('CO2', 8); // 可选：初始大气 CO2（碳化玩法）");
  // 插件注入（scene 构建后、start 前；插件源码已在页内 <script> 加载注册）
  const pls = activePlugins();
  if (pls.length) {
    lines.push('', '// ▶ 插件逻辑（配置文件见编辑器插件面板）');
    lines.push(`Chezzle.Plugin.inject(scene, ${safeJson(pls)});`);
  }
  lines.push('', 'L.start();');
  // 选关系统：通关上报（导出 HTML 已自动带上 report.js；
  // id 与 levels/levels.js 里同位素关卡 id 一致，如 H-1/He-1）
  const lid = ($('inLevelId')?.value || '').trim();
  if (lid) {
    lines.push(`ChezzleReport.bind(scene, '${lid.replace(/[^0-9A-Za-z\u4e00-\u9fff-]/g, '')}'); // 选关系统：通关上报`);
  } else {
    lines.push("// ChezzleReport.bind(scene, 'H-1'); // 选关系统：填上关卡 id 后取消注释（见 levels/levels.js）");
  }
  // 编辑器插件导出钩子：插件可追加/改写脚本行（ed.onExport 注册的 fn(lines, ctx)）
  for (const [reg, hooks] of editorHooks) {
    for (const fn of hooks) {
      try {
        const r = fn(lines, { state, byType, dslLine, safeJson });
        if (Array.isArray(r)) lines = r;
      } catch (e) {
        if (typeof console !== 'undefined') console.error(`[editor-plugin:${reg}] onExport`, e);
      }
    }
  }
  return lines.join('\n');
}

/** 导出 HTML 的插件 <script> 标签：嵌入源码（默认）或外链 plugin/<file>。

function pluginTags() {
  const embed = $('cbEmbedPlugins')?.checked !== false;
  const tags = [];
  for (const file of requiredPluginFiles()) {
    const e = pluginLib.get(file);
    if (!e) {
      tags.push(`<!-- ⚠ 插件 ${file} 未加载（请加载后重新导出） -->`);
      continue;
    }
    if (embed) {
      tags.push(`<!-- 插件: ${e.meta.name}${e.meta.version ? ' v' + e.meta.version : ''}（${file}） -->`);
      tags.push('<script>\n' + e.src + '\n<\/script>');
    } else {
      tags.push(`<!-- 插件: ${e.meta.name}（外链模式，请把 ${file} 放到 level.html 同目录的 plugin/ 下） -->`);
      tags.push(`<script src="plugin/${file}"><\/script>`);
    }
  }
  return tags.join('\n');
}

async function loadState(errors) {

    const raw = localStorage.getItem(STORAGE_KEY);

    const refs = Array.isArray(data.plugins) ? data.plugins : [];
    const res = await ensurePluginsFrom(refs);
    for (const e of res.errors) errors?.push(e);
    if (location.protocol === 'file:' && res.fromCache.length) errors?.push(`${res.fromCache.join('、')}（来自浏览器缓存——file:// 读不到磁盘 plugin/；用 http 服务打开编辑器）`);
    if (typeof data.levelId === 'string') { levelId = data.levelId; $('inLevelId').value = levelId; }
    state.plugins = refs.map((p) => ({ file: p.file, reg: p.reg ?? pluginLib.get(p.file)?.reg, name: p.name ?? p.file, enabled: p.enabled !== false }));
    // 编辑器插件持久化状态（chapters 等插件用它存自己的数据）。
    // ★ 就地填充：插件自动加载在前，def.editor() 已把 state 引用放进 Map——

    for (const [k, v] of Object.entries(data.editorState ?? {})) {

      if (cur && typeof cur === 'object') Object.assign(cur, v);
      else editorStates.set(k, v);
    }
    for (const [k, fns] of editorStateLoadedHooks) {
      for (const fn of fns) { try { fn(); } catch (e) { /* 忽略 */ } }
    }
    // v3（多场景实验版）兼容：取当前场景作为单场景；v2/v1：直接单场景
    let src = data;
    if (Array.isArray(data.scenes)) {
      src = data.scenes.find((s) => s.id === data.current) ?? data.scenes[0];
    }
    state.worldW = src.worldW || 3000;
    state.worldH = src.worldH || 800;
    $('inW').value = state.worldW;
    $('inH').value = state.worldH;
    state.customReactions = Array.isArray(src.rx) ? src.rx : (src.rx ? [src.rx] : []);
    state.atmosphere = { ...(src.atmosphere ?? {}) };
    state.tips = Array.isArray(src.tips) ? src.tips.map((t) => ({ text: t.text ?? '', mode: t.mode ?? 'and', items: Array.isArray(t.items) ? t.items : [] })) : [];
    refreshAtmInput();

    state.selected = null;

    return true;
  } catch (e) { return false; }
}

  const tps = tipsToScene(state.tips);
  for (const t of tps) scene.tips.push(t);
  // 无玩家时相机聚焦关卡内容（包围盒）：否则试玩显示世界中央，物体（滴管/池等）
  // 可能不在视口内——看着"一切正常"但点击没反应（用户反馈）
  if (!scene.player) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const p of state.placed) {
      const o = p.obj;
      if (o.w <= 0 || o.h <= 0) continue;
      x0 = Math.min(x0, o.x); x1 = Math.max(x1, o.x + o.w);
      y0 = Math.min(y0, o.y); y1 = Math.max(y1, o.y + o.h);
    }
    if (x1 > -Infinity) {
      scene.cameraFocus = { x: x0 - 60, y: y0 - 40, w: x1 - x0 + 120, h: y1 - y0 + 80 };
    }
  }
  // 编辑器自带：关卡大气（preset = 整组独占：设置过的按值、没设置的=没有；空=保持默认）
  scene.atmosphere.preset(state.atmosphere);
  // 插件试玩前置钩子（scene 构建后、注入前）：把插件的 scene 数据写进去
  // （如新手引导模组的横幅剧本）——与导出脚本"数据行在 inject 之前"同一时机，所见即所得。
  for (const fns of editorPlaySceneHooks.values()) {
    for (const fn of fns) {
      try { fn(scene); } catch (e) { if (typeof console !== 'undefined') console.error(`[editor-plugin] playScene`, e); }
    }
  }
  // 延迟出现（appearDelay>0 开局隐藏 → 到时显现+淡入）：与导出一致，注入后、start 前
  scene.applyAppearDelays();
  // 插件注入（试玩与导出同管线：scene 构建后、start 前）
  const pls = activePlugins();
  if (pls.length) C.Plugin.inject(scene, pls);
  scene.status = 'running';
  scene.debugMode = true; // 试玩默认开调试模式（F5暂停/F6步进/X切换/悬停溯源）
  // 试玩视口与实际游戏一致（1000×800 视口、跟随玩家）：与导出关卡同一比例
  const renderer = new C.Renderer(canvas, { worldW: state.worldW, worldH: state.worldH });
  scene.renderer = renderer;
  scene.camera = renderer.camera;
  // 试玩也带 HUD：鼠标悬停溯源 + 空气计 + 气体变化日志 + 最近反应（与游戏调试模式一致）
  const hud = new C.Hud(scene);
  const onPlayMove = (e) => {
    const rect = canvas.getBoundingClientRect();
    scene.mouse = { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height), on: true };
  };
  const onPlayLeave = () => { if (scene.mouse) scene.mouse.on = false; };
  // 试玩点击：提示按钮（右上）+ 物品栏选格（右下）+ 可点击物体（滴管等 onTap）
  // ——与导出关卡 LevelBuilder.bindClick 同一管线（Chezzle.handleSceneClick）
  // 诊断回调：点击/悬停的世界坐标与命中结果实时显示在状态栏（排查"点了没反应"）
  const onPlayClick = (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    C.handleSceneClick(scene, hud, canvas, x, y, (info) => {
      const wx = Math.round(info.world?.x ?? 0);
      const wy = Math.round(info.world?.y ?? 0);
      let msg;
      if (info.type === 'tap') {
        const o = info.object;
        msg = `点击→世界(${wx},${wy}) 命中：${o.hoverLabel ?? o.constructor.name} ${info.success ? '→ 已滴液' : '→ 未滴（下方无容器或已滴空）'}`;
      } else if (info.type === 'miss') {
        msg = `点击→世界(${wx},${wy}) 未命中任何可交互物体（滴管不在该点）`;
      } else if (info.type === 'tip') {
        msg = '点击：右上提示按钮';
      } else {
        msg = '点击：物品栏选格';
      }
      $('status').textContent = '试玩中｜' + msg;
    });
  };
  canvas.addEventListener('mousemove', onPlayMove);
  canvas.addEventListener('mouseleave', onPlayLeave);
  canvas.addEventListener('click', onPlayClick);
  // 悬停显示世界坐标（对照滴管实际位置；排查"点偏了/看到的是编辑画面"）
  const onPlayMoveDiag = (e) => {
    if (!state.playing || !scene.camera) return;
    const rect = canvas.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const sy = (e.clientY - rect.top) * (canvas.height / rect.height);
    const w = C.screenToWorld(scene, canvas, sx, sy);
    $('status').textContent = `试玩中｜悬停世界(${Math.round(w.x)},${Math.round(w.y)})｜滴管：点胶头滴液/按住持续滴·液下长按吸取·玻璃段拖动`;
  };
  canvas.addEventListener('mousemove', onPlayMoveDiag);
  // 松开鼠标准确停（长按滴加在 mouseup 停止；窗口级兜底）
  const onPlayTapUp = (e) => {
    if (!state.playing) return;
    if (e && e.target === canvas) C.handleScenePressUp(scene, canvas);
    else C.handleScenePressUp(scene);
  };
  window.addEventListener('mouseup', onPlayTapUp);
  // 拖动滴管（按下后移动>6px = 拖动改变位置；窗口级：拖出画布不丢）
  const onPlayPressMove = (e) => {
    if (!state.playing || !playScene) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    C.handleScenePressMove(playScene, canvas, x, y);
    if (playScene._drag) $('status').textContent = '试玩中｜拖动滴管（松开停在位置）';
  };
  window.addEventListener('mousemove', onPlayPressMove);
  state.playing = true;
  $('btnPlay').textContent = '⏹ 退出试玩';
  canvas.style.cursor = 'default';
  playUnbind = C.bindKeyboard(scene);
  // 鸟瞰输入（滚轮缩放 + 拖动平移；试玩 HUD 也有"鸟瞰"按钮，与导出关卡一致）
  const unbindOverview = C.bindOverviewInput(canvas, () => (playScene === scene ? { scene } : null));
  playMouseClean = () => {
    canvas.removeEventListener('mousemove', onPlayMove);
    canvas.removeEventListener('mouseleave', onPlayLeave);
    canvas.removeEventListener('click', onPlayClick);
    canvas.removeEventListener('mousemove', onPlayMoveDiag);
    window.removeEventListener('mouseup', onPlayTapUp);
    window.removeEventListener('mousemove', onPlayPressMove);
    unbindOverview();
  };
  playStop = C.startLoop(scene, renderer, { hud });
  playScene = scene; // 调试/测试可访问当前试玩场景
  $('status').textContent = '试玩中：A/D 移动 · 空格跳 · Q 收集 · Shift 放置 · C 拾取物品/吸液/按住集气 · X 倒出/按住通气 · 滴管：点胶头滴液/按住持续滴(液下长按=吸取)/玻璃段拖动 · V 鸟瞰 · 悬停查来源 · F5暂停';
  notifyPlayState(true);
}

/** 渲染前自检：画布缓冲尺寸与"容器×dpr"不一致就立刻重设（对模糊的最后一道保险）。 */
function ensureCanvasSize() {
  const wrap = $('canvasWrap');
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (w > 0 && h > 0 && (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr))) {
    resizeCanvas();
  }
}
function resizeCanvas() {
  if (state.playing) return; // 试玩中：画布缓冲已被切到 1100×700（与导出实机一致），重叠改尺寸会打断试玩
  const wrap = $('canvasWrap');
  // 用 devicePixelRatio 保证高分屏清晰（否则 canvas 缓冲=CSS像素 → 被放大显示 → 模糊）
  const dpr = window.devicePixelRatio || 1;
  // 容器尺寸没就绪（布局未完成/隐藏）时回退到 getBoundingClientRect / 窗口尺寸，
  // 避免 canvas 保持默认 300×150 被拉伸模糊
  let w = wrap.clientWidth;
  let h = wrap.clientHeight;
  if (!w || w < 50) w = wrap.getBoundingClientRect().width || window.innerWidth || 800;
  if (!h || h < 50) h = wrap.getBoundingClientRect().height || window.innerHeight || 600;
  const bw = Math.max(1, Math.round(w * dpr));
  const bh = Math.max(1, Math.round(h * dpr));
  // 尺寸没变就不重设缓冲（重设会清空画布），避免无谓闪烁
  if (canvas.width !== bw) canvas.width = bw;
  if (canvas.height !== bh) canvas.height = bh;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  fitView();
  renderEdit();
}
// 保存 / 加载关卡（JSON）
function saveJSON() {
  const data = {
    version: 2,
    levelId, // 关卡ID随 JSON 保存/加载
    plugins: state.plugins, // 插件引用清单（加载 JSON 时自动从 plugin/ 目录或缓存加载；找不到=报错）
    rx: state.customReactions,
    atmosphere: state.atmosphere, // 编辑器自带：关卡大气
    editorState: Object.fromEntries([...editorStates].map(([k, v]) => [k, v])),
    objects: state.placed.map((p) => ({ type: p.type, opts: byType[p.type].collect(p.obj) })),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'level.json';
  a.click();
  URL.revokeObjectURL(a.href);
  $('status').textContent = '已保存 level.json';
}
async function applyLevel(data) {
  // 0. 自动加载 JSON 里引用的插件：已加载 → 磁盘 plugin/ 目录 → 浏览器缓存。
  //    JSON 是插件清单的唯一真相（不再附带"已加载的插件自动用于本关"）；
  //    找不到/加载失败 = 直接报错，不半加载（物体/面板都得等插件先就绪）。
  const refs = Array.isArray(data.plugins) ? data.plugins : [];
  const res = await ensurePluginsFrom(refs);
  if (!res.ok) {
    throw new Error('JSON 引用的插件未就绪：' + res.errors.join('；') + '（把插件放到 plugin/ 目录后重新加载）');
  }
  const cacheWarn = location.protocol === 'file:' && res.fromCache.length
    ? `（插件来自浏览器缓存：${res.fromCache.join('、')}——file:// 直开编辑器读不到磁盘 plugin/；请用 http 服务打开编辑器或用「+ 加载插件文件」重新选）`
    : '';
  if (typeof data.levelId === 'string') { levelId = data.levelId; $('inLevelId').value = levelId; }
  state.plugins = refs.map((p) => ({ file: p.file, reg: p.reg ?? pluginLib.get(p.file)?.reg, name: p.name ?? p.file, enabled: p.enabled !== false }));
  // 编辑器插件状态：就地填充（保引用一致，否则插件面板数据刷新后消失）
  for (const [k, v] of Object.entries(data.editorState ?? {})) {
    const cur = editorStates.get(k);
    if (cur && typeof cur === 'object') Object.assign(cur, v);
    else editorStates.set(k, v);
  }
  for (const [k, fns] of editorStateLoadedHooks) {
    for (const fn of fns) { try { fn(); } catch (e) { /* 忽略 */ } }
  }
  // v3（多场景实验版）兼容：取当前场景作为单场景
  let src = data;
  if (Array.isArray(data.scenes)) {
    src = data.scenes.find((s) => s.id === data.current) ?? data.scenes[0];
  }
  state.worldW = src.worldW || 3000;
  state.worldH = src.worldH || 800;
  $('inW').value = state.worldW;
  $('inH').value = state.worldH;
  state.customReactions = Array.isArray(src.rx) ? src.rx : (src.rx ? [src.rx] : []);
  state.atmosphere = { ...(src.atmosphere ?? {}) };
  refreshAtmInput();
  state.placed = (src.objects || [])
    .filter((o) => byType[o.type])
    .map((o) => ({ type: o.type, obj: byType[o.type].construct(gridOpts(o.type, o.opts)) }));
  state.selected = null;
  state.sel = new Set();
  undoStack.length = 0;
  syncIdSeq();
  migratePortalGroups(); // 旧数据（只有颜色的门）→ 按颜色自动分组
  buildRenderScene();
  resizeCanvas();
  refreshProps();
  renderRxPanel();
  renderPluginPanel();
  refreshExport();
  saveState();
  $('status').textContent = `已加载关卡（${state.placed.length} 个物体，${state.customReactions.length} 个自定义反应，${state.plugins.length} 个插件）${cacheWarn ?? ''}`;
}

function loadJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        await applyLevel(JSON.parse(reader.result));
      } catch (e) {
        // 插件未就绪等：直接报错（alert + 状态栏），当前关卡保持不变
        alert('JSON 加载失败：' + e.message);
        $('status').textContent = 'JSON 加载失败: ' + e.message;
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function addRx() {
  const input = $('rxAdd');
  const rx = input.value.trim();
  if (!rx) return;
  const err = C.reactionStrError(rx);
  if (err) {
    $('status').textContent = `自定义反应无效：${err}`;
    return;
  }
  if (state.customReactions.includes(rx)) { $('status').textContent = '该反应已存在'; return; }
  pushUndo();          // 添加反应也是可撤销步骤：快照在 push 之前，含旧 rx 列表
  state.customReactions.push(rx);
  input.value = '';
  saveState();
  renderRxPanel();
  refreshExport();
  $('status').textContent = `已添加自定义反应：${rx}`;
}
$('rxAddBtn').onclick = addRx;
$('rxAdd').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addRx(); } });

// ---- 条件提示管理面板（列表 + 展开编辑 + 条件组 且/或） ------------------------
let openTip = -1;
let tipRectPick = null; // { ti, ci }：正在"画布框选玩家位置范围"的目标条件
let tipRectDrag = null; // 框选中的矩形（世界坐标，renderEdit 绘制）
let pickRectCb = null;  // 插件框选（pickRect API）：下一次画布拖出区域后回调 {x,y,w,h}；null=取消
let pickRectDrag = null; // 插件框选中矩形（世界坐标，renderEdit 绘制）
const TIP_OPS = [['==', '等于'], ['>', '大于'], ['<', '小于'], ['>=', '大于等于'], ['<=', '小于等于']];
const TIP_TYPES = [['pos', '玩家位置范围'], ['inv', '物品栏 有/没有某物'], ['seq', '提示序号比较']];

/** 编辑器提示数据 → 引擎场景提示对象（导出 .tips([...]) 与试玩注入共用同一规格） */
function tipsToScene(tips) {
  return (tips ?? [])
    .map((t) => {
      if (!t || typeof t.text !== 'string') return null;
      const items = (Array.isArray(t.items) ? t.items : [])
        .filter((c) => c && c.type)
        .map((c) => {
          const o = { type: c.type };
          for (const k of ['x', 'y', 'w', 'h', 'item', 'has', 'op', 'n']) {
            if (c[k] !== undefined && c[k] !== null && c[k] !== '') o[k] = c[k];
          }
          return o;
        });
      return { text: t.text, when: { mode: t.mode === 'any' ? 'any' : 'and', items } };
    })
    .filter(Boolean);
}

/** 导出为 L.tips([...]) 链式行（无条件项的 when 省略=恒真） */
function dslTips() {
  const lines = ['  .tips(['];
  for (const t of tipsToScene(state.tips)) {
    const when = t.when.items.length ? { mode: t.when.mode, items: t.when.items } : null;
    lines.push(`    { text: ${JSON.stringify(t.text)}${when ? `, when: ${JSON.stringify(when)}` : ''}},`);
  }
  lines.push('  ])');
  return lines;
}

function tipSig(t) {
  const s = (t.items ?? []).map((c) => {
    if (c.type === 'pos') return `位置(${c.x ?? 0},${c.y ?? 0},${c.w ?? 0}×${c.h ?? 0})`;
    if (c.type === 'inv') return `${c.has === false ? '没有' : '有'} ${c.item ?? ''}`;
    if (c.type === 'seq') return `序号${c.op ?? '=='}${c.n ?? 0}`;
    return '?';
  }).join(t.mode === 'any' ? ' 或 ' : ' 且 ');
  return s || '无条件';
}

function tipCondHTML(c, i) {
  const selType = `<select class="cct"><option value="pos">玩家位置范围</option><option value="inv">物品栏 有/没有</option><option value="seq">提示序号比较</option></select>`;
  let body = '';
  if (c.type === 'pos') {
    body = `<span class="fl">范围</span>x<input type="number" class="ccx" value="${c.x ?? 0}"> y<input type="number" class="ccy" value="${c.y ?? 0}"> 宽<input type="number" class="ccw" value="${c.w ?? 200}"> 高<input type="number" class="cch" value="${c.h ?? 120}"><button class="cc-pick" title="在画布上拖出玩家位置范围">🎯 框选</button>`;
  } else if (c.type === 'inv') {
    body = `<select class="cch1"><option value="true"${c.has !== false ? ' selected' : ''}>有</option><option value="false"${c.has === false ? ' selected' : ''}>没有</option></select><input class="cci" list="substances" placeholder="物质名 / 物品名" value="${(c.item ?? '').replace(/"/g, '&quot;')}" style="width:110px">`;
  } else {
    body = `<select class="cco">${TIP_OPS.map(([v, l]) => `<option value="${v}"${(c.op ?? '>') === v ? ' selected' : ''}>${l} ${v}</option>`).join('')}</select><input type="number" class="ccn" value="${c.n ?? 1}">`;
  }
  return `<div class="tip-cond" data-i="${i}"><span class="fl">条件${i + 1}</span>${selType}${body}<button class="cc-del" title="删除条件">✕</button></div>`;
}

function renderTipPanel() {
  const list = $('tipList');
  if (!state.tips.length) {
    list.innerHTML = '<div class="empty">还没有条件提示<br>点下方 + 添加（触发顺序 = 从上到下，触发后不重复）</div>';
    return;
  }
  list.innerHTML = state.tips.map((t, i) => `
    <div class="tip-item${openTip === i ? ' open' : ''}" data-i="${i}">
      <div class="tip-head">
        <span class="tip-no">#${i + 1}</span>
        <span class="tip-prev">${(t.text || '（空提示）').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>
        <span class="tip-sig">${tipSig(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span>
        <button class="tip-mv" data-mv="-1" title="上移">↑</button>
        <button class="tip-mv" data-mv="1" title="下移">↓</button>
        <button class="tip-del" title="删除提示">✕</button>
      </div>
      <div class="tip-edit">
        <div class="tip-fld"><span class="fl">提示文本</span><textarea class="ttx" rows="2">${t.text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</textarea></div>
        <div class="tip-fld">
          <span class="fl">多个条件之间</span>
          <select class="tmd"><option value="and"${t.mode !== 'any' ? ' selected' : ''}>全部满足（且）</option><option value="any"${t.mode === 'any' ? ' selected' : ''}>任一满足（或）</option></select>
          <span class="fl" style="margin-left:6px">条件列表</span>
        </div>
        <div class="tip-conds">${(t.items ?? []).map((c, ci) => tipCondHTML(c, ci)).join('')}</div>
        <div class="tip-fld"><button class="btn cc-add" style="font-size:10px;padding:2px 10px">+ 添加条件</button></div>
      </div>
    </div>`).join('');

  const tipOf = (el) => state.tips[+el.closest('.tip-item').dataset.i];
  list.querySelectorAll('.tip-head').forEach((head) => {
    head.onclick = (e) => {
      if (e.target.closest('button')) return; // 按钮自己处理
      const i = +head.closest('.tip-item').dataset.i;
      openTip = openTip === i ? -1 : i;
      renderTipPanel();
    };
  });
  list.querySelectorAll('.tip-mv').forEach((btn) => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const i = +btn.closest('.tip-item').dataset.i;
      const j = i + (+btn.dataset.mv);
      if (j < 0 || j >= state.tips.length) return;
      pushUndo();
      const [t] = state.tips.splice(i, 1);
      state.tips.splice(j, 0, t);
      openTip = j;
      saveState(); renderTipPanel(); refreshExport();
    };
  });
  list.querySelectorAll('.tip-del').forEach((btn) => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const i = +btn.closest('.tip-item').dataset.i;
      pushUndo();
      state.tips.splice(i, 1);
      openTip = -1;
      saveState(); renderTipPanel(); refreshExport();
    };
  });
  // 展开编辑区：文本/条件连接/条件行
  list.querySelectorAll('.ttx').forEach((ta) => {
    ta.oninput = () => { tipOf(ta).text = ta.value; saveState(); refreshExport(); };
  });
  list.querySelectorAll('.tmd').forEach((sel) => {
    sel.onchange = () => { tipOf(sel).mode = sel.value; saveState(); renderTipPanel(); refreshExport(); };
  });
  list.querySelectorAll('.cc-add').forEach((btn) => {
    btn.onclick = () => {
      pushUndo();
      tipOf(btn).items = tipOf(btn).items ?? [];
      tipOf(btn).items.push({ type: 'pos', x: 0, y: 0, w: 200, h: 120 });
      saveState(); renderTipPanel(); refreshExport();
    };
  });
  list.querySelectorAll('.tip-cond').forEach((row) => {
    const c = tipOf(row).items[+row.dataset.i];
    const save = () => { saveState(); refreshExport(); };
    row.querySelector('.cct').onchange = (e) => {
      pushUndo();
      const type = e.target.value;
      if (type === 'pos') Object.assign(c, { type, x: 0, y: 0, w: 200, h: 120 });
      else if (type === 'inv') Object.assign(c, { type, item: 'K', has: true });
      else Object.assign(c, { type, op: '>', n: 1 });
      save(); renderTipPanel();
    };
    row.querySelector('.cc-del').onclick = () => {
      pushUndo();
      const t = tipOf(row);
      t.items.splice(+row.dataset.i, 1);
      save(); renderTipPanel();
    };
    if (c.type === 'pos') {
      row.querySelector('.ccx').oninput = (e) => { c.x = +e.target.value || 0; save(); };
      row.querySelector('.ccy').oninput = (e) => { c.y = +e.target.value || 0; save(); };
      row.querySelector('.ccw').oninput = (e) => { c.w = +e.target.value || 0; save(); };
      row.querySelector('.cch').oninput = (e) => { c.h = +e.target.value || 0; save(); };
      row.querySelector('.cc-pick').onclick = () => {
        tipRectPick = { ti: +row.closest('.tip-item').dataset.i, ci: +row.dataset.i };
        $('status').textContent = '🎯 在画布上按住拖出"玩家位置范围"（松开确定）';
      };
    } else if (c.type === 'inv') {
      row.querySelector('.cch1').onchange = (e) => { c.has = e.target.value === 'true'; save(); };
      row.querySelector('.cci').oninput = (e) => { c.item = e.target.value; save(); };
    } else {
      row.querySelector('.cco').onchange = (e) => { c.op = e.target.value; save(); };
      row.querySelector('.ccn').oninput = (e) => { c.n = +e.target.value || 0; save(); };
    }
  });
}
$('tipAdd').onclick = () => {
  pushUndo();
  state.tips.push({ text: '新提示：走到……', mode: 'and', items: [] });
  openTip = state.tips.length - 1;
  saveState(); renderTipPanel(); refreshExport();
};
// 可收缩面板：点头部折叠/展开（自定义反应/条件提示；🧩 插件设置的头部自己处理——要记住开合状态）
document.querySelectorAll('.pc-head').forEach((h) => {
  if (h.dataset.plshelf || h.closest('#plShelf')) return;

});
// 插件设置区：记住开合（本地存储）
{
  const shelf = $('plShelf');
  const shelfHead = shelf?.querySelector('.pc-head');
  if (shelf && shelfHead) {

      plShelfSave();

  refreshShelfEmpty();
}
window.addEventListener('resize', resizeCanvas);

buildPalette();
buildSubstanceList();
// 没有默认关卡。加载顺序：v2 存档 → 旧 v1 存档（迁移+去重+剥种子）→ 都没有就空画布。
// 插件不是"恢复全部缓存"，而是按引用自动加载（磁盘 plugin/ → 浏览器缓存）——
// 引用缺源时记入 bootErrors（软提示），JSON 加载（applyLevel）则是硬报错。
(async () => {
  const bootErrors = [];
  const migrated = migrateLegacy();           // 迁移旧 v1（自动清掉）
  let loadedFromStorage = await loadState(bootErrors); // 读 v2（自动加载引用的插件）
  if (!loadedFromStorage) {
    if (migrated != null) {
      loadedFromStorage = true;               // v1 迁过来的关卡视为已恢复
      saveState();
      statusMsg = `已迁移旧存档并清理重复（${state.placed.length} 个物体）`;
    } else {
      state.placed = [];                      // 全新打开：空画布，不摆默认关卡
      state.selected = null;
      statusMsg = '就绪（空画布）';
    }
  } else {
    saveState();                              // 重新规范化存档（已去重/剥种子）
    statusMsg = `已恢复自动存档（${state.placed.length} 个物体）`;
  }
  if (bootErrors.length) statusMsg += ` ⚠ 插件未恢复：${bootErrors.join('；')}`;
  refreshExport();
  renderRxPanel();                          // 渲染自定义反应列表
  renderTipPanel();                          // 渲染条件提示列表
  renderPluginPanel();                      // 渲染插件面板（含已恢复的插件引用）
  refreshShelfEmpty();
  $('status').textContent = statusMsg;
  // 容器尺寸一变化就重设画布：ResizeObserver 在 observe 时立即回调一次，之后每次布局
  // 变化都拿到**真实尺寸**，根治"刷新后模糊、要手动缩放才正常"；老浏览器退化用多次兜底。
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(() => resizeCanvas()).observe($('canvasWrap'));
  } else {
    requestAnimationFrame(resizeCanvas);
    setTimeout(resizeCanvas, 300);
    window.addEventListener('load', resizeCanvas);
  }
})();
</script>

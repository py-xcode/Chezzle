<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chezzle 关卡编辑器</title>
<style>
  :root { --gold: #e8b84b; --panel: #141a40; --edge: #2b3047; --txt: #dfe8f2; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #0b0e28; color: var(--txt); font: 13px "Segoe UI","Microsoft YaHei",sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  /* 顶部工具栏 */
  #toolbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--edge); flex-wrap: wrap; }
  #toolbar label { color: #9fb2c8; }
  #toolbar input[type=number] { width: 64px; background: #0e1432; color: #fff; border: 1px solid var(--edge); padding: 2px 4px; }
  /* 试玩按钮宽固定（▶ 试玩 ↔ ⏹ 退出试玩 换文案不改变工具栏布局/换行，插件控件不会跳动） */
  #btnPlay { min-width: 112px; text-align: center; }
  .btn { background: #2a3060; color: #fff; border: 1px solid #3a4178; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  .btn:hover { background: #3a4380; }
  .btn.primary { background: var(--gold); color: #2a2000; border-color: #ffd76a; font-weight: bold; }
  #status { margin-left: auto; color: #9fb2c8; font-size: 12px; }
  /* 主体：左面板 + 画布 + 右面板 */
  #main { display: flex; flex: 1; min-height: 0; }
  #palette { width: 108px; background: var(--panel); border-right: 1px solid var(--edge); overflow-y: auto; padding: 6px; }
  #palette .pbtn { display: block; width: 100%; text-align: left; margin-bottom: 4px; padding: 6px 8px; border: 1px solid var(--edge); border-radius: 4px; background: #10142e; color: var(--txt); cursor: pointer; }
  #palette .pbtn.pplug { border-color: #4a3a6e; }
  #palette .psep { font-size: 10px; color: #c78bff; padding: 8px 2px 4px; border-top: 1px dashed #3a4178; margin-top: 6px; }
  #palette .pbtn.active { border-color: var(--gold); background: #2a2440; box-shadow: 0 0 6px rgba(232,184,75,.5); }
  #palette .pbtn .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  #canvasWrap { flex: 1; position: relative; overflow: hidden; }
  /* 试玩中：画布容器变 flex 居中——试玩画布用 1100×700 等比缩放（与导出实机同视口） */
  #canvasWrap.playing { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #hint { position: absolute; left: 10px; bottom: 8px; color: rgba(200,220,255,.6); font-size: 12px; pointer-events: none; }
  #side { width: 220px; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--edge); min-height: 0; }
  #rxPanel { padding: 10px; border-bottom: 1px solid var(--edge); max-height: 42%; overflow-y: auto; flex-shrink: 0; }
  #rxPanel h3 { color: var(--gold); font-size: 13px; margin-bottom: 8px; }
  #rxList { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
  .rx-item { display: flex; align-items: center; gap: 5px; font: 11px Consolas,monospace; color: #9fe8ff; background: #0e1432; border: 1px solid var(--edge); border-radius: 3px; padding: 3px 5px; }
  .rx-item .rx-text { flex: 1; min-width: 0; word-break: break-all; }
  .rx-item .rx-del { background: #5a2a2a; color: #ffd9d9; border: 1px solid #7a3a3a; border-radius: 3px; cursor: pointer; padding: 0 6px; font-size: 11px; }
  .rx-item .rx-del:hover { background: #7a2a2a; }
  #rxAddRow { display: flex; gap: 4px; }
  #rxAdd { flex: 1; min-width: 0; background: #0e1432; color: #fff; border: 1px solid var(--edge); padding: 3px 5px; font-size: 11px; }
  /* 可收缩面板（自定义反应/条件提示）：点头部折叠 */
  .pc-head { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 4px; }
  .pc-head small { flex: 1; }
  .pc-arrow { color: #6a7a96; font-size: 11px; transition: transform .15s; flex-shrink: 0; }
  .pc.collapsed .pc-arrow { transform: rotate(-90deg); }
  .pc.collapsed .pc-body { display: none; }
  /* 插件面板内容防爆：最多占可视区约一半高，超出内部滚动（内置面板有自己的 max-height） */
  .edPanel .pc-body { max-height: 46vh; overflow-y: auto; }
  /* 条件提示面板 */
  #tipPanel { padding: 10px; border-bottom: 1px solid var(--edge); max-height: 36%; overflow-y: auto; flex-shrink: 0; }
  #tipPanel h3 { color: var(--gold); font-size: 13px; margin-bottom: 6px; }
  #tipPanel .tip-note { color: #6a7a96; font-size: 10px; margin-bottom: 6px; }
  .tip-item { background: #0e1432; border: 1px solid var(--edge); border-radius: 4px; margin-bottom: 4px; }
  .tip-item.open { border-color: var(--gold); }
  .tip-head { display: flex; align-items: center; gap: 4px; padding: 4px 6px; cursor: pointer; }
  .tip-head .tip-no { color: var(--gold); font-weight: bold; font-size: 11px; flex-shrink: 0; }
  .tip-head .tip-prev { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9fe8ff; font-size: 11px; }
  .tip-head .tip-sig { color: #6a7a96; font-size: 10px; flex-shrink: 0; }
  .tip-head button { background: #2a3060; color: #fff; border: 1px solid #3a4178; border-radius: 3px; cursor: pointer; font-size: 10px; padding: 1px 5px; flex-shrink: 0; }
  .tip-head .tip-del { background: #5a2a2a; color: #ffd9d9; border-color: #7a3a3a; }
  .tip-edit { padding: 6px; border-top: 1px solid var(--edge); display: none; }
  .tip-item.open .tip-edit { display: block; }
  .tip-edit textarea { width: 100%; background: #121a3e; color: #fff; border: 1px solid var(--edge); padding: 3px 5px; font-size: 11px; min-height: 30px; resize: vertical; font-family: inherit; }
  .tip-edit select, .tip-edit input { background: #121a3e; color: #fff; border: 1px solid var(--edge); padding: 2px 4px; font-size: 11px; }
  .tip-edit input[type=number] { width: 54px; }
  .tip-edit .tip-fld { display: flex; align-items: center; gap: 4px; margin: 4px 0; flex-wrap: wrap; }
  .tip-edit .tip-fld .fl { color: #9fb2c8; font-size: 10px; }
  .tip-cond { display: flex; align-items: center; gap: 4px; margin: 3px 0; flex-wrap: wrap; }
  .tip-cond .fl { color: #9fb2c8; font-size: 10px; }
  .tip-cond .cc-del { background: #5a2a2a; color: #ffd9d9; border: 1px solid #7a3a3a; border-radius: 3px; cursor: pointer; padding: 0 5px; font-size: 10px; }
  .tip-cond .cc-pick { background: #2a3060; color: #ffd76a; border: 1px solid #3a4178; border-radius: 3px; cursor: pointer; font-size: 10px; padding: 2px 6px; }
  .tip-cond .cc-pick:hover { background: #3a4380; }
  .tip-cond .cc-body { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  /* 插件面板 */
  #pluginPanel { padding: 10px; border-bottom: 1px solid var(--edge); max-height: 38%; overflow-y: auto; flex-shrink: 0; }
  #pluginPanel h3 { color: var(--gold); font-size: 13px; margin-bottom: 8px; }
  #pluginPanel .pl-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  #pluginPanel .pl-head .pl-name { color: #7fe0ff; font-weight: bold; font-size: 12px; }
  #pluginPanel .pl-head .pl-ver { color: #6a7a96; font-size: 10px; }
  #pluginPanel .pl-desc { color: #9fb2c8; font-size: 11px; margin: 2px 0 6px; }
  #pluginPanel .pl-miss { color: #ffb340; font-size: 10px; }
  #pluginPanel .pl-inst { background: #0e1432; border: 1px solid var(--edge); border-radius: 4px; padding: 6px; margin-bottom: 6px; }
  #pluginPanel .pl-inst .pl-cfg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
  #pluginPanel .pl-inst .fld { margin-bottom: 4px; }
  #pluginPanel .pl-inst .fld-wide { grid-column: 1 / -1; }
  #pluginPanel .pl-inst .fld input, #pluginPanel .pl-inst .fld select, #pluginPanel .pl-inst .fld textarea { width: 100%; background: #121a3e; color: #fff; border: 1px solid var(--edge); padding: 2px 4px; font-size: 11px; }
  #pluginPanel .pl-inst .fld input[type=checkbox] { width: auto; }
  #pluginPanel .pl-inst .fld label { color: #9fb2c8; font-size: 10px; display: block; }
  #pluginPanel .pl-btns { display: flex; gap: 6px; margin: 4px 0; align-items: center; flex-wrap: wrap; }
  #pluginPanel .pl-add { font-size: 11px; padding: 2px 8px; }
  #pluginPanel .pl-del { background: #5a2a2a; color: #ffd9d9; border: 1px solid #7a3a3a; font-size: 10px; padding: 0 6px; border-radius: 3px; }
  #pluginPanel .pl-toggle { font-size: 11px; }
  #pluginPanel .pl-comp { color: #c78bff; font-size: 10px; margin-top: 3px; }
  /* 插件列表（精简行）：名字 + 「用于」开关 + 编辑/卸载，详情收进 title */
  #pluginPanel .pl-item { display: flex; align-items: center; gap: 5px; padding: 4px 0; border-top: 1px solid var(--edge); }
  #pluginPanel .pl-item:first-child { border-top: none; }
  #pluginPanel .pl-item .pl-name { color: #dfe9ff; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #pluginPanel .pl-item .pl-ver { color: #6a7a96; font-size: 10px; margin: 0 3px 0 2px; }
  #pluginPanel .pl-item .pl-badge { color: #7fe0ff; font-size: 10px; flex-shrink: 0; white-space: nowrap; }
  #pluginPanel .pl-item .pl-toggle { font-size: 11px; color: #9fb2c8; display: flex; align-items: center; gap: 3px; flex-shrink: 0; white-space: nowrap; margin-left: auto; }
  /* 插件设置区（插件面板统一收纳） */
  #plShelf { max-height: 44%; overflow: hidden auto; flex-shrink: 0; border-bottom: 1px solid var(--edge); }
  #plShelf .pc-body { padding: 8px 10px; }
  #plShelf .pc-head small { min-width: 0; } /* 长文案允许换行——否则 min-width:auto 撑出水平滚动条 */
  #plShelf .edPanel { border-bottom: 1px solid var(--edge); }
  #plShelf .edPanel:last-child { border-bottom: none; }
  #plShelf .edPanel .pc-head { padding: 5px 4px; }
  #plShelf .edPanel .pc-body { max-height: 40vh; }
  /* 侧栏滚动条细暗化：17px 大条太抢眼（面板自带滚动条统一收成 6px 半透明） */
  #side ::-webkit-scrollbar { width: 6px; height: 6px; }
  #side ::-webkit-scrollbar-thumb { background: rgba(120,140,200,.28); border-radius: 3px; }
  #side ::-webkit-scrollbar-thumb:hover { background: rgba(140,160,220,.45); }
  #side ::-webkit-scrollbar-track { background: transparent; }
  #side { scrollbar-width: thin; scrollbar-color: rgba(120,140,200,.28) transparent; }
  #props { flex: 1; padding: 10px; overflow-y: auto; }
  #props.pc.collapsed { flex: 0 0 auto; } /* 折叠后不硬撑剩余空间 */
  #props h3 { color: var(--gold); font-size: 13px; margin-bottom: 8px; }
  .fld { margin-bottom: 6px; }
  .fld label { display: block; color: #9fb2c8; font-size: 11px; margin-bottom: 2px; }
  .fld input, .fld select, .fld textarea { width: 100%; background: #0e1432; color: #fff; border: 1px solid var(--edge); padding: 3px 5px; font-size: 12px; }
  .fld input[type=checkbox] { width: auto; }
  #props .empty { color: #6a7a96; font-size: 12px; }
  /* 主题：无底部导出区（导出 HTML 按钮直接生成文件） */
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <button class="btn" id="btnExportHTML">📄 导出 HTML</button>
    <label style="color:#9fb2c8">关卡ID <input type="text" id="inLevelId" placeholder="如 H-1（选关系统 id，留空不接上报）" style="width:110px"></label>
    <button class="btn" id="btnSave">💾 保存关卡</button>
    <button class="btn" id="btnLoad">📂 加载关卡</button>
    <button class="btn" id="btnPlay">▶ 试玩</button>
    <button class="btn" id="btnUndo">↩ 撤销</button>
    <button class="btn" id="btnPlugins">🧩 插件</button>
    <button class="btn" id="btnClear">🗑 清空</button>
    <label style="color:#9fb2c8"><input type="checkbox" id="cbDebug" checked> 导出调试提示（?debug=1）</label>
    <label>世界宽 <input type="number" id="inW" value="3000" min="200" step="100"></label>
    <label>高 <input type="number" id="inH" value="800" min="300" step="50"></label>
    <label style="color:#9fb2c8">大气 <input type="text" id="inAtm" placeholder="CO2:8, O2:15（不填=默认地球大气）" style="width:100px;background:#0e1432;color:#fff;border:1px solid var(--edge);padding:2px 5px;font-size:11px"></label>
    <button class="btn" id="btnAtmSet" title="把大气设置存入关卡（编辑器自带；多场景下随场景快照保存）" style="padding:1px 6px">设</button>
    <span id="verBadge" style="margin-right:6px;color:#7fe0ff;font-size:11px;border:1px solid #3a4178;padding:1px 6px;border-radius:3px">v3</span>
    <span id="status">就绪</span>
  </div>
  <div id="main">
    <div id="palette"></div>
    <div id="canvasWrap"><canvas id="editor"></canvas><div id="hint">左键放置/选中 · 拖拽移动 · 拖角/边手柄缩放 · Ctrl+左键框选/增减选 · 拖已选物体=整组平移 · Delete 删除 · 滚轮缩放 · 中键平移</div></div>
    <div id="side">
      <div id="pluginPanel" style="display:none">
        <h3>🧩 插件 <small style="color:#6a7a96">关卡的额外脚本（加载即用于本关）</small></h3>
        <div class="pl-btns">
          <button class="btn" id="btnAddPlugin">+ 加载插件文件</button>
          <button class="btn" id="btnNewMod" title="不建 .js 文件，直接在编辑器里写模块（模板起步，保存即加载）">＋ 新建模块</button>
          <button class="btn" id="btnReloadPlugins" title="重新从磁盘 plugin/ 目录加载所有插件源码（插件状态保留）——改了插件文件后点它，不用刷新页面">🔄 从磁盘重载</button>
          <button class="btn" id="btnClrCache" title="清除插件源码的浏览器缓存（file:// 直开编辑器时读不到磁盘，会用到它）">🧹 清缓存</button>
          <label style="color:#9fb2c8;font-size:10px"><input type="checkbox" id="cbEmbedPlugins" checked> 导出 HTML 时嵌入插件源码</label>
        </div>
        <div id="pluginList"></div>
        <input type="file" id="pluginFile" accept=".js" multiple style="display:none">
      </div>
      <div id="plShelf" class="pc collapsed">
        <h3 class="pc-head" data-plshelf>🧩 插件设置 <small style="color:#6a7a96">插件面板统一收纳</small><span class="pc-arrow">▾</span></h3>
        <div class="pc-body"><div id="plShelfBody"></div><div class="empty" id="plShelfEmpty" style="margin:4px 2px">（还没有插件面板）</div></div>
      </div>
      <div id="rxPanel" class="pc">
        <h3 class="pc-head">⚗ 自定义反应 <small style="color:#6a7a96">最高优先级</small><span class="pc-arrow">▾</span></h3>
        <div class="pc-body">
          <div id="rxList"></div>
          <div id="rxAddRow"><input type="text" id="rxAdd" placeholder="Cu + FeCl3 → CuCl2 + FeCl2"><button id="rxAddBtn" class="btn">+ 添加</button></div>
        </div>
      </div>
      <div id="tipPanel" class="pc">
        <h3 class="pc-head">💬 条件提示 <small style="color:#6a7a96">点提示按钮才展示</small><span class="pc-arrow">▾</span></h3>
        <div class="pc-body">
          <div class="tip-note">按顺序逐条展示（触发后不重复）。条件：玩家位置范围 / 物品栏有·没有某物 / 提示序号比较；多条条件可且/或连接。玩家满足条件后点击 HUD 提示按钮才会看到。</div>
          <div id="tipList"></div>
          <button id="tipAdd" class="btn" style="width:100%">+ 添加提示</button>
        </div>
      </div>
      <div id="props" class="pc">
        <h3 class="pc-head">🎚 属性 <small style="color:#6a7a96">选中物体后编辑</small><span class="pc-arrow">▾</span></h3>
        <div class="pc-body" id="propsBody"><div class="empty">选中一个物体编辑属性</div></div>
      </div>
    </div>
  </div>
</div>
<datalist id="substances"></datalist>
<script src="../dist/chezzle.js?vmto1haka?vmto13ecy?vmtnzn7a4?vmtnyxblw?vmtnxszpm?vmtnwuuru?vmtnvnx3h?vmtfspzrg?vmtfrfflh?vmtfr81ac?vmtfr1s0a?vmtfqm31b"></script>
<script>
// ============================================================================
// Chezzle 可视化关卡编辑器
// 复用 dist/chezzle.js?vmto1haka?vmto13ecy?vmtnzn7a4?vmtnyxblw?vmtnxszpm?vmtnwuuru?vmtnvnx3h?vmtfspzrg?vmtfrfflh?vmtfr81ac?vmtfr1s0a?vmtfqm31b 的全局 Chezzle：对象类、Scene、渲染、物理循环。
// 编辑模式：自建 transform 渲染已摆放物体；试玩模式：重建 Scene 跑物理+化学。
// ============================================================================
const C = Chezzle;
const $ = (id) => document.getElementById(id);
const canvas = $('editor');
const ctx = canvas.getContext('2d');

// ---- 物体目录 --------------------------------------------------------------
// 每个条目：type/label/dsl/color/rect(拖拽定尺寸)/fields/construct/collect
// fields.kind: number|text|bool|select|substance|solutes
const F = {
  num: (k, label, d = {}) => ({ k, label: label ?? k, kind: 'number', d }),
  txt: (k, label, d = '') => ({ k, label: label ?? k, kind: 'text', d }),
  txtM: (k, label, d = '') => ({ k, label: label ?? k, kind: 'text', d, multiline: true }), // 多行文本（属性面板=textarea，\n 换行）
  bool: (k, label, d = false) => ({ k, label: label ?? k, kind: 'bool', d }),
  sel: (k, label, opts, d = '') => ({ k, label: label ?? k, kind: 'select', options: opts, d }),
  sub: (k, label, d = '') => ({ k, label: label ?? k, kind: 'substance', d }),
  dropsub: (k, label, d = '') => ({ k, label: label ?? k, kind: 'dropsub', d }), // 滴管：只列液体/可溶物质
  sol: (k, label = '溶质') => ({ k, label, kind: 'solutes', d: {} }),
};
const CATALOG = [
  { type: 'floor', label: '地板', dsl: 'floor', color: '#8a6a48', rect: true,
    construct: (o) => new C.Floor({ x: o.x, y: o.y, w: o.w, h: o.h, ice: o.ice, id: o.id }),
    collect: (o) => ({ x: o.x, y: o.y, w: o.w, h: o.h, ice: o.ice, id: o.id }),
    fields: [F.num('x'), F.num('y'), F.num('w', '宽'), F.num('h', '高'), F.bool('ice', '冰面(极滑·禁搭高)', false), F.txt('id', 'id')] },
  { type: 'pool', label: '药品池', dsl: 'pool', color: '#2fa8e0', rect: true,
    construct: (o) => new C.Pool({ x: o.x, y: o.y, w: o.w, h: o.h, volume: o.volume ?? 200, solutes: o.solutes, gasHeight: o.gasHeight, id: o.id }),
    collect: (o) => ({ x: o.x, y: o.y, w: o.w, h: o.h, volume: o.solution.volume, solutes: mapToObj(o.solution.solutes), gasHeight: o.gasHeight ?? 80, id: o.id }),
    fields: [F.num('x'), F.num('y'), F.num('w', '宽'), F.num('h', '高'), F.num('volume', '容量ml'), F.sol('solutes'), F.num('gasHeight', '气泡柱高px', 80), F.txt('id', 'id')] },
  { type: 'block', label: '物块', dsl: 'block', color: '#ff8f46',
    construct: (o) => new C.Block({ x: o.x, y: o.y, substance: o.substance ?? 'Fe', mass: o.mass ?? 50, w: o.w, h: o.h, pushable: o.pushable, noLift: o.noLift, id: o.id }),
    collect: (o) => ({ x: o.x, y: o.y, substance: o.substance, mass: Math.round((o.grid?.totalMass?.() ?? o.mass ?? 50) * 10) / 10, w: o.w, h: o.h, pushable: o.pushable, noLift: o.noLift, id: o.id }),
    fields: [F.num('x'), F.num('y'), F.sub('substance', '物质'), F.num('mass', '质量g(决定尺寸)', 50), F.num('w', '宽px'), F.num('h', '高px'), F.bool('pushable', '可推动', true), F.bool('noLift', '不可被气流托起', false), F.txt('id', 'id')] },
  { type: 'deposit', label: '沉淀堆', dsl: 'deposit', color: '#b8e0c8',
    construct: (o) => new C.Deposit({ x: o.x, y: o.y, substance: o.substance ?? 'BaCO3', mass: o.mass ?? 20, w: o.w, h: o.h, id: o.id }),

// ---- 插件系统 ---------------------------------------------------------------
// 插件 = 本关卡的额外 JS 脚本（仓库统一放 **plugin/** 目录），三种承载（按需取用，互不强制）：
//   1. 纯逻辑：run(scene, api) 里写死本关卡的玩法（定时/键盘/新反应……）——零配置；
//   2. enhance：给"已有物体类型"增加属性字段（如酒精灯多了"延迟出现(秒)"）——
//      参数直接在物体属性面板调整（大众化参数的唯一入口），插件 run 读物体字段执行；
//   3. components：注册新的可放置物体类型（字段同样进属性面板）。
// 编辑器里：手动"加载插件文件"= 立即用于本关；关卡 JSON/自动存档 = 按引用自动加载
// （磁盘 plugin/ → 浏览器缓存），找不到=JSON 加载直接报错。清空关卡 = 全部卸载。
// ----------------------------------------------------------------------------
const pluginLib = new Map();        // file -> {src, meta, reg}
const pluginComponents = new Map(); // type -> 组件声明（meta.components 条目，含 plugin 归属）
const enhanceRegistry = [];         // [{file, reg, types:[], fields:[...]}]：物体属性增强
const PLUGIN_CACHE_KEY = 'chezzle-plugins-cache-v1';

/** HTML 转义（插件名/描述进 title/列表前消毒） */
function escHtml(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ---- 插件设置区（插件面板统一收纳；开合状态记住） ----
const PLSHELF_KEY = 'chezzle-plshelf-v1';
let plShelfState = { open: false, sub: {} };
try { plShelfState = { open: false, sub: {}, ...JSON.parse(localStorage.getItem(PLSHELF_KEY) || '{}') }; } catch (e) { /* 忽略 */ }
function plShelfSave() { try { localStorage.setItem(PLSHELF_KEY, JSON.stringify(plShelfState)); } catch (e) { /* 忽略 */ } }
function refreshShelfEmpty() {
  const n = $('plShelfBody')?.children.length ?? 0;
  const e = $('plShelfEmpty');
  if (e) e.style.display = n ? 'none' : '';
}

function pluginDefaultsOf(fields) {
  const d = {};
  for (const f of fields ?? []) {
    let v = f.def;
    if (v === undefined) {
      if (f.kind === 'bool') v = false;
      else if (f.kind === 'number') v = 0;
      else if (f.kind === 'solutes') v = {};
      else if (f.kind === 'select') v = f.options?.[0] ?? '';
      else v = '';
    }
    d[f.key] = v;
  }
  return d;
}

/** 占位对象：编辑器编辑态用（不执行插件代码）；试玩/导出时经 C.Plugin.create 换成真实对象 */
function pluginPlaceholder(type, opts) {
  const comp = pluginComponents.get(type);
  const o = {
    x: opts.x ?? 0,
    y: opts.y ?? 0,
    w: opts.w ?? (comp?.defW ?? 64),
    h: opts.h ?? (comp?.defH ?? 64),
    typeName: comp?.label ?? type,
    hidden: !!opts.hidden,
    render: placeholderRender,
    ...pluginDefaultsOf(comp?.fields),
  };
  for (const [k, v] of Object.entries(opts)) {
    if (k !== 'x' && k !== 'y' && k !== 'w' && k !== 'h') o[k] = v;
  }
  return o;
}
function pluginCollect(type, o) {
  const comp = pluginComponents.get(type);
  const out = { x: o.x, y: o.y, w: o.w, h: o.h };
  if (o.id) out.id = o.id;
  for (const f of comp?.fields ?? []) {
    if (f.key === 'hidden') continue;
    const v = o[f.key];
    if (v === undefined || v === null) continue;
    out[f.key] = f.kind === 'number' ? (Number(v) || 0) : v;
  }
  if (o.hidden) out.hidden = true;
  return out;
}
function placeholderRender(ctx) {
  const o = this;
  ctx.save();
  ctx.fillStyle = 'rgba(199,139,255,0.22)';
  ctx.fillRect(o.x, o.y, o.w, o.h);
  ctx.strokeStyle = '#c78bff'; ctx.lineWidth = 1.5;
  ctx.strokeRect(o.x, o.y, o.w, o.h);
  ctx.fillStyle = '#c78bff'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
  ctx.fillText(o.typeName ?? '?', o.x + o.w / 2, o.y + o.h / 2 + 4);
  ctx.textAlign = 'left';
  ctx.restore();
}

function registerPluginComponents(meta, file) {
  for (const comp of meta.components ?? []) {
    if (pluginComponents.has(comp.type)) {
      $('status').textContent = `组件 ${comp.type} 已存在（同名组件后载不生效）`;
      continue;
    }
    pluginComponents.set(comp.type, { plugin: file, ...comp });
  }
}

/** 某类型的全部增强字段（插件 meta.enhance 声明，并进物体属性面板） */
function enhanceFieldsOf(type) {
  const out = [];
  for (const e of enhanceRegistry) if (e.types.includes(type)) out.push(...e.fields);
  return out;
}

/**
 * 给目录条目套上"增强包装"：属性面板多出插件字段；construct/collect 带上/导出该值。
 * （物体对象上带增强字段 → 插件 run 读取并执行；只有非默认值才会进快照/导出）
 */
function enhanceWrap(entry) {
  const fields = enhanceFieldsOf(entry.type);
  // 内置字段优先：插件增强与内建字段同 key（如"延迟出现"已内建）时不重复加
  const extra = fields.filter((f) => !entry.fields.some((x) => x.k === f.key));
  if (!extra.length) return entry;
  const out = { ...entry, fields: [...entry.fields, ...extra.map((f) => ({ k: f.key, label: f.label ?? f.key, kind: f.kind ?? 'text', d: f.def, options: f.options, multiline: f.multiline }))] };
  const origConstruct = entry.construct;
  const origCollect = entry.collect;
  out.construct = (o) => {
    const obj = origConstruct(o);
    for (const f of fields) {
      const v = o[f.key];
      obj[f.key] = v !== undefined ? v : f.def ?? (f.kind === 'number' ? 0 : f.kind === 'bool' ? false : f.kind === 'select' ? (f.options?.[0] ?? '') : '');
    }
    return obj;
  };
  out.collect = (o) => {
    const r = origCollect(o);
    for (const f of fields) {
      const v = o[f.key];
      if (v !== undefined && v !== f.def) r[f.key] = v;
    }
    return r;
  };
  return out;
}

/** 重建目录：内置对象克隆 + 插件组件 + 全量增强包装（插件加载/卸载后调用） */
function syncCatalog() {
  const built = new Map();
  for (const e of CATALOG) built.set(e.type, { ...e, fields: [...e.fields] });
  for (const [type, comp] of pluginComponents) {
    // 组件对象在编辑器里直接构造**真实实例**（插件 construct）：编辑界面与游戏界面
    // 显示一致（render 相同）。construct 抛错/未注册时回退轻量占位。
    const defW = comp.defW ?? 64;
    const defH = comp.defH ?? 64;
    built.set(type, {
      type,
      label: comp.label ?? type,
      dsl: null,
      color: comp.color ?? '#c78bff',
      pluginType: true,
      rect: comp.rect !== false, // 默认可拖拽定尺寸（像地板一样直接拖）
      defaults: { w: defW, h: defH },
      fields: [
        { k: 'w', label: '宽', kind: 'number', d: defW },
        { k: 'h', label: '高', kind: 'number', d: defH },
        ...(comp.fields ?? []).map((f) => ({ k: f.key, label: f.label ?? f.key, kind: f.kind ?? 'text', d: f.def, options: f.options, multiline: f.multiline })),
        { k: 'hidden', label: '初始隐藏(靠开关显现)', kind: 'bool', d: false },
        { k: 'appearDelay', label: '延迟出现(秒)', kind: 'number', d: 0 },
        { k: 'appearFade', label: '淡入(秒)', kind: 'number', d: 0 },
      ],
      construct: (o) => {
        try {
          const obj = C.Plugin.create(type, o) ?? pluginPlaceholder(type, o);
          if (Number(o.appearDelay) > 0) obj.appearDelay = Number(o.appearDelay);
          if (Number(o.appearFade) > 0) obj.appearFade = Number(o.appearFade);
          return obj;
        } catch (e) {
          return pluginPlaceholder(type, o);
        }
      },
      collect: (o) => {
        const out = pluginCollect(type, o);
        if (Number(o.appearDelay) > 0) out.appearDelay = Number(o.appearDelay);
        if (Number(o.appearFade) > 0) out.appearFade = Number(o.appearFade);
        return out;
      },
    });
  }
  for (const [type, entry] of built) byType[type] = enhanceWrap(entry);
  if (!byType[state.palette]) state.palette = 'floor'; // 被卸载的组件不再是当前选择
  buildPalette();
}

function pluginCacheSave() {
  try {
    // 合并式保存：缓存 = 源码副本库（卸载/清空不删源码——撤销与"按引用加载"兜底）；
    // 只有引用回来了，它才重新出现，没有"复活"问题。
    let cur = {};
    try { cur = JSON.parse(localStorage.getItem(PLUGIN_CACHE_KEY) || '{}'); } catch (e) { /* 忽略 */ }
    for (const [f, e] of pluginLib) cur[f] = e.src;
    localStorage.setItem(PLUGIN_CACHE_KEY, JSON.stringify(cur));
  } catch (e) { /* 忽略 */ }
}

/** 单文件缓存读取（缓存 = 源码副本：磁盘 plugin/ 拉不到的兜底 + 撤销回载用） */
function pluginCacheGet(file) {
  try {
    const o = JSON.parse(localStorage.getItem(PLUGIN_CACHE_KEY) || '{}');
    return o[file] || null;
  } catch (e) { return null; }
}

/** 磁盘插件源码（plugin/ 目录，按编辑器位置推算：tools/leveleditor.html → ../plugin/，根目录 → plugin/）。
 *  文件加载由 fetch 完成——file:// 直开编辑器时读不到磁盘，会走浏览器缓存兜底。 */
async function pluginFetchDisk(file) {
  const dirs = [...new Set([location.pathname.includes('/tools/') ? '../plugin' : 'plugin', 'plugin'])];
  for (const d of dirs) {
    try {
      const r = await fetch(`${d}/${encodeURIComponent(file)}`, { cache: 'no-cache' });
      if (r.ok) {
        const t = await r.text();
        if (t && t.includes('@@chezzle-plugin')) return t; // 404/HTML 兜底拒绝
      }
    } catch (e) { /* file:// 等取不到磁盘时走缓存 */ }
  }
  return null;
}

/** 插件源码定位（JSON/自动存档加载时自动调用）：已加载 → 磁盘 plugin/ 目录 → 浏览器缓存。
 *  返回 {src, from:'disk'|'cache'} 或 null。from 用于面板徽标（一眼看出用的是磁盘还是旧缓存）。 */
async function pluginFetchSrc(file) {
  if (pluginLib.has(file)) return { src: pluginLib.get(file).src, from: pluginLib.get(file).from ?? 'disk' };
  const disk = await pluginFetchDisk(file);
  if (disk) return { src: disk, from: 'disk' };
  const cache = pluginCacheGet(file);
  return cache ? { src: cache, from: 'cache' } : null;
}

/** 确保一批插件全部加载（引用来源：关卡 JSON/自动存档 → 已加载 → 磁盘 plugin/ → 缓存）。
 *  返回 {ok, errors:[...], fromCache:[...]}——JSON 加载语义：未就绪 = 报错，不半加载。 */
async function ensurePluginsFrom(list) {
  const errors = [];
  const fromCache = [];
  for (const p of list ?? []) {
    const file = p?.file;
    if (!file || pluginLib.has(file)) continue;
    const got = await pluginFetchSrc(file);
    if (got == null) { errors.push(`${file}（未找到——请把插件文件放到 plugin/ 目录后重新加载）`); continue; }
    if (got.from === 'cache') fromCache.push(file);
    if (!loadPluginSource(file, got.src, { silent: true, from: got.from })) errors.push(`${file}（加载失败——检查元数据/语法，控制台有详情）`);
  }
  return { ok: !errors.length, errors, fromCache };
}

/** 撤销回载：引用里缺源码的插件从浏览器缓存原地恢复（清空后 Ctrl+Z 用；磁盘是异步的）。 */
function restorePluginsSync() {
  for (const p of state.plugins) {
    if (!p?.file || pluginLib.has(p.file)) continue;
    const src = pluginCacheGet(p.file);
    if (src) loadPluginSource(p.file, src, { silent: true, from: 'cache' });
  }
}

/** 加载一个插件源：解析元数据 + 执行注册 + 组件/增强登记。手动加载自动"用于本关"。 */
function loadPluginSource(file, src, opts = {}) {
  const meta = C.Plugin.parseMeta(src);
  if (!meta || !meta.name) {
    if (!opts.silent) $('status').textContent = `插件 ${file} 缺少 @@chezzle-plugin 元数据块（或 name 字段），已跳过`;
    return false;
  }
  const before = new Set(C.Plugin.names());
  try {
    new Function(src)(); // 插件约定：顶层只做 Chezzle.Plugin.register(...)，无副作用
  } catch (e) {
    if (!opts.silent) $('status').textContent = `插件 ${file} 执行注册失败: ${e.message}`;
    if (typeof console !== 'undefined') console.error(e);
    return false;
  }
  // 注册名 = 源码实际 register 的名字（与元数据 name 可能不同；注入/导出必须用它）
  const added = C.Plugin.names().filter((n) => !before.has(n));
  // 同文件重载（模块编辑保存）：register 同名覆盖 → added 为空 → 沿用该文件原注册名
  const prevReg = pluginLib.get(file)?.reg;
  const reg = added[0] ?? prevReg ?? file.replace(/\.js$/, '');
  if (added.length > 1) $('status').textContent = `插件 ${file} 注册了 ${added.length} 个定义，将使用 ${reg}（建议一文件一注册）`;
  pluginLib.set(file, { src, meta, reg, from: opts.from ?? 'disk' });
  registerPluginComponents(meta, file);
  // 增强登记（meta.enhance: 数组或单个 {types, fields|field}）
  const eh = Array.isArray(meta.enhance) ? meta.enhance : (meta.enhance ? [meta.enhance] : []);
  for (const e0 of eh) {
    const ff = Array.isArray(e0.fields) ? e0.fields : (e0.field ? [e0.field] : []);
    if (ff.length) enhanceRegistry.push({ file, reg, types: e0.types ?? [], fields: ff });
  }
  // 已有关卡引用补上注册名
  for (const p of state.plugins) if (p.file === file && !p.reg) p.reg = reg;
  // 手动加载 → 自动用于本关（零配置，可撤销）；缓存恢复（silent）不加（引用来自存档）
  if (!opts.silent && !state.plugins.some((p) => p.file === file)) {
    pushUndo();
    state.plugins.push({ file, reg, name: meta.name ?? file, enabled: true });
  }
  pluginCacheSave();
  syncCatalog();
  // 编辑器插件（"改编编辑器"）：def.editor(ed) 在加载时执行（如添加面板/按钮/导出钩子）
  const def = C.Plugin.get(reg);
  if (def && typeof def.editor === 'function') {
    try {
      const r = def.editor(makeEditorApi(reg));
      if (typeof r === 'function') editorCleanups.set(reg, r);
    } catch (e) {
      if (typeof console !== 'undefined') console.error(`[editor-plugin:${reg}] editor()`, e);
    }
  }
  if (!opts.silent) $('status').textContent = `已加载插件 ${meta.name}${meta.version ? ' v' + meta.version : ''}${opts.silent ? '' : '（已用于本关）'}`;
  renderPluginPanel();
  refreshShelfEmpty();
  return true;
}

/** 卸载插件：撤引用 + 组件/增强注销 + 画布上该插件组件对象移除。
 *  工具性操作（不可撤销）→ 双击确认防误触；opts.confirm=false（清空关卡用）跳过确认。 */
let unloadConfirmFile = null;
function pluginUnload(file, opts = {}) {
  const e = pluginLib.get(file);
  if (!e) return;
  if (opts.confirm !== false && unloadConfirmFile !== file) {
    unloadConfirmFile = file;
    $('status').textContent = `再点一次「✕」确认卸载 ${e.meta.name}（画布上的组件对象将一并移除，不可撤销）`;
    setTimeout(() => { if (unloadConfirmFile === file) unloadConfirmFile = null; }, 4000);
    return;
  }
  unloadConfirmFile = null;
  for (let i = state.placed.length - 1; i >= 0; i--) {
    const p = state.placed[i];
    const comp = pluginComponents.get(p.type);
    if (comp && comp.plugin === file) state.placed.splice(i, 1);
  }
  state.plugins = state.plugins.filter((p) => p.file !== file);
  for (const comp of e.meta.components ?? []) pluginComponents.delete(comp.type);
  for (let i = enhanceRegistry.length - 1; i >= 0; i--) {
    if (enhanceRegistry[i].file === file) enhanceRegistry.splice(i, 1);
  }
  // ★ 卸载前把源码存进缓存（存完再删库）——清空/卸载后 Ctrl+Z 撤销才能回载；
  //    缓存只是"源码副本"，不引用就不出现，没有复活问题。
  pluginCacheSave();
  pluginLib.delete(file);
  // 编辑器插件清理：onExport 钩子 + UI 元素 + cleanup（插件状态保留，重载可恢复）
  const cleanup = editorCleanups.get(e.reg);
  if (typeof cleanup === 'function') { try { cleanup(); } catch (err) { /* 忽略 */ } }
  editorCleanups.delete(e.reg);
  editorHooks.delete(e.reg);
  editorStateLoadedHooks.delete(e.reg);
  editorPlayStateHooks.delete(e.reg);
  editorPlaySceneHooks.delete(e.reg);
  for (const [m, h] of editorPlayHooks) if (h.reg === e.reg) editorPlayHooks.delete(m);
  editorStates.delete(e.reg); // 用户要求：卸载插件 → 其保存的数据不再保留（重载=全新）
  for (const el of editorDom.get(e.reg) ?? []) el.remove?.();
  editorDom.delete(e.reg);
  refreshShelfEmpty();
  syncIdSeq();
  buildRenderScene(); renderEdit(); refreshProps(); refreshExport(); saveState();
  syncCatalog();
  renderPluginPanel();
  $('status').textContent = `已卸载插件 ${e.meta.name}`;
}

/** 清空关卡用：卸载全部插件（源码留缓存——撤销 Ctrl+Z 能恢复；面板/组件/数据全清） */
function pluginUnloadAll() {
  for (const file of [...pluginLib.keys()]) pluginUnload(file, { confirm: false });
}

function renderPluginPanel() {
  const box = $('pluginList');
  if (!pluginLib.size) {
    box.innerHTML = '<div class="empty">还没有插件。<br>插件 = 本关卡的额外脚本（放 <b>plugin/</b> 目录）。<br>点「+ 加载插件文件」选 .js，或点「＋ 新建模块」直接在编辑器里写（带模板）。</div>';
    return;
  }
  const html = [];
  for (const [file, e] of pluginLib) {
    const meta = e.meta;
    const ref = state.plugins.find((p) => p.file === file);
    const enabled = ref?.enabled !== false;
    // 徽标：🧱 组件 / 🔧 增强 / 🖊 编辑器面板；详情收进 title（悬停可见）
    const comps = (meta.components ?? []).map((c) => `${c.label ?? c.type}（拖入画布即用）`);
    const enh = enhanceRegistry.filter((x) => x.file === file);
    const enhDesc = enh.map((x) => x.types
      .map((t) => `${byType[t]?.label ?? t} 增加属性：${x.fields.map((f) => f.label ?? f.key).join('、')}`)
      .join('；')).join('；');
    const badges = [];
    if (comps.length) badges.push('🧱组件');
    if (enhDesc) badges.push('🔧增强');
    const def = C.Plugin.get(e.reg);
    if (def && typeof def.editor === 'function') badges.push('🖊编辑器');
    // 来源徽标：来自浏览器缓存 = 黄字（磁盘是最新源码；file:// 直开编辑器才走缓存）
    const fromBadge = e.from === 'cache'
      ? `<span class="pl-badge" title="源码来自浏览器缓存（磁盘 plugin/ 读不到时兜底）——想用磁盘新版：点「🔄 从磁盘重载」，或 Ctrl+F5 刷新页面">⚠缓存</span>`
      : '';
    const tip = [meta.description, comps.length ? '🧱 ' + comps.join('、') : '', enhDesc ? '🔧 ' + enhDesc + '（物体属性面板调整）' : ''].filter(Boolean).join('\n');
    html.push(`<div class="pl-item" title="${escHtml(tip)}">
      <span class="pl-name">${escHtml(meta.name)}<span class="pl-ver">v${escHtml(meta.version ?? '?')}</span>${fromBadge}${badges.length ? `<span class="pl-badge">${badges.map(escHtml).join(' ')}</span>` : ''}</span>
      <label class="pl-toggle" title="用于本关（试玩/导出时注入；组件/增强不受此开关影响）"><input type="checkbox" data-toggle="${escHtml(file)}" ${enabled ? 'checked' : ''}> 用于</label>
      <button class="pl-del" data-edit="${escHtml(file)}" title="查看/编辑模块源码（保存即重载，插件状态保留）">✎</button>
      <button class="pl-del" data-remove="${escHtml(file)}" title="从本关移除并卸载插件">✕</button>
    </div>`);
  }
  const orphan = state.plugins.filter((p) => !pluginLib.has(p.file));
  if (orphan.length) {
    html.push('<div style="margin-top:6px;color:#ffb340;font-size:10px">引用但未加载的插件（重新加载文件后恢复）：' + escHtml(orphan.map((p) => p.name ?? p.file).join('、')) + '</div>');
  }
  box.innerHTML = html.join('');
}

// 面板变化：仅"用于本关"开关（无实例配置——参数在物体属性面板 / 逻辑写在插件里）
function onPluginPanelChange(e) {
  const file = e.target.dataset.toggle;
  if (!file || !pluginLib.has(file)) return;
  pushUndo();
  const ref = state.plugins.find((p) => p.file === file);
  if (ref) ref.enabled = e.target.checked;
  else if (e.target.checked) state.plugins.push({ file, reg: pluginLib.get(file).reg, name: pluginLib.get(file).meta.name ?? file, enabled: true });
  renderPluginPanel();
}

function onPluginPanelClick(e) {
  const rm = e.target.closest('[data-remove]');
  if (rm) { pluginUnload(rm.dataset.remove); return; }
  const ed = e.target.closest('[data-edit]');
  if (ed) openModEditor({ mode: 'edit', file: ed.dataset.edit });
}

/** 编辑态模块（新建/改过的）统一存进插件缓存库（与加载文件同一持久化路径） */
function modFileFree(file) {
  return !pluginLib.has(file) && !state.plugins.some((p) => p.file === file);
}
function modUniqName(base) {
  if (modFileFree(base)) return base;
  const stem = base.replace(/\.js$/, '');
  for (let n = 2; n < 100; n++) if (modFileFree(`${stem}${n}.js`)) return `${stem}${n}.js`;
  return `${stem}${Date.now()}.js`;
}

/** 原地重载插件源码：保留「用于本关」开关与插件私有状态（编辑保存专用，区别于卸载） */
function pluginReloadKeep(file, src) {
  const old = pluginLib.get(file);
  if (!old) return false;
  const keepSt = editorStates.get(old.reg); // 插件私有持久状态（横幅剧本等）
  // —— 清旧（同 pluginUnload 的钩子/DOM/组件/增强清理，但不动 state.plugins 引用/画布对象/插件状态）——
  const cleanup = editorCleanups.get(old.reg);
  if (typeof cleanup === 'function') { try { cleanup(); } catch (e) { /* 忽略 */ } }
  editorCleanups.delete(old.reg);
  editorHooks.delete(old.reg);
  editorStateLoadedHooks.delete(old.reg);
  editorPlayStateHooks.delete(old.reg);
  editorPlaySceneHooks.delete(old.reg);
  for (const [m, h] of editorPlayHooks) if (h.reg === old.reg) editorPlayHooks.delete(m);
  for (const el of editorDom.get(old.reg) ?? []) el.remove?.();
  editorDom.delete(old.reg);
  for (const comp of old.meta.components ?? []) pluginComponents.delete(comp.type);
  for (let i = enhanceRegistry.length - 1; i >= 0; i--) if (enhanceRegistry[i].file === file) enhanceRegistry.splice(i, 1);
  if (keepSt) editorStates.set(old.reg, keepSt);
  const wasRef = state.plugins.find((p) => p.file === file);
  pluginLib.delete(file);
  // —— 载新 ——
  const ok = loadPluginSource(file, src, { silent: true });
  if (!ok) {
    // 新代码注册失败 → 旧代码回滚（别把关卡弄成无插件可用）
    editorStates.delete(old.reg);
    if (keepSt) editorStates.set(old.reg, keepSt);
    loadPluginSource(file, old.src, { silent: true });
    $('status').textContent = `模块保存失败：新代码注册出错（已回滚旧版，看控制台）`;
    return false;
  }
  const nowReg = pluginLib.get(file).reg;
  if (wasRef) { wasRef.reg = nowReg; wasRef.name = pluginLib.get(file).meta.name ?? file; }
  syncCatalog();
  buildRenderScene();
  renderEdit();
  refreshProps();
  refreshExport();
  saveState();
  renderPluginPanel();
  $('status').textContent = `模块已更新并重载（插件状态保留）`;
  return true;
}

let modModal = null;
function openModEditor(o) {
  if (!modModal) {
    const css = document.createElement('style');
    css.textContent = `
      #modModal { position:fixed; inset:0; background:rgba(4,6,18,0.72); z-index:300; display:flex; align-items:center; justify-content:center; }
      #modModal .mm-box { width:min(860px,92vw); max-height:90vh; display:flex; flex-direction:column; background:#0d1330; border:1px solid var(--edge); border-radius:12px; padding:12px 14px; box-shadow:0 12px 60px rgba(0,0,0,0.6); }
      #modModal textarea { flex:1; min-height:380px; background:#0a0e24; color:#9fe8ff; border:1px solid var(--edge); border-radius:8px; padding:8px; font:12px/1.5 Consolas,"Courier New",monospace; resize:vertical; white-space:pre; tab-size:2; }
      #modModal .mm-head { display:flex; gap:8px; align-items:center; margin-bottom:8px; color:#dfe9ff; font-weight:600; }
      #modModal .mm-foot { display:flex; gap:8px; align-items:center; margin-top:8px; }
      #modModal .mm-msg { color:#ffb340; font-size:11px; flex:1; }`;
    document.head.appendChild(css);
    modModal = document.createElement('div');
    modModal.id = 'modModal';
    modModal.style.display = 'none';
    modModal.innerHTML = `<div class="mm-box">
      <div class="mm-head"><span id="mmTitle">模块</span>
        <select id="mmTpl" title="新建时选模板"></select>
        <input id="mmFile" class="ipt" placeholder="文件名 mymod.js" style="width:170px">
      </div>
      <textarea id="mmCode" spellcheck="false"></textarea>
      <div class="mm-foot"><button class="btn" id="mmSave">💾 保存并载入</button>
        <button class="btn" id="mmCancel">关闭 (Esc)</button>
        <span class="mm-msg" id="mmMsg"></span></div>
    </div>`;
    document.body.appendChild(modModal);
    const $m = (id) => modModal.querySelector(id);
    const mmClose = () => { // 未保存修改 → 先确认（别把人写的代码悄悄丢了）
      const ta = $m('#mmCode');
      if (ta.value !== ta.dataset.orig && !confirm('模块代码有未保存的修改，确定关闭？')) return;
      modModal.style.display = 'none';
    };
    $m('#mmCancel').onclick = mmClose;
    $m('#mmTpl').onchange = () => {
      const t = MOD_TEMPLATES[$m('#mmTpl').value];
      if (t) {
        $m('#mmCode').value = t.src;
        $m('#mmCode').dataset.orig = t.src;
        $m('#mmFile').value = t.file;
      }
    };
    $m('#mmCode').addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); $m('#mmSave').click(); }
      if (e.key === 'Tab') { // Tab 插两空格（别跳焦点）
        e.preventDefault();
        const ta = e.target;
        const s = ta.selectionStart;
        ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(ta.selectionEnd);
        ta.selectionStart = ta.selectionEnd = s + 2;
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modModal.style.display !== 'none') mmClose();
    }, true);
    $m('#mmSave').onclick = () => {
      const src = $m('#mmCode').value;
      const isNew = $m('#mmSave').dataset.mode === 'new';
      if (isNew) {
        let file = ($m('#mmFile').value || 'mymod.js').trim();
        if (!/\.js$/i.test(file)) file += '.js';
        file = modUniqName(file);
        if (!loadPluginSource(file, src)) { $m('#mmMsg').textContent = '载入失败：检查元数据块/语法（控制台有详情）'; return; }
        $m('#mmMsg').textContent = `✅ 已创建并载入：${file}`;
        $m('#mmSave').dataset.mode = 'edit';
        $m('#mmSave').dataset.file = file;
        $m('#mmFile').value = file;
        $m('#mmCode').dataset.orig = src;
        $('status').textContent = `新模块 ${file} 已创建（可撤销）`;
      } else {
        const file = $m('#mmSave').dataset.file;
        if (!pluginReloadKeep(file, src)) { $m('#mmMsg').textContent = '保存失败：已回滚到旧版（控制台有详情）'; return; }
        $m('#mmMsg').textContent = '✅ 已保存并重载';
        $m('#mmCode').dataset.orig = src;
      }
      modModal.style.display = 'none';
    };
  }
  const $m = (id) => modModal.querySelector(id);
  $m('#mmMsg').textContent = '';
  const tplSel = $m('#mmTpl');
  if (o.mode === 'edit') {
    const e = pluginLib.get(o.file);
    if (!e) return;
    $m('#mmTitle').textContent = `✎ 编辑模块：${e.meta.name ?? o.file}`;
    tplSel.style.display = 'none';
    $m('#mmFile').value = o.file;
    $m('#mmFile').disabled = true;
    $m('#mmCode').value = e.src;
    $m('#mmCode').dataset.orig = e.src;
    $m('#mmSave').dataset.mode = 'edit';
    $m('#mmSave').dataset.file = o.file;
  } else {
    tplSel.innerHTML = Object.entries(MOD_TEMPLATES).map(([k, t]) => `<option value="${k}">${t.label}</option>`).join('');
    tplSel.style.display = '';
    $m('#mmFile').disabled = false;
    $m('#mmTitle').textContent = '＋ 新建模块';
    const t = MOD_TEMPLATES[tplSel.value] ?? MOD_TEMPLATES.logic;
    $m('#mmCode').value = t.src;
    $m('#mmCode').dataset.orig = t.src;
    $m('#mmFile').value = t.file;
    $m('#mmSave').dataset.mode = 'new';
  }
  modModal.style.display = 'flex';
}
$('btnNewMod').onclick = () => openModEditor({ mode: 'new' });

/** 试玩构造：插件组件经 C.Plugin.create 生成真实对象（编辑器占位只存在于编辑态） */
function buildPlayObject(p) {
  if (pluginComponents.has(p.type)) {
    return C.Plugin.create(p.type, pluginCollect(p.type, p.obj));
  }
  return byType[p.type].construct(gridOpts(p.type, byType[p.type].collect(p.obj)));
}

/**
 * 把"编辑器 rope 对象"正确接线后加入 scene（chapters 试玩 / 默认试玩共用）。
 * 编辑器对象只存引用 id（hanging/anchorMode/anchorObj 或带下划线的私有字段），
 * 必须在此转成场景内的真实悬挂/锚点对象——直接 addObject 预览对象会得到一条
 * 不吊任何东西的绳子（用户 level(23) basin：绳子没能挂住 block2 的根因）。
 * obj 锚点带偏移（绳子顶端相对锚物体左上角）——旧代码 { obj } 会把锚点定在
 * 锚物体左上角，挂点随之错位（可能撞到上方平台 → 断绳）。
 */
function wireRopeInto(scene, r) {
  const hangingId = r._hangingId ?? r.hanging ?? '';
  const anchorMode = r._anchorMode ?? r.anchorMode ?? 'fixed';
  const anchorObjId = r._anchorObj ?? r.anchorObj ?? '';
  const hang = hangingId ? scene.byId[hangingId] : undefined;
  let anchor;
  if (anchorMode === 'obj' && anchorObjId) {
    const ao = scene.byId[anchorObjId];
    anchor = ao
      ? { obj: ao, dx: (r.x ?? 0) - ao.x, dy: (r.y ?? 0) - ao.y }
      : { fixed: { x: r.x ?? 0, y: r.y ?? 0 } }; // 锚点物体缺失（如已被删除）→ 按固定点兜底
  } else {
    anchor = { fixed: { x: r.x ?? 0, y: r.y ?? 0 } };
  }
  scene.addObject(new C.Rope({ x: r.x ?? 0, y: r.y ?? 0, length: r.length ?? 100, anchor, hanging: hang }));
}

/** 导出/注入用：启用的插件清单（注册名；参数在物体上，无需 cfg）。
 *  注：组件/增强插件的源码仍须随导出注册（见 requiredPluginFiles），此处只注入 run 逻辑。 */
function activePlugins() {
  return state.plugins.filter((p) => p.enabled).map((p) => {
    const reg = p.reg ?? p.name;
    const cfgFn = editorPluginCfgs.get(reg);
    return { name: reg, ...(cfgFn ? { cfg: cfgFn() ?? {} } : {}) };
  });
}

/** 导出 HTML 必须注册的插件文件：被引用的插件 + 画布上组件所属的插件 + 有编辑器扩展的插件 */
function requiredPluginFiles() {
  const files = new Set(state.plugins.map((p) => p.file));
  for (const p of state.placed) {
    const comp = pluginComponents.get(p.type);
    if (comp?.plugin) files.add(comp.plugin);
  }
  for (const [file, e] of pluginLib) {
    const def = C.Plugin.get(e.reg);
    if (def && typeof def.editor === 'function' && (editorHooks.has(e.reg) || editorDom.has(e.reg) || editorCleanups.has(e.reg))) {
      files.add(file); // 编辑器插件（chapters 等）：导出/试玩需要其源码注册
    }
  }
  return [...files];
}

// ---- 编辑器插件 API：插件不只是"改游戏"，还能"改编编辑器" -------------------
// def.editor(ed) 在插件加载时执行（卸载时清理）：
//   ed.addToolbarButton({label, title, onClick})  → 工具栏按钮
//   ed.addPanel({title, html})                    → 侧栏面板（返回元素）
//   ed.onExport(fn)                               → 导出脚本生成时调用 fn(lines, ctx)
//   ed.state                                      → 随存档持久化的插件私有状态
//   ed.getState()/ed.save()/ed.refresh()/$()      → 编辑器后门
//   ed.snapshot()/ed.applySnapshot(s)             → 画布快照（章节类插件的场景存储）
//   ed.sceneDsl(snap, name)                       → 快照 → 场景 DSL（chain/post）
// ----------------------------------------------------------------------------
const editorHooks = new Map();    // reg -> [fn]（onExport）
const editorDom = new Map();      // reg -> [elements]（卸载时移除）
const editorStates = new Map();   // reg -> 插件私有持久化状态
const editorCleanups = new Map(); // reg -> cleanup
const editorPluginCfgs = new Map(); // reg -> fn()（返回运行时配置 cfg——试玩/导出注入插件用）
const editorStateLoadedHooks = new Map(); // reg -> [fn]（存档恢复后调用——插件重渲染面板用）
const editorPlayHooks = new Map(); // mode('current'|'all') -> {reg, fn}（试玩接管：返回 stop 函数）
const editorPlayStateHooks = new Map(); // reg -> [fn]（试玩开始/结束通知：插件同步自己 UI，如「▶当前」变「⏹ 退出」）
const editorSceneSyncHooks = new Map(); // reg -> [fn]（顶层对象变更后调用：chapters 等场景管理插件把当前场景快照回写）
const editorPlaySceneHooks = new Map(); // reg -> [fn(scene)]（默认试玩场景构建后、插件注入前——与导出脚本"先写数据后 inject"同一时机）
let editorPlayMode = 'all';        // 试玩方向：'all'=整关(初始场景开始) / 'current'=仅当前视图（插件可切换）
function notifyPlayState(playing) {
  for (const fns of editorPlayStateHooks.values()) {
    for (const fn of fns) { try { fn(playing); } catch (e) { /* 插件 UI 回调失败不影响试玩 */ } }
  }
}

function makeEditorApi(reg) {
  let st = editorStates.get(reg);
  if (!st) { st = {}; editorStates.set(reg, st); }
  const doms = editorDom.get(reg) ?? (editorDom.set(reg, []), editorDom.get(reg));
  const hooks = editorHooks.get(reg) ?? (editorHooks.set(reg, []), editorHooks.get(reg));
  return {
    state: st,
    addToolbarButton: (o = {}) => {
      const b = document.createElement('button');
      b.className = 'btn';
      b.textContent = o.label || '按键';
      if (o.title) b.title = o.title;
      b.onclick = o.onClick || (() => {});
      $('toolbar').appendChild(b);
      doms.push(b);
      return b;
    },
    addPanel: (o = {}) => {
      const d = document.createElement('div');
      // 与内置面板（⚗/💬）同款折叠结构：点标题收起/展开。
      // 默认收进「🧩 插件设置」总折叠区（shelf: false 可要求留在侧栏顶层）——
      // 插件面板再多也只占顶部一行，不挤爆右栏；开合状态按标题记住。
      const open = o.collapsed === false ? true : (plShelfState.sub[o.title ?? ''] ?? false);
      d.className = 'edPanel pc' + (open ? '' : ' collapsed');
      d.innerHTML = `<h3 class="pc-head">${o.title ?? ''} <small style="color:#6a7a96">插件</small><span class="pc-arrow">▾</span></h3><div class="pc-body edPanelBody">${o.html ?? ''}</div>`;
      d.querySelector('.pc-head').onclick = () => {
        d.classList.toggle('collapsed');
        plShelfState.sub[o.title ?? ''] = !d.classList.contains('collapsed');
        plShelfSave();
      };
      if (o.shelf === false) {
        const side = $('side');
        side.insertBefore(d, side.firstChild);
      } else {
        $('plShelfBody').appendChild(d);
        refreshShelfEmpty();
      }
      doms.push(d);
      return d;
    },
    /** 往工具栏放任意元素（select/下拉等复杂控件用）。插到「状态」栏之前 →
     *  插件控件始终在左侧组里，不会因状态栏换行/推挤而跳到最右。 */
    addToolbarElement: (el) => {
      $('toolbar').insertBefore(el, $('status'));
      doms.push(el);
      return el;
    },
    /** 试玩状态变化回调（true=开始，false=结束）：插件同步自己的 UI（如开始按钮变退出按钮） */
    onPlayState: (fn) => {
      const arr = editorPlayStateHooks.get(reg) ?? (editorPlayStateHooks.set(reg, []), editorPlayStateHooks.get(reg));
      arr.push(fn);
    },
    /** 顶层画布对象已变更（属性修改/添加/删除/拖动落定后，saveState 时触发）：
     *  场景管理插件（chapters 等）在此把"当前场景快照"回写为 ed.snapshot()——
     *  否则多场景中改属性只进顶层 state，刷新/切场景后从旧快照还原（用户"修改不保存"根因）。 */
    onSceneSync: (fn) => {
      const arr = editorSceneSyncHooks.get(reg) ?? (editorSceneSyncHooks.set(reg, []), editorSceneSyncHooks.get(reg));
      arr.push(fn);
    },
    /** 试玩前置钩子 fn(scene)：默认试玩场景构建后、插件 inject 前调用（改 scene 数据用；
     *  与导出"先写数据后 inject"同一时机——横幅剧本"试玩所见 = 导出所得"的关键）。 */
    onPlayScene: (fn) => {
      const arr = editorPlaySceneHooks.get(reg) ?? (editorPlaySceneHooks.set(reg, []), editorPlaySceneHooks.get(reg));
      arr.push(fn);
    },
    /** 运行时配置来源：fn() 返回插件运行时 cfg 对象——试玩/导出时注入 {name, cfg}，
     *  横幅剧本/检查点 spawns/演出剧本等"编辑器里配、关卡里用"的数据都走这里。 */
    pluginCfg: (fn) => {
      if (typeof fn === 'function') editorPluginCfgs.set(reg, fn);
    },
    /** 画布框选回调：下一次在画布上拖出矩形（世界坐标）后回调 {x,y,w,h}（太小回调 null）。
     *  演出剧本 pos 触发器的「🎯 画布框选」用它填 x/y/w/h。Esc 取消。 */
    pickRect: (cb) => {
      pickRectCb = typeof cb === 'function' ? cb : null;
      pickRectDrag = null;
      const s = $('status');
      if (s) s.textContent = '🎯 在画布上拖出触发区域（松开确定 · Esc 取消）';
    },
    /** 试玩接管：mode 'all'（整关，如多场景）或 'current'（仅当前视图）。fn 返回 stop 函数 */
    onPlay: (fn, mode = 'all') => {
      editorPlayHooks.set(mode, { reg, fn });
    },
    onExport: (fn) => hooks.push(fn),
    /** 试玩接管：mode 'all'（整关，如多场景）或 'current'（仅当前视图）。fn 返回 stop 函数 */
    onPlay: (fn, mode = 'all') => {
      editorPlayHooks.set(mode, { reg, fn });
    },
    /** 切换试玩方向（整关/当前场景）——chapters 的「▶当前场景」按钮用 */
    setPlayMode: (mode) => { editorPlayMode = mode; },
    /** 试玩注入的插件清单（与导出一致） */
    getActivePlugins: () => activePlugins(),
    /** 快照 → 可放入场景的《真实》对象数组（组件经 C.Plugin.create；编辑器对象不被复用）。
     *  传送门旧数据（snap 只有颜色没组号）→ 按颜色补稳定组号（跨场景同色=同组，互通），
     *  并**写回 snap 数据**（后续 sceneDsl/再构建也一致，不产生"运行时一种号、存盘一种号"）。 */
    objectsFrom: (snap) => (snap.objects ?? [])
      .filter((o) => byType[o.type])
      .map((o) => ({ type: o.type, obj: ensurePortalGroup(buildPlayObject({ type: o.type, obj: byType[o.type].construct(gridOpts(o.type, o.opts)) }), o) })),
    /** 存档恢复后回调（editor() 执行在恢复之前——面板需在恢复后重渲染） */
    onStateLoaded: (fn) => {
      const arr = editorStateLoadedHooks.get(reg) ?? (editorStateLoadedHooks.set(reg, []), editorStateLoadedHooks.get(reg));
      arr.push(fn);
    },
    getState: () => state,
    save: () => saveState(),
    refresh: () => { buildRenderScene(); renderEdit(); refreshProps(); renderRxPanel(); renderPluginPanel(); refreshExport(); },
    $: (id) => document.getElementById(id),
    /** 画布快照（可序列化；切换/备份场景数据用；含编辑器自带的大气设置） */
    snapshot: () => ({
      worldW: state.worldW,
      worldH: state.worldH,
      rx: [...state.customReactions],
      atm: { ...state.atmosphere },
      objects: state.placed.map((p) => ({ type: p.type, opts: byType[p.type].collect(p.obj) })),
    }),
    /** 载入快照 */
    applySnapshot: (snap) => {
      state.worldW = snap.worldW ?? state.worldW;
      state.worldH = snap.worldH ?? state.worldH;
      state.customReactions = (snap.rx ?? []).slice();
      state.atmosphere = { ...(snap.atm ?? {}) };
      refreshAtmInput();
      state.placed = (snap.objects ?? []).filter((o) => byType[o.type]).map((o) => ({ type: o.type, obj: byType[o.type].construct(gridOpts(o.type, o.opts)) }));
      $('inW').value = state.worldW;
      $('inH').value = state.worldH;
      state.selected = null;
      state.sel = new Set();
      syncIdSeq();
      migratePortalGroups(); // 旧数据（只有颜色的门）→ 按颜色自动分组
      buildRenderScene(); resizeCanvas(); renderEdit(); refreshProps(); renderRxPanel(); refreshExport();
      saveState();
    },
    /** 把快照里的 rope 正确接线后加入场景（试玩接管插件用；与默认试玩同一条逻辑） */
    wireRopes: (scene, snap) => {
      for (const o of snap.objects ?? []) {
        if (o.type !== 'rope') continue;
        wireRopeInto(scene, o.opts ?? {});
      }
    },
    /** 快照 → 场景 DSL（章节类插件用）：{chain 行, post 行}（accessor 用 M.byId/M.byName）
     *  ensurePlayer：快照无摆放玩家时，在链尾追加一个默认玩家（放入口点）——
     *  无玩家场景启动/传送后 scene.player=null，相机无焦点（用户 level(24) 复现）。 */
    sceneDsl: (snap, name, ensurePlayer = false) => {
      const q = safeJson;
      const PREC_TYPES = ['lamp', 'blastlamp', 'switch', 'key', 'gasdetector'];
      const idPrefix = { lamp: 'lamp', blastlamp: 'lamp', switch: 'sw', key: 'key' };
      const placed = [];
      let seq = 0;
      for (const o of snap.objects ?? []) {
        const p = { type: o.type, obj: byType[o.type].construct(gridOpts(o.type, o.opts)) };
        // 传送门旧数据（无组号）→ 按颜色补稳定组号（跨场景同色=同组，互通）
        if (p.type === 'portal') ensurePortalGroup(p.obj, o);
        if (PREC_TYPES.includes(p.type) && !p.obj.id && Object.keys(mapToObj(p.obj.precipitates)).length) p.obj.id = `${idPrefix[p.type]}${++seq}`;
        // 无 id 但有非默认增强值（如"延迟出现(秒)"）：补 id——增强走 M.byId 引用
        if (!p.obj.id && p.type !== 'rope') {
          const fs0 = enhanceFieldsOf(p.type);
          if (fs0.some((f) => p.obj[f.key] !== undefined && p.obj[f.key] !== f.def)) p.obj.id = `${p.type}${++seq}`;
        }
        placed.push(p);
      }
      const chain = [`M.scene(${q(name)}, { worldW: ${snap.worldW ?? state.worldW}, worldH: ${snap.worldH ?? state.worldH} })`];
      const post = [];
      for (const p of placed) {
        if (p.type === 'rope') continue;
        const l = dslLine(p);
        if (l) chain.push('  ' + l);
        if (PREC_TYPES.includes(p.type) && p.obj.id) {
          const prec = mapToObj(p.obj.precipitates);
          for (const [id, m] of Object.entries(prec)) if (m > 0) post.push(`M.byId(${q(name)}, ${q(p.obj.id)}).addPrecipitate('${id}', ${m});`);
        }
      }
      // 无摆放玩家 → 默认玩家（入口点：最宽地板中心上方）
      if (ensurePlayer && !placed.some((p) => p.type === 'player')) {
        const floors = (snap.objects ?? [])
          .filter((o) => o.type === 'floor' && (o.opts?.w ?? 0) > 60)
          .sort((a, b) => ((b.opts?.w ?? 0) - (a.opts?.w ?? 0)));
        const f = floors[0];
        const ep = f
          ? { x: Math.round((f.opts.x ?? 0) + (f.opts.w ?? 0) / 2), y: Math.round((f.opts.y ?? 0) - 40) }
          : { x: Math.round((snap.worldW ?? 3000) / 2), y: Math.round((snap.worldH ?? 800) / 2) };
        chain.push(`  .player(${ep.x}, ${ep.y}, { substance: 'NaOH', mass: 30, id: 'auto_player' })`);
      }
      for (const rx of snap.rx ?? []) chain.push(`  .reaction(${q(rx)})`);
      chain.push(';');
      for (const p of placed) {
        if (p.type !== 'rope') continue;
        const o = byType.rope.collect(p.obj);
        // obj 锚点带偏移：绳子顶端相对锚物体的位置（old { obj } 锚点=锚物体左上角，错位）
        const ao = placed.find((x) => x.obj.id === o.anchorObj)?.obj;
        const anchor = o.anchorMode === 'obj' && ao
          ? `{ obj: M.byId(${q(name)}, ${q(o.anchorObj)}), dx: ${(o.x - ao.x).toFixed(2)}, dy: ${(o.y - ao.y).toFixed(2)} }`
          : `{ fixed: { x: ${o.x}, y: ${o.y} } }`;
        const hang = o.hanging ? `M.byId(${q(name)}, ${q(o.hanging)})` : 'undefined';
        post.push(`M.byName(${q(name)}).addObject(new Chezzle.Rope({ x: ${o.x}, y: ${o.y}, length: ${o.length}, anchor: ${anchor}, hanging: ${hang} }));`);
      }
      // 插件增强属性（如"延迟出现"）
      for (const p of placed) {
        const flds = enhanceFieldsOf(p.type);
        if (!flds.length || !p.obj.id) continue;
        for (const f of flds) {
          const v = p.obj[f.key];
          if (v !== undefined && v !== f.def) post.push(`M.byId(${q(name)}, ${q(p.obj.id)}).${f.key} = ${safeJson(v)}; // 插件增强`);
        }
      }
      // 延迟出现/淡入（内建通用字段）
      for (const p of placed) {
        if (!p.obj.id) continue;
        const d = Number(p.obj.appearDelay);
        if (d > 0) {
          post.push(`M.byId(${q(name)}, ${q(p.obj.id)}).appearDelay = ${d}; // 延迟出现`);
          const fd = Number(p.obj.appearFade);
          if (fd > 0) post.push(`M.byId(${q(name)}, ${q(p.obj.id)}).appearFade = ${fd};`);
        }
      }
      // 场景大气预设（整组独占：设置过的按值、没设置的=没有；空=保持默认）
      post.push(`M.byName(${q(name)}).atmosphere.preset(${safeJson(snap.atm ?? {})});`);
      return { chain, post, placed };
    },
  };
}


// 给所有物体类型加"初始隐藏"字段：勾上后该物体默认不出现/无碰撞，靠开关"开启时生成(id)"显现。
// 用包装 construct/collect 的方式统一注入，无需逐个改目录。
for (const e of CATALOG) {
  if (!e.fields.some((f) => f.k === 'hidden')) e.fields.push(F.bool('hidden', '初始隐藏(靠开关显现)', false));
  if (!e.fields.some((f) => f.k === 'appearDelay')) e.fields.push(F.num('appearDelay', '延迟出现(秒)', 0));
  if (!e.fields.some((f) => f.k === 'appearFade')) e.fields.push(F.num('appearFade', '淡入(秒)', 0));
  const origC = e.construct;
  const origCol = e.collect;
  e.construct = (o) => {
    const obj = origC(o);
    if (o.hidden) obj.hidden = true;
    if (Number(o.appearDelay) > 0) obj.appearDelay = Number(o.appearDelay);
    if (Number(o.appearFade) > 0) obj.appearFade = Number(o.appearFade);
    return obj;
  };
  e.collect = (o) => ({
    ...origCol(o),
    hidden: o.hidden === true ? true : undefined,
    appearDelay: Number(o.appearDelay) > 0 ? Number(o.appearDelay) : undefined,
    appearFade: Number(o.appearFade) > 0 ? Number(o.appearFade) : undefined,
  });
}

// ---- 状态 ----------------------------------------------------------------
// 单场景编辑器：场景/章节这类"不常用玩法"由**编辑器插件**实现（ed API 可加 UI/按钮/
// 导出钩子/持久化；官方示例 plugin/chapters.js 演示）。
const state = { worldW: 3000, worldH: 800, palette: 'floor', placed: [], selected: null, sel: new Set(), selBox: null, playing: false, customReactions: [], plugins: [], atmosphere: {}, tips: [] };
const view = { scale: 1, ox: 0, oy: 0 }; // 屏幕→世界：world=(screen-offset)/scale
let renderScene = new C.Scene({ worldW: state.worldW, worldH: state.worldH });
let drag = null; // {mode:'place'|'move'|'resize'|'select'|'rect'|'pan', ...}
const undoStack = [];
let levelId = ''; // 已提交的关卡ID（撤销快照的唯一来源；输入框 value 只是其视图）
let statusMsg = ''; // 状态栏常驻文案：试玩退出/编辑后恢复（模块级——boot 在 async IIFE 里）

// 可拖手柄缩放的类型（构造支持 w/h 的物体）；网格物体（block/deposit）缩放时重建
// 网格（质量=格数×0.1g，质量↔体积挂钩），非网格物体直接改 w/h。
// 玩家不可改形状：形状始终由质量决定。
const RESIZE_TYPES = new Set(['floor', 'pool', 'block', 'deposit', 'door', 'beaker', 'gas', 'portal', 'extractor']);
const RESIZE_MIN = { block: 5, deposit: 15 }; // 最小宽（px）；默认 10
const RESIZE_MIN_H = { deposit: 10 }; // 最小高（px）；默认=宽

function resizeMin(type, axis) {
  if (axis === 'h') return RESIZE_MIN_H[type] ?? RESIZE_MIN[type] ?? 10;
  return RESIZE_MIN[type] ?? 10;
}

/** 命中缩放手柄（8 个：四角+四边中点；角优先于边）。返回手柄名或 null */
function hitHandle(wx, wy) {
  const p = state.placed[state.selected];
  if (!p || state.sel.size !== 1) return null;
  if (!RESIZE_TYPES.has(p.type) && !pluginComponents.has(p.type)) return null;
  const o = p.obj;
  const tol = 8 / view.scale;
  const pts = [
    ['nw', o.x, o.y], ['ne', o.x + o.w, o.y], ['se', o.x + o.w, o.y + o.h], ['sw', o.x, o.y + o.h],
    ['n', o.x + o.w / 2, o.y], ['e', o.x + o.w, o.y + o.h / 2], ['s', o.x + o.w / 2, o.y + o.h], ['w', o.x, o.y + o.h / 2],
  ];
  for (const [k, cx, cy] of pts) {
    if (Math.abs(wx - cx) <= tol && Math.abs(wy - cy) <= tol) return k;
  }
  return null;
}

/** 直接改物体尺寸：网格物体重建网格（碰撞箱/渲染锚点同步），非网格物体改 w/h */
function applySize(o, type, w, h) {
  if (type === 'block') {
    o.grid = C.MaterialGrid.rect(w, h, o.substance);
    o.mass = o.grid.totalMass(); // 质量↔体积挂钩：体积变了质量跟着变
  } else if (type === 'deposit') {
    o.grid = C.MaterialGrid.heapRect(w, h, o.substance);
    o.mass = o.grid.totalMass();
  }
  if (o.syncGrid) o.syncGrid(); // 网格物体：w/h + gridOrigin 从网格重算（渲染/碰撞一致）
  else { o.w = w; o.h = h; }
}

// 快照必须覆盖"所有会被用户修改的状态"，否则撤销时会把没动过的内容一并回滚：
// 世界尺寸(wh)、关卡ID、自定义反应(rx) 都要进快照，且各自修改时都要 pushUndo，
// 这样每次 Ctrl+Z 恰好撤回一个"用户可感知的操作"。
function snap() {
  return {
    placed: state.placed.map((p) => ({ type: p.type, opts: byType[p.type].collect(p.obj) })),
    rx: [...state.customReactions],
    plugins: state.plugins.map((p) => ({ ...p })),
    atmosphere: { ...state.atmosphere },
    worldW: state.worldW,
    worldH: state.worldH,
    levelId,
  };
}
function pushUndo() { undoStack.push(snap()); if (undoStack.length > 60) undoStack.shift(); }
function buildRenderScene() {
  renderScene = new C.Scene({ worldW: state.worldW, worldH: state.worldH });
  for (const p of state.placed) renderScene.addObject(p.obj);
}

// ---- 物体构造/替换 ---------------------------------------------------------
/** 网格物体（物块/沉淀堆）构造参数归一：显式 w/h 时强制"像素模式"（mass=0，
 *  按像素尺寸建网格，质量=格数×0.1g）——缩放/放置结果在保存、加载、撤销、试玩后
 *  保持原样；无 w/h 时由 mass 决定形状。玩家不在列：形状始终由质量决定。 */
function gridOpts(type, opts) {
  const o = { ...opts };
  if ((type === 'block' || type === 'deposit') && o.w && o.h) o.mass = 0;
  return o;
}
/** 把数字/其它类型的 id 统一转成字符串。旧数据可能存了数字 id（如 pool id: 2），
 *  而后面大量代码要调 .match/.test —— 数字直接报错。JS 对象键本就会把数字键转字符串，
 *  所以 byId[2] 和 byId["2"] 是同一个键，转字符串不影响 poolId/switchId 引用。 */
function normalizeIds() {
  for (const p of state.placed) {
    if (p.obj.id != null && typeof p.obj.id !== 'string') p.obj.id = String(p.obj.id);
  }
}
function syncIdSeq() {
  normalizeIds();
  state.idSeq = {};
  for (const p of state.placed) {
    const m = String(p.obj.id || '').match(/^([a-z]+)(\d+)$/);
    if (m) state.idSeq[m[1]] = Math.max(state.idSeq[m[1]] || 0, +m[2]);
  }
}
/** 把不稳定的默认 id（obj2/obj19 等）或无 id 的物体重分配为稳定的类型 id（block1/pool1…），
 *  并保证 id 唯一（否则 byId/绳子悬挂/接线会乱）。 */
function ensureStableIds() {
  syncIdSeq();
  const used = new Set();
  for (const p of state.placed) {
    if (!p.obj.id || /^obj\d+$/.test(p.obj.id)) {
      const t = p.type === 'player' ? 'player' : p.type;
      state.idSeq[t] = (state.idSeq[t] || 0) + 1;
      p.obj.id = `${t}${state.idSeq[t]}`;
    }
    // 重复 id → 换新的（如两个 portal1 → 第二个变 portal2）
    while (used.has(p.obj.id)) {
      const t = p.type === 'player' ? 'player' : p.type;
      state.idSeq[t] = (state.idSeq[t] || 0) + 1;
      p.obj.id = `${t}${state.idSeq[t]}`;
    }
    used.add(p.obj.id);
  }
  syncIdSeq();
}
/** 去掉重复的物体：① 同类型+同 id+同位置尺寸 → 完全重复；② 同类型+同位置（忽略 id）
 *  → 旧版 bug 用不同 id 存了两份同一批物体。都保留第一个。 */
function dedupePlaced() {
  const seen = new Set();
  const seenPos = new Set();
  state.placed = state.placed.filter((p) => {
    const o = p.obj;
    const k = `${p.type}|${o.id ?? ''}|${o.x}|${o.y}|${o.w ?? 0}|${o.h ?? 0}`;
    if (seen.has(k)) return false;
    seen.add(k);
    const pos = `${p.type}|${Math.round(o.x)}|${Math.round(o.y)}`;
    if (seenPos.has(pos)) return false;
    seenPos.add(pos);
    return true;
  });
}
/** 种子签名：只有 5 个种子物【全部】存在（含固定位置）才判定为旧版遗留的示例关卡并移除。
 *  用户自己摆放的关卡几乎不可能恰好命中全部 5 个签名位。 */
function stripSeedObjects() {
  const SIG = [
    ['floor', 0, 720], ['pool', 300, 720], ['floor', 500, 720],
    ['block', 560, 680], ['player', 60, 600],
  ];
  const hasAll = SIG.every(([t, x, y]) =>
    state.placed.some((p) => p.type === t && Math.round(p.obj.x) === x && Math.round(p.obj.y) === y));
  if (!hasAll) return;
  state.placed = state.placed.filter((p) => !SIG.some(([t, x, y]) =>
    p.type === t && Math.round(p.obj.x) === x && Math.round(p.obj.y) === y));
}
function addPlaced(type, opts) {
  const e = byType[type];
  // 药品池：新建时默认容积随划定大小自动计算（≈25px²/ml，取5的倍数，下限20ml）——
  // 大池子不再顶着固定 200ml 的小容量永远显示满格；属性面板里手动改过则尊重原值
  if (type === 'pool' && opts.volume == null && opts.w > 0 && opts.h > 0) {
    opts.volume = Math.max(20, Math.round((opts.w * opts.h) / 25 / 5) * 5);
  }
  // 数字 id（属性面板/旧数据可能给数字）统一转字符串
  if (opts.id != null) opts.id = String(opts.id);
  // 传送门：不再自动配对（用户定案：显式先设组号，不自动分配）。
  // 新门 = 未分组（group 空），在属性面板「加入组」里选已有的组号或输入新组号；
  // 颜色仅是外观，默认取未使用色（可与组任意搭配）。
  if (type === 'portal') {
    if (!opts.color) opts.color = nextPortalColor([...new Set(state.placed.filter((p) => p.type === 'portal').map((p) => p.obj.color).filter(Boolean))]);
  }
  // 自动分配可读 id（block1/pool1/lamp1…），供绳子悬挂/接线引用
  if (!opts.id) {
    const t = type === 'player' ? 'player' : type;
    state.idSeq = state.idSeq || {};
    state.idSeq[t] = (state.idSeq[t] || 0) + 1;
    opts.id = `${t}${state.idSeq[t]}`;
  }
  const obj = e.construct(gridOpts(type, opts));
  state.placed.push({ type, obj });
  buildRenderScene();
  saveState();
  return state.placed.length - 1;
}
function replaceAt(idx, opts) {
  const e = byType[state.placed[idx].type];
  state.placed[idx].obj = e.construct(gridOpts(state.placed[idx].type, opts));
  buildRenderScene();
  saveState();
}

/** 传送门组色候选（避免花哨随机——按"未用色"顺序取，全用尽再随机） */
const PORTAL_COLORS = ['#c78bff', '#7fd8ff', '#ffb340', '#4dff5f', '#ff5f8a', '#ffe05f', '#7fe0c8', '#5f8aff'];
function nextPortalColor(used = []) {
  const c = PORTAL_COLORS.find((x) => !used.includes(x));
  return c ?? PORTAL_COLORS[Math.floor(Math.random() * PORTAL_COLORS.length)];
}

/**
 * 传送门组属性同步（组 = 同组号；旧数据无组号 → 按颜色兜底同步）：
 * 改颜色/次数/开关 → 组内其余门跟随。返回受影响的门索引列表（不含自身）。
 */
function portalGroupSync(key, patch, exceptIdx) {
  const byGroup = !key.startsWith('__color:');
  const color = byGroup ? null : key.slice('__color:'.length);
  const hits = [];
  for (let i = 0; i < state.placed.length; i++) {
    if (i === exceptIdx) continue;
    const p = state.placed[i];
    if (p.type !== 'portal') continue;
    if (byGroup) {
      if (!p.obj.group || p.obj.group !== key) continue;
    } else {
      if (p.obj.color !== color || p.obj.group != null) continue; // 有组号的走组号同步
    }
    const opts = byType.portal.collect(p.obj);
    for (const [k, v] of Object.entries(patch)) {
      if (v === undefined) delete opts[k];
      else opts[k] = v;
    }
    state.placed[i].obj = byType.portal.construct(gridOpts('portal', opts));
    hits.push(i);
  }
  return hits;
}

/**
 * 旧版本迁移：把只有颜色（无组号）的传送门按颜色补**稳定组号**（同色=同组）。
 * 与 objectsFrom/sceneDsl 的 portalGroupOf 同一条规则（颜色哈希）——两种入口统一，
 * 否则加载时按 g1/g2 顺序编号、快照构建按哈希编号，同色门会得到不同组号（跨场景不通）。
 */
function migratePortalGroups() {
  let migrated = 0;
  for (const [i, p] of state.placed.entries()) {
    if (p.type !== 'portal' || p.obj.group != null) continue;
    const g = portalGroupOf(p.obj.color);
    if (!g) continue;
    const opts = byType.portal.collect(p.obj);
    opts.group = g;
    state.placed[i].obj = byType.portal.construct(gridOpts('portal', opts));
    migrated++;
  }
  return migrated;
}

/**
 * 颜色 → 稳定组号：同一颜色在任何场景都映射到同一组号（确定性哈希）——
 * 多场景的"旧数据（无组号）按颜色兜底"这样才跨场景一致（否则场景A按颜色分 g1、
 * 场景B又按颜色重头分 g1，同色能对、异色可能撞组）。颜色哈希到色板索引+1。
 */
const PORTAL_GROUPS_BY_COLOR = new Map();
function portalGroupOf(color) {
  if (!color) return null;
  if (PORTAL_GROUPS_BY_COLOR.has(color)) return PORTAL_GROUPS_BY_COLOR.get(color);
  const hash = [...color].reduce((h, c) => (h * 31 + c.charCodeAt(0)) & 0x7fffffff, 7);
  const g = 'g' + (hash % 9999 + 1);
  PORTAL_GROUPS_BY_COLOR.set(color, g);
  return g;
}

/**
 * 给 Portal 对象补组号：无 group 且有色 → 按颜色的稳定组号（旧数据迁移，跨场景一致）。
 * data 可选：原始数据对象（{type, opts}），补组号时同步写回 opts.group（快照数据持久化，
 * 保证运行时/存盘同一种号）。
 */
function ensurePortalGroup(obj, data = null) {
  if (!obj || obj.group != null || !obj.color) return obj;
  const g = portalGroupOf(obj.color);
  if (!g) return obj;
  obj.group = g;
  if (data && data.opts && data.opts.group == null) data.opts.group = g;
  return obj;
}
function removeAt(idx) {
  state.placed.splice(idx, 1);
  if (state.selected === idx) state.selected = null;
  else if (state.selected > idx) state.selected--;
  buildRenderScene();
  saveState();
}

// ---- 渲染（编辑模式）--------------------------------------------------------
function fitView() {
  const W = canvas.width, H = canvas.height;
  view.scale = Math.min((W - 40) / state.worldW, (H - 40) / state.worldH);
  view.ox = (W - state.worldW * view.scale) / 2;
  view.oy = (H - state.worldH * view.scale) / 2;
}
function screenToWorld(sx, sy) {
  return { x: (sx - view.ox) / view.scale, y: (sy - view.oy) / view.scale };
}
function renderEdit() {
  ensureCanvasSize(); // 尺寸不对就先重设——任何时机漏了一次也不会糊
  const W = canvas.width, H = canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b0e28'; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(view.scale, 0, 0, view.scale, view.ox, view.oy);
  // 网格背景
  ctx.strokeStyle = 'rgba(120,140,200,0.08)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let gx = 0; gx <= state.worldW; gx += 50) { ctx.moveTo(gx, 0); ctx.lineTo(gx, state.worldH); }
  for (let gy = 0; gy <= state.worldH; gy += 50) { ctx.moveTo(0, gy); ctx.lineTo(state.worldW, gy); }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(232,184,75,0.5)'; ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, state.worldW, state.worldH);
  // 物体（隐藏的物体用虚线框 + 半透明标示，仍可选中/编辑）
  const time = performance.now() / 1000;
  for (const p of state.placed) {
    if (p.obj.hidden) {
      const o = p.obj;
      ctx.save();
      ctx.globalAlpha = 0.35;

      ctx.setLineDash([]);

      ctx.fillText('隐藏', o.x + o.w / 2, o.y - 18);
      ctx.textAlign = 'left';
      ctx.restore();

    }
    if (p.obj.render) { try { p.obj.render(ctx, { scene: renderScene, time }); } catch (e) {} }
  }

    const o = p.obj;
    if (!o.id || p.type === 'sign') continue;
    const tw = ctx.measureText(o.id).width;
    ctx.fillStyle = 'rgba(8,14,32,0.72)';
    ctx.fillRect(o.x + o.w / 2 - tw / 2 - 2, o.y - 12, tw + 4, 11);
    ctx.fillStyle = '#9fd8ff';
    ctx.fillText(o.id, o.x + o.w / 2, o.y - 3);
  }

  // 选中框：主选（金色虚线）+ 其余多选（青色细虚线）+ 框选矩形（半透明填充）
  if (state.sel.size > 0) {
    for (const idx of state.sel) {
      if (idx === state.selected) continue;
      const o = state.placed[idx]?.obj;

    ctx.font = `bold ${12 / view.scale}px "Segoe UI","Microsoft YaHei",sans-serif`;

        [o.x, o.y], [o.x + o.w, o.y], [o.x + o.w, o.y + o.h], [o.x, o.y + o.h],
        [hx, o.y], [o.x + o.w, hy], [hx, o.y + o.h], [o.x, hy],

      ctx.strokeStyle = '#0b0e28';
      ctx.lineWidth = 1;

function hitTest(wx, wy) {
  for (let i = state.placed.length - 1; i >= 0; i--) {
    const o = state.placed[i].obj;
    if (o.constructor?.name === 'Rope') {
      // 绳子是细线：水平 ±12px 宽容命中，垂直整段可点
      if (wx >= o.x - 12 && wx <= o.x + 12 && wy >= o.y && wy <= o.y + o.h) return i;
    } else if (wx >= o.x && wx <= o.x + o.w && wy >= o.y && wy <= o.y + o.h) return i;

/** 删除所有选中的物体（单次撤销点） */
